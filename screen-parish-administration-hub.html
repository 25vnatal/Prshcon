<script>

          coral: '#FF7F73', gold: '#F6C453', green: '#6CBF84', lavender: '#A88BFF',
          error: { DEFAULT: '#E5645A', bg: '#FDECEA' },

        fontFamily: { heading: ['Manrope', 'sans-serif'], body: ['Inter', 'sans-serif'] },
        borderRadius: { card: '24px', button: '16px', input: '16px', badge: '999px' },
        boxShadow: { card: '0 6px 24px rgba(30,41,59,0.08)', 'card-hover': '0 12px 36px rgba(30,41,59,0.12)' },

<script>
  const sessionParams = new URLSearchParams(window.location.search);
  // Only these identity params should ever propagate between pages via navigation —
  // page-specific deep-link params (family, tab, module, openRegister, etc.) must NOT
  // leak forward, or every subsequent "go somewhere" link keeps re-opening whatever
  // deep link the user originally arrived on (e.g. Family Records always reopening
  // a specific family's Updates tab instead of showing the plain list).
  function baseParams() {
    const p = new URLSearchParams();
    ['parish', 'parishName', 'name'].forEach(k => { if (sessionParams.get(k)) p.set(k, sessionParams.get(k)); });
    return p;
  }
  const parishName = sessionParams.get('parishName') || 'Infant Jesus Shrine';
  const staffName = sessionParams.get('name') || 'Parish Staff';
  document.getElementById('sidebar-parish-name').textContent = parishName;
  document.getElementById('header-parish-name').textContent = parishName;
  document.getElementById('account-parish-name').textContent = parishName;
  document.getElementById('avatar-btn').textContent = parishName.split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();

  function goDash() { window.location.href = 'screen-parish-dashboard-home.html?' + baseParams().toString(); return false; }
  function goFamilyRecords() { window.location.href = 'screen-parish-familyrecords-search.html?' + baseParams().toString(); return false; }
  function goCommittees() { window.location.href = 'screen-parish-committees-hub.html?' + baseParams().toString(); return false; }
  function goRequests() { window.location.href = 'screen-parish-requests-hub.html?' + baseParams().toString(); return false; }
  function goMasses() { window.location.href = 'screen-parish-masses-hub.html?' + baseParams().toString(); return false; }
  function goServices() { window.location.href = 'screen-parish-services-hub.html?' + baseParams().toString(); return false; }
  function goFinance() { window.location.href = 'screen-parish-finance-hub.html?' + baseParams().toString(); return false; }
  function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('-translate-x-full');
    document.getElementById('sidebar-backdrop').classList.toggle('hidden');
  }
  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.remove('opacity-0'); t.classList.add('opacity-100');
    clearTimeout(window._t);
    window._t = setTimeout(() => { t.classList.remove('opacity-100'); t.classList.add('opacity-0'); }, 1800);
  }
  function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

  const ICON_PATHS = {
    check: '<path d="M20 6 9 17l-5-5"/>',
    x: '<path d="M18 6 6 18"/><path d="M6 6l12 12"/>',
    plus: '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
    edit: '<path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="m18.5 2.5 3 3L12 15l-4 1 1-4Z"/>',
    trash: '<path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>',
    file: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/>',
    box: '<path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/>',
    users: '<circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M2 21v-1a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v1"/><path d="M15 15.5a4 4 0 0 1 5 3.5"/>',
    mapPin: '<path d="M21 10c0 7-9 12-9 12s-9-5-9-12a9 9 0 0 1 18 0Z"/><circle cx="12" cy="10" r="3"/>',
  };
  function icon(name, cls) { return `<svg class="${cls||'icon'}" viewBox="0 0 24 24">${ICON_PATHS[name]}</svg>`; }

  function formatMoney(n) { return '₹' + n.toLocaleString('en-IN'); }
  const MONTH_NAMES = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  function formatDate(iso) {
    if (!iso) return '—';
    const [y,m,d] = iso.split('-').map(Number);
    return `${d} ${MONTH_NAMES[m-1]} ${y}`;
  }

  // ---------------- Mock data: Parish Profile (schema section 4.10) ----------------
  let parishProfile = {
    name: "Infant Jesus Shrine",
    shortName: "Infant Jesus Shrine, Viveknagar",
    patronSaint: "Infant Jesus",
    feastDay: "13 January",
    yearEstablished: 1971,
    motto: "One Faith. One Community. One Family.",
    phone: "25301206",
    whatsapp: "",
    email: "",
    website: "",
    address: "Post Box 4712, Viveknagar, Bengaluru 560 047",
    officeHours: { weekday: "9:00 AM - 5:30 PM", saturday: "9:00 AM - 1:00 PM", sunday: "Closed (Mass timings only)", weeklyHoliday: "Monday" },
    aboutParish: "Infant Jesus Shrine has served the Viveknagar community since 1971, growing into one of Bangalore's largest and most active parishes.",
  };

  ];
  let worshipLocations = [
    { id:"WL-001", name:"Main Church", address:"Post Box 4712, Viveknagar, Bengaluru 560 047", status:"Active" },
  ];

  // ---------------- Mock data: Inventory ----------------
  let inventoryItems = [
    { id:"INV-001", name:"Foldable Chairs", category:"Furniture", quantity:200, condition:"Good", location:"Parish Hall Store", lastUpdated:"2026-04-01" },
    { id:"INV-002", name:"Altar Vestments (Green)", category:"Liturgical", quantity:6, condition:"Good", location:"Sacristy", lastUpdated:"2026-01-15" },
    { id:"INV-003", name:"PA Sound System", category:"Electronics", quantity:1, condition:"Needs Repair", location:"Main Church", lastUpdated:"2026-06-20" },
    { id:"INV-004", name:"Parish Van", category:"Vehicle", quantity:1, condition:"Good", location:"Parish Garage", lastUpdated:"2026-03-10" },
    { id:"INV-005", name:"Projector", category:"Electronics", quantity:2, condition:"Good", location:"Parish Hall", lastUpdated:"2026-02-05" },
  ];

  // ---------------- Mock data: Staff & Payroll ----------------
  let staffMembers = [

  function submitClergy() {
    const name = document.getElementById('clf-name').value.trim();
    const role = document.getElementById('clf-role').value;
    const phone = document.getElementById('clf-phone').value.trim();
    if (!name) { toast('Please enter a name.'); return; }
    if (editingClergyId) {
      Object.assign(clergy.find(x => x.id === editingClergyId), { name, role, phone });
      toast(`${name} updated.`);
    } else {
      clergy.push({ id: 'CLG-' + Math.floor(100 + Math.random()*899), name, role, phone, email: '' });
      toast(`${name} added.`);

    editingClergyId = null;
    closeModal('clergy-modal');
    renderModule();
  }

    const c = clergy.find(x => x.id === id);
    clergy = clergy.filter(x => x.id !== id);
    toast(`${c.name} removed.`);
    renderModule();

    document.getElementById('inventory-modal').classList.remove('hidden');
    document.getElementById('inventory-form').innerHTML = `
      <div class="space-y-1.5"><label class="text-xs font-medium">Item name</label><input id="invf-name" type="text" placeholder="e.g. Foldable Chairs" value="${i ? i.name : ''}" class="w-full border border-divider rounded-input px-3 h-10 text-sm bg-white focus:ring-2 focus:ring-primary-light focus:outline-none"></div>
      <div class="grid grid-cols-2 gap-3">
        <div class="space-y-1.5"><label class="text-xs font-medium">Category</label>
          <select id="invf-category" class="w-full border border-divider rounded-input px-3 h-10 text-sm bg-white focus:ring-2 focus:ring-primary-light focus:outline-none">
            ${["Furniture","Liturgical","Electronics","Vehicle","Other"].map(c => `<option ${i && i.category===c ? 'selected' : ''}>${c}</option>`).join('')}
          </select>
        </div>
        <div class="space-y-1.5"><label class="text-xs font-medium">Quantity</label><input id="invf-qty" type="number" value="${i ? i.quantity : 1}" class="w-full border border-divider rounded-input px-3 h-10 text-sm bg-white focus:ring-2 focus:ring-primary-light focus:outline-none"></div>
      </div>
      <div class="space-y-1.5"><label class="text-xs font-medium">Condition</label>
        <select id="invf-condition" class="w-full border border-divider rounded-input px-3 h-10 text-sm bg-white focus:ring-2 focus:ring-primary-light focus:outline-none">
          <option ${!i || i.condition==='Good' ? 'selected' : ''}>Good</option>
          <option ${i && i.condition==='Needs Repair' ? 'selected' : ''}>Needs Repair</option>
          <option ${i && i.condition==='Damaged' ? 'selected' : ''}>Damaged</option>
        </select>
      </div>
      <div class="space-y-1.5"><label class="text-xs font-medium">Location</label><input id="invf-location" type="text" value="${i ? i.location : ''}" class="w-full border border-divider rounded-input px-3 h-10 text-sm bg-white focus:ring-2 focus:ring-primary-light focus:outline-none"></div>
    `;
  }
  function submitInventoryItem() {
    const name = document.getElementById('invf-name').value.trim();
    const category = document.getElementById('invf-category').value;
    const quantity = parseInt(document.getElementById('invf-qty').value) || 0;
    const condition = document.getElementById('invf-condition').value;
    const location = document.getElementById('invf-location').value.trim();
    if (!name) { toast('Please enter an item name.'); return; }
    if (editingInventoryId) {
      Object.assign(inventoryItems.find(x => x.id === editingInventoryId), { name, category, quantity, condition, location, lastUpdated: '2026-07-31' });
      toast(`${name} updated.`);
    } else {
      inventoryItems.push({ id: 'INV-' + Math.floor(100 + Math.random()*899), name, category, quantity, condition, location, lastUpdated: '2026-07-31' });
      toast(`${name} added.`);
    }
    editingInventoryId = null;
    closeModal('inventory-modal');
    renderModule();
  }
  function deleteInventoryItem(id) {
    const i = inventoryItems.find(x => x.id === id);
    inventoryItems = inventoryItems.filter(x => x.id !== id);
    toast(`${i.name} deleted.`);
    renderModule();
  }

  // =========================================================================
  // MODULE 4: Staff & Payroll
  // =========================================================================
  function renderStaffModule(el) {
    const totalPayroll = staffMembers.reduce((s, m) => s + m.monthlySalary, 0);
    el.innerHTML = `
      <div class="bg-card-bg rounded-card shadow-card p-5 mb-4 flex items-center justify-between flex-wrap gap-3">
        <div>
          <p class="text-xs text-ink-muted uppercase tracking-wide">Total monthly payroll</p>
          <p class="font-heading font-bold text-2xl mt-1">${formatMoney(totalPayroll)}</p>
        </div>
        <button onclick="openStaffModal()" class="bg-primary hover:bg-primary-hover text-white text-sm font-semibold px-4 py-2.5 rounded-button min-h-[40px] transition-warm flex items-center gap-1.5">${icon('plus','icon w-4 h-4')}Add Staff Member</button>
      </div>
      <div class="bg-card-bg rounded-card shadow-card overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead>
              <tr class="border-b border-divider text-left text-ink-muted text-xs uppercase tracking-wide">
                <th class="px-4 py-3 font-medium">Name</th>
                <th class="px-4 py-3 font-medium">Role</th>
                <th class="px-4 py-3 font-medium">Joined</th>
                <th class="px-4 py-3 font-medium">Monthly Salary</th>
                <th class="px-4 py-3 font-medium">This Month</th>
                <th class="px-4 py-3 font-medium"></th>
              </tr>
            </thead>
            <tbody>
              ${staffMembers.map(m => `
                <tr class="border-b border-divider last:border-0">
                  <td class="px-4 py-3 font-medium">${m.name}</td>
                  <td class="px-4 py-3 text-ink-muted">${m.role}</td>
                  <td class="px-4 py-3 text-ink-muted whitespace-nowrap">${formatDate(m.joinedDate)}</td>
                  <td class="px-4 py-3">${formatMoney(m.monthlySalary)}</td>
                  <td class="px-4 py-3">
                    <button onclick="togglePaymentStatus('${m.id}')" class="${m.paymentStatus==='Paid' ? 'bg-green/20 text-[#2f6b45]' : 'bg-gold/20 text-[#8a5a10]'} text-xs font-semibold px-2.5 py-1 rounded-badge whitespace-nowrap transition-warm">${m.paymentStatus}</button>
                  </td>
                  <td class="px-4 py-3">
                    <div class="flex items-center gap-1 justify-end">
                      <button onclick="openStaffModal('${m.id}')" aria-label="Edit staff member" class="w-8 h-8 rounded-button flex items-center justify-center text-ink-muted hover:bg-section-bg transition-warm">${icon('edit','icon w-4 h-4')}</button>
                      <button onclick="deleteStaff('${m.id}')" aria-label="Delete staff member" class="w-8 h-8 rounded-button flex items-center justify-center text-error hover:bg-error-bg transition-warm">${icon('trash','icon w-4 h-4')}</button>
                    </div>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      </div>
      <p class="text-xs text-ink-muted mt-3">Tap a payment pill to toggle it between Paid and Pending for the current month.</p>
    `;
  }

  function togglePaymentStatus(id) {
    const m = staffMembers.find(x => x.id === id);
    m.paymentStatus = m.paymentStatus === 'Paid' ? 'Pending' : 'Paid';
    renderModule();
  }

  let editingStaffId = null;
  function openStaffModal(editId) {
    editingStaffId = editId || null;
    const m = editId ? staffMembers.find(x => x.id === editId) : null;
    document.getElementById('staff-modal-title').textContent = m ? 'Edit Staff Member' : 'Add Staff Member';
    document.getElementById('staff-modal-save-label').textContent = m ? 'Save Changes' : 'Save';
    document.getElementById('staff-modal').classList.remove('hidden');
    document.getElementById('staff-form').innerHTML = `
      <div class="space-y-1.5"><label class="text-xs font-medium">Full name</label><input id="stf-name" type="text" placeholder="e.g. Grace Almeida" value="${m ? m.name : ''}" class="w-full border border-divider rounded-input px-3 h-10 text-sm bg-white focus:ring-2 focus:ring-primary-light focus:outline-none"></div>
      <div class="space-y-1.5"><label class="text-xs font-medium">Role</label><input id="stf-role" type="text" placeholder="e.g. Parish Secretary" value="${m ? m.role : ''}" class="w-full border border-divider rounded-input px-3 h-10 text-sm bg-white focus:ring-2 focus:ring-primary-light focus:outline-none"></div>
      <div class="grid grid-cols-2 gap-3">
        <div class="space-y-1.5"><label class="text-xs font-medium">Phone</label><input id="stf-phone" type="text" value="${m ? m.phone : ''}" class="w-full border border-divider rounded-input px-3 h-10 text-sm bg-white focus:ring-2 focus:ring-primary-light focus:outline-none"></div>
        <div class="space-y-1.5"><label class="text-xs font-medium">Joined date</label><input id="stf-joined" type="date" value="${m ? m.joinedDate : ''}" class="w-full border border-divider rounded-input px-3 h-10 text-sm bg-white focus:ring-2 focus:ring-primary-light focus:outline-none"></div>
      </div>
      <div class="space-y-1.5"><label class="text-xs font-medium">Monthly salary (₹)</label><input id="stf-salary" type="number" value="${m ? m.monthlySalary : ''}" class="w-full border border-divider rounded-input px-3 h-10 text-sm bg-white focus:ring-2 focus:ring-primary-light focus:outline-none"></div>
    `;
  }
  function submitStaff() {
    const name = document.getElementById('stf-name').value.trim();
    const role = document.getElementById('stf-role').value.trim();
    const phone = document.getElementById('stf-phone').value.trim();
    const joinedDate = document.getElementById('stf-joined').value;
    const monthlySalary = parseFloat(document.getElementById('stf-salary').value) || 0;
    if (!name || !role) { toast('Please enter a name and role.'); return; }
    if (editingStaffId) {
      Object.assign(staffMembers.find(x => x.id === editingStaffId), { name, role, phone, joinedDate, monthlySalary });
      toast(`${name} updated.`);
    } else {
      staffMembers.push({ id: 'STF-' + Math.floor(100 + Math.random()*899), name, role, phone, email: '', joinedDate: joinedDate || '2026-07-31', monthlySalary, paymentStatus: 'Pending' });
      toast(`${name} added.`);
    }
    editingStaffId = null;
    closeModal('staff-modal');
    renderModule();
  }
  function deleteStaff(id) {
    const m = staffMembers.find(x => x.id === id);
    staffMembers = staffMembers.filter(x => x.id !== id);
    toast(`${m.name} removed.`);
    renderModule();
  }

  renderModule();
</script>

</body>
</html>
