<!DOCTYPE html>
<html lang="en">
<head>
<title>Parish Connect — Services</title>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          'bg-warm': '#FAFBFD', 'card-bg': '#FFFFFF', 'section-bg': '#F5F7FB', divider: '#E8EDF5',
          ink: '#1F2937', 'ink-muted': '#6B7280',
          primary: { DEFAULT: '#4F7CF5', hover: '#3F6CE4', light: '#EEF4FF' },
          coral: '#FF7F73', gold: '#F6C453', green: '#6CBF84', lavender: '#A88BFF',
          error: { DEFAULT: '#E5645A', bg: '#FDECEA' },
        },
        fontFamily: { heading: ['Manrope', 'sans-serif'], body: ['Inter', 'sans-serif'] },
        borderRadius: { card: '24px', button: '16px', input: '16px', badge: '999px' },
        boxShadow: { card: '0 6px 24px rgba(30,41,59,0.08)', 'card-hover': '0 12px 36px rgba(30,41,59,0.12)' },
      },
    },
  };
</script>
<style>
  body { font-family: 'Inter', sans-serif; background-color: #FAFBFD; color: #1F2937; line-height: 1.5; }
  h1, h2, .font-heading { font-family: 'Manrope', sans-serif; }
  :focus-visible { outline: 2px solid #4F7CF5; outline-offset: 2px; }
  .transition-warm { transition: all 200ms ease; }
  .icon { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body class="text-ink">

  <div class="max-w-[420px] mx-auto min-h-screen bg-bg-warm pb-24 relative">

    <!-- ============ TOP BAR ============ -->
    <header class="px-5 pt-5 pb-4">
      <p class="font-heading font-bold text-xl">Services</p>
      <p class="text-ink-muted text-sm mt-1">Everything you can request from the parish, in one place.</p>
    </header>

    <main class="px-5 space-y-3">

      <button onclick="window.location.href='screen-parishioner-documents-request.html?' + sessionParams.toString()" class="w-full bg-card-bg rounded-card shadow-card p-5 flex items-center gap-4 text-left transition-warm hover:shadow-card-hover min-h-[44px]">
        <span class="w-12 h-12 rounded-badge bg-lavender/20 text-[#5b3fc4] flex items-center justify-center flex-shrink-0"><svg class="icon w-5 h-5" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/></svg></span>
        <div class="min-w-0 flex-1">
          <p class="text-sm font-semibold">Documents &amp; Certificates</p>
          <p class="text-xs text-ink-muted mt-0.5">Baptism, Confirmation, Marriage certificates, NOC and more</p>
        </div>
        <span class="text-ink-muted flex-shrink-0"><svg class="icon w-5 h-5" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></span>
      </button>

      <button onclick="window.location.href='screen-parishioner-sacraments-register.html?' + sessionParams.toString()" class="w-full bg-card-bg rounded-card shadow-card p-5 flex items-center gap-4 text-left transition-warm hover:shadow-card-hover min-h-[44px]">
        <span class="w-12 h-12 rounded-badge bg-green/20 text-[#2f6b45] flex items-center justify-center flex-shrink-0"><svg class="icon w-5 h-5" viewBox="0 0 24 24"><path d="M12 2v20M5 7h14"/></svg></span>
        <div class="min-w-0 flex-1">
          <p class="text-sm font-semibold">Sacraments</p>
          <p class="text-xs text-ink-muted mt-0.5">Register for Baptism, First Communion, Confirmation, Marriage</p>
        </div>
        <span class="text-ink-muted flex-shrink-0"><svg class="icon w-5 h-5" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></span>
      </button>

      <button onclick="window.location.href='screen-parishioner-homeservices-request.html?' + sessionParams.toString()" class="w-full bg-card-bg rounded-card shadow-card p-5 flex items-center gap-4 text-left transition-warm hover:shadow-card-hover min-h-[44px]">
        <span class="w-12 h-12 rounded-badge bg-coral/20 text-[#b1402f] flex items-center justify-center flex-shrink-0"><svg class="icon w-5 h-5" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/></svg></span>
        <div class="min-w-0 flex-1">
          <p class="text-sm font-semibold">Home Services</p>
          <p class="text-xs text-ink-muted mt-0.5">House blessing, home Communion, sick visits and more</p>
        </div>
        <span class="text-ink-muted flex-shrink-0"><svg class="icon w-5 h-5" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></span>
      </button>

      <button onclick="window.location.href='screen-parishioner-facilities-request.html?' + sessionParams.toString()" class="w-full bg-card-bg rounded-card shadow-card p-5 flex items-center gap-4 text-left transition-warm hover:shadow-card-hover min-h-[44px]">
        <span class="w-12 h-12 rounded-badge bg-primary-light text-primary flex items-center justify-center flex-shrink-0"><svg class="icon w-5 h-5" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="1"/><path d="M9 8h1M14 8h1M9 12h1M14 12h1M9 16h1M14 16h1"/></svg></span>
        <div class="min-w-0 flex-1">
          <p class="text-sm font-semibold">Facility Booking</p>
          <p class="text-xs text-ink-muted mt-0.5">Parish hall, meeting rooms, and grounds</p>
        </div>
        <span class="text-ink-muted flex-shrink-0"><svg class="icon w-5 h-5" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></span>
      </button>

      <div class="pt-4">
        <p class="text-xs font-semibold text-ink-muted uppercase tracking-wide mb-3">Your activity</p>
        <div class="grid grid-cols-2 gap-3">
          <button onclick="window.location.href='screen-parishioner-documents-myrequests.html?' + sessionParams.toString()" class="bg-card-bg rounded-card shadow-card p-4 text-left transition-warm hover:shadow-card-hover min-h-[44px]">
            <p class="text-xs font-semibold">My Document Requests</p>
          </button>
          <button onclick="window.location.href='screen-parishioner-sacraments-myregistrations.html?' + sessionParams.toString()" class="bg-card-bg rounded-card shadow-card p-4 text-left transition-warm hover:shadow-card-hover min-h-[44px]">
            <p class="text-xs font-semibold">My Sacrament Registrations</p>
          </button>
          <button onclick="window.location.href='screen-parishioner-homeservices-myrequests.html?' + sessionParams.toString()" class="bg-card-bg rounded-card shadow-card p-4 text-left transition-warm hover:shadow-card-hover min-h-[44px]">
            <p class="text-xs font-semibold">My Home Service Requests</p>
          </button>
          <button onclick="window.location.href='screen-parishioner-facilities-mybookings.html?' + sessionParams.toString()" class="bg-card-bg rounded-card shadow-card p-4 text-left transition-warm hover:shadow-card-hover min-h-[44px]">
            <p class="text-xs font-semibold">My Facility Bookings</p>
          </button>
        </div>
      </div>

    </main>

  </div>

  <!-- ============ BOTTOM NAV (5 items) ============ -->
  <nav class="fixed bottom-0 left-0 right-0 bg-card-bg border-t border-divider max-w-[420px] mx-auto">
    <div class="grid grid-cols-5">
      <button onclick="window.location.href='screen-parishioner-dashboard-home.html?' + sessionParams.toString()" class="flex flex-col items-center gap-1 py-3 text-ink-muted">
        <svg class="icon" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/></svg>
        <span class="text-[10.5px]">Home</span>
      </button>
      <button class="flex flex-col items-center gap-1 py-3 text-primary">
        <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="4" width="7" height="7" rx="1.5"/><rect x="14" y="4" width="7" height="7" rx="1.5"/><rect x="3" y="15" width="7" height="7" rx="1.5"/><rect x="14" y="15" width="7" height="7" rx="1.5"/></svg>
        <span class="text-[10.5px] font-semibold">Services</span>
      </button>
      <button onclick="window.location.href='screen-parishioner-donate-hub.html?' + sessionParams.toString()"" class="flex flex-col items-center gap-1 py-3 text-ink-muted">
        <svg class="icon" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-10-9.3C.4 8.4 2.3 5 5.7 5 8 5 10 6.3 12 9c2-2.7 4-4 6.3-4 3.4 0 5.3 3.4 3.7 6.7C19.5 16.4 12 21 12 21Z"/></svg>
        <span class="text-[10.5px]">Give</span>
      </button>
      <button onclick="window.location.href='screen-parishioner-family.html?' + sessionParams.toString()" class="flex flex-col items-center gap-1 py-3 text-ink-muted">
        <svg class="icon" viewBox="0 0 24 24"><circle cx="9" cy="7" r="3.5"/><path d="M2 21v-1a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v1"/><circle cx="18" cy="8" r="2.5"/></svg>
        <span class="text-[10.5px]">My Family</span>
      </button>
      <button onclick="window.location.href='screen-parishioner-me-hub.html?' + sessionParams.toString()"" class="flex flex-col items-center gap-1 py-3 text-ink-muted">
        <svg class="icon" viewBox="0 0 24 24"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
        <span class="text-[10.5px]">Menu</span>
      </button>
    </div>
  </nav>

<script>
  const sessionParams = new URLSearchParams(window.location.search);
</script>

</body>
</html>
