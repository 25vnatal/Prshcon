<!DOCTYPE html>
<html lang="en">
<head>
<title>Parish Connect — Ministry</title>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          'bg-warm': '#FAFBFD', 'card-bg': '#FFFFFF', 'section-bg': '#F5F7FB', divider: '#E8EDF5',
          ink: '#1F2937', 'ink-muted': '#6B7280',
          primary: { DEFAULT: '#4F7CF5', hover: '#3F6CE4', light: '#EEF4FF' },
          coral: '#FF7F73', gold: '#F6C453', green: '#6CBF84', lavender: '#A88BFF',
          error: { DEFAULT: '#E5645A', bg: '#FDECEA' },
        },
        fontFamily: { heading: ['Manrope', 'sans-serif'], body: ['Inter', 'sans-serif'] },
        borderRadius: { card: '24px', button: '16px', input: '16px', badge: '999px' },
        boxShadow: { card: '0 6px 24px rgba(30,41,59,0.08)' },
        maxWidth: { content: '1440px' },
      },
    },
  };
</script>
<style>
  body { font-family: 'Inter', sans-serif; background-color: #FAFBFD; color: #1F2937; line-height: 1.5; }
  h1, h2, h3, .font-heading { font-family: 'Manrope', sans-serif; }
  :focus-visible { outline: 2px solid #4F7CF5; outline-offset: 2px; }
  .transition-warm { transition: all 200ms ease; }
  .icon { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body class="text-ink">

  <div class="flex min-h-screen">

    <aside class="w-[280px] bg-card-bg border-r border-divider flex-shrink-0 flex flex-col fixed lg:static inset-y-0 left-0 z-40 -translate-x-full lg:translate-x-0 transition-transform" id="sidebar">
      <div class="px-6 pt-6 pb-5">
        <p class="font-heading font-bold text-base">Parish Connect</p>
        <p class="text-xs text-ink-muted mt-1">Diocese Console</p>
      </div>
      <nav class="flex-1 px-4 space-y-1 overflow-y-auto">
        <button onclick="return goDash()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-button text-ink-muted text-sm hover:bg-section-bg transition-warm">
          <svg class="icon" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/></svg>
          Dashboard
        </button>
        <button onclick="return goParishes()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-button text-ink-muted text-sm hover:bg-section-bg transition-warm">
          <svg class="icon" viewBox="0 0 24 24"><path d="M3 21V8l9-5 9 5v13"/><path d="M9 21v-6h6v6"/></svg>
          Parishes
        </button>
        <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-button bg-primary-light text-primary font-semibold text-sm">
          <svg class="icon" viewBox="0 0 24 24"><path d="M12 2v20M5 7h14"/></svg>
          Ministry
        </a>
        <button onclick="return goCommunication()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-button text-ink-muted text-sm hover:bg-section-bg transition-warm">
          <svg class="icon" viewBox="0 0 24 24"><path d="M4 4h16v12H7l-3 3V4Z"/></svg>
          Communication
        </button>
        <button onclick="return goDocuments()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-button text-ink-muted text-sm hover:bg-section-bg transition-warm">
          <svg class="icon" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/><path d="M9 13h6"/><path d="M9 17h6"/></svg>
          Documents
        </button>
        <button onclick="return goReports()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-button text-ink-muted text-sm hover:bg-section-bg transition-warm">
          <svg class="icon" viewBox="0 0 24 24"><path d="M4 20V10M12 20V4M20 20v-7"/></svg>
          Reports
        </button>
        <button onclick="return goSettings()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-button text-ink-muted text-sm hover:bg-section-bg transition-warm">
          <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.11-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1.11 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1Z"/></svg>
          Settings
        </button>
      </nav>
    </aside>
    <div id="sidebar-backdrop" onclick="toggleSidebar()" class="hidden fixed inset-0 bg-black/20 z-30 lg:hidden"></div>

    <div class="flex-1 min-w-0">
      <header class="bg-card-bg border-b border-divider px-6 lg:px-10 py-4 flex items-center justify-between sticky top-0 z-20">
        <div class="flex items-center gap-3">
          <button onclick="toggleSidebar()" aria-label="Toggle navigation" class="lg:hidden w-9 h-9 rounded-button flex items-center justify-center text-ink-muted hover:bg-section-bg">
            <svg class="icon" viewBox="0 0 24 24"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
          </button>
          <div>
            <p class="text-sm font-semibold">Bangalore Archdiocese</p>
            <p class="text-xs text-ink-muted">Ministry</p>
          </div>
        </div>
        <button id="avatar-btn" onclick="document.getElementById('account-menu').classList.toggle('hidden')" aria-label="Account menu" class="w-9 h-9 rounded-badge bg-lavender/30 text-[#5b3fc4] text-xs font-bold flex items-center justify-center flex-shrink-0">DA</button>
        <div id="account-menu" class="hidden absolute right-6 lg:right-10 top-16 bg-card-bg rounded-card shadow-card w-56 z-50 overflow-hidden">
          <div class="px-4 py-3.5 border-b border-divider">
            <p class="text-sm font-semibold">Diocese Admin</p>
            <p class="text-xs text-ink-muted">Bangalore Archdiocese</p>
          </div>
          <button onclick="window.location.href='screen-diocese-login.html'" class="w-full text-left px-4 py-3.5 text-sm text-error hover:bg-error-bg min-h-[44px] transition-warm">Log out</button>
        </div>
      </header>

      <main class="px-6 lg:px-10 py-8 max-w-content">
        <div class="mb-6">
          <p class="font-heading font-bold text-2xl">Ministry</p>
          <p class="text-ink-muted text-sm mt-1">Diocese-organized events, shared faith formation content, and pastoral ministries.</p>
        </div>

        <div class="flex gap-2 mb-6 flex-wrap">
          <button onclick="setModule('events')" data-module="events" class="module-tab px-4 py-2.5 rounded-badge text-sm font-semibold whitespace-nowrap transition-warm bg-primary text-white">Diocese Events</button>
          <button onclick="setModule('faithformation')" data-module="faithformation" class="module-tab px-4 py-2.5 rounded-badge text-sm font-semibold whitespace-nowrap transition-warm bg-card-bg text-ink-muted">Faith Formation</button>
          <button onclick="setModule('pastoral')" data-module="pastoral" class="module-tab px-4 py-2.5 rounded-badge text-sm font-semibold whitespace-nowrap transition-warm bg-card-bg text-ink-muted">Pastoral Ministries</button>
        </div>

        <div id="module-content"></div>
      </main>
    </div>
  </div>

  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-ink text-white text-sm px-4 py-2.5 rounded-button shadow-card opacity-0 pointer-events-none transition-opacity duration-200 max-w-[90%] text-center z-50"></div>

  <!-- EVENT MODAL -->
  <div id="event-modal" class="hidden fixed inset-0 bg-black/30 z-50 flex items-center justify-center p-4">
    <div class="bg-card-bg rounded-card shadow-card w-full max-w-lg max-h-[85vh] overflow-y-auto">
      <div class="px-6 pt-6 pb-4 border-b border-divider flex items-center justify-between">
        <p id="event-modal-title" class="font-heading font-bold text-lg">Add Event</p>
        <button onclick="closeModal('event-modal')" aria-label="Close" class="w-9 h-9 rounded-button flex items-center justify-center text-ink-muted hover:bg-section-bg">
          <svg class="icon" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="M6 6l12 12"/></svg>
        </button>
      </div>
      <div id="event-form" class="px-6 py-5 space-y-4"></div>
      <div class="px-6 pb-6 pt-2 flex gap-3">
        <button onclick="submitEvent('Draft')" class="text-ink-muted border border-divider text-sm font-semibold px-4 py-3 rounded-button min-h-[44px] transition-warm hover:bg-section-bg">Save as Draft</button>
        <button onclick="submitEvent('Published')" class="flex-1 bg-primary hover:bg-primary-hover text-white text-sm font-semibold py-3 rounded-button min-h-[44px] transition-warm">Publish</button>
      </div>
    </div>
  </div>

  <!-- REGISTRATIONS MODAL -->
  <div id="registrations-modal" class="hidden fixed inset-0 bg-black/30 z-50 flex items-center justify-center p-4">
    <div class="bg-card-bg rounded-card shadow-card w-full max-w-lg max-h-[85vh] overflow-y-auto">
      <div class="px-6 pt-6 pb-4 border-b border-divider flex items-center justify-between">
        <p id="registrations-modal-title" class="font-heading font-bold text-lg">Registrations</p>
        <button onclick="closeModal('registrations-modal')" aria-label="Close" class="w-9 h-9 rounded-button flex items-center justify-center text-ink-muted hover:bg-section-bg">
          <svg class="icon" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="M6 6l12 12"/></svg>
        </button>
      </div>
      <div id="registrations-body" class="px-6 py-5 space-y-2"></div>
    </div>
  </div>

  <!-- FAITH CONTENT MODAL -->
  <div id="faith-modal" class="hidden fixed inset-0 bg-black/30 z-50 flex items-center justify-center p-4">
    <div class="bg-card-bg rounded-card shadow-card w-full max-w-md max-h-[85vh] overflow-y-auto">
      <div class="px-6 pt-6 pb-4 border-b border-divider flex items-center justify-between">
        <p id="faith-modal-title" class="font-heading font-bold text-lg">Add Content</p>
        <button onclick="closeModal('faith-modal')" aria-label="Close" class="w-9 h-9 rounded-button flex items-center justify-center text-ink-muted hover:bg-section-bg">
          <svg class="icon" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="M6 6l12 12"/></svg>
        </button>
      </div>
      <div id="faith-form" class="px-6 py-5 space-y-4"></div>
      <div class="px-6 pb-6 pt-2 flex gap-3">
        <button onclick="submitFaithContent('Draft')" class="text-ink-muted border border-divider text-sm font-semibold px-4 py-3 rounded-button min-h-[44px] transition-warm hover:bg-section-bg">Save as Draft</button>
        <button onclick="submitFaithContent('Published')" class="flex-1 bg-primary hover:bg-primary-hover text-white text-sm font-semibold py-3 rounded-button min-h-[44px] transition-warm">Publish to Parishes</button>
      </div>
    </div>
  </div>

  <!-- PASTORAL PROGRAM MODAL -->
  <div id="program-modal" class="hidden fixed inset-0 bg-black/30 z-50 flex items-center justify-center p-4">
    <div class="bg-card-bg rounded-card shadow-card w-full max-w-md max-h-[85vh] overflow-y-auto">
      <div class="px-6 pt-6 pb-4 border-b border-divider flex items-center justify-between">
        <p id="program-modal-title" class="font-heading font-bold text-lg">Add Program</p>
        <button onclick="closeModal('program-modal')" aria-label="Close" class="w-9 h-9 rounded-button flex items-center justify-center text-ink-muted hover:bg-section-bg">
          <svg class="icon" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="M6 6l12 12"/></svg>
        </button>
      </div>
      <div id="program-form" class="px-6 py-5 space-y-4"></div>
      <div class="px-6 pb-6 pt-2">
        <button onclick="submitProgram()" class="w-full bg-primary hover:bg-primary-hover text-white text-sm font-semibold py-3 rounded-button min-h-[44px] transition-warm"><span id="program-modal-save-label">Add Program</span></button>
      </div>
    </div>
  </div>

<script>
  const sessionParams = new URLSearchParams(window.location.search);
  function baseParams() {
    const p = new URLSearchParams();
    ['name'].forEach(k => { if (sessionParams.get(k)) p.set(k, sessionParams.get(k)); });
    return p;
  }
  function goDash() { window.location.href = 'screen-diocese-dashboard-home.html?' + baseParams().toString(); return false; }
  function goParishes() { window.location.href = 'screen-diocese-parishes-hub.html?' + baseParams().toString(); return false; }
  function goCommunication() { window.location.href = 'screen-diocese-communication-hub.html?' + baseParams().toString(); return false; }
  function goDocuments() { window.location.href = 'screen-diocese-documents-hub.html?' + baseParams().toString(); return false; }
  function goReports() { window.location.href = 'screen-diocese-reports-hub.html?' + baseParams().toString(); return false; }
  function goSettings() { window.location.href = 'screen-diocese-settings-hub.html?' + baseParams().toString(); return false; }
  function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('-translate-x-full');
    document.getElementById('sidebar-backdrop').classList.toggle('hidden');
  }
  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.remove('opacity-0'); t.classList.add('opacity-100');
    clearTimeout(window._t);
    window._t = setTimeout(() => { t.classList.remove('opacity-100'); t.classList.add('opacity-0'); }, 1800);
  }
  function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
  const MONTH_NAMES = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  function formatDate(iso) {
    if (!iso) return '\u2014';
    const [y,m,d] = iso.split('-').map(Number);
    return `${d} ${MONTH_NAMES[m-1]} ${y}`;
  }
  function statusPill(status) {
    const map = { 'Published':['bg-green/20','text-[#2f6b45]'], 'Draft':['bg-gold/20','text-[#8a5a10]'], 'Active':['bg-green/20','text-[#2f6b45]'], 'Paused':['bg-section-bg','text-ink-muted'] };
    const [bg, text] = map[status] || ['bg-section-bg','text-ink-muted'];
    return `<span class="${bg} ${text} text-xs font-semibold px-2.5 py-1 rounded-badge whitespace-nowrap">${status}</span>`;
  }
  const ICON_PATHS = {
    plus: '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
    edit: '<path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="m18.5 2.5 3 3L12 15l-4 1 1-4Z"/>',
    trash: '<path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>',
    users: '<circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M2 21v-1a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v1"/><path d="M15 15.5a4 4 0 0 1 5 3.5"/>',
    search: '<circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>',
    check: '<path d="M20 6 9 17l-5-5"/>',
  };
  function icon(name, cls) { return `<svg class="${cls||'icon'}" viewBox="0 0 24 24">${ICON_PATHS[name]}</svg>`; }
  function statCard(label, value) {
    return `<div class="bg-card-bg rounded-card shadow-card p-5"><p class="font-heading font-bold text-2xl">${value}</p><p class="text-xs text-ink-muted mt-1">${label}</p></div>`;
  }

  let currentModule = 'events';
  function setModule(m) {
    currentModule = m;
    document.querySelectorAll('.module-tab').forEach(btn => {
      const active = btn.dataset.module === m;
      btn.className = `module-tab px-4 py-2.5 rounded-badge text-sm font-semibold whitespace-nowrap transition-warm ${active ? 'bg-primary text-white' : 'bg-card-bg text-ink-muted'}`;
    });
    renderModule();
  }
  function renderModule() {
    const el = document.getElementById('module-content');
    if (currentModule === 'events') renderEventsModule(el);
    else if (currentModule === 'faithformation') renderFaithFormationModule(el);
    else renderPastoralModule(el);
  }

  // =========================================================================
  // MODULE 1: Diocese Events — same 3 diocese-organized events already
  // established in Reports (Confirmation Mass, Priests' Retreat, Youth
  // Convention), now editable here as their source of truth, plus two more
  // for variety. CRUD + Registrations, mirroring the Parish-side Events pattern.
  // =========================================================================
  const EVENT_CATEGORIES = ["Liturgical", "Clergy", "Youth", "Formation", "Social"];
  let dioceseEvents = [
    { id:"DEVT-001", name:"Confirmation Mass — Cathedral", category:"Liturgical", status:"Published", eventDate:"2026-08-03", venue:"St Francis Xavier Cathedral", registrationRequired:false,
      registrations:[] },
    { id:"DEVT-002", name:"Annual Priests' Retreat", category:"Clergy", status:"Published", eventDate:"2026-08-18", venue:"Diocesan Retreat Centre", registrationRequired:true,
      registrations:[
        { name:"Fr. John Anthony", parish:"Infant Jesus Shrine", attendance:"Not Recorded" },
        { name:"Fr. Francis Billemane", parish:"Infant Jesus Shrine", attendance:"Not Recorded" },
      ] },
    { id:"DEVT-003", name:"Diocesan Youth Convention", category:"Youth", status:"Published", eventDate:"2026-10-10", venue:"St Francis Xavier Cathedral", registrationRequired:true,
      registrations:[
        { name:"Kevin Rodrigues", parish:"Infant Jesus Shrine", attendance:"Not Recorded" },
      ] },
    { id:"DEVT-004", name:"Catechist Formation Day", category:"Formation", status:"Draft", eventDate:"2026-09-20", venue:"Diocesan Pastoral Centre", registrationRequired:true, registrations:[] },
    { id:"DEVT-005", name:"Chrism Mass", category:"Liturgical", status:"Published", eventDate:"2027-03-25", venue:"St Francis Xavier Cathedral", registrationRequired:false, registrations:[] },
  ];
  function renderEventsModule(el) {
    el.innerHTML = `
      <div class="flex justify-end mb-4">
        <button onclick="openEventModal()" class="bg-primary hover:bg-primary-hover text-white text-sm font-semibold px-4 py-2.5 rounded-button min-h-[40px] transition-warm flex items-center gap-1.5">${icon('plus','icon w-4 h-4')}Add Event</button>
      </div>
      <div class="grid md:grid-cols-2 gap-4">
        ${dioceseEvents.map(e => `
          <div class="bg-card-bg rounded-card shadow-card p-5">
            <div class="flex items-start justify-between gap-3 mb-1">
              <p class="text-sm font-semibold">${e.name}</p>
              ${statusPill(e.status)}
            </div>
            <p class="text-xs text-ink-muted">${e.category} \u00b7 ${formatDate(e.eventDate)} \u00b7 ${e.venue}</p>
            <div class="flex gap-2 mt-3">
              <button onclick="openEventModal('${e.id}')" class="bg-section-bg text-ink text-xs font-semibold px-3 py-2 rounded-button min-h-[36px] transition-warm hover:bg-primary-light">Edit</button>
              ${e.registrationRequired ? `<button onclick="openRegistrationsModal('${e.id}')" class="bg-white border border-divider text-ink-muted text-xs font-semibold px-3 py-2 rounded-button min-h-[36px] transition-warm hover:bg-section-bg flex items-center gap-1.5">${icon('users','icon w-3.5 h-3.5')}${e.registrations.length} registered</button>` : ''}
              <button onclick="deleteEvent('${e.id}')" class="bg-white border border-divider text-error text-xs font-semibold px-3 py-2 rounded-button min-h-[36px] transition-warm hover:bg-error-bg">Delete</button>
            </div>
          </div>
        `).join('')}
      </div>
    `;
  }
  let editingEventId = null;
  function openEventModal(editId) {
    editingEventId = editId || null;
    const e = editId ? dioceseEvents.find(x => x.id === editId) : null;
    document.getElementById('event-modal-title').textContent = e ? 'Edit Event' : 'Add Event';
    document.getElementById('event-modal').classList.remove('hidden');
    document.getElementById('event-form').innerHTML = `
      <div class="space-y-1.5"><label class="text-xs font-medium">Event name</label><input id="ef-name" type="text" value="${e ? e.name : ''}" class="w-full border border-divider rounded-input px-3 h-10 text-sm bg-white focus:ring-2 focus:ring-primary-light focus:outline-none"></div>
      <div class="grid grid-cols-2 gap-3">
        <div class="space-y-1.5"><label class="text-xs font-medium">Category</label>
          <select id="ef-category" class="w-full border border-divider rounded-input px-3 h-10 text-sm bg-white focus:ring-2 focus:ring-primary-light focus:outline-none">
            ${EVENT_CATEGORIES.map(cat => `<option ${e && e.category===cat ? 'selected' : ''}>${cat}</option>`).join('')}
          </select>
        </div>
        <div class="space-y-1.5"><label class="text-xs font-medium">Date</label><input id="ef-date" type="date" value="${e ? e.eventDate : ''}" class="w-full border border-divider rounded-input px-3 h-10 text-sm bg-white focus:ring-2 focus:ring-primary-light focus:outline-none"></div>
      </div>
      <div class="space-y-1.5"><label class="text-xs font-medium">Venue</label><input id="ef-venue" type="text" value="${e ? e.venue : ''}" class="w-full border border-divider rounded-input px-3 h-10 text-sm bg-white focus:ring-2 focus:ring-primary-light focus:outline-none"></div>
      <label class="flex items-center gap-2 text-sm"><input id="ef-regreq" type="checkbox" ${e && e.registrationRequired ? 'checked' : ''} class="w-4 h-4"> Registration required</label>
    `;
  }
  function submitEvent(status) {
    const name = document.getElementById('ef-name').value.trim();
    if (!name) { toast('Please enter an event name.'); return; }
    const category = document.getElementById('ef-category').value;
    const eventDate = document.getElementById('ef-date').value;
    const venue = document.getElementById('ef-venue').value.trim();
    const registrationRequired = document.getElementById('ef-regreq').checked;
    if (editingEventId) {
      Object.assign(dioceseEvents.find(x => x.id === editingEventId), { name, category, eventDate, venue, registrationRequired, status });
    } else {
      dioceseEvents.unshift({ id:'DEVT-'+Math.floor(100+Math.random()*899), name, category, eventDate, venue, registrationRequired, status, registrations:[] });
    }
    toast(`${name} ${status === 'Published' ? 'published' : 'saved as draft'}.`);
    editingEventId = null;
    closeModal('event-modal');
    renderModule();
  }
  function deleteEvent(id) {
    const e = dioceseEvents.find(x => x.id === id);
    dioceseEvents = dioceseEvents.filter(x => x.id !== id);
    toast(`${e.name} deleted.`);
    renderModule();
  }
  function openRegistrationsModal(eventId) {
    const e = dioceseEvents.find(x => x.id === eventId);
    document.getElementById('registrations-modal-title').textContent = e.name + ' \u2014 Registrations';
    document.getElementById('registrations-modal').classList.remove('hidden');
    document.getElementById('registrations-body').innerHTML = e.registrations.length === 0
      ? '<p class="text-sm text-ink-muted text-center py-4">No registrations yet.</p>'
      : e.registrations.map((r, i) => `
          <div class="flex items-center justify-between gap-3 py-2 border-b border-divider last:border-0">
            <div><p class="text-sm font-medium">${r.name}</p><p class="text-xs text-ink-muted">${r.parish}</p></div>
            <button onclick="toggleAttendance('${eventId}', ${i})" class="${r.attendance === 'Present' ? 'bg-green/20 text-[#2f6b45]' : 'bg-section-bg text-ink-muted'} text-xs font-semibold px-2.5 py-1.5 rounded-badge transition-warm">${r.attendance}</button>
          </div>
        `).join('');
  }
  function toggleAttendance(eventId, i) {
    const e = dioceseEvents.find(x => x.id === eventId);
    e.registrations[i].attendance = e.registrations[i].attendance === 'Present' ? 'Not Recorded' : 'Present';
    openRegistrationsModal(eventId);
  }

  // =========================================================================
  // MODULE 2: Faith Formation — a diocese-published content library that
  // parishes draw from, distinct from Reports' adoption metrics (this is the
  // content itself; Reports shows how much of it parishes are actually using).
  // Same categories as the Parish-side Faith Formation hub, for continuity.
  // =========================================================================
  const FAITH_CATEGORIES = ["Daily Prayers", "Readings & Reflections", "Special Prayers", "Rosary", "Feast Day Content"];
  let dioceseFaithContent = [
    { id:"DFF-001", category:"Readings & Reflections", title:"Advent Reflection Series (Diocese-wide)", status:"Published", publishedDate:"2026-07-10" },
    { id:"DFF-002", category:"Special Prayers", title:"Prayer for Vocations (Diocesan)", status:"Published", publishedDate:"2026-06-01" },
    { id:"DFF-003", category:"Feast Day Content", title:"Feast of the Archdiocese's Patron — Devotional Note", status:"Published", publishedDate:"2026-05-15" },
    { id:"DFF-004", category:"Daily Prayers", title:"Novena for Priestly Vocations", status:"Draft", publishedDate:null },
  ];
  let faithSearch = '';
  function filteredFaithContent() {
    const q = faithSearch.trim().toLowerCase();
    return dioceseFaithContent.filter(f => !q || f.title.toLowerCase().includes(q));
  }
  function renderFaithFormationModule(el) {
    el.innerHTML = `
      <div class="bg-card-bg rounded-card shadow-card p-4 mb-4 flex flex-wrap items-center gap-3">
        <div class="relative flex-1 min-w-[200px]">
          <span class="absolute left-3 top-1/2 -translate-y-1/2 text-ink-muted">${icon('search','icon w-4 h-4')}</span>
          <input type="text" placeholder="Search content…" value="${faithSearch}" oninput="faithSearch=this.value; renderFaithContentList()" class="w-full border border-divider rounded-input pl-9 pr-3 h-10 text-sm bg-bg-warm focus:ring-2 focus:ring-primary-light focus:outline-none">
        </div>
        <button onclick="openFaithModal()" class="bg-primary hover:bg-primary-hover text-white text-sm font-semibold px-4 py-2.5 rounded-button min-h-[40px] transition-warm flex items-center gap-1.5 flex-shrink-0">${icon('plus','icon w-4 h-4')}Add Content</button>
      </div>
      <p class="text-xs text-ink-muted mb-3">Content published here becomes available to every parish's own Faith Formation library.</p>
      <div id="faith-list" class="space-y-3"></div>
    `;
    renderFaithContentList();
  }
  function renderFaithContentList() {
    const list = filteredFaithContent();
    document.getElementById('faith-list').innerHTML = list.length === 0
      ? '<div class="bg-card-bg rounded-card shadow-card p-10 text-center"><p class="text-sm font-semibold">No content found</p></div>'
      : list.map(f => `
        <div class="bg-card-bg rounded-card shadow-card p-5">
          <div class="flex items-start justify-between gap-3 mb-1">
            <div><p class="text-xs text-primary font-semibold uppercase tracking-wide">${f.category}</p><p class="text-sm font-semibold mt-0.5">${f.title}</p></div>
            <div class="flex items-center gap-1.5 flex-shrink-0">
              ${statusPill(f.status)}
              <button onclick="openFaithModal('${f.id}')" aria-label="Edit" class="w-8 h-8 rounded-button flex items-center justify-center text-ink-muted hover:bg-section-bg transition-warm">${icon('edit','icon w-4 h-4')}</button>
              <button onclick="deleteFaithContent('${f.id}')" aria-label="Delete" class="w-8 h-8 rounded-button flex items-center justify-center text-error hover:bg-error-bg transition-warm">${icon('trash','icon w-4 h-4')}</button>
            </div>
          </div>
          <p class="text-xs text-ink-muted mt-2">${f.status === 'Published' ? 'Published ' + formatDate(f.publishedDate) : 'Not yet published'}</p>
        </div>
      `).join('');
  }
  let editingFaithId = null;
  function openFaithModal(editId) {
    editingFaithId = editId || null;
    const f = editId ? dioceseFaithContent.find(x => x.id === editId) : null;
    document.getElementById('faith-modal-title').textContent = f ? 'Edit Content' : 'Add Content';
    document.getElementById('faith-modal').classList.remove('hidden');
    document.getElementById('faith-form').innerHTML = `
      <div class="space-y-1.5"><label class="text-xs font-medium">Category</label>
        <select id="ff-category" class="w-full border border-divider rounded-input px-3 h-10 text-sm bg-white focus:ring-2 focus:ring-primary-light focus:outline-none">
          ${FAITH_CATEGORIES.map(c => `<option ${f && f.category===c ? 'selected' : ''}>${c}</option>`).join('')}
        </select>
      </div>
      <div class="space-y-1.5"><label class="text-xs font-medium">Title</label><input id="ff-title" type="text" value="${f ? f.title : ''}" class="w-full border border-divider rounded-input px-3 h-10 text-sm bg-white focus:ring-2 focus:ring-primary-light focus:outline-none"></div>
    `;
  }
  function submitFaithContent(status) {
    const title = document.getElementById('ff-title').value.trim();
    if (!title) { toast('Please enter a title.'); return; }
    const category = document.getElementById('ff-category').value;
    if (editingFaithId) {
      Object.assign(dioceseFaithContent.find(x => x.id === editingFaithId), { category, title, status, publishedDate: status==='Published' ? '2026-07-31' : null });
    } else {
      dioceseFaithContent.unshift({ id:'DFF-'+Math.floor(100+Math.random()*899), category, title, status, publishedDate: status==='Published' ? '2026-07-31' : null });
    }
    toast(`${title} ${status === 'Published' ? 'published to all parishes' : 'saved as draft'}.`);
    editingFaithId = null;
    closeModal('faith-modal');
    renderModule();
  }
  function deleteFaithContent(id) {
    const f = dioceseFaithContent.find(x => x.id === id);
    dioceseFaithContent = dioceseFaithContent.filter(x => x.id !== id);
    toast(`${f.title} deleted.`);
    renderModule();
  }

  // =========================================================================
  // MODULE 3: Pastoral Ministries (Family / Youth / Catechism / Vocations)
  // =========================================================================
  const pastoralMinistries = {
    Family: [
      { name:"Marriage Preparation Program", coordinator:"Fr. Michael D'Souza", participants:186, status:"Active" },
      { name:"Family Counselling Service", coordinator:"Mrs. Teresa Fernandes", participants:42, status:"Active" },
      { name:"Golden Jubilee Couples Ministry", coordinator:"Mr. & Mrs. Pinto", participants:58, status:"Active" },
    ],
    Youth: [
      { name:"Diocesan Youth Ministry", coordinator:"Fr. Arun Kumar", participants:940, status:"Active" },
      { name:"Young Adults Fellowship", coordinator:"Ms. Priya Nair", participants:215, status:"Active" },
    ],
    Catechism: [
      { name:"Catechist Formation Program", coordinator:"Sr. Agnes Rodrigues", participants:312, status:"Active" },
      { name:"Sunday School Curriculum Committee", coordinator:"Fr. Joseph Menezes", participants:18, status:"Active" },
    ],
    Vocations: [
      { name:"Vocations Promotion Team", coordinator:"Fr. Anthony Swamy", participants:24, status:"Active" },
      { name:"Seminary Formation Support", coordinator:"Diocesan Vocations Office", participants:37, status:"Active" },
    ],
  };
  let pastoralTab = 'Family';
  function renderPastoralModule(el) {
    const totalParticipants = Object.values(pastoralMinistries).flat().reduce((s, m) => s + m.participants, 0);
    const totalPrograms = Object.values(pastoralMinistries).flat().length;
    el.innerHTML = `
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
        ${statCard('Total active programs', totalPrograms)}
        ${statCard('Total participants (diocese-wide)', totalParticipants.toLocaleString('en-IN'))}
        ${statCard('Ministry areas', 4)}
        ${statCard('Avg. participants per program', Math.round(totalParticipants/totalPrograms))}
      </div>
      <div class="flex items-center justify-between mb-4 flex-wrap gap-3">
        <div class="flex gap-2 flex-wrap" id="pastoral-tabs"></div>
        <button onclick="openProgramModal()" class="bg-primary hover:bg-primary-hover text-white text-sm font-semibold px-4 py-2.5 rounded-button min-h-[40px] transition-warm flex items-center gap-1.5">${icon('plus','icon w-4 h-4')}Add Program</button>
      </div>
      <div id="pastoral-list"></div>
    `;
    renderPastoralTabs();
    renderPastoralList();
  }
  function renderPastoralTabs() {
    document.getElementById('pastoral-tabs').innerHTML = Object.keys(pastoralMinistries).map(area =>
      `<button onclick="pastoralTab='${area}'; renderPastoralTabs(); renderPastoralList()" class="px-3.5 py-2 rounded-badge text-xs font-semibold whitespace-nowrap transition-warm ${pastoralTab === area ? 'bg-primary text-white' : 'bg-card-bg text-ink-muted border border-divider'}">${area}</button>`
    ).join('');
  }
  function renderPastoralList() {
    const programs = pastoralMinistries[pastoralTab];
    document.getElementById('pastoral-list').innerHTML = programs.length === 0
      ? `<div class="bg-card-bg rounded-card shadow-card p-8 text-center"><p class="text-sm text-ink-muted">No programs in ${pastoralTab} yet.</p></div>`
      : `
      <div class="grid md:grid-cols-2 gap-4">
        ${programs.map((p, i) => `
          <div class="bg-card-bg rounded-card shadow-card p-5">
            <div class="flex items-start justify-between gap-3 mb-1">
              <p class="text-sm font-semibold">${p.name}</p>
              ${statusPill(p.status)}
            </div>
            <p class="text-xs text-ink-muted">Coordinator: ${p.coordinator}</p>
            <p class="text-xs text-ink-muted mt-1">${p.participants.toLocaleString('en-IN')} participants</p>
            <div class="flex gap-2 mt-3">
              <button onclick="openProgramModal(${i})" class="bg-section-bg text-ink text-xs font-semibold px-3 py-2 rounded-button min-h-[36px] transition-warm hover:bg-primary-light">Edit</button>
              <button onclick="toggleProgramStatus(${i})" class="bg-white border border-divider text-ink-muted text-xs font-semibold px-3 py-2 rounded-button min-h-[36px] transition-warm hover:bg-section-bg">${p.status === 'Active' ? 'Pause' : 'Resume'}</button>
              <button onclick="deleteProgram(${i})" class="bg-white border border-divider text-error text-xs font-semibold px-3 py-2 rounded-button min-h-[36px] transition-warm hover:bg-error-bg">Delete</button>
            </div>
          </div>
        `).join('')}
      </div>
    `;
  }
  let editingProgramIndex = null;
  function openProgramModal(index) {
    editingProgramIndex = index === undefined ? null : index;
    const p = editingProgramIndex !== null ? pastoralMinistries[pastoralTab][editingProgramIndex] : null;
    document.getElementById('program-modal-title').textContent = p ? 'Edit Program' : 'Add Program';
    document.getElementById('program-modal-save-label').textContent = p ? 'Save Changes' : 'Add Program';
    document.getElementById('program-modal').classList.remove('hidden');
    document.getElementById('program-form').innerHTML = `
      <div class="space-y-1.5"><label class="text-xs font-medium">Ministry area</label>
        <select id="pgf-area" ${p ? 'disabled' : ''} class="w-full border border-divider rounded-input px-3 h-10 text-sm bg-white focus:ring-2 focus:ring-primary-light focus:outline-none disabled:bg-section-bg disabled:text-ink-muted">
          ${Object.keys(pastoralMinistries).map(a => `<option ${a === pastoralTab ? 'selected' : ''}>${a}</option>`).join('')}
        </select>
      </div>
      <div class="space-y-1.5"><label class="text-xs font-medium">Program name</label><input id="pgf-name" type="text" value="${p ? p.name : ''}" class="w-full border border-divider rounded-input px-3 h-10 text-sm bg-white focus:ring-2 focus:ring-primary-light focus:outline-none"></div>
      <div class="space-y-1.5"><label class="text-xs font-medium">Coordinator</label><input id="pgf-coordinator" type="text" value="${p ? p.coordinator : ''}" class="w-full border border-divider rounded-input px-3 h-10 text-sm bg-white focus:ring-2 focus:ring-primary-light focus:outline-none"></div>
      <div class="space-y-1.5"><label class="text-xs font-medium">Participants</label><input id="pgf-participants" type="number" min="0" value="${p ? p.participants : 0}" class="w-full border border-divider rounded-input px-3 h-10 text-sm bg-white focus:ring-2 focus:ring-primary-light focus:outline-none"></div>
    `;
  }
  function submitProgram() {
    const name = document.getElementById('pgf-name').value.trim();
    if (!name) { toast('Please enter a program name.'); return; }
    const coordinator = document.getElementById('pgf-coordinator').value.trim();
    const participants = parseInt(document.getElementById('pgf-participants').value) || 0;
    if (editingProgramIndex !== null) {
      const p = pastoralMinistries[pastoralTab][editingProgramIndex];
      Object.assign(p, { name, coordinator, participants });
      toast(`${name} updated.`);
    } else {
      const area = document.getElementById('pgf-area').value;
      pastoralMinistries[area].push({ name, coordinator, participants, status: 'Active' });
      pastoralTab = area;
      toast(`${name} added to ${area}.`);
    }
    editingProgramIndex = null;
    closeModal('program-modal');
    renderModule();
  }
  function toggleProgramStatus(index) {
    const p = pastoralMinistries[pastoralTab][index];
    p.status = p.status === 'Active' ? 'Paused' : 'Active';
    toast(`${p.name} ${p.status === 'Active' ? 'resumed' : 'paused'}.`);
    renderPastoralList();
  }
  function deleteProgram(index) {
    const p = pastoralMinistries[pastoralTab][index];
    pastoralMinistries[pastoralTab].splice(index, 1);
    toast(`${p.name} removed.`);
    renderModule();
  }

  renderModule();
</script>

</body>
</html>
