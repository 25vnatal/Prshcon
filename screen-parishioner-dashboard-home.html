<!DOCTYPE html>
<html lang="en">
<head>
<title>Parish Connect — Home</title>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Fonts: Manrope (headings, 600/700 only) + Inter (body/UI, 400/500). No serif. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Tailwind CDN -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          'bg-warm': '#FAFBFD',
          'card-bg': '#FFFFFF',
          'section-bg': '#F5F7FB',
          divider: '#E8EDF5',
          ink: '#1F2937',
          'ink-muted': '#6B7280',
          primary: { DEFAULT: '#4F7CF5', hover: '#3F6CE4', light: '#EEF4FF' },
          coral: '#FF7F73',
          gold: '#F6C453',
          green: '#6CBF84',
          lavender: '#A88BFF',
          error: { DEFAULT: '#E5645A', bg: '#FDECEA' },
        },
        fontFamily: {
          heading: ['Manrope', 'sans-serif'],
          body: ['Inter', 'sans-serif'],
        },
        borderRadius: {
          card: '24px',
          button: '16px',
          input: '16px',
          dialog: '24px',
          badge: '999px',
        },
        boxShadow: {
          card: '0 6px 24px rgba(30, 41, 59, 0.08)',
          'card-hover': '0 12px 36px rgba(30, 41, 59, 0.12)',
        },
      },
    },
  };
</script>
<style>
  body { font-family: 'Inter', sans-serif; background-color: #FAFBFD; color: #1F2937; line-height: 1.5; }
  h1, h2, h3, h4, .font-heading { font-family: 'Manrope', sans-serif; }
  :focus-visible { outline: 2px solid #4F7CF5; outline-offset: 2px; }
  .transition-warm { transition: all 200ms ease; }
  .icon { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .skeleton { background: linear-gradient(90deg, #E8EDF5 25%, #F2F5FA 37%, #E8EDF5 63%); background-size: 400% 100%; animation: shimmer 1.4s ease infinite; }
  @keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }
  @media (prefers-reduced-motion: reduce) { .skeleton { animation: none; } }
</style>
</head>
<body class="text-ink">

  <!-- ============ DEMO CONTROLS (not part of the product UI) ============ -->
  <div id="demo-bar" class="hidden bg-ink text-white text-xs px-4 py-2 flex items-center gap-2 flex-wrap sticky top-0 z-50">
    <span class="opacity-60 mr-1">Preview state:</span>
    <button onclick="setState('loading')" class="px-2 py-1 rounded bg-white/10 hover:bg-white/20">Loading</button>
    <button onclick="setState('empty')" class="px-2 py-1 rounded bg-white/10 hover:bg-white/20">Empty</button>
    <button onclick="setState('populated')" class="px-2 py-1 rounded bg-white/10 hover:bg-white/20">Populated</button>
    <button onclick="setState('error')" class="px-2 py-1 rounded bg-white/10 hover:bg-white/20">Error</button>
    <button onclick="document.getElementById('demo-bar').classList.add('hidden')" class="ml-auto px-2 py-1 rounded bg-white/10 hover:bg-white/20">Hide</button>
  </div>
  <button onclick="document.getElementById('demo-bar').classList.toggle('hidden')" aria-label="Toggle preview state controls" class="fixed bottom-2 right-2 w-3 h-3 rounded-full bg-ink/20 hover:bg-ink/50 z-50"></button>

  <div class="max-w-[420px] mx-auto min-h-screen bg-bg-warm pb-28 relative">

    <!-- ============ TOP BAR ============ -->
    <header class="px-5 pt-5 pb-2 flex items-center justify-between relative">
      <div class="flex items-center gap-2">
        <img src="assets/pc-logo.jpg" alt="Parish Connect" class="w-8 h-8 rounded-lg object-cover flex-shrink-0">
        <p class="font-heading font-bold text-base leading-none">Parish Connect</p>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="openSearch()" aria-label="Search" class="w-10 h-10 rounded-button flex items-center justify-center text-ink-muted hover:bg-section-bg transition-warm">
          <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
        <div class="relative flex-shrink-0">
          <button id="avatar-btn" onclick="document.getElementById('account-menu').classList.toggle('hidden')" aria-label="Account menu" class="w-10 h-10 rounded-badge bg-primary text-white text-xs font-bold flex items-center justify-center">JR</button>
          <span id="avatar-notification-dot" class="hidden absolute -top-0.5 -right-0.5 w-3 h-3 rounded-full bg-error border-2 border-bg-warm"></span>
        </div>
      </div>
      <div id="account-menu" class="hidden absolute right-5 top-16 bg-card-bg rounded-card shadow-card w-52 z-50 overflow-hidden">
        <div class="px-4 py-3.5 border-b border-divider">
          <p id="account-name" class="text-sm font-semibold">John Rodrigues</p>
          <p class="text-xs text-ink-muted">Parishioner</p>
        </div>
        <button onclick="window.location.href='screen-parishioner-login.html'" class="w-full text-left px-4 py-3.5 text-sm text-error hover:bg-error-bg min-h-[44px] transition-warm">Log out</button>
      </div>
    </header>

    <!-- ============ MAIN CONTENT (swapped by state) ============ -->
    <main id="main-content" class="px-5 pt-2 space-y-6"></main>

  </div>

  <!-- ============ BOTTOM NAV (5 items) ============ -->
  <nav class="fixed bottom-0 left-0 right-0 bg-card-bg border-t border-divider max-w-[420px] mx-auto">
    <div class="grid grid-cols-5">
      <button class="flex flex-col items-center gap-1 py-3 text-primary">
        <svg class="icon" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/></svg>
        <span class="text-[10.5px] font-semibold">Home</span>
      </button>
      <button onclick="window.location.href='screen-parishioner-services-hub.html?' + sessionParams.toString()" class="flex flex-col items-center gap-1 py-3 text-ink-muted">
        <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="4" width="7" height="7" rx="1.5"/><rect x="14" y="4" width="7" height="7" rx="1.5"/><rect x="3" y="15" width="7" height="7" rx="1.5"/><rect x="14" y="15" width="7" height="7" rx="1.5"/></svg>
        <span class="text-[10.5px]">Services</span>
      </button>
      <button onclick="toast('Give')" class="flex flex-col items-center gap-1 py-3 text-ink-muted">
        <svg class="icon" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-10-9.3C.4 8.4 2.3 5 5.7 5 8 5 10 6.3 12 9c2-2.7 4-4 6.3-4 3.4 0 5.3 3.4 3.7 6.7C19.5 16.4 12 21 12 21Z"/></svg>
        <span class="text-[10.5px]">Give</span>
      </button>
      <button onclick="window.location.href='screen-parishioner-family.html?' + sessionParams.toString()" class="flex flex-col items-center gap-1 py-3 text-ink-muted">
        <svg class="icon" viewBox="0 0 24 24"><circle cx="9" cy="7" r="3.5"/><path d="M2 21v-1a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v1"/><circle cx="18" cy="8" r="2.5"/></svg>
        <span class="text-[10.5px]">My Family</span>
      </button>
      <button onclick="toast('Menu')" class="flex flex-col items-center gap-1 py-3 text-ink-muted">
        <svg class="icon" viewBox="0 0 24 24"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
        <span class="text-[10.5px]">Menu</span>
      </button>
    </div>
  </nav>

  <!-- ============ TOAST ============ -->
  <div id="toast" class="fixed bottom-24 left-1/2 -translate-x-1/2 bg-ink text-white text-sm px-4 py-2.5 rounded-button shadow-card opacity-0 pointer-events-none transition-opacity duration-200 max-w-[90%] text-center z-50"></div>

  <!-- ============ SEARCH OVERLAY ============ -->
  <div id="search-overlay" class="hidden fixed inset-0 bg-bg-warm z-50 max-w-[420px] mx-auto overflow-y-auto">
    <div class="px-5 pt-5 pb-3 flex items-center gap-3">
      <button onclick="closeSearch()" aria-label="Close search" class="w-10 h-10 rounded-button flex items-center justify-center text-ink-muted hover:bg-section-bg transition-warm flex-shrink-0">
        <svg class="icon" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      </button>
      <div class="relative flex-1">
        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-ink-muted"><svg class="icon w-4 h-4" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
        <input id="search-input" type="text" placeholder="Search Parish Connect…" onkeydown="if(event.key==='Enter') runSearch(this.value)"
          class="w-full border border-divider rounded-input pl-10 pr-4 h-11 text-sm bg-card-bg focus:ring-2 focus:ring-primary-light focus:outline-none">
      </div>
      <button onclick="runSearch(document.getElementById('search-input').value)" class="bg-primary hover:bg-primary-hover text-white text-xs font-semibold px-3.5 h-11 rounded-button transition-warm flex-shrink-0">Search</button>
    </div>
    <div class="px-5">
      <p class="text-xs font-semibold text-ink-muted uppercase tracking-wide mb-2">Try searching for</p>
      <div class="flex flex-wrap gap-2 mb-6">
        <button onclick="fillSearch('Churches near me')" class="bg-card-bg border border-divider text-xs font-medium px-3 py-2 rounded-badge hover:bg-section-bg transition-warm">Churches near me</button>
        <button onclick="fillSearch('Mass timings')" class="bg-card-bg border border-divider text-xs font-medium px-3 py-2 rounded-badge hover:bg-section-bg transition-warm">Mass timings</button>
        <button onclick="fillSearch('Parish contact')" class="bg-card-bg border border-divider text-xs font-medium px-3 py-2 rounded-badge hover:bg-section-bg transition-warm">Parish contact</button>
        <button onclick="fillSearch('Novena schedule')" class="bg-card-bg border border-divider text-xs font-medium px-3 py-2 rounded-badge hover:bg-section-bg transition-warm">Novena schedule</button>
      </div>
      <div id="search-results"></div>
    </div>
  </div>

<script>
  // ---------------- Session (from login redirect) ----------------
  const sessionParams = new URLSearchParams(window.location.search);
  const sessionName = sessionParams.get('name') || 'John Rodrigues';
  const sessionFirstName = sessionName.split(' ')[0];
  const sessionInitials = sessionName.split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();
  document.getElementById('account-name').textContent = sessionName;
  document.getElementById('avatar-btn').textContent = sessionInitials;

  // ---------------- Mock data ----------------
  const seed = {
    parish: { name: "Infant Jesus Shrine, Viveknagar" },
    member: { firstName: sessionFirstName },
    heroEvent: {
      title: "St. Mary's Basilica Feast",
      date: "8 Sep 2026",
      sub: "Novena begins 30 Aug at the Basilica",
      cta: "View Details",
    },
    myRequests: {
      count: 2,
    },
    otherActions: [
      { label: "Mass booking payment pending", sub: "₹100 due for your 16 Aug booking", cta: "Pay Now" },
      { label: "Subscription payment reminder", sub: "Next payment due 1 Oct 2026", cta: "Pay Now" },
    ],
    upcoming: [
      { label: "Next Mass", value: "Sunday, 2 Aug · 8:00 AM", church: "Infant Jesus Shrine, Viveknagar" },
      { label: "Your Mass Intention", value: "Sunday, 9 Aug · 8:00 AM", church: "Infant Jesus Shrine, Viveknagar", detail: "Thanksgiving Mass offered by Rodrigues family" },
    ],
    weeklyAnnouncements: {
      week: "Week of 27 Jul 2026 · Infant Jesus Shrine",
      items: [
        "First Friday Adoration will be held from 6:30 PM to 8:00 PM.",
        "Youth Fellowship meets this Saturday at 5:00 PM.",
        "Registrations are open for the next Marriage Preparation Course.",
        "The Poor Families Collection will be held this Sunday.",
      ],
    },
    donationCauses: [
      { name: "Church Renovation Fund", desc: "Support the ongoing renovation of the parish worship hall." },
      { name: "Education Support Fund", desc: "Scholarships for children from economically weaker families." },
    ],
    quickActions: [
      { label: "Book a Mass", icon: "calendar", href: "screen-parishioner-massbooking-request.html" },
      { label: "Register for a Sacrament", icon: "book", href: "screen-parishioner-sacraments-register.html" },
      { label: "Request a Document", icon: "file", href: "screen-parishioner-documents-request.html" },
      { label: "Request Home Service", icon: "home", href: "screen-parishioner-homeservices-request.html" },
    ],
  };

  const icons = {
    calendar: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18"/><path d="M8 3v4"/><path d="M16 3v4"/>',
    book: '<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5v-15Z"/><path d="M20 18H6.5A2.5 2.5 0 0 0 4 20.5"/>',
    file: '<path d="M14 3v5a1 1 0 0 0 1 1h5"/><path d="M6 3h8l6 6v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z"/>',
    home: '<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/>',
    chevron: '<polyline points="9 18 15 12 9 6"/>',
    chevronDown: '<polyline points="6 9 12 15 18 9"/>',
    church: '<path d="M12 3v4"/><path d="M9 6l3-2 3 2"/><path d="M5 21V11l7-5 7 5v10"/><path d="M9 21v-6a3 3 0 0 1 6 0v6"/>',
    phone: '<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2Z"/>',
    clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    check: '<path d="M20 6 9 17l-5-5"/>',
    star: '<polygon points="12 2 15 9 22 9 16.5 13.5 18.5 21 12 16.5 5.5 21 7.5 13.5 2 9 9 9"/>',
    pin: '<path d="M12 21s7-6.5 7-12a7 7 0 0 0-14 0c0 5.5 7 12 7 12Z"/><circle cx="12" cy="9" r="2.5"/>',
    bell: '<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>',
  };
  function icon(name, cls) { return `<svg class="${cls||'icon'}" viewBox="0 0 24 24">${icons[name]}</svg>`; }

  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = typeof msg === 'string' ? msg : '';
    t.classList.remove('opacity-0');
    t.classList.add('opacity-100');
    clearTimeout(window._toastTimer);
    window._toastTimer = setTimeout(() => {
      t.classList.remove('opacity-100');
      t.classList.add('opacity-0');
    }, 1800);
  }

  function goTo(href, label) {
    if (href) {
      window.location.href = href + '?' + sessionParams.toString();
    } else {
      toast(`Opening ${label}…`);
    }
  }

  // A small warm line-illustration — softens the dashboard header, per Community Heart guidance.
  function chapelIllustration(size) {
    return `
      <svg width="${size}" height="${size}" viewBox="0 0 120 120" fill="none">
        <circle cx="90" cy="28" r="14" fill="#F6C453" opacity="0.35"/>
        <path d="M40 100V56l20-16 20 16v44" stroke="#4F7CF5" stroke-width="3" stroke-linejoin="round" fill="#EEF4FF"/>
        <rect x="55" y="72" width="10" height="28" rx="2" fill="#FFFFFF" stroke="#4F7CF5" stroke-width="2.5"/>
        <line x1="60" y1="34" x2="60" y2="24" stroke="#FF7F73" stroke-width="3" stroke-linecap="round"/>
        <line x1="55" y1="29" x2="65" y2="29" stroke="#FF7F73" stroke-width="3" stroke-linecap="round"/>
        <path d="M18 100c4-10 10-16 10-16s6 6 10 16" stroke="#6CBF84" stroke-width="3" stroke-linecap="round" fill="none"/>
        <path d="M82 100c4-10 10-16 10-16s6 6 10 16" stroke="#6CBF84" stroke-width="3" stroke-linecap="round" fill="none"/>
      </svg>
    `;
  }

  // ---------------- Search ----------------
  function openSearch() {
    document.getElementById('search-overlay').classList.remove('hidden');
    document.getElementById('search-results').innerHTML = '';
    document.getElementById('search-input').value = '';
    setTimeout(() => document.getElementById('search-input').focus(), 50);
  }
  function closeSearch() {
    document.getElementById('search-overlay').classList.add('hidden');
    document.getElementById('search-input').value = '';
    document.getElementById('search-results').innerHTML = '';
  }

  // Pre-fills the search bar from a suggestion chip — does NOT run the search.
  // The person still has to submit (Enter or the Search button) before results show.
  function fillSearch(text) {
    const input = document.getElementById('search-input');
    input.value = text;
    input.focus();
    input.setSelectionRange(text.length, text.length);
    document.getElementById('search-results').innerHTML = '';
  }

  const NEARBY_CHURCHES = [
    { name: "Infant Jesus Shrine", locality: "Viveknagar (your parish)", distance: "0.0 km" },
    { name: "Our Lady of Sacred Heart Church", locality: "HSR Layout", distance: "3.1 km" },
    { name: "Resurrection Church", locality: "Indiranagar", distance: "4.4 km" },
  ];
  const MASS_TIMINGS = [
    { label: "Sunday", value: "6:30 AM, 8:00 AM, 10:00 AM (Konkani)" },
    { label: "Saturday Vigil", value: "6:00 PM" },
    { label: "Weekdays", value: "6:45 AM" },
  ];

  function runSearch(query) {
    query = (query || '').trim();
    const el = document.getElementById('search-results');
    if (!query) { el.innerHTML = ''; return; }
    document.getElementById('search-input').value = query;
    const q = query.toLowerCase();
    const heading = `<p class="text-xs font-semibold text-ink-muted uppercase tracking-wide mb-2">Results for "${query}"</p>`;

    if (q.includes('near')) {
      el.innerHTML = `
        ${heading}
        <div class="bg-card-bg rounded-card shadow-card divide-y divide-divider overflow-hidden">
          ${NEARBY_CHURCHES.map(c => `
            <div class="px-4 py-3 flex items-center gap-3">
              <span class="w-9 h-9 rounded-badge bg-primary-light text-primary flex items-center justify-center flex-shrink-0">${icon('pin','w-4 h-4')}</span>
              <div class="min-w-0 flex-1">
                <p class="text-sm font-semibold truncate">${c.name}</p>
                <p class="text-xs text-ink-muted mt-0.5">${c.locality}</p>
              </div>
              <span class="text-xs text-ink-muted flex-shrink-0">${c.distance}</span>
            </div>
          `).join('')}
        </div>
        <p class="text-xs text-ink-muted mt-2">Distances are approximate.</p>
      `;
    } else if (q.includes('mass') || q.includes('timing')) {
      el.innerHTML = `
        ${heading}
        <div class="bg-card-bg rounded-card shadow-card divide-y divide-divider overflow-hidden">
          ${MASS_TIMINGS.map(m => `
            <div class="px-4 py-3 flex items-center justify-between">
              <span class="text-sm font-medium">${m.label}</span>
              <span class="text-sm text-ink-muted text-right">${m.value}</span>
            </div>
          `).join('')}
        </div>
      `;
    } else if (q.includes('contact') || q.includes('office') || q.includes('phone')) {
      el.innerHTML = `
        ${heading}
        <div class="bg-card-bg rounded-card shadow-card p-4 space-y-1.5">
          <p class="text-sm font-semibold">Infant Jesus Shrine, Viveknagar</p>
          <p class="text-xs text-ink-muted">Post Box 4712, Viveknagar, Bengaluru 560 047</p>
          <p class="text-xs text-ink-muted">Mon–Sat, 9:00 AM – 5:30 PM (Sat until 1:00 PM) · Closed Monday</p>
          <p class="text-xs text-ink-muted">Parish office: 25301206</p>
        </div>
      `;
    } else if (q.includes('novena')) {
      el.innerHTML = `
        ${heading}
        <div class="bg-card-bg rounded-card shadow-card p-4 space-y-1.5">
          <p class="text-sm font-semibold">30 Aug – 6 Sep, 6:00 PM daily</p>
          <p class="text-xs text-ink-muted">Feast Day Mass: 8 Sep, 7:00 AM at St. Mary's Basilica</p>
        </div>
      `;
    } else {
      el.innerHTML = `
        <div class="bg-card-bg rounded-card shadow-card p-6 text-center">
          <p class="text-sm text-ink-muted">No results for "${query}" yet — try one of the suggestions above.</p>
        </div>
      `;
    }
  }

  // ---------------- State renderers ----------------
  function renderLoading() {
    const skel = (h) => `<div class="skeleton rounded-card" style="height:${h}"></div>`;
    return `
      <section class="space-y-3">
        <div class="skeleton rounded h-6 w-44"></div>
        <div class="skeleton rounded h-4 w-32"></div>
      </section>
      ${skel('90px')}
      <section class="grid grid-cols-2 gap-3">
        ${skel('96px')}${skel('96px')}
      </section>
      ${skel('90px')}
      <section class="grid grid-cols-2 gap-3">
        ${Array(4).fill(0).map(() => skel('76px')).join('')}
      </section>
      ${skel('130px')}
    `;
  }

  function renderError() {
    return `
      <section class="bg-error-bg rounded-card p-8 text-center space-y-3 mt-2">
        <p class="text-sm font-semibold text-error">We couldn't load your dashboard</p>
        <p class="text-xs text-error/90">Please check your connection and try again.</p>
        <button onclick="setState('loading'); setTimeout(()=>setState('populated'), 900)" class="bg-error text-white text-sm font-semibold px-6 py-3 rounded-button min-h-[48px] transition-warm">Try again</button>
      </section>
    `;
  }

  function renderEmpty() {
    return `
      <section class="pt-0.5">
        <p class="font-heading font-bold text-lg">Good morning, ${seed.member.firstName}</p>
      </section>
      ${heroBannerSection()}
      <section class="bg-card-bg rounded-card shadow-card p-8 text-center space-y-3">
        ${chapelIllustration(88)}
        <p class="text-sm font-semibold">You're all caught up</p>
        <p class="text-sm text-ink-muted max-w-xs mx-auto">Nothing needs your attention right now. New requests, approvals and reminders will show up here.</p>
      </section>
      ${quickActionsSection()}
      <section class="bg-card-bg rounded-card shadow-card p-8 text-center space-y-2">
        <p class="text-sm font-semibold">No announcements yet</p>
        <p class="text-sm text-ink-muted">Parish news will appear here as it's published.</p>
      </section>
      ${myParishSection()}
    `;
  }

  function heroBannerSection() {
    const h = seed.heroEvent;
    return `
      <section class="rounded-card p-3.5 relative overflow-hidden flex items-center gap-3" style="background: linear-gradient(135deg, #F6C453 0%, #FF7F73 100%);">
        <span class="w-9 h-9 rounded-badge bg-white/25 text-white flex items-center justify-center flex-shrink-0">${icon('star','w-4 h-4')}</span>
        <div class="min-w-0 flex-1">
          <p class="font-heading font-bold text-sm text-white leading-tight truncate">${h.title}</p>
          <p class="text-white/90 text-[11px] mt-0.5 truncate">${h.date} · ${h.sub}</p>
        </div>
        <button onclick="toast('${h.cta}')" class="bg-white text-ink text-[11px] font-semibold px-3 py-2 rounded-button min-h-[32px] transition-warm flex-shrink-0 whitespace-nowrap">${h.cta}</button>
      </section>
    `;
  }

  function renderUpcomingTile(u) {
    return `
      <div class="px-5 py-3.5">
        <p class="text-xs text-ink-muted uppercase tracking-wide">${u.label}</p>
        <p class="text-sm font-semibold mt-1">${u.value}</p>
        <p class="text-xs text-ink-muted mt-0.5">${u.church}</p>
        ${u.detail ? `<p class="text-xs text-ink-muted mt-0.5">${u.detail}</p>` : ''}
      </div>
    `;
  }

  let upcomingExpanded = false;
  function toggleUpcoming() {
    upcomingExpanded = !upcomingExpanded;
    document.getElementById('upcoming-more').classList.toggle('hidden', !upcomingExpanded);
    document.getElementById('upcoming-toggle-label').textContent = upcomingExpanded ? 'Show less' : `Show ${seed.upcoming.length - 1} more`;
    document.getElementById('upcoming-toggle-chevron').style.transform = `rotate(${upcomingExpanded ? '180' : '0'}deg)`;
  }

  function myRequestsCard() {
    const r = seed.myRequests;
    return `
      <button onclick="goTo('screen-parishioner-documents-myrequests.html', 'My Requests')" class="w-full bg-card-bg rounded-card shadow-card p-4 flex items-center justify-between text-left transition-warm hover:shadow-card-hover min-h-[36px]">
        <p class="text-xs font-semibold text-ink-muted uppercase tracking-wide">My Requests</p>
        <span class="text-primary text-xs font-semibold flex items-center gap-1 flex-shrink-0">${r.count} update${r.count===1?'':'s'}${icon('chevron','icon w-3.5 h-3.5')}</span>
      </button>
    `;
  }

  let otherActionsOpen = false;
  function otherActionsCard() {
    const items = seed.otherActions;
    return `
      <div class="bg-card-bg rounded-card shadow-card p-4">
        <button onclick="toggleOtherActions()" class="w-full flex items-center justify-between text-left">
          <p class="text-xs font-semibold text-ink-muted uppercase tracking-wide">Other Actions</p>
          <span class="text-primary text-xs font-semibold flex items-center gap-1 flex-shrink-0">${items.length} pending<span id="other-actions-chevron" class="inline-flex transition-warm" style="transform: rotate(${otherActionsOpen ? '180' : '0'}deg)">${icon('chevronDown','icon w-3.5 h-3.5')}</span></span>
        </button>
        <div id="other-actions-body" class="${otherActionsOpen ? '' : 'hidden'} mt-3 space-y-2.5">
          ${items.map(i => `
            <div class="bg-section-bg rounded-card p-3 flex items-center justify-between gap-3">
              <div class="min-w-0 flex items-start gap-2">
                <span class="text-coral flex-shrink-0 mt-0.5">${icon('bell','icon w-3.5 h-3.5')}</span>
                <div class="min-w-0">
                  <p class="text-xs font-semibold truncate">${i.label}</p>
                  <p class="text-[11px] text-ink-muted mt-0.5">${i.sub}</p>
                </div>
              </div>
              <button onclick="toast('${i.cta}')" class="bg-primary hover:bg-primary-hover text-white text-[11px] font-semibold px-3 py-1.5 rounded-button flex-shrink-0 transition-warm">${i.cta}</button>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }

  function toggleOtherActions() {
    otherActionsOpen = !otherActionsOpen;
    document.getElementById('other-actions-body').classList.toggle('hidden');
    document.getElementById('other-actions-chevron').style.transform = `rotate(${otherActionsOpen ? '180' : '0'}deg)`;
  }

  function quickActionsSection() {
    return `
      <section>
        <h2 class="font-heading font-bold text-base mb-3">Quick actions</h2>
        <div class="grid grid-cols-2 gap-2.5">
          ${seed.quickActions.map(qa => `
            <button onclick="goTo(${qa.href ? `'${qa.href}'` : 'null'}, '${qa.label}')" class="bg-card-bg rounded-card shadow-card p-3 flex flex-col items-center gap-1.5 min-h-[36px] transition-warm hover:shadow-card-hover">
              <span class="w-8 h-8 rounded-badge bg-primary-light text-primary flex items-center justify-center">${icon(qa.icon, 'icon w-4 h-4')}</span>
              <span class="text-xs leading-tight text-center text-ink font-medium">${qa.label}</span>
            </button>
          `).join('')}
        </div>
      </section>
    `;
  }

  function myParishSection() {
    return `
      <section>
        <h2 class="font-heading font-bold text-base mb-3">My Parish</h2>
        <div class="bg-card-bg rounded-card shadow-card divide-y divide-divider overflow-hidden">
          <button onclick="toast('Opening Parish Profile…')" class="w-full flex items-center justify-between px-5 py-4 min-h-[44px] transition-warm hover:bg-section-bg">
            <span class="flex items-center gap-3 text-sm font-medium"><span class="w-9 h-9 rounded-badge bg-primary-light text-primary flex items-center justify-center flex-shrink-0">${icon('church')}</span>Parish Profile</span>
            <span class="text-ink-muted">${icon('chevron','icon w-4 h-4')}</span>
          </button>
          <button onclick="runSearchFromDashboard('Mass timings')" class="w-full flex items-center justify-between px-5 py-4 min-h-[44px] transition-warm hover:bg-section-bg">
            <span class="flex items-center gap-3 text-sm font-medium"><span class="w-9 h-9 rounded-badge bg-primary-light text-primary flex items-center justify-center flex-shrink-0">${icon('clock')}</span>Mass Timings</span>
            <span class="text-ink-muted">${icon('chevron','icon w-4 h-4')}</span>
          </button>
          <button onclick="runSearchFromDashboard('Parish contact')" class="w-full flex items-center justify-between px-5 py-4 min-h-[44px] transition-warm hover:bg-section-bg">
            <span class="flex items-center gap-3 text-sm font-medium"><span class="w-9 h-9 rounded-badge bg-primary-light text-primary flex items-center justify-center flex-shrink-0">${icon('phone')}</span>Contact Parish</span>
            <span class="text-ink-muted">${icon('chevron','icon w-4 h-4')}</span>
          </button>
        </div>
      </section>
    `;
  }

  function runSearchFromDashboard(query) {
    openSearch();
    setTimeout(() => runSearch(query), 60);
  }

  function renderPopulated() {
    return `
      <section class="pt-0.5">
        <p class="font-heading font-bold text-lg">Good morning, ${seed.member.firstName}</p>
      </section>

      ${heroBannerSection()}

      <section>
        <h2 class="font-heading font-bold text-base mb-3">Things needing your attention</h2>
        <div class="grid grid-cols-1 gap-3">
          ${myRequestsCard()}
          ${otherActionsCard()}
        </div>
      </section>

      <section>
        <div class="flex items-center justify-between mb-3">
          <h2 class="font-heading font-bold text-base">Upcoming</h2>
          <button onclick="goTo('screen-parishioner-massbooking-mybookings.html', 'My Bookings')" class="text-primary text-xs font-semibold">My Bookings</button>
        </div>
        <div class="bg-card-bg rounded-card shadow-card divide-y divide-divider overflow-hidden">
          ${renderUpcomingTile(seed.upcoming[0])}
          ${seed.upcoming.length > 1 ? `
            <div id="upcoming-more" class="hidden">
              ${seed.upcoming.slice(1).map(renderUpcomingTile).join('')}
            </div>
            <button onclick="toggleUpcoming()" class="w-full flex items-center justify-center gap-1.5 px-5 py-3 text-xs font-semibold text-primary min-h-[40px]">
              <span id="upcoming-toggle-label">Show ${seed.upcoming.length - 1} more</span>
              <span id="upcoming-toggle-chevron" class="inline-flex transition-warm">${icon('chevronDown','icon w-3.5 h-3.5')}</span>
            </button>
          ` : ''}
        </div>
      </section>

      ${quickActionsSection()}

      <section>
        <div class="flex items-center justify-between mb-3">
          <h2 class="font-heading font-bold text-base">Parish Announcements</h2>
          <button onclick="toast('All Announcements')" class="text-primary text-xs font-semibold">View all</button>
        </div>
        <div class="bg-card-bg rounded-card shadow-card p-5">
          <p class="text-xs text-ink-muted uppercase tracking-wide mb-3">${seed.weeklyAnnouncements.week}</p>
          <ul class="space-y-2.5">
            ${seed.weeklyAnnouncements.items.map(a => `
              <li class="flex gap-2.5 text-sm">
                <span class="w-1.5 h-1.5 rounded-full bg-primary flex-shrink-0 mt-1.5"></span>
                <span>${a}</span>
              </li>
            `).join('')}
          </ul>
        </div>
      </section>

      <section>
        <div class="flex items-center justify-between mb-3">
          <h2 class="font-heading font-bold text-base">Community</h2>
          <button onclick="toast('All Causes')" class="text-primary text-xs font-semibold">View all causes</button>
        </div>
        <div class="grid grid-cols-2 gap-3 mb-3">
          ${seed.donationCauses.map(c => `
            <div class="bg-card-bg rounded-card shadow-card p-4 flex flex-col justify-between">
              <div>
                <p class="text-sm font-semibold leading-snug">${c.name}</p>
                <p class="text-xs text-ink-muted mt-1.5 leading-relaxed">${c.desc}</p>
              </div>
              <button onclick="toast('Give to ${c.name}')" class="mt-3 bg-primary hover:bg-primary-hover text-white text-xs font-semibold py-2.5 rounded-button min-h-[36px] transition-warm">Give</button>
            </div>
          `).join('')}
        </div>
        ${myParishSection()}
      </section>
    `;
  }

  const renderers = { loading: renderLoading, empty: renderEmpty, populated: renderPopulated, error: renderError };

  function setState(state) {
    const main = document.getElementById('main-content');
    main.innerHTML = renderers[state]();
    const totalActions = state === 'populated' ? (seed.myRequests.count + seed.otherActions.length) : 0;
    document.getElementById('avatar-notification-dot').classList.toggle('hidden', totalActions === 0);
  }

  // Simulate an initial fetch on page load
  setState('loading');
  setTimeout(() => setState('populated'), 900);
</script>

</body>
</html>
