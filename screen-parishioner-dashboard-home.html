<!DOCTYPE html>
<html lang="en">
<head>
<title>Parish Connect — Home</title>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Fonts: Manrope (headings, 600/700 only) + Inter (body/UI, 400/500). No serif. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Tailwind CDN -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          'bg-warm': '#FAFBFD',
          'card-bg': '#FFFFFF',
          'section-bg': '#F5F7FB',
          divider: '#E8EDF5',
          ink: '#1F2937',
          'ink-muted': '#6B7280',
          primary: { DEFAULT: '#4F7CF5', hover: '#3F6CE4', light: '#EEF4FF' },
          coral: '#FF7F73',
          gold: '#F6C453',
          green: '#6CBF84',
          lavender: '#A88BFF',
          error: { DEFAULT: '#E5645A', bg: '#FDECEA' },
        },
        fontFamily: {
          heading: ['Manrope', 'sans-serif'],
          body: ['Inter', 'sans-serif'],
        },
        borderRadius: {
          card: '24px',
          button: '16px',
          input: '16px',
          dialog: '24px',
          badge: '999px',
        },
        boxShadow: {
          card: '0 6px 24px rgba(30, 41, 59, 0.08)',
          'card-hover': '0 12px 36px rgba(30, 41, 59, 0.12)',
        },
      },
    },
  };
</script>
<style>
  body { font-family: 'Inter', sans-serif; background-color: #FAFBFD; color: #1F2937; line-height: 1.5; }
  h1, h2, h3, h4, .font-heading { font-family: 'Manrope', sans-serif; }
  :focus-visible { outline: 2px solid #4F7CF5; outline-offset: 2px; }
  .transition-warm { transition: all 200ms ease; }
  .icon { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .skeleton { background: linear-gradient(90deg, #E8EDF5 25%, #F2F5FA 37%, #E8EDF5 63%); background-size: 400% 100%; animation: shimmer 1.4s ease infinite; }
  @keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }
  @media (prefers-reduced-motion: reduce) { .skeleton { animation: none; } }
</style>
</head>
<body class="text-ink">

  <!-- ============ DEMO CONTROLS (not part of the product UI) ============ -->
  <!-- Collapsed by default so a real demo audience never sees dev tooling.
       Tap the small dot (bottom-right) to reveal state controls for review/QA. -->
  <div id="demo-bar" class="hidden bg-ink text-white text-xs px-4 py-2 flex items-center gap-2 flex-wrap sticky top-0 z-50">
    <span class="opacity-60 mr-1">Preview state:</span>
    <button onclick="setState('loading')" class="px-2 py-1 rounded bg-white/10 hover:bg-white/20">Loading</button>
    <button onclick="setState('empty')" class="px-2 py-1 rounded bg-white/10 hover:bg-white/20">Empty</button>
    <button onclick="setState('populated')" class="px-2 py-1 rounded bg-white/10 hover:bg-white/20">Populated</button>
    <button onclick="setState('error')" class="px-2 py-1 rounded bg-white/10 hover:bg-white/20">Error</button>
    <button onclick="document.getElementById('demo-bar').classList.add('hidden')" class="ml-auto px-2 py-1 rounded bg-white/10 hover:bg-white/20">Hide</button>
  </div>
  <button onclick="document.getElementById('demo-bar').classList.toggle('hidden')" aria-label="Toggle preview state controls" class="fixed bottom-2 right-2 w-3 h-3 rounded-full bg-ink/20 hover:bg-ink/50 z-50"></button>

  <div class="max-w-[420px] mx-auto min-h-screen bg-bg-warm pb-28 relative">

    <!-- ============ TOP BAR ============ -->
    <header class="px-5 pt-5 pb-2 flex items-center justify-between relative">
      <p class="font-heading font-bold text-base leading-none">Parish Connect</p>
      <div class="flex items-center gap-2">
        <button aria-label="Search" class="w-10 h-10 rounded-button flex items-center justify-center text-ink-muted hover:bg-section-bg transition-warm">
          <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
        <button id="avatar-btn" onclick="document.getElementById('account-menu').classList.toggle('hidden')" aria-label="Account menu" class="w-10 h-10 rounded-badge bg-primary text-white text-xs font-bold flex items-center justify-center flex-shrink-0">JR</button>
      </div>
      <div id="account-menu" class="hidden absolute right-5 top-16 bg-card-bg rounded-card shadow-card w-52 z-50 overflow-hidden">
        <div class="px-4 py-3.5 border-b border-divider">
          <p id="account-name" class="text-sm font-semibold">John Rodrigues</p>
          <p class="text-xs text-ink-muted">Parishioner</p>
        </div>
        <button onclick="window.location.href='screen-parishioner-login.html'" class="w-full text-left px-4 py-3.5 text-sm text-error hover:bg-error-bg min-h-[44px] transition-warm">Log out</button>
      </div>
    </header>

    <!-- ============ MAIN CONTENT (swapped by state) ============ -->
    <main id="main-content" class="px-5 pt-2 space-y-8"></main>

  </div>

  <!-- ============ BOTTOM NAV (5 items) ============ -->
  <nav class="fixed bottom-0 left-0 right-0 bg-card-bg border-t border-divider max-w-[420px] mx-auto">
    <div class="grid grid-cols-5">
      <button class="flex flex-col items-center gap-1 py-3 text-primary">
        <svg class="icon" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/></svg>
        <span class="text-[10.5px] font-semibold">Home</span>
      </button>
      <button onclick="toast('Services')" class="flex flex-col items-center gap-1 py-3 text-ink-muted">
        <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="4" width="7" height="7" rx="1.5"/><rect x="14" y="4" width="7" height="7" rx="1.5"/><rect x="3" y="15" width="7" height="7" rx="1.5"/><rect x="14" y="15" width="7" height="7" rx="1.5"/></svg>
        <span class="text-[10.5px]">Services</span>
      </button>
      <button onclick="toast('Give')" class="flex flex-col items-center gap-1 py-3 text-ink-muted">
        <svg class="icon" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-10-9.3C.4 8.4 2.3 5 5.7 5 8 5 10 6.3 12 9c2-2.7 4-4 6.3-4 3.4 0 5.3 3.4 3.7 6.7C19.5 16.4 12 21 12 21Z"/></svg>
        <span class="text-[10.5px]">Give</span>
      </button>
      <button onclick="toast('My Family')" class="flex flex-col items-center gap-1 py-3 text-ink-muted">
        <svg class="icon" viewBox="0 0 24 24"><circle cx="9" cy="7" r="3.5"/><path d="M2 21v-1a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v1"/><circle cx="18" cy="8" r="2.5"/></svg>
        <span class="text-[10.5px]">My Family</span>
      </button>
      <button onclick="toast('Menu')" class="flex flex-col items-center gap-1 py-3 text-ink-muted">
        <svg class="icon" viewBox="0 0 24 24"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
        <span class="text-[10.5px]">Menu</span>
      </button>
    </div>
  </nav>

  <!-- ============ TOAST (simulates opening a screen that doesn't exist yet) ============ -->
  <div id="toast" class="fixed bottom-24 left-1/2 -translate-x-1/2 bg-ink text-white text-sm px-4 py-2.5 rounded-button shadow-card opacity-0 pointer-events-none transition-opacity duration-200 max-w-[90%] text-center z-50"></div>

<script>
  // ---------------- Session (from login redirect) ----------------
  const sessionParams = new URLSearchParams(window.location.search);
  const sessionName = sessionParams.get('name') || 'John Rodrigues';
  const sessionFirstName = sessionName.split(' ')[0];
  const sessionInitials = sessionName.split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();
  document.getElementById('account-name').textContent = sessionName;
  document.getElementById('avatar-btn').textContent = sessionInitials;

  // ---------------- Mock data (from mock-seed.json) ----------------
  const seed = {
    parish: { name: "Infant Jesus Shrine, Viveknagar" },
    member: { firstName: sessionFirstName },
    actionCenter: [
      { id: "REQ-3001", label: "Baptism Certificate request", sub: "Under review by the parish office", status: "Pending", tone: "gold", href: "screen-parishioner-documents-myrequests.html" },
      { id: "REQ-3201", label: "Clara's Confirmation registration", sub: "Approved — next: attend preparation classes", status: "Approved", tone: "green" },
      { id: "REQ-3101", label: "House blessing request", sub: "Awaiting the parish priest's approval", status: "Pending", tone: "gold" },
    ],
    announcement: {
      title: "Feast of Infant Jesus — Novena Begins",
      date: "18 Jul 2026",
      preview: "The nine-day novena in preparation for the Feast of Infant Jesus begins this Friday at 6:00 PM. All parishioners are invited.",
    },
    upcoming: [
      { label: "Next Mass", value: "Sunday, 2 Aug · 8:00 AM", sub: "Sunday 8:00 AM Mass" },
      { label: "Your Mass intention", value: "2 Aug · Thanksgiving", sub: "Booked for the Rodrigues family" },
      { label: "Feast Day Celebration", value: "13 Jan 2027 · 7:00 AM", sub: "Registration open" },
    ],
    donationCauses: [
      { name: "Church Renovation Fund", desc: "Support the ongoing renovation of the parish worship hall." },
      { name: "Education Support Fund", desc: "Scholarships for children from economically weaker families." },
    ],
    quickActions: [
      { label: "Book a Mass", icon: "calendar" },
      { label: "Register for a Sacrament", icon: "book" },
      { label: "Request a Document", icon: "file", href: "screen-parishioner-documents-request.html" },
      { label: "Request Home Service", icon: "home" },
    ],
  };

  const icons = {
    calendar: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18"/><path d="M8 3v4"/><path d="M16 3v4"/>',
    book: '<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5v-15Z"/><path d="M20 18H6.5A2.5 2.5 0 0 0 4 20.5"/>',
    file: '<path d="M14 3v5a1 1 0 0 0 1 1h5"/><path d="M6 3h8l6 6v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z"/>',
    home: '<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/>',
    chevron: '<polyline points="9 18 15 12 9 6"/>',
    church: '<path d="M12 3v4"/><path d="M9 6l3-2 3 2"/><path d="M5 21V11l7-5 7 5v10"/><path d="M9 21v-6a3 3 0 0 1 6 0v6"/>',
    phone: '<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2Z"/>',
    clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    check: '<path d="M20 6 9 17l-5-5"/>',
  };
  function icon(name, cls) { return `<svg class="${cls||'icon'}" viewBox="0 0 24 24">${icons[name]}</svg>`; }

  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = `Opening ${msg}…`;
    t.classList.remove('opacity-0');
    t.classList.add('opacity-100');
    clearTimeout(window._toastTimer);
    window._toastTimer = setTimeout(() => {
      t.classList.remove('opacity-100');
      t.classList.add('opacity-0');
    }, 1800);
  }

  // A small warm line-illustration — softens the dashboard header, per Community Heart guidance.
  function chapelIllustration(size) {
    return `
      <svg width="${size}" height="${size}" viewBox="0 0 120 120" fill="none">
        <circle cx="90" cy="28" r="14" fill="#F6C453" opacity="0.35"/>
        <path d="M40 100V56l20-16 20 16v44" stroke="#4F7CF5" stroke-width="3" stroke-linejoin="round" fill="#EEF4FF"/>
        <rect x="55" y="72" width="10" height="28" rx="2" fill="#FFFFFF" stroke="#4F7CF5" stroke-width="2.5"/>
        <line x1="60" y1="34" x2="60" y2="24" stroke="#FF7F73" stroke-width="3" stroke-linecap="round"/>
        <line x1="55" y1="29" x2="65" y2="29" stroke="#FF7F73" stroke-width="3" stroke-linecap="round"/>
        <path d="M18 100c4-10 10-16 10-16s6 6 10 16" stroke="#6CBF84" stroke-width="3" stroke-linecap="round" fill="none"/>
        <path d="M82 100c4-10 10-16 10-16s6 6 10 16" stroke="#6CBF84" stroke-width="3" stroke-linecap="round" fill="none"/>
      </svg>
    `;
  }

  // ---------------- State renderers ----------------
  function renderLoading() {
    const skel = (h) => `<div class="skeleton rounded-card" style="height:${h}"></div>`;
    return `
      <section class="space-y-3">
        <div class="skeleton rounded h-6 w-44"></div>
        <div class="skeleton rounded h-4 w-32"></div>
      </section>
      <section class="space-y-3">
        ${skel('72px')}${skel('72px')}${skel('72px')}
      </section>
      <section class="grid grid-cols-2 gap-3">
        ${Array(4).fill(0).map(() => skel('76px')).join('')}
      </section>
      ${skel('110px')}
      ${skel('140px')}
    `;
  }

  function renderError() {
    return `
      <section class="bg-error-bg rounded-card p-8 text-center space-y-3 mt-2">
        <p class="text-sm font-semibold text-error">We couldn't load your dashboard</p>
        <p class="text-xs text-error/90">Please check your connection and try again.</p>
        <button onclick="setState('loading'); setTimeout(()=>setState('populated'), 900)" class="bg-error text-white text-sm font-semibold px-6 py-3 rounded-button min-h-[48px] transition-warm">Try again</button>
      </section>
    `;
  }

  function renderEmpty() {
    return `
      <section class="pt-1">
        <p class="font-heading font-bold text-2xl">Good morning, ${seed.member.firstName}</p>
        <p class="text-ink-muted text-sm mt-1">${seed.parish.name}</p>
      </section>
      <section class="bg-card-bg rounded-card shadow-card p-8 text-center space-y-3">
        ${chapelIllustration(88)}
        <p class="text-sm font-semibold">You're all caught up</p>
        <p class="text-sm text-ink-muted max-w-xs mx-auto">Nothing needs your attention right now. New requests, approvals and reminders will show up here.</p>
      </section>
      ${quickActionsSection()}
      <section class="bg-card-bg rounded-card shadow-card p-8 text-center space-y-2">
        <p class="text-sm font-semibold">No announcements yet</p>
        <p class="text-sm text-ink-muted">Parish news will appear here as it's published.</p>
      </section>
      ${myParishSection()}
    `;
  }

  function goTo(href, label) {
    if (href) {
      window.location.href = href + '?' + sessionParams.toString();
    } else {
      toast(label);
    }
  }

  function quickActionsSection() {
    return `
      <section>
        <h2 class="font-heading font-bold text-lg mb-3">Quick actions</h2>
        <div class="grid grid-cols-2 gap-3">
          ${seed.quickActions.map(qa => `
            <button onclick="goTo(${qa.href ? `'${qa.href}'` : 'null'}, '${qa.label}')" class="bg-card-bg rounded-card shadow-card p-4 flex flex-col items-center gap-2 min-h-[44px] transition-warm hover:shadow-card-hover">
              <span class="w-10 h-10 rounded-badge bg-primary-light text-primary flex items-center justify-center">${icon(qa.icon)}</span>
              <span class="text-xs leading-tight text-center text-ink font-medium">${qa.label}</span>
            </button>
          `).join('')}
        </div>
      </section>
    `;
  }

  function myParishSection() {
    return `
      <section>
        <h2 class="font-heading font-bold text-lg mb-3">My Parish</h2>
        <div class="bg-card-bg rounded-card shadow-card divide-y divide-divider overflow-hidden">
          <button onclick="toast('Parish Profile')" class="w-full flex items-center justify-between px-5 py-4 min-h-[44px] transition-warm hover:bg-section-bg">
            <span class="flex items-center gap-3 text-sm font-medium"><span class="w-9 h-9 rounded-badge bg-primary-light text-primary flex items-center justify-center flex-shrink-0">${icon('church')}</span>Parish Profile</span>
            <span class="text-ink-muted">${icon('chevron','icon w-4 h-4')}</span>
          </button>
          <button onclick="toast('Mass Timings')" class="w-full flex items-center justify-between px-5 py-4 min-h-[44px] transition-warm hover:bg-section-bg">
            <span class="flex items-center gap-3 text-sm font-medium"><span class="w-9 h-9 rounded-badge bg-primary-light text-primary flex items-center justify-center flex-shrink-0">${icon('clock')}</span>Mass Timings</span>
            <span class="text-ink-muted">${icon('chevron','icon w-4 h-4')}</span>
          </button>
          <button onclick="toast('Contact Parish')" class="w-full flex items-center justify-between px-5 py-4 min-h-[44px] transition-warm hover:bg-section-bg">
            <span class="flex items-center gap-3 text-sm font-medium"><span class="w-9 h-9 rounded-badge bg-primary-light text-primary flex items-center justify-center flex-shrink-0">${icon('phone')}</span>Contact Parish</span>
            <span class="text-ink-muted">${icon('chevron','icon w-4 h-4')}</span>
          </button>
        </div>
      </section>
    `;
  }

  function renderPopulated() {
    const toneMap = {
      gold: ['bg-gold/20', 'text-[#8a5a10]', 'clock'],
      green: ['bg-green/20', 'text-[#2f6b45]', 'check'],
    };
    return `
      <section class="pt-1 flex items-start justify-between gap-3">
        <div>
          <p class="font-heading font-bold text-2xl">Good morning, ${seed.member.firstName}</p>
          <p class="text-ink-muted text-sm mt-1">${seed.parish.name}</p>
        </div>
        <div class="flex-shrink-0">${chapelIllustration(56)}</div>
      </section>

      <section>
        <h2 class="font-heading font-bold text-lg mb-3">Things needing your attention</h2>
        <div class="space-y-3">
          ${seed.actionCenter.map(item => {
            const [bg, text, iconName] = toneMap[item.tone];
            return `
            <button onclick="goTo(${item.href ? `'${item.href}'` : 'null'}, '${item.label}')" class="w-full bg-card-bg rounded-card shadow-card p-5 flex items-start justify-between gap-3 text-left min-h-[44px] transition-warm hover:shadow-card-hover">
              <div class="min-w-0">
                <p class="text-sm font-semibold truncate">${item.label}</p>
                <p class="text-xs text-ink-muted mt-1">${item.sub}</p>
              </div>
              <span class="${bg} ${text} text-xs font-semibold px-3 py-1.5 rounded-badge whitespace-nowrap flex-shrink-0 flex items-center gap-1.5">${icon(iconName, 'w-3 h-3')}${item.status}</span>
            </button>
          `}).join('')}
        </div>
      </section>

      ${quickActionsSection()}

      <section>
        <div class="flex items-center justify-between mb-3">
          <h2 class="font-heading font-bold text-lg">Your schedule</h2>
        </div>
        <div class="bg-card-bg rounded-card shadow-card divide-y divide-divider overflow-hidden">
          ${seed.upcoming.map(u => `
            <div class="px-5 py-4">
              <p class="text-xs text-ink-muted uppercase tracking-wide">${u.label}</p>
              <p class="text-sm font-semibold mt-1">${u.value}</p>
              <p class="text-xs text-ink-muted mt-0.5">${u.sub}</p>
            </div>
          `).join('')}
        </div>
      </section>

      <section>
        <div class="flex items-center justify-between mb-3">
          <h2 class="font-heading font-bold text-lg">Announcements</h2>
          <button onclick="toast('All Announcements')" class="text-primary text-xs font-semibold">View all</button>
        </div>
        <div class="bg-card-bg rounded-card shadow-card p-5">
          <p class="text-sm font-semibold">${seed.announcement.title}</p>
          <p class="text-xs text-ink-muted mt-1 mb-2">${seed.announcement.date}</p>
          <p class="text-xs text-ink-muted leading-relaxed">${seed.announcement.preview}</p>
        </div>
      </section>

      <section>
        <div class="flex items-center justify-between mb-3">
          <h2 class="font-heading font-bold text-lg">Community</h2>
          <button onclick="toast('All Causes')" class="text-primary text-xs font-semibold">View all causes</button>
        </div>
        <div class="grid grid-cols-2 gap-3 mb-3">
          ${seed.donationCauses.map(c => `
            <div class="bg-card-bg rounded-card shadow-card p-4 flex flex-col justify-between">
              <div>
                <p class="text-sm font-semibold leading-snug">${c.name}</p>
                <p class="text-xs text-ink-muted mt-1.5 leading-relaxed">${c.desc}</p>
              </div>
              <button onclick="toast('Give to ${c.name}')" class="mt-3 bg-primary hover:bg-primary-hover text-white text-xs font-semibold py-2.5 rounded-button min-h-[36px] transition-warm">Give</button>
            </div>
          `).join('')}
        </div>
        ${myParishSection()}
      </section>
    `;
  }

  const renderers = { loading: renderLoading, empty: renderEmpty, populated: renderPopulated, error: renderError };

  function setState(state) {
    const main = document.getElementById('main-content');
    main.innerHTML = renderers[state]();
  }

  // Simulate an initial fetch on page load
  setState('loading');
  setTimeout(() => setState('populated'), 900);
</script>

</body>
</html>
