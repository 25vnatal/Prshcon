    clearTimeout(window._toastTimer);
    window._toastTimer = setTimeout(() => {
      t.classList.remove('opacity-100');
      t.classList.add('opacity-0');
    }, 1800);
  }

  function runSearch(query) {
    query = (query || '').trim();
    const el = document.getElementById('search-results');
    if (!query) { el.innerHTML = ''; return; }
    document.getElementById('search-input').value = query;
    const q = query.toLowerCase();
    const heading = `<p class="text-xs font-semibold text-ink-muted uppercase tracking-wide mb-2">Results for "${query}"</p>`;

    const parishMatches = q.length >= 3 ? PARISH_DIRECTORY.filter(p => p.name.toLowerCase().includes(q)) : [];
    if (parishMatches.length > 0) {
      el.innerHTML = `
        ${heading}
        <div class="bg-card-bg rounded-card shadow-card divide-y divide-divider overflow-hidden">
          ${parishMatches.slice(0, 8).map(p => `
            <button onclick="window.location.href='screen-parishioner-parish-profile.html?' + baseParams().toString() + '&parishId=${p.id}'" class="w-full flex items-center gap-3 px-4 py-3 text-left transition-warm hover:bg-section-bg min-h-[44px]">
              <span class="w-9 h-9 rounded-badge bg-primary-light text-primary flex items-center justify-center flex-shrink-0">${icon('pin','w-4 h-4')}</span>
              <div class="min-w-0 flex-1">
                <p class="text-sm font-semibold truncate">${p.name}${p.id === 'PAR-0002' ? ' <span class="text-primary font-normal">(your parish)</span>' : ''}</p>
                <p class="text-xs text-ink-muted mt-0.5 truncate">${p.address}</p>
              </div>
              <span class="text-ink-muted flex-shrink-0">${icon('chevron','icon w-4 h-4')}</span>
            </button>
          `).join('')}
        </div>
        ${parishMatches.length > 8 ? `<p class="text-xs text-ink-muted mt-2">Showing 8 of ${parishMatches.length} matches — keep typing to narrow.</p>` : ''}
      `;
    } else if (q.includes('near')) {
      el.innerHTML = `
        ${heading}
        <div class="bg-card-bg rounded-card shadow-card divide-y divide-divider overflow-hidden">
          ${NEARBY_CHURCHES.map(c => `
            <button onclick="window.location.href='screen-parishioner-parish-profile.html?' + baseParams().toString() + '&parishId=${c.id}'" class="w-full flex items-center gap-3 px-4 py-3 text-left transition-warm hover:bg-section-bg min-h-[44px]">
              <span class="w-9 h-9 rounded-badge bg-primary-light text-primary flex items-center justify-center flex-shrink-0">${icon('pin','w-4 h-4')}</span>
              <div class="min-w-0 flex-1">
                <p class="text-sm font-semibold truncate">${c.name}</p>
                <p class="text-xs text-ink-muted mt-0.5">${c.locality}</p>
              </div>
              <span class="text-xs text-ink-muted flex-shrink-0">${c.distance}</span>
            </button>
          `).join('')}
        </div>
        <p class="text-xs text-ink-muted mt-2">Distances are approximate.</p>
      `;
    } else if (q.includes('mass') || q.includes('timing')) {
      el.innerHTML = `
        ${heading}
        <div class="bg-card-bg rounded-card shadow-card divide-y divide-divider overflow-hidden">
          ${MASS_TIMINGS.map(m => `
            <div class="px-4 py-3 flex items-center justify-between">
              <span class="text-sm font-medium">${m.label}</span>
              <span class="text-sm text-ink-muted text-right">${m.value}</span>
            </div>
          `).join('')}
        </div>
      `;
    } else if (q.includes('contact') || q.includes('office') || q.includes('phone')) {
      el.innerHTML = `
        ${heading}
        <div class="bg-card-bg rounded-card shadow-card p-4 space-y-1.5">
          <p class="text-sm font-semibold">Infant Jesus Shrine, Viveknagar</p>
          <p class="text-xs text-ink-muted">Post Box 4712, Viveknagar, Bengaluru 560 047</p>
          <p class="text-xs text-ink-muted">Mon–Sat, 9:00 AM – 5:30 PM (Sat until 1:00 PM) · Closed Monday</p>
          <p class="text-xs text-ink-muted">Parish office: 25301206</p>
        </div>
      `;
    } else if (q.includes('novena')) {
      el.innerHTML = `
        ${heading}
        <div class="bg-card-bg rounded-card shadow-card p-4 space-y-1.5">
          <p class="text-sm font-semibold">30 Aug – 6 Sep, 6:00 PM daily</p>
          <p class="text-xs text-ink-muted">Feast Day Mass: 8 Sep, 7:00 AM at St. Mary's Basilica</p>
        </div>
      `;
    } else {
      el.innerHTML = `
        <div class="bg-card-bg rounded-card shadow-card p-6 text-center">
          <p class="text-sm text-ink-muted">No results for "${query}" yet — try one of the suggestions above.</p>
        </div>
      `;
    }
  }

              <button onclick="goTo('${i.go}', '${i.cta}')" class="bg-primary hover:bg-primary-hover text-white text-[11px] font-semibold px-3 py-1.5 rounded-button flex-shrink-0 transition-warm">${i.cta}</button>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }

  function toggleOtherActions() {
    otherActionsOpen = !otherActionsOpen;
    document.getElementById('other-actions-body').classList.toggle('hidden');
    document.getElementById('other-actions-chevron').style.transform = `rotate(${otherActionsOpen ? '180' : '0'}deg)`;
  }

  function quickActionsSection() {
    return `
      <section>
        <h2 class="font-heading font-bold text-base mb-3">Quick actions</h2>
        <div class="grid grid-cols-2 gap-2.5">
          ${seed.quickActions.map(qa => `
            <button onclick="goTo(${qa.href ? `'${qa.href}'` : 'null'}, '${qa.label}')" class="bg-card-bg rounded-card shadow-card p-3 flex flex-col items-center gap-1.5 min-h-[36px] transition-warm hover:shadow-card-hover">
              <span class="w-8 h-8 rounded-badge bg-primary-light text-primary flex items-center justify-center">${icon(qa.icon, 'icon w-4 h-4')}</span>
              <span class="text-xs leading-tight text-center text-ink font-medium">${qa.label}</span>
            </button>
          `).join('')}
        </div>
      </section>
    `;
  }

  function myParishSection() {
    return `
      <section>
        <h2 class="font-heading font-bold text-base mb-3">My Parish</h2>
        <div class="bg-card-bg rounded-card shadow-card divide-y divide-divider overflow-hidden">
          <button onclick="window.location.href='screen-parishioner-parish-profile.html?' + sessionParams.toString()" class="w-full flex items-center justify-between px-5 py-4 min-h-[44px] transition-warm hover:bg-section-bg">
            <span class="flex items-center gap-3 text-sm font-medium"><span class="w-9 h-9 rounded-badge bg-primary-light text-primary flex items-center justify-center flex-shrink-0">${icon('church')}</span>Parish Profile</span>
            <span class="text-ink-muted">${icon('chevron','icon w-4 h-4')}</span>
          </button>
          <button onclick="window.location.href='screen-parishioner-events.html?' + sessionParams.toString()" class="w-full flex items-center justify-between px-5 py-4 min-h-[44px] transition-warm hover:bg-section-bg">
            <span class="flex items-center gap-3 text-sm font-medium"><span class="w-9 h-9 rounded-badge bg-primary-light text-primary flex items-center justify-center flex-shrink-0">${icon('calendar')}</span>Parish Events</span>
            <span class="text-ink-muted">${icon('chevron','icon w-4 h-4')}</span>
          </button>
          <button onclick="window.location.href='screen-parishioner-committees.html?' + sessionParams.toString()" class="w-full flex items-center justify-between px-5 py-4 min-h-[44px] transition-warm hover:bg-section-bg">
            <span class="flex items-center gap-3 text-sm font-medium"><span class="w-9 h-9 rounded-badge bg-primary-light text-primary flex items-center justify-center flex-shrink-0">${icon('star')}</span>Committees & Ministries</span>
            <span class="text-ink-muted">${icon('chevron','icon w-4 h-4')}</span>
          </button>
          <button onclick="window.location.href='screen-parishioner-faithformation.html?' + sessionParams.toString()" class="w-full flex items-center justify-between px-5 py-4 min-h-[44px] transition-warm hover:bg-section-bg">
            <span class="flex items-center gap-3 text-sm font-medium"><span class="w-9 h-9 rounded-badge bg-primary-light text-primary flex items-center justify-center flex-shrink-0">${icon('rosary')}</span>Faith & Prayers</span>
            <span class="text-ink-muted">${icon('chevron','icon w-4 h-4')}</span>
          </button>
          <button onclick="window.location.href='screen-parishioner-parish-profile.html?' + baseParams().toString() + '&card=masstimes'" class="w-full flex items-center justify-between px-5 py-4 min-h-[44px] transition-warm hover:bg-section-bg">
            <span class="flex items-center gap-3 text-sm font-medium"><span class="w-9 h-9 rounded-badge bg-primary-light text-primary flex items-center justify-center flex-shrink-0">${icon('clock')}</span>Mass Timings</span>
            <span class="text-ink-muted">${icon('chevron','icon w-4 h-4')}</span>
          </button>
          <button onclick="window.location.href='screen-parishioner-parish-profile.html?' + baseParams().toString() + '&card=contact'" class="w-full flex items-center justify-between px-5 py-4 min-h-[44px] transition-warm hover:bg-section-bg">
            <span class="flex items-center gap-3 text-sm font-medium"><span class="w-9 h-9 rounded-badge bg-primary-light text-primary flex items-center justify-center flex-shrink-0">${icon('phone')}</span>Contact Parish</span>
            <span class="text-ink-muted">${icon('chevron','icon w-4 h-4')}</span>
          </button>
        </div>
      </section>
    `;
  }

  function runSearchFromDashboard(query) {
    openSearch();
    setTimeout(() => runSearch(query), 60);
  }

  function renderPopulated() {
    return `
      <section class="pt-0.5">
        <p class="font-heading font-bold text-lg">Good morning, ${seed.member.firstName}</p>
      </section>

      ${heroBannerSection()}

      <section>
        <div class="flex items-center justify-between mb-3">
          <h2 class="font-heading font-bold text-base">Today</h2>
          <button onclick="window.location.href='screen-parishioner-faithformation.html?' + sessionParams.toString()" class="text-primary text-xs font-semibold">More</button>
        </div>
        <button onclick="window.location.href='screen-parishioner-faithformation.html?' + sessionParams.toString()" class="w-full text-left bg-card-bg rounded-card shadow-card p-5 transition-warm hover:shadow-card-hover min-h-[44px]">
          <p class="text-xs font-semibold text-lavender uppercase tracking-wide">Prayer of the Day</p>
          <p class="text-sm font-semibold mt-1.5">Trust in Providence</p>
          <p class="text-sm text-ink-muted mt-1 leading-relaxed">Lord, help me trust in Your providence today, in ways big and small.</p>
          <div class="flex items-center justify-between mt-3 pt-3 border-t border-divider">
            <p class="text-xs text-ink-muted">Sunday Gospel Reflection — The Good Samaritan</p>
            <span class="text-primary flex-shrink-0">${icon('chevron','icon w-3.5 h-3.5')}</span>
          </div>
        </button>
      </section>

      <section>
        <h2 class="font-heading font-bold text-base mb-3">Things needing your attention</h2>
        <div class="grid grid-cols-1 gap-3">
          ${myRequestsCard()}
          ${otherActionsCard()}
        </div>
      </section>

      <section>
        <div class="flex items-center justify-between mb-3">
          <h2 class="font-heading font-bold text-base">Upcoming</h2>
          <button onclick="goTo('screen-parishioner-massbooking-mybookings.html', 'My Bookings')" class="text-primary text-xs font-semibold">My Bookings</button>
        </div>
        <div class="bg-card-bg rounded-card shadow-card divide-y divide-divider overflow-hidden">
          ${renderUpcomingTile(seed.upcoming[0])}
          ${seed.upcoming.length > 1 ? `
            <div id="upcoming-more" class="hidden">
              ${seed.upcoming.slice(1).map(renderUpcomingTile).join('')}
            </div>
            <button onclick="toggleUpcoming()" class="w-full flex items-center justify-center gap-1.5 px-5 py-3 text-xs font-semibold text-primary min-h-[40px]">
              <span id="upcoming-toggle-label">Show ${seed.upcoming.length - 1} more</span>
              <span id="upcoming-toggle-chevron" class="inline-flex transition-warm">${icon('chevronDown','icon w-3.5 h-3.5')}</span>
            </button>
          ` : ''}
        </div>
      </section>

      ${quickActionsSection()}

      <section>
        <div class="flex items-center justify-between mb-3">
          <h2 class="font-heading font-bold text-base">Parish Announcements</h2>
          <button onclick="toast('All Announcements')" class="text-primary text-xs font-semibold">View all</button>
        </div>
        <div class="bg-card-bg rounded-card shadow-card p-5">
          <p class="text-xs text-ink-muted uppercase tracking-wide mb-3">${seed.weeklyAnnouncements.week}</p>
          <ul class="space-y-2.5">
            ${seed.weeklyAnnouncements.items.map(a => `
              <li class="flex gap-2.5 text-sm">
                <span class="w-1.5 h-1.5 rounded-full bg-primary flex-shrink-0 mt-1.5"></span>
                <span>${a}</span>
              </li>
            `).join('')}
          </ul>
        </div>
      </section>

      <section>
        <div class="flex items-center justify-between mb-3">
          <h2 class="font-heading font-bold text-base">Community</h2>
          <button onclick="window.location.href='screen-parishioner-donate-hub.html?' + sessionParams.toString()" class="text-primary text-xs font-semibold">View all causes</button>
        </div>
        <div class="grid grid-cols-2 gap-3 mb-3">
          ${seed.donationCauses.map(c => `
            <div class="bg-card-bg rounded-card shadow-card p-4 flex flex-col justify-between">
              <div>
                <p class="text-sm font-semibold leading-snug">${c.name}</p>
                <p class="text-xs text-ink-muted mt-1.5 leading-relaxed">${c.desc}</p>
              </div>
              <button onclick="window.location.href='screen-parishioner-donate-hub.html?' + sessionParams.toString()" class="mt-3 bg-primary hover:bg-primary-hover text-white text-xs font-semibold py-2.5 rounded-button min-h-[36px] transition-warm">Give</button>
            </div>
          `).join('')}
        </div>
        ${myParishSection()}
      </section>
    `;
  }

  const renderers = { loading: renderLoading, empty: renderEmpty, populated: renderPopulated, error: renderError };

  function setState(state) {
    const main = document.getElementById('main-content');
    main.innerHTML = renderers[state]();
    const totalActions = state === 'populated' ? (seed.myRequests.count + seed.otherActions.length) : 0;
    document.getElementById('avatar-notification-dot').classList.toggle('hidden', totalActions === 0);
  }

  // Simulate an initial fetch on page load
  setState('loading');
  setTimeout(() => setState('populated'), 900);
</script>

</body>
</html>
