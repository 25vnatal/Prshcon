<!DOCTYPE html>
<html lang="en">
<head>
<title>Parish Connect — Parish Dashboard</title>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          'bg-warm': '#FAFBFD', 'card-bg': '#FFFFFF', 'section-bg': '#F5F7FB', divider: '#E8EDF5',
          ink: '#1F2937', 'ink-muted': '#6B7280',
          primary: { DEFAULT: '#4F7CF5', hover: '#3F6CE4', light: '#EEF4FF' },
          coral: '#FF7F73', gold: '#F6C453', green: '#6CBF84', lavender: '#A88BFF',
          error: { DEFAULT: '#E5645A', bg: '#FDECEA' },
        },
        fontFamily: { heading: ['Manrope', 'sans-serif'], body: ['Inter', 'sans-serif'] },
        borderRadius: { card: '24px', button: '16px', input: '16px', badge: '999px' },
        boxShadow: { card: '0 6px 24px rgba(30,41,59,0.08)', 'card-hover': '0 12px 36px rgba(30,41,59,0.12)' },
        maxWidth: { content: '1440px' },
      },
    },
  };
</script>
<style>
  body { font-family: 'Inter', sans-serif; background-color: #FAFBFD; color: #1F2937; line-height: 1.5; }
  h1, h2, h3, .font-heading { font-family: 'Manrope', sans-serif; }
  :focus-visible { outline: 2px solid #4F7CF5; outline-offset: 2px; }
  .transition-warm { transition: all 200ms ease; }
  .icon { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .skeleton { background: linear-gradient(90deg, #E8EDF5 25%, #F2F5FA 37%, #E8EDF5 63%); background-size: 400% 100%; animation: shimmer 1.4s ease infinite; }
  @keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }
  @media (prefers-reduced-motion: reduce) { .skeleton { animation: none; } }
</style>
</head>
<body class="text-ink">

  <!-- ============ DEMO CONTROLS (not part of the product UI) ============ -->
  <div id="demo-bar" class="hidden bg-ink text-white text-xs px-4 py-2 flex items-center gap-2 flex-wrap sticky top-0 z-50">
    <span class="opacity-60 mr-1">Preview state:</span>
    <button onclick="setState('loading')" class="px-2 py-1 rounded bg-white/10 hover:bg-white/20">Loading</button>
    <button onclick="setState('empty')" class="px-2 py-1 rounded bg-white/10 hover:bg-white/20">Empty</button>
    <button onclick="setState('populated')" class="px-2 py-1 rounded bg-white/10 hover:bg-white/20">Populated</button>
    <button onclick="setState('error')" class="px-2 py-1 rounded bg-white/10 hover:bg-white/20">Error</button>
    <button onclick="document.getElementById('demo-bar').classList.add('hidden')" class="ml-auto px-2 py-1 rounded bg-white/10 hover:bg-white/20">Hide</button>
  </div>
  <button onclick="document.getElementById('demo-bar').classList.toggle('hidden')" aria-label="Toggle preview state controls" class="fixed bottom-2 right-2 w-3 h-3 rounded-full bg-ink/20 hover:bg-ink/50 z-50"></button>

  <div class="flex min-h-screen">

    <!-- ============ SIDEBAR (desktop-first, 280px) ============ -->
    <aside id="sidebar" class="w-[280px] bg-card-bg border-r border-divider flex-shrink-0 flex flex-col fixed lg:static inset-y-0 left-0 z-40 -translate-x-full lg:translate-x-0 transition-transform">
      <div class="px-6 pt-6 pb-5">
        <div class="flex items-center gap-2 mb-1">
          <img src="assets/pc-logo.jpg" alt="Parish Connect" class="w-8 h-8 rounded-lg object-cover flex-shrink-0">
          <p class="font-heading font-bold text-base">Parish Connect</p>
        </div>
        <p id="sidebar-parish-name" class="text-xs text-ink-muted mt-1 truncate">Infant Jesus Shrine</p>
      </div>
      <nav class="flex-1 px-4 space-y-1 overflow-y-auto">
        <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-button bg-primary-light text-primary font-semibold text-sm">
          <svg class="icon" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/></svg>
          Dashboard
        </a>
        <button onclick="return goFamilyRecords()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-button text-ink-muted text-sm hover:bg-section-bg transition-warm">
          <svg class="icon" viewBox="0 0 24 24"><circle cx="9" cy="7" r="4"/><path d="M2 21v-2a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v2"/></svg>
          Family Records
        </button>
        <button onclick="return goCommittees()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-button text-ink-muted text-sm hover:bg-section-bg transition-warm">
          <svg class="icon" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M2 21v-1a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v1"/><path d="M15 15.5a4 4 0 0 1 5 3.5"/></svg>
          Committees
        </button>
        <a href="#" onclick="return goRequests()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-button text-ink-muted text-sm hover:bg-section-bg transition-warm">
          <svg class="icon" viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          Requests
        </a>
        <button onclick="return goMasses()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-button text-ink-muted text-sm hover:bg-section-bg transition-warm">
          <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18"/><path d="M8 3v4"/><path d="M16 3v4"/></svg>
          Masses
        </button>
        <button onclick="toast('Communication')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-button text-ink-muted text-sm hover:bg-section-bg transition-warm">
          <svg class="icon" viewBox="0 0 24 24"><path d="M4 4h16v12H7l-3 3V4Z"/></svg>
          Communication
        </button>
        <button onclick="return goFinance()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-button text-ink-muted text-sm hover:bg-section-bg transition-warm">
          <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.5a2.5 2.5 0 0 1 2.5-1h.5a2.5 2.5 0 0 1 0 5h-1a2.5 2.5 0 0 0 0 5h.5a2.5 2.5 0 0 0 2.5-1"/></svg>
          Finance
        </button>
        <button onclick="return goAdministration()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-button text-ink-muted text-sm hover:bg-section-bg transition-warm">
          <svg class="icon" viewBox="0 0 24 24"><path d="M12 3v4"/><path d="M9 6l3-2 3 2"/><path d="M5 21V11l7-5 7 5v10"/><path d="M9 21v-6a3 3 0 0 1 6 0v6"/></svg>
          Administration
        </button>
        <button onclick="toast('Reports')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-button text-ink-muted text-sm hover:bg-section-bg transition-warm">
          <svg class="icon" viewBox="0 0 24 24"><path d="M4 20V10M12 20V4M20 20v-7"/></svg>
          Reports
        </button>
        <button onclick="toast('Settings')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-button text-ink-muted text-sm hover:bg-section-bg transition-warm">
          <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.11-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1.11 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1Z"/></svg>
          Settings
        </button>
      </nav>
    </aside>
    <div id="sidebar-backdrop" onclick="toggleSidebar()" class="hidden fixed inset-0 bg-black/20 z-30 lg:hidden"></div>

    <!-- ============ MAIN ============ -->
    <div class="flex-1 min-w-0">

      <!-- Top bar -->
      <header class="bg-card-bg border-b border-divider px-6 lg:px-10 py-4 flex items-center justify-between sticky top-0 z-20">
        <div class="flex items-center gap-3">
          <button onclick="toggleSidebar()" aria-label="Toggle navigation" class="lg:hidden w-9 h-9 rounded-button flex items-center justify-center text-ink-muted hover:bg-section-bg">
            <svg class="icon" viewBox="0 0 24 24"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
          </button>
          <div>
            <p id="header-parish-name" class="text-sm font-semibold">Infant Jesus Shrine</p>
            <p class="text-xs text-ink-muted">Parish office</p>
          </div>
        </div>
        <div class="flex items-center gap-3">
          <button aria-label="Search" class="w-9 h-9 rounded-button flex items-center justify-center text-ink-muted hover:bg-section-bg transition-warm">
            <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          </button>
          <button id="avatar-btn" onclick="document.getElementById('account-menu').classList.toggle('hidden')" aria-label="Account menu" class="w-9 h-9 rounded-badge bg-primary text-white text-xs font-bold flex items-center justify-center flex-shrink-0">PS</button>
        </div>
        <div id="account-menu" class="hidden absolute right-6 lg:right-10 top-16 bg-card-bg rounded-card shadow-card w-56 z-50 overflow-hidden">
          <div class="px-4 py-3.5 border-b border-divider">
            <p class="text-sm font-semibold">Parish Staff</p>
            <p id="account-parish-name" class="text-xs text-ink-muted truncate">Infant Jesus Shrine</p>
          </div>
          <button onclick="window.location.href='screen-parish-login.html'" class="w-full text-left px-4 py-3.5 text-sm text-error hover:bg-error-bg min-h-[44px] transition-warm">Log out</button>
        </div>
      </header>

      <main id="main-content" class="px-6 lg:px-10 py-8 space-y-8 max-w-content"></main>

    </div>
  </div>

  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-ink text-white text-sm px-4 py-2.5 rounded-button shadow-card opacity-0 pointer-events-none transition-opacity duration-200 max-w-[90%] text-center z-50"></div>

<script>
  // ---------------- Session (from login redirect) ----------------
  const sessionParams = new URLSearchParams(window.location.search);
  const parishId = sessionParams.get('parish') || 'PAR-0002';
  const parishName = sessionParams.get('parishName') || 'Infant Jesus Shrine';
  const isSeededParish = parishId === 'PAR-0002';

  document.getElementById('sidebar-parish-name').textContent = parishName;
  document.getElementById('header-parish-name').textContent = parishName;
  document.getElementById('account-parish-name').textContent = parishName;
  document.getElementById('avatar-btn').textContent = parishName.split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();

  function goRequests() { window.location.href = 'screen-parish-requests-hub.html?' + sessionParams.toString(); return false; }
  function goFamilyRecords() { window.location.href = 'screen-parish-familyrecords-search.html?' + sessionParams.toString(); return false; }
  function goMasses() { window.location.href = 'screen-parish-masses-hub.html?' + sessionParams.toString(); return false; }
  function goCommittees() { window.location.href = 'screen-parish-committees-hub.html?' + sessionParams.toString(); return false; }
  function goFinance() { window.location.href = 'screen-parish-finance-hub.html?' + sessionParams.toString(); return false; }
  function goAdministration() { window.location.href = 'screen-parish-administration-hub.html?' + sessionParams.toString(); return false; }
  function goRegisterFamily() { window.location.href = 'screen-parish-familyrecords-search.html?' + sessionParams.toString() + '&openRegister=1'; return false; }

  function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('-translate-x-full');
    document.getElementById('sidebar-backdrop').classList.toggle('hidden');
  }

  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = `Opening ${msg}…`;
    t.classList.remove('opacity-0'); t.classList.add('opacity-100');
    clearTimeout(window._t);
    window._t = setTimeout(() => { t.classList.remove('opacity-100'); t.classList.add('opacity-0'); }, 1800);
  }

  const icons = {
    check: '<path d="M20 6 9 17l-5-5"/>',
    clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    plus: '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
    calendar: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18"/><path d="M8 3v4"/><path d="M16 3v4"/>',
    megaphone: '<path d="M3 11v3a1 1 0 0 0 1 1h2l4 4V6L6 10H4a1 1 0 0 0-1 1Z"/><path d="M14 8a4 4 0 0 1 0 8"/><path d="M17 5a8 8 0 0 1 0 14"/>',
    cash: '<circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.5a2.5 2.5 0 0 1 2.5-1h.5a2.5 2.5 0 0 1 0 5h-1a2.5 2.5 0 0 0 0 5h.5a2.5 2.5 0 0 0 2.5-1"/>',
  };
  function icon(name, cls) { return `<svg class="${cls||'icon'}" viewBox="0 0 24 24">${icons[name]}</svg>`; }

  function chapelIllustration(size) {
    return `
      <svg width="${size}" height="${size}" viewBox="0 0 120 120" fill="none">
        <circle cx="90" cy="28" r="14" fill="#F6C453" opacity="0.35"/>
        <path d="M40 100V56l20-16 20 16v44" stroke="#4F7CF5" stroke-width="3" stroke-linejoin="round" fill="#EEF4FF"/>
        <rect x="55" y="72" width="10" height="28" rx="2" fill="#FFFFFF" stroke="#4F7CF5" stroke-width="2.5"/>
        <line x1="60" y1="34" x2="60" y2="24" stroke="#FF7F73" stroke-width="3" stroke-linecap="round"/>
        <line x1="55" y1="29" x2="65" y2="29" stroke="#FF7F73" stroke-width="3" stroke-linecap="round"/>
        <path d="M18 100c4-10 10-16 10-16s6 6 10 16" stroke="#6CBF84" stroke-width="3" stroke-linecap="round" fill="none"/>
        <path d="M82 100c4-10 10-16 10-16s6 6 10 16" stroke="#6CBF84" stroke-width="3" stroke-linecap="round" fill="none"/>
      </svg>
    `;
  }

  // ---------------- Mock data (Infant Jesus Shrine, from mock-seed.json) ----------------
  const seed = {
    priorities: [
      { label: "Baptism Certificate request — Rodrigues family", sub: "Submitted 20 Jul · awaiting your review", status: "Pending", tone: "gold" },
      { label: "House blessing request — Rodrigues family", sub: "Awaiting Fr. John Anthony's approval", status: "Pending", tone: "gold" },
      { label: "Family update request — Rodrigues family", sub: "Add a Family Member — awaiting your review", status: "Pending", tone: "gold", href: "screen-parish-familyrecords-search.html", extraParams: "&family=FAM-1001&tab=updates" },
      { label: "Clara Rodrigues' Confirmation registration", sub: "Documents verified, payment received", status: "Approved", tone: "green" },
    ],
    quickActions: [
      { label: "Approve Requests", icon: "check" },
      { label: "Register New Family", icon: "plus" },
      { label: "Schedule a Mass", icon: "calendar" },
      { label: "Send Announcement", icon: "megaphone" },
    ],
    schedule: [
      { time: "8:00 AM", title: "Sunday Mass", sub: "Main church · 5 intentions booked" },
      { time: "10:30 AM", title: "Confirmation preparation class", sub: "Parish hall · 12 candidates" },
      { time: "4:00 PM", title: "Family records review", sub: "Parish office" },
    ],
    activity: [
      { text: "Payment recorded for Rodrigues family subscription", time: "2 hours ago" },
      { text: "Clara Rodrigues' Confirmation registration approved", time: "Yesterday" },
      { text: "Novena announcement published", time: "2 days ago" },
    ],
    snapshot: [
      { label: "Registered families", value: "1,842" },
      { label: "Active parishioners", value: "6,120" },
      { label: "Pending requests", value: "7" },
      { label: "Subscription collection", value: "82%" },
    ],
  };

  // ---------------- State renderers ----------------
  function renderLoading() {
    const skel = (h) => `<div class="skeleton rounded-card" style="height:${h}"></div>`;
    return `
      <div class="skeleton rounded h-7 w-56"></div>
      <div class="grid md:grid-cols-3 gap-4">${skel('90px')}${skel('90px')}${skel('90px')}</div>
      <div class="grid md:grid-cols-4 gap-4">${Array(4).fill(0).map(()=>skel('90px')).join('')}</div>
      ${skel('180px')}
      ${skel('180px')}
    `;
  }

  function renderError() {
    return `
      <div class="bg-error-bg rounded-card p-10 text-center space-y-3 max-w-lg mx-auto">
        <p class="text-sm font-semibold text-error">We couldn't load your parish dashboard</p>
        <p class="text-xs text-error/90">Please check your connection and try again.</p>
        <button onclick="setState('loading'); setTimeout(()=>setState('populated'), 900)" class="bg-error text-white text-sm font-semibold px-6 py-3 rounded-button min-h-[48px] transition-warm">Try again</button>
      </div>
    `;
  }

  function quickActionsSection() {
    return `
      <section>
        <h2 class="font-heading font-bold text-lg mb-3">Quick actions</h2>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
          ${seed.quickActions.map(qa => `
            <button onclick="${qa.label === 'Approve Requests' ? 'goRequests()' : qa.label === 'Register New Family' ? 'goRegisterFamily()' : qa.label === 'Schedule a Mass' ? 'goMasses()' : `toast('${qa.label}')`}" class="bg-card-bg rounded-card shadow-card p-5 flex flex-col items-center gap-2.5 transition-warm hover:shadow-card-hover min-h-[44px]">
              <span class="w-11 h-11 rounded-badge bg-primary-light text-primary flex items-center justify-center">${icon(qa.icon)}</span>
              <span class="text-xs font-medium text-center">${qa.label}</span>
            </button>
          `).join('')}
        </div>
      </section>
    `;
  }

  function renderEmpty() {
    return `
      <section>
        <p class="font-heading font-bold text-2xl">Welcome, ${parishName}</p>
        <p class="text-ink-muted text-sm mt-1">You're the first to sign in for this parish — let's get set up.</p>
      </section>
      <section class="bg-card-bg rounded-card shadow-card p-12 text-center space-y-3">
        ${chapelIllustration(96)}
        <p class="text-sm font-semibold">No records yet for ${parishName}</p>
        <p class="text-sm text-ink-muted max-w-md mx-auto">This parish doesn't have any families, requests, or mass schedules on Parish Connect yet — each parish only ever sees its own data. Get started by registering your first family.</p>
        <button onclick="goRegisterFamily()" class="bg-primary hover:bg-primary-hover text-white text-sm font-semibold px-6 py-3 rounded-button min-h-[48px] transition-warm">Register a Family</button>
      </section>
      ${quickActionsSection()}
    `;
  }

  function renderPopulated() {
    const toneMap = {
      gold: ['bg-gold/20', 'text-[#8a5a10]', 'clock'],
      green: ['bg-green/20', 'text-[#2f6b45]', 'check'],
    };
    return `
      <section class="flex items-start justify-between gap-3">
        <div>
          <p class="font-heading font-bold text-2xl">Good morning, Parish Office</p>
          <p class="text-ink-muted text-sm mt-1">${parishName}</p>
        </div>
        <div class="hidden sm:block flex-shrink-0">${chapelIllustration(56)}</div>
      </section>

      <section>
        <h2 class="font-heading font-bold text-lg mb-3">Things needing your attention</h2>
        <div class="space-y-3">
          ${seed.priorities.map(item => {
            const [bg, text, iconName] = toneMap[item.tone];
            return `
            <button onclick="${item.href ? `window.location.href='${item.href}?' + sessionParams.toString() + '${item.extraParams||''}'` : 'goRequests()'}" class="w-full bg-card-bg rounded-card shadow-card p-5 flex items-start justify-between gap-3 text-left transition-warm hover:shadow-card-hover min-h-[44px]">
              <div class="min-w-0">
                <p class="text-sm font-semibold">${item.label}</p>
                <p class="text-xs text-ink-muted mt-1">${item.sub}</p>
              </div>
              <span class="${bg} ${text} text-xs font-semibold px-3 py-1.5 rounded-badge whitespace-nowrap flex-shrink-0 flex items-center gap-1.5">${icon(iconName, 'w-3 h-3')}${item.status}</span>
            </button>
          `}).join('')}
        </div>
      </section>

      ${quickActionsSection()}

      <div class="grid lg:grid-cols-2 gap-8">
        <section>
          <h2 class="font-heading font-bold text-lg mb-3">Today's schedule</h2>
          <div class="bg-card-bg rounded-card shadow-card divide-y divide-divider overflow-hidden">
            ${seed.schedule.map(s => `
              <div class="px-5 py-4 flex items-start gap-4">
                <p class="text-xs font-semibold text-primary w-16 flex-shrink-0 pt-0.5">${s.time}</p>
                <div>
                  <p class="text-sm font-semibold">${s.title}</p>
                  <p class="text-xs text-ink-muted mt-0.5">${s.sub}</p>
                </div>
              </div>
            `).join('')}
          </div>
        </section>

        <section>
          <h2 class="font-heading font-bold text-lg mb-3">Recent activity</h2>
          <div class="bg-card-bg rounded-card shadow-card divide-y divide-divider overflow-hidden">
            ${seed.activity.map(a => `
              <div class="px-5 py-4">
                <p class="text-sm">${a.text}</p>
                <p class="text-xs text-ink-muted mt-0.5">${a.time}</p>
              </div>
            `).join('')}
          </div>
        </section>
      </div>

      <section>
        <h2 class="font-heading font-bold text-lg mb-3">Parish snapshot</h2>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
          ${seed.snapshot.map(s => `
            <div class="bg-card-bg rounded-card shadow-card p-5">
              <p class="text-xs text-ink-muted uppercase tracking-wide mb-2">${s.label}</p>
              <p class="font-heading font-bold text-2xl">${s.value}</p>
            </div>
          `).join('')}
        </div>
      </section>
    `;
  }

  const renderers = { loading: renderLoading, empty: renderEmpty, populated: renderPopulated, error: renderError };

  function setState(state) {
    document.getElementById('main-content').innerHTML = renderers[state]();
  }

  // Simulate an initial fetch — non-seeded parishes always render Empty, proving data isolation.
  setState('loading');
  setTimeout(() => setState(isSeededParish ? 'populated' : 'empty'), 900);
</script>

</body>
</html>
