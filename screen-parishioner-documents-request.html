<!DOCTYPE html>
<html lang="en">
<head>
<title>Parish Connect — Request a Document</title>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          'bg-warm': '#FAFBFD', 'card-bg': '#FFFFFF', 'section-bg': '#F5F7FB', divider: '#E8EDF5',
          ink: '#1F2937', 'ink-muted': '#6B7280',
          primary: { DEFAULT: '#4F7CF5', hover: '#3F6CE4', light: '#EEF4FF' },
          coral: '#FF7F73', gold: '#F6C453', green: '#6CBF84', lavender: '#A88BFF',
          error: { DEFAULT: '#E5645A', bg: '#FDECEA' },
        },
        fontFamily: { heading: ['Manrope', 'sans-serif'], body: ['Inter', 'sans-serif'] },
        borderRadius: { card: '24px', button: '16px', input: '16px', badge: '999px' },
        boxShadow: { card: '0 6px 24px rgba(30,41,59,0.08)' },
      },
    },
  };
</script>
<style>
  body { font-family: 'Inter', sans-serif; background-color: #FAFBFD; color: #1F2937; line-height: 1.5; }
  h1, h2, .font-heading { font-family: 'Manrope', sans-serif; }
  :focus-visible { outline: 2px solid #4F7CF5; outline-offset: 2px; }
  .transition-warm { transition: all 200ms ease; }
  .icon { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .option-card { border: 2px solid #E8EDF5; }
  .option-card.selected { border-color: #4F7CF5; background: #EEF4FF; }
</style>
</head>
<body class="text-ink">

  <div class="max-w-[420px] mx-auto min-h-screen bg-bg-warm pb-28 relative flex flex-col">

    <!-- ============ TOP BAR ============ -->
    <header class="px-5 pt-5 pb-3 flex items-center gap-3">
      <button onclick="goBack()" aria-label="Back" class="w-10 h-10 rounded-button flex items-center justify-center text-ink-muted hover:bg-section-bg transition-warm flex-shrink-0">
        <svg class="icon" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      </button>
      <div class="flex-1">
        <p class="font-heading font-bold text-base leading-tight">Request a Document</p>
        <p id="step-label" class="text-xs text-ink-muted mt-0.5">Step 1 of 6</p>
      </div>
    </header>

    <!-- ============ PROGRESS BAR ============ -->
    <div class="px-5 pb-4">
      <div class="h-1.5 bg-divider rounded-badge overflow-hidden">
        <div id="progress-fill" class="h-full bg-primary rounded-badge transition-all duration-300" style="width: 16.6%"></div>
      </div>
    </div>

    <!-- ============ STEP CONTENT ============ -->
    <main id="step-content" class="px-5 flex-1 space-y-4"></main>

    <!-- ============ FOOTER ACTIONS (thumb-reachable) ============ -->
    <div id="footer-actions" class="fixed bottom-0 left-0 right-0 bg-card-bg border-t border-divider max-w-[420px] mx-auto px-5 py-4 flex gap-3">
      <button id="continue-btn" onclick="handleContinue()" class="flex-1 bg-primary hover:bg-primary-hover text-white text-sm font-semibold py-3.5 rounded-button min-h-[48px] transition-warm disabled:opacity-40 disabled:cursor-not-allowed">Continue</button>
    </div>

  </div>

  <div id="toast" class="fixed bottom-24 left-1/2 -translate-x-1/2 bg-ink text-white text-sm px-4 py-2.5 rounded-button shadow-card opacity-0 pointer-events-none transition-opacity duration-200 max-w-[90%] text-center z-50"></div>

<script>
  // ---------------- Session ----------------
  const sessionParams = new URLSearchParams(window.location.search);
  const sessionName = sessionParams.get('name') || 'John Rodrigues';

  // ---------------- Reference data (from mock-data-schema.md / mock-seed.json) ----------------
  const documentTypes = [
    { id: "DOC-TYPE-BAPTISM-CERT", name: "Baptism Certificate", category: "Sacramental", adminCharge: 100, requiredSupportingDocs: ["Photo ID of requester"], deliveryOptions: ["In-app Download","Email","Collect at the Parish","Post / Courier"], time: "3-5 working days" },
    { id: "DOC-TYPE-COMMUNION-CERT", name: "First Communion Certificate", category: "Sacramental", adminCharge: 100, requiredSupportingDocs: ["Baptism Certificate"], deliveryOptions: ["In-app Download","Email","Collect at the Parish","Post / Courier"], time: "3-5 working days" },
    { id: "DOC-TYPE-CONFIRMATION-CERT", name: "Confirmation Certificate", category: "Sacramental", adminCharge: 100, requiredSupportingDocs: ["Baptism Certificate"], deliveryOptions: ["In-app Download","Email","Collect at the Parish","Post / Courier"], time: "3-5 working days" },
    { id: "DOC-TYPE-MARRIAGE-CERT", name: "Marriage Certificate", category: "Sacramental", adminCharge: 150, requiredSupportingDocs: ["Baptism Certificates of both spouses"], deliveryOptions: ["In-app Download","Email","Collect at the Parish","Post / Courier"], time: "5-7 working days" },
    { id: "DOC-TYPE-NOC", name: "No Objection / Good Standing Certificate", category: "Administrative", adminCharge: 50, requiredSupportingDocs: [], deliveryOptions: ["In-app Download","Email","Collect at the Parish"], time: "2-3 working days" },
    { id: "DOC-TYPE-TRANSFER", name: "Parish Transfer Certificate", category: "Administrative", adminCharge: 0, requiredSupportingDocs: [], deliveryOptions: ["In-app Download","Email","Collect at the Parish"], time: "5-7 working days" },
  ];

  const familyMembers = [
    { id: "MEM-2001", name: "John Rodrigues", relationship: "Head", email: "john.rodrigues@example.com", dateOfBirth: "14 Mar 1975", fatherName: "Michael Rodrigues", motherName: "Teresa Rodrigues", membershipStatus: "Active",
      sacraments: { Baptism: { date: "20 Apr 1975", church: "Infant Jesus Shrine, Viveknagar" }, Confirmation: { date: "15 May 1990", church: "Infant Jesus Shrine, Viveknagar" } } },
    { id: "MEM-2002", name: "Grace Rodrigues", relationship: "Spouse", email: "grace.rodrigues@example.com", dateOfBirth: "2 Jul 1978", fatherName: "Anthony Pinto", motherName: "Rose Pinto", membershipStatus: "Active",
      sacraments: { Baptism: { date: "10 Aug 1978", church: "St Patrick's Church" } } },
    { id: "MEM-2003", name: "Kevin Rodrigues", relationship: "Son", email: "kevin.rodrigues@example.com", dateOfBirth: "18 Jan 2003", fatherName: "John Rodrigues", motherName: "Grace Rodrigues", membershipStatus: "Active",
      sacraments: { Baptism: { date: "14 Feb 2003", church: "Infant Jesus Shrine, Viveknagar" }, "First Communion": { date: "10 Apr 2011", church: "Infant Jesus Shrine, Viveknagar" }, Confirmation: { date: "3 Sep 2017", church: "Infant Jesus Shrine, Viveknagar" } } },
    { id: "MEM-2004", name: "Clara Rodrigues", relationship: "Daughter", email: null, dateOfBirth: "25 Sep 2006", fatherName: "John Rodrigues", motherName: "Grace Rodrigues", membershipStatus: "Active",
      sacraments: { Baptism: { date: "15 Oct 2006", church: "Infant Jesus Shrine, Viveknagar" }, "First Communion": { date: "6 Apr 2014", church: "Infant Jesus Shrine, Viveknagar" } } },
  ];
  const familyAddress = "No. 27, 2nd Cross, Church Street, Viveknagar, Bengaluru, Karnataka 560047";
  const family = {
    familyRecordNumber: "IJS/FAM/1001",
    familyName: "Rodrigues Family",
    headOfFamily: "John Rodrigues",
    spouseName: "Grace Rodrigues",
    marriageDate: "24 Nov 2001",
    marriageChurch: "Infant Jesus Shrine, Viveknagar",
    address: familyAddress,
  };
  const defaultMember = familyMembers.find(m => m.name === sessionName) || familyMembers[0];

  // Per-document-type field requirements, distinguishing what's already known (auto-filled,
  // Capture Once principle) from what only the parishioner can provide, and what the parish
  // staff fills in later at certificate generation (Certificate Number / Issue Date).
  const FIELD_LABELS = {
    fullName: "Full Name", dateOfBirth: "Date of Birth", fatherName: "Father's Name", motherName: "Mother's Name",
    baptismDate: "Baptism Date", baptismParish: "Baptism Parish",
    communionDate: "First Communion Date", communionParish: "Parish",
    confirmationDate: "Confirmation Date", confirmationParish: "Parish",
    groomName: "Groom Name", brideName: "Bride Name", marriageDate: "Marriage Date", marriageParish: "Marriage Parish",
    familyRecordNumber: "Family Record Number", familyName: "Family Name", headOfFamily: "Head of Family",
    familyMembers: "Family Members", address: "Address", membershipStatus: "Membership Status",
  };
  const FIELD_SPECS = {
    "DOC-TYPE-BAPTISM-CERT": { autoFields: ["fullName","dateOfBirth","fatherName","motherName","baptismDate","baptismParish"], inputFields: [{ key: "godfather", label: "Godfather" }, { key: "godmother", label: "Godmother" }] },
    "DOC-TYPE-COMMUNION-CERT": { autoFields: ["fullName","dateOfBirth","communionDate","communionParish"], inputFields: [] },
    "DOC-TYPE-CONFIRMATION-CERT": { autoFields: ["fullName","dateOfBirth","confirmationDate","confirmationParish"], inputFields: [] },
    "DOC-TYPE-MARRIAGE-CERT": { autoFields: ["groomName","brideName","marriageDate","marriageParish"], inputFields: [{ key: "witness1", label: "Witness 1" }, { key: "witness2", label: "Witness 2" }, { key: "celebrant", label: "Celebrant (Priest)" }] },
    "DOC-TYPE-NOC": { autoFields: ["fullName","familyRecordNumber","address","membershipStatus"], inputFields: [{ key: "destination", label: "Destination (Parish / Institution / Organization)" }] },
    "DOC-TYPE-TRANSFER": { autoFields: ["familyRecordNumber","familyName","headOfFamily","familyMembers"], inputFields: [{ key: "destinationParish", label: "Destination Parish" }, { key: "transferDate", label: "Transfer Date", type: "date" }] },
  };

  function sacramentEntry(member, name) { return (member.sacraments || {})[name]; }
  function resolveAutoField(key, member) {
    switch (key) {
      case 'fullName': return member.name;
      case 'dateOfBirth': return member.dateOfBirth;
      case 'fatherName': return member.fatherName;
      case 'motherName': return member.motherName;
      case 'baptismDate': return sacramentEntry(member, 'Baptism')?.date || '';
      case 'baptismParish': return sacramentEntry(member, 'Baptism')?.church || '';
      case 'communionDate': return sacramentEntry(member, 'First Communion')?.date || '';
      case 'communionParish': return sacramentEntry(member, 'First Communion')?.church || '';
      case 'confirmationDate': return sacramentEntry(member, 'Confirmation')?.date || '';
      case 'confirmationParish': return sacramentEntry(member, 'Confirmation')?.church || '';
      case 'groomName': return family.headOfFamily;
      case 'brideName': return family.spouseName;
      case 'marriageDate': return family.marriageDate;
      case 'marriageParish': return family.marriageChurch;
      case 'familyRecordNumber': return family.familyRecordNumber;
      case 'familyName': return family.familyName;
      case 'headOfFamily': return family.headOfFamily;
      case 'familyMembers': return familyMembers.map(m => m.name).join(', ');
      case 'address': return family.address;
      case 'membershipStatus': return member.membershipStatus || 'Active';
      default: return '';
    }
  }

  const state = {
    documentTypeId: null,
    forMemberId: defaultMember.id,
    purpose: '',
    docFields: {}, // parishioner-provided input fields, keyed by FIELD_SPECS inputFields[].key
    uploadedFileName: null,
    deliveryMethod: null,
    emailAddress: '',
    mailingAddress: familyAddress,
    paymentMethod: null,
  };

  function selectedDocType() { return documentTypes.find(d => d.id === state.documentTypeId); }
  function selectedMember() { return familyMembers.find(m => m.id === state.forMemberId); }
  function needsUpload() { const d = selectedDocType(); return d && d.requiredSupportingDocs.length > 0; }
  function needsPayment() { const d = selectedDocType(); return d && d.adminCharge > 0; }

  // Steps are computed dynamically since the payment step is conditional.
  function getSteps() {
    const steps = ['docType', 'forWhom', 'purpose', 'details', 'delivery'];
    if (needsPayment()) steps.push('payment');
    steps.push('review');
    return steps;
  }

  let stepIndex = 0;

  function icon(paths, cls) { return `<svg class="${cls||'icon'}" viewBox="0 0 24 24">${paths}</svg>`; }
  const ICONS = {
    check: '<path d="M20 6 9 17l-5-5"/>',
    upload: '<path d="M12 3v12"/><path d="M7 8l5-5 5 5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>',
    download: '<path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>',
    mail: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',
    home: '<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/>',
    truck: '<rect x="1" y="7" width="14" height="10" rx="1"/><path d="M15 10h4l3 3v4h-7z"/><circle cx="6" cy="19" r="1.5"/><circle cx="18" cy="19" r="1.5"/>',
  };

  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.remove('opacity-0'); t.classList.add('opacity-100');
    clearTimeout(window._t);
    window._t = setTimeout(() => { t.classList.remove('opacity-100'); t.classList.add('opacity-0'); }, 1800);
  }

  function goBack() {
    if (stepIndex === 0) { window.location.href = 'screen-parishioner-dashboard-home.html?' + sessionParams.toString(); return; }
    stepIndex--;
    render();
  }

  function handleContinue() {
    const steps = getSteps();
    const step = steps[stepIndex];
    if (!validateStep(step)) return;
    if (step === 'review') { submitRequest(); return; }
    stepIndex++;
    render();
  }

  function validateStep(step) {
    if (step === 'docType' && !state.documentTypeId) { toast('Please choose a document type.'); return false; }
    if (step === 'forWhom' && !state.forMemberId) { toast('Please select who this is for.'); return false; }
    if (step === 'purpose' && !state.purpose.trim()) { toast('Please tell us the purpose of this request.'); return false; }
    if (step === 'details') {
      const spec = FIELD_SPECS[state.documentTypeId] || { inputFields: [] };
      for (const f of spec.inputFields) {
        if (!(state.docFields[f.key] || '').trim()) { toast(`Please provide ${f.label}.`); return false; }
      }
      if (needsUpload() && !state.uploadedFileName) { toast('Please attach the required document.'); return false; }
    }
    if (step === 'delivery' && !state.deliveryMethod) { toast('Please choose how you\'d like to receive it.'); return false; }
    if (step === 'delivery' && state.deliveryMethod && !validateDeliveryDetail()) { return false; }
    if (step === 'payment' && needsPayment() && !state.paymentMethod) { toast('Please choose a payment method.'); return false; }
    return true;
  }

  function selectDocType(id) {
    state.documentTypeId = id;
    // Reset dependent fields since required-doc/payment logic may change
    state.deliveryMethod = null;
    render();
  }

  // ---------------- Step renderers ----------------
  function renderDocType() {
    return `
      <p class="font-heading font-bold text-xl mb-1">What document do you need?</p>
      <p class="text-ink-muted text-sm mb-4">Choose the certificate or document you'd like to request.</p>
      <div class="space-y-3">
        ${documentTypes.map(d => `
          <button onclick="selectDocType('${d.id}')" class="option-card w-full rounded-card p-4 text-left transition-warm min-h-[44px] ${state.documentTypeId === d.id ? 'selected' : 'bg-card-bg'}">
            <div class="flex items-center justify-between">
              <p class="text-sm font-semibold">${d.name}</p>
              ${state.documentTypeId === d.id ? `<span class="text-primary">${icon(ICONS.check, 'w-5 h-5')}</span>` : ''}
            </div>
            <p class="text-xs text-ink-muted mt-1">${d.category} · ${d.adminCharge > 0 ? '₹' + d.adminCharge + ' admin charge' : 'No charge'} · ${d.time}</p>
          </button>
        `).join('')}
      </div>
    `;
  }

  function renderForWhom() {
    return `
      <p class="font-heading font-bold text-xl mb-1">Who is this for?</p>
      <p class="text-ink-muted text-sm mb-4">Pre-filled from your family record — pick a family member.</p>
      <div class="space-y-3">
        ${familyMembers.map(m => `
          <button onclick="state.forMemberId='${m.id}'; render()" class="option-card w-full rounded-card p-4 flex items-center gap-3 text-left transition-warm min-h-[44px] ${state.forMemberId === m.id ? 'selected' : 'bg-card-bg'}">
            <span class="w-10 h-10 rounded-badge bg-primary-light text-primary font-heading font-bold text-sm flex items-center justify-center flex-shrink-0">${m.name.split(' ').map(w=>w[0]).join('').slice(0,2)}</span>
            <span class="flex-1">
              <p class="text-sm font-semibold">${m.name}</p>
              <p class="text-xs text-ink-muted">${m.relationship}</p>
            </span>
            ${state.forMemberId === m.id ? `<span class="text-primary flex-shrink-0">${icon(ICONS.check, 'w-5 h-5')}</span>` : ''}
          </button>
        `).join('')}
      </div>
    `;
  }

  function renderPurpose() {
    return `
      <p class="font-heading font-bold text-xl mb-1">What's this for?</p>
      <p class="text-ink-muted text-sm mb-4">A short note helps the parish office process your request faster.</p>
      <div class="bg-card-bg rounded-card shadow-card p-5 space-y-2">
        <label for="purpose-input" class="text-sm font-medium">Purpose</label>
        <textarea id="purpose-input" rows="3" placeholder="e.g. School admission, marriage preparation, visa application…"
          class="w-full border border-divider rounded-input px-4 py-3 text-sm bg-bg-warm focus:ring-2 focus:ring-primary-light focus:outline-none resize-none"
          oninput="state.purpose = this.value">${state.purpose}</textarea>
      </div>
    `;
  }

  function renderDetails() {
    const d = selectedDocType();
    const member = selectedMember();
    const spec = FIELD_SPECS[d.id] || { autoFields: [], inputFields: [] };
    return `
      <p class="font-heading font-bold text-xl mb-1">Document Details</p>
      <p class="text-ink-muted text-sm mb-4">We've filled in what we already have on file — just confirm or add the rest.</p>

      ${spec.autoFields.length ? `
        <div class="bg-card-bg rounded-card shadow-card divide-y divide-divider overflow-hidden mb-4">
          ${spec.autoFields.map(key => `
            <div class="px-5 py-3.5 flex items-center justify-between gap-3">
              <span class="text-sm text-ink-muted">${FIELD_LABELS[key]}</span>
              <span class="text-sm font-semibold text-right">${resolveAutoField(key, member) || '<span class="text-ink-muted font-normal">Not on file</span>'}</span>
            </div>
          `).join('')}
        </div>
        <p class="text-xs text-ink-muted mb-4">From your family record — let the parish office know if anything here needs correcting.</p>
      ` : ''}

      ${spec.inputFields.length ? `
        <div class="bg-card-bg rounded-card shadow-card p-5 space-y-4 mb-4">
          ${spec.inputFields.map(f => `
            <div class="space-y-1.5">
              <label for="field-${f.key}" class="text-sm font-medium">${f.label}</label>
              <input id="field-${f.key}" type="${f.type || 'text'}" value="${state.docFields[f.key] || ''}"
                class="w-full border border-divider rounded-input px-4 h-12 text-sm bg-bg-warm focus:ring-2 focus:ring-primary-light focus:outline-none"
                oninput="state.docFields['${f.key}'] = this.value">
            </div>
          `).join('')}
        </div>
      ` : ''}

      ${needsUpload() ? `
        <p class="text-sm font-semibold mb-2">Supporting documents</p>
        <p class="text-xs text-ink-muted mb-3">${d.name} requires: ${d.requiredSupportingDocs.join(', ')}.</p>
        <div class="bg-card-bg rounded-card shadow-card p-6 text-center space-y-3">
          ${state.uploadedFileName
            ? `<p class="text-sm font-semibold text-green">${icon(ICONS.check, 'w-5 h-5 inline mb-1')}<br>${state.uploadedFileName}</p>
               <button onclick="simulateUpload()" class="text-primary text-xs font-semibold">Replace file</button>`
            : `<span class="w-12 h-12 rounded-badge bg-primary-light text-primary flex items-center justify-center mx-auto">${icon(ICONS.upload)}</span>
               <p class="text-sm text-ink-muted">Attach a clear photo or scan (PDF/JPG)</p>
               <button onclick="simulateUpload()" class="bg-primary hover:bg-primary-hover text-white text-sm font-semibold px-5 py-2.5 rounded-button min-h-[44px] transition-warm">Choose File</button>`
          }
        </div>
      ` : ''}
    `;
  }

  function simulateUpload() {
    state.uploadedFileName = 'supporting_document.pdf';
    render();
  }

  const DELIVERY_INFO = {
    'In-app Download': {
      icon: ICONS.download,
      note: "Get notified in the app and download instantly from My Documents. Fastest option, no extra charge.",
    },
    'Email': {
      icon: ICONS.mail,
      note: "We'll email a digital copy to your registered email address.",
    },
    'Collect at the Parish': {
      icon: ICONS.home,
      note: "Pick up a printed copy from the parish office during working hours.",
    },
    'Post / Courier': {
      icon: ICONS.truck,
      note: "We'll post a printed copy to your registered address. This may take a few extra days.",
    },
  };

  function renderDelivery() {
    const d = selectedDocType();
    return `
      <p class="font-heading font-bold text-xl mb-1">How would you like to receive it?</p>
      <p class="text-ink-muted text-sm mb-4">Choose a delivery method.</p>
      <div class="space-y-3">
        ${d.deliveryOptions.map(opt => {
          const info = DELIVERY_INFO[opt];
          const isSelected = state.deliveryMethod === opt;
          return `
          <div class="option-card w-full rounded-card transition-warm ${isSelected ? 'selected' : 'bg-card-bg'}">
            <button onclick="selectDelivery('${opt}')" class="w-full text-left p-4 min-h-[44px]">
              <div class="flex items-center gap-3">
                <span class="w-10 h-10 rounded-badge bg-primary-light text-primary flex items-center justify-center flex-shrink-0">${icon(info.icon)}</span>
                <span class="flex-1 text-sm font-semibold">${opt}</span>
                ${isSelected ? `<span class="text-primary flex-shrink-0">${icon(ICONS.check, 'w-5 h-5')}</span>` : ''}
              </div>
              <p class="text-xs text-ink-muted mt-2 leading-relaxed">${info.note}</p>
            </button>
            ${isSelected ? renderDeliveryDetail() : ''}
          </div>
        `}).join('')}
      </div>
    `;
  }

  function selectDelivery(opt) {
    state.deliveryMethod = opt;
    if (opt === 'Email' && !state.emailAddress) {
      const m = selectedMember();
      state.emailAddress = m.email || familyMembers.find(f => f.id === defaultMember.id).email || '';
    }
    render();
  }

  function renderDeliveryDetail() {
    if (state.deliveryMethod === 'Email') {
      return `
        <div class="border-t border-divider mx-4 mb-4 pt-4 space-y-2">
          <label for="email-input" class="text-sm font-medium">Email address</label>
          <input id="email-input" type="email" value="${state.emailAddress}" placeholder="you@example.com"
            class="w-full border border-divider rounded-input px-4 h-12 text-sm bg-bg-warm focus:ring-2 focus:ring-primary-light focus:outline-none"
            oninput="state.emailAddress = this.value">
          <p class="text-xs text-ink-muted">We'll send the certificate here — pre-filled from your family record, feel free to edit it.</p>
        </div>
      `;
    }
    if (state.deliveryMethod === 'Post / Courier') {
      return `
        <div class="border-t border-divider mx-4 mb-4 pt-4 space-y-2">
          <label for="address-input" class="text-sm font-medium">Mailing address</label>
          <textarea id="address-input" rows="3"
            class="w-full border border-divider rounded-input px-4 py-3 text-sm bg-bg-warm focus:ring-2 focus:ring-primary-light focus:outline-none resize-none"
            oninput="state.mailingAddress = this.value">${state.mailingAddress}</textarea>
          <p class="text-xs text-ink-muted">Pre-filled from your family record — feel free to edit it.</p>
        </div>
      `;
    }
    if (state.deliveryMethod === 'Collect at the Parish') {
      return `
        <div class="border-t border-divider mx-4 mb-4 pt-4 space-y-1.5">
          <p class="text-sm font-semibold">Infant Jesus Shrine, Viveknagar</p>
          <p class="text-xs text-ink-muted">Post Box 4712, Viveknagar, Bengaluru 560 047</p>
          <p class="text-xs text-ink-muted">Mon–Sat, 9:00 AM – 5:30 PM (Sat until 1:00 PM) · Closed Monday</p>
          <p class="text-xs text-ink-muted">Parish office: 25301206</p>
        </div>
      `;
    }
    return '';
  }

  function validateDeliveryDetail() {
    if (state.deliveryMethod === 'Email' && !state.emailAddress.trim()) { toast('Please provide an email address.'); return false; }
    if (state.deliveryMethod === 'Post / Courier' && !state.mailingAddress.trim()) { toast('Please provide a mailing address.'); return false; }
    return true;
  }


  function renderPayment() {
    const d = selectedDocType();
    const methods = ['UPI', 'Card', 'Pay at Parish Office'];
    return `
      <p class="font-heading font-bold text-xl mb-1">Admin charge</p>
      <div class="bg-card-bg rounded-card shadow-card p-5 mb-4 flex items-center justify-between">
        <p class="text-sm text-ink-muted">${d.name}</p>
        <p class="font-heading font-bold text-xl">₹${d.adminCharge}</p>
      </div>
      <p class="text-ink-muted text-sm mb-3">Choose a payment method.</p>
      <div class="space-y-3">
        ${methods.map(m => `
          <button onclick="state.paymentMethod='${m}'; render()" class="option-card w-full rounded-card p-4 flex items-center justify-between text-left transition-warm min-h-[44px] ${state.paymentMethod === m ? 'selected' : 'bg-card-bg'}">
            <span class="text-sm font-semibold">${m}</span>
            ${state.paymentMethod === m ? `<span class="text-primary">${icon(ICONS.check, 'w-5 h-5')}</span>` : ''}
          </button>
        `).join('')}
      </div>
    `;
  }

  function renderReview() {
    const d = selectedDocType();
    const member = familyMembers.find(m => m.id === state.forMemberId);
    const spec = FIELD_SPECS[d.id] || { inputFields: [] };
    return `
      <p class="font-heading font-bold text-xl mb-1">Review your request</p>
      <p class="text-ink-muted text-sm mb-4">Please confirm the details before submitting.</p>
      <div class="bg-card-bg rounded-card shadow-card divide-y divide-divider overflow-hidden">
        <div class="px-5 py-4 flex justify-between"><span class="text-sm text-ink-muted">Document</span><span class="text-sm font-semibold text-right">${d.name}</span></div>
        <div class="px-5 py-4 flex justify-between"><span class="text-sm text-ink-muted">For</span><span class="text-sm font-semibold">${member.name}</span></div>
        <div class="px-5 py-4 flex justify-between gap-4"><span class="text-sm text-ink-muted flex-shrink-0">Purpose</span><span class="text-sm font-semibold text-right">${state.purpose}</span></div>
        ${spec.inputFields.map(f => `<div class="px-5 py-4 flex justify-between gap-4"><span class="text-sm text-ink-muted flex-shrink-0">${f.label}</span><span class="text-sm font-semibold text-right">${state.docFields[f.key] || ''}</span></div>`).join('')}
        ${state.uploadedFileName ? `<div class="px-5 py-4 flex justify-between"><span class="text-sm text-ink-muted">Attached</span><span class="text-sm font-semibold">${state.uploadedFileName}</span></div>` : ''}
        <div class="px-5 py-4 flex justify-between"><span class="text-sm text-ink-muted">Delivery</span><span class="text-sm font-semibold">${state.deliveryMethod}</span></div>
        ${state.deliveryMethod === 'Email' ? `<div class="px-5 py-4 flex justify-between"><span class="text-sm text-ink-muted">Sending to</span><span class="text-sm font-semibold text-right">${state.emailAddress}</span></div>` : ''}
        ${state.deliveryMethod === 'Post / Courier' ? `<div class="px-5 py-4 flex justify-between gap-4"><span class="text-sm text-ink-muted flex-shrink-0">Mailing to</span><span class="text-sm font-semibold text-right">${state.mailingAddress}</span></div>` : ''}
        ${state.deliveryMethod === 'Collect at the Parish' ? `<div class="px-5 py-4 flex justify-between gap-4"><span class="text-sm text-ink-muted flex-shrink-0">Collect from</span><span class="text-sm font-semibold text-right">Parish office, Mon–Sat 9:00 AM–5:30 PM</span></div>` : ''}
        ${needsPayment() ? `<div class="px-5 py-4 flex justify-between"><span class="text-sm text-ink-muted">Payment</span><span class="text-sm font-semibold">₹${d.adminCharge} via ${state.paymentMethod}</span></div>` : ''}
        <div class="px-5 py-4 flex justify-between"><span class="text-sm text-ink-muted">Expected processing</span><span class="text-sm font-semibold">${d.time}</span></div>
      </div>
    `;
  }

  const RENDERERS = {
    docType: renderDocType, forWhom: renderForWhom, purpose: renderPurpose,
    details: renderDetails, delivery: renderDelivery, payment: renderPayment, review: renderReview,
  };
  const STEP_LABELS = {
    docType: 'Document', forWhom: 'For whom', purpose: 'Purpose',
    details: 'Details', delivery: 'Delivery', payment: 'Payment', review: 'Review',
  };

  function render() {
    const steps = getSteps();
    if (stepIndex >= steps.length) stepIndex = steps.length - 1;
    const step = steps[stepIndex];
    document.getElementById('step-content').innerHTML = RENDERERS[step]();
    document.getElementById('step-label').textContent = `Step ${stepIndex + 1} of ${steps.length} · ${STEP_LABELS[step]}`;
    document.getElementById('progress-fill').style.width = `${((stepIndex + 1) / steps.length) * 100}%`;
    document.getElementById('continue-btn').textContent = step === 'review' ? 'Submit Request' : 'Continue';
    if (step === 'purpose') {
      setTimeout(() => document.getElementById('purpose-input')?.focus(), 50);
    }
  }

  function submitRequest() {
    const btn = document.getElementById('continue-btn');
    btn.disabled = true;
    btn.textContent = 'Submitting…';
    setTimeout(() => {
      const ref = 'DOC-REQ-2026-' + Math.floor(1000 + Math.random() * 8999);
      document.getElementById('footer-actions').classList.add('hidden');
      document.getElementById('step-content').innerHTML = `
        <div class="pt-10 text-center space-y-4">
          <span class="w-16 h-16 rounded-badge bg-green/20 text-[#2f6b45] flex items-center justify-center mx-auto">${icon(ICONS.check, 'w-8 h-8')}</span>
          <p class="font-heading font-bold text-xl">Request submitted</p>
          <p class="text-sm text-ink-muted max-w-xs mx-auto">Your ${selectedDocType().name.toLowerCase()} request has been sent to the parish office. Reference: <span class="font-semibold text-ink">${ref}</span></p>
          <div class="pt-4 space-y-3">
            <button onclick="window.location.href='screen-parishioner-documents-myrequests.html?${sessionParams.toString()}'" class="w-full bg-primary hover:bg-primary-hover text-white text-sm font-semibold py-3.5 rounded-button min-h-[48px] transition-warm">View My Requests</button>
            <button onclick="window.location.href='screen-parishioner-dashboard-home.html?${sessionParams.toString()}'" class="w-full text-primary text-sm font-semibold py-2 min-h-[44px]">Back to Home</button>
          </div>
        </div>
      `;
      document.getElementById('step-label').textContent = 'Done';
      document.getElementById('progress-fill').style.width = '100%';
    }, 900);
  }

  render();
</script>

</body>
</html>
