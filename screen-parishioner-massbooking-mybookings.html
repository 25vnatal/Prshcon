<!DOCTYPE html>
<html lang="en">
<head>
<title>Parish Connect — My Mass Bookings</title>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          'bg-warm': '#FAFBFD', 'card-bg': '#FFFFFF', 'section-bg': '#F5F7FB', divider: '#E8EDF5',
          ink: '#1F2937', 'ink-muted': '#6B7280',
          primary: { DEFAULT: '#4F7CF5', hover: '#3F6CE4', light: '#EEF4FF' },
          coral: '#FF7F73', gold: '#F6C453', green: '#6CBF84', lavender: '#A88BFF',
          error: { DEFAULT: '#E5645A', bg: '#FDECEA' },
        },
        fontFamily: { heading: ['Manrope', 'sans-serif'], body: ['Inter', 'sans-serif'] },
        borderRadius: { card: '24px', button: '16px', input: '16px', badge: '999px' },
        boxShadow: { card: '0 6px 24px rgba(30,41,59,0.08)' },
      },
    },
  };
</script>
<style>
  body { font-family: 'Inter', sans-serif; background-color: #FAFBFD; color: #1F2937; line-height: 1.5; }
  h1, h2, .font-heading { font-family: 'Manrope', sans-serif; }
  :focus-visible { outline: 2px solid #4F7CF5; outline-offset: 2px; }
  .transition-warm { transition: all 200ms ease; }
  .icon { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .skeleton { background: linear-gradient(90deg, #E8EDF5 25%, #F2F5FA 37%, #E8EDF5 63%); background-size: 400% 100%; animation: shimmer 1.4s ease infinite; }
  @keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }
</style>
</head>
<body class="text-ink">

  <div class="max-w-[420px] mx-auto min-h-screen bg-bg-warm pb-10 relative">

    <!-- ============ TOP BAR ============ -->
    <header class="px-5 pt-5 pb-3 flex items-center gap-3">
      <button onclick="window.location.href='screen-parishioner-dashboard-home.html?' + sessionParams.toString()" aria-label="Back" class="w-10 h-10 rounded-button flex items-center justify-center text-ink-muted hover:bg-section-bg transition-warm flex-shrink-0">
        <svg class="icon" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      </button>
      <p class="font-heading font-bold text-lg">My Mass Bookings</p>
    </header>

    <!-- ============ FILTER TABS ============ -->
    <div class="px-5 pb-3 flex gap-2">
      <button onclick="setFilter('Upcoming')" data-filter="Upcoming" class="filter-tab px-4 py-2 rounded-badge text-xs font-semibold whitespace-nowrap transition-warm bg-primary text-white">Upcoming</button>
      <button onclick="setFilter('Past')" data-filter="Past" class="filter-tab px-4 py-2 rounded-badge text-xs font-semibold whitespace-nowrap transition-warm bg-card-bg text-ink-muted">Past</button>
    </div>

    <main id="main-content" class="px-5 space-y-3"></main>

    <div class="px-5 mt-6">
      <button onclick="window.location.href='screen-parishioner-massbooking-request.html?' + sessionParams.toString()" class="w-full bg-primary hover:bg-primary-hover text-white text-sm font-semibold py-3.5 rounded-button min-h-[48px] transition-warm">Book Another Mass</button>
    </div>

  </div>

<script>
  const sessionParams = new URLSearchParams(window.location.search);
  const TODAY = "2026-07-26";

  // ---------------- Mock data (matches screen-parish-masses-hub.html's seeded bookings for Rodrigues family) ----------------
  const bookings = [
    { id:"BOOK-7101", scheduleName:"Sunday 8:00 AM Mass", date:"2026-08-02", time:"8:00 AM",
      intentionType:"Thanksgiving", intentionFor:"Rodrigues Family", intentionMessage:"In thanksgiving for good health",
      offeringAmount:100, paymentStatus:"Paid", bookingReference:"MASS-BOOK-2026-0311" },
    { id:"BOOK-6098", scheduleName:"Sunday 8:00 AM Mass", date:"2026-06-14", time:"8:00 AM",
      intentionType:"Memorial", intentionFor:"Late Michael Rodrigues", intentionMessage:"5th death anniversary",
      offeringAmount:100, paymentStatus:"Paid", bookingReference:"MASS-BOOK-2026-0204" },
  ];

  const DAY_NAMES = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const MONTH_NAMES = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  function formatDateLabel(iso) {
    const d = new Date(iso + "T00:00:00");
    return `${DAY_NAMES[d.getDay()].slice(0,3)}, ${d.getDate()} ${MONTH_NAMES[d.getMonth()]} ${d.getFullYear()}`;
  }

  const ICON_PATHS = {
    check: '<path d="M20 6 9 17l-5-5"/>',
    clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  };
  function icon(name, cls) { return `<svg class="${cls||'icon'}" viewBox="0 0 24 24">${ICON_PATHS[name]}</svg>`; }

  let currentFilter = 'Upcoming';

  function setFilter(f) {
    currentFilter = f;
    document.querySelectorAll('.filter-tab').forEach(btn => {
      const active = btn.dataset.filter === f;
      btn.className = `filter-tab px-4 py-2 rounded-badge text-xs font-semibold whitespace-nowrap transition-warm ${active ? 'bg-primary text-white' : 'bg-card-bg text-ink-muted'}`;
    });
    renderList();
  }

  function renderList() {
    const filtered = bookings.filter(b => currentFilter === 'Upcoming' ? b.date >= TODAY : b.date < TODAY)
      .sort((a,b) => currentFilter === 'Upcoming' ? a.date.localeCompare(b.date) : b.date.localeCompare(a.date));
    const main = document.getElementById('main-content');

    if (filtered.length === 0) {
      main.innerHTML = `
        <div class="bg-card-bg rounded-card shadow-card p-8 text-center space-y-2 mt-2">
          <p class="text-sm font-semibold">No ${currentFilter.toLowerCase()} bookings</p>
          <p class="text-sm text-ink-muted">${currentFilter === 'Upcoming' ? "Book a Mass and it'll show up here." : "Past bookings will appear here."}</p>
        </div>
      `;
      return;
    }

    main.innerHTML = filtered.map(b => `
      <div class="bg-card-bg rounded-card shadow-card p-5">
        <div class="flex items-start justify-between gap-3">
          <div class="min-w-0">
            <p class="text-sm font-semibold">${formatDateLabel(b.date)} · ${b.time}</p>
            <p class="text-xs text-ink-muted mt-0.5">${b.scheduleName}</p>
          </div>
          <span class="${b.paymentStatus==='Paid' ? 'bg-green/20 text-[#2f6b45]' : 'bg-gold/20 text-[#8a5a10]'} text-xs font-semibold px-2.5 py-1 rounded-badge whitespace-nowrap flex-shrink-0 inline-flex items-center gap-1">${icon(b.paymentStatus==='Paid'?'check':'clock','w-3 h-3')}${b.paymentStatus}</span>
        </div>
        <div class="mt-3 pt-3 border-t border-divider">
          <p class="text-sm font-semibold">${b.intentionType} — ${b.intentionFor}</p>
          ${b.intentionMessage ? `<p class="text-xs text-ink-muted mt-1">${b.intentionMessage}</p>` : ''}
          <p class="text-xs text-ink-muted mt-2">₹${b.offeringAmount} · ${b.bookingReference}</p>
        </div>
      </div>
    `).join('');
  }

  function renderLoading() {
    document.getElementById('main-content').innerHTML = `
      <div class="skeleton rounded-card" style="height:110px"></div>
      <div class="skeleton rounded-card" style="height:110px"></div>
    `;
  }

  renderLoading();
  setTimeout(renderList, 600);
</script>

</body>
</html>
