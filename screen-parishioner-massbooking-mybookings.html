<!DOCTYPE html>
<html lang="en">
<head>
<title>Parish Connect — My Mass Bookings</title>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          'bg-warm': '#FAFBFD', 'card-bg': '#FFFFFF', 'section-bg': '#F5F7FB', divider: '#E8EDF5',
          ink: '#1F2937', 'ink-muted': '#6B7280',
          primary: { DEFAULT: '#4F7CF5', hover: '#3F6CE4', light: '#EEF4FF' },
          coral: '#FF7F73', gold: '#F6C453', green: '#6CBF84', lavender: '#A88BFF',
          error: { DEFAULT: '#E5645A', bg: '#FDECEA' },
        },
        fontFamily: { heading: ['Manrope', 'sans-serif'], body: ['Inter', 'sans-serif'] },
        borderRadius: { card: '24px', button: '16px', input: '16px', badge: '999px' },
        boxShadow: { card: '0 6px 24px rgba(30,41,59,0.08)' },
      },
    },
  };
</script>
<style>
  body { font-family: 'Inter', sans-serif; background-color: #FAFBFD; color: #1F2937; line-height: 1.5; }
  h1, h2, .font-heading { font-family: 'Manrope', sans-serif; }
  :focus-visible { outline: 2px solid #4F7CF5; outline-offset: 2px; }
  .transition-warm { transition: all 200ms ease; }
  .icon { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .skeleton { background: linear-gradient(90deg, #E8EDF5 25%, #F2F5FA 37%, #E8EDF5 63%); background-size: 400% 100%; animation: shimmer 1.4s ease infinite; }
  @keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }
</style>
</head>
<body class="text-ink">

  <div class="max-w-[420px] mx-auto min-h-screen bg-bg-warm pb-28 relative">

    <!-- ============ TOP BAR ============ -->
    <header class="px-5 pt-5 pb-3 flex items-center gap-3">
      <button onclick="window.location.href='screen-parishioner-dashboard-home.html?' + sessionParams.toString()" aria-label="Back" class="w-10 h-10 rounded-button flex items-center justify-center text-ink-muted hover:bg-section-bg transition-warm flex-shrink-0">
        <svg class="icon" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      </button>
      <p class="font-heading font-bold text-lg">My Mass Bookings</p>
    </header>

    <!-- ============ FILTER TABS ============ -->
    <div class="px-5 pb-3 flex gap-2">
      <button onclick="setFilter('Upcoming')" data-filter="Upcoming" class="filter-tab px-4 py-2 rounded-badge text-xs font-semibold whitespace-nowrap transition-warm bg-primary text-white">Upcoming</button>
      <button onclick="setFilter('Past')" data-filter="Past" class="filter-tab px-4 py-2 rounded-badge text-xs font-semibold whitespace-nowrap transition-warm bg-card-bg text-ink-muted">Past</button>
    </div>

    <main id="main-content" class="px-5 space-y-3"></main>

    <div class="px-5 mt-6">
      <button onclick="window.location.href='screen-parishioner-massbooking-request.html?' + sessionParams.toString()" class="w-full bg-primary hover:bg-primary-hover text-white text-sm font-semibold py-3.5 rounded-button min-h-[48px] transition-warm">Book Another Mass</button>
    </div>

  </div>

  <!-- ============ BOTTOM NAV (5 items) ============ -->
  <nav class="fixed bottom-0 left-0 right-0 bg-card-bg border-t border-divider max-w-[420px] mx-auto">
    <div class="grid grid-cols-5">
      <button onclick="window.location.href='screen-parishioner-dashboard-home.html?' + sessionParams.toString()" class="flex flex-col items-center gap-1 py-3 text-ink-muted">
        <svg class="icon" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/></svg>
        <span class="text-[10.5px]">Home</span>
      </button>
      <button class="flex flex-col items-center gap-1 py-3 text-primary">
        <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="4" width="7" height="7" rx="1.5"/><rect x="14" y="4" width="7" height="7" rx="1.5"/><rect x="3" y="15" width="7" height="7" rx="1.5"/><rect x="14" y="15" width="7" height="7" rx="1.5"/></svg>
        <span class="text-[10.5px] font-semibold">Services</span>
      </button>
      <button onclick="window.location.href='screen-parishioner-dashboard-home.html?' + sessionParams.toString()" class="flex flex-col items-center gap-1 py-3 text-ink-muted">
        <svg class="icon" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-10-9.3C.4 8.4 2.3 5 5.7 5 8 5 10 6.3 12 9c2-2.7 4-4 6.3-4 3.4 0 5.3 3.4 3.7 6.7C19.5 16.4 12 21 12 21Z"/></svg>
        <span class="text-[10.5px]">Give</span>
      </button>
      <button onclick="window.location.href='screen-parishioner-family.html?' + sessionParams.toString()" class="flex flex-col items-center gap-1 py-3 text-ink-muted">
        <svg class="icon" viewBox="0 0 24 24"><circle cx="9" cy="7" r="3.5"/><path d="M2 21v-1a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v1"/><circle cx="18" cy="8" r="2.5"/></svg>
        <span class="text-[10.5px]">My Family</span>
      </button>
      <button onclick="window.location.href='screen-parishioner-dashboard-home.html?' + sessionParams.toString()" class="flex flex-col items-center gap-1 py-3 text-ink-muted">
        <svg class="icon" viewBox="0 0 24 24"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
        <span class="text-[10.5px]">Menu</span>
      </button>
    </div>
  </nav>

  <div id="toast" class="fixed bottom-24 left-1/2 -translate-x-1/2 bg-ink text-white text-sm px-4 py-2.5 rounded-button shadow-card opacity-0 pointer-events-none transition-opacity duration-200 max-w-[90%] text-center z-50"></div>

<script>
  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.remove('opacity-0'); t.classList.add('opacity-100');
    clearTimeout(window._t);
    window._t = setTimeout(() => { t.classList.remove('opacity-100'); t.classList.add('opacity-0'); }, 1800);
  }

  const sessionParams = new URLSearchParams(window.location.search);
  const TODAY = "2026-07-26";

  const ICON_PATHS = {
    check: '<path d="M20 6 9 17l-5-5"/>',
    clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    chevronDown: '<polyline points="6 9 12 15 18 9"/>',
  };
  function icon(name, cls) { return `<svg class="${cls||'icon'}" viewBox="0 0 24 24">${ICON_PATHS[name]}</svg>`; }

  const DAY_NAMES = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const MONTH_NAMES = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  function formatDateLabel(iso) {
    const d = new Date(iso + "T00:00:00");
    return `${DAY_NAMES[d.getDay()].slice(0,3)}, ${d.getDate()} ${MONTH_NAMES[d.getMonth()]} ${d.getFullYear()}`;
  }

  // ---------------- Mock data: bookings, each with one or more intentions (matches the corrected model) ----------------
  const bookings = [
    {
      id: "BOOK-0311", bookingNumber: "MASS-BOOK-2026-0311", source: "ONLINE", bookingStatus: "Confirmed", paymentStatus: "Paid",
      paymentMethod: "UPI", createdAt: "24 Jul 2026", receiptNumber: "IJS/RCPT/2026/0311",
      intentions: [
        { massName: "Sunday 8:00 AM Mass", date: "2026-08-02", time: "8:00 AM", intentionType: "Thanksgiving", intentionDescription: "In thanksgiving for good health", offeredBy: "John Rodrigues", stipend: 100 },
      ],
    },
    {
      id: "BOOK-0329", bookingNumber: "MASS-BOOK-2026-0329", source: "ONLINE", bookingStatus: "Pending Payment", paymentStatus: "Pending",
      paymentMethod: null, createdAt: "25 Jul 2026", receiptNumber: null,
      intentions: [
        { massName: "Sunday 8:00 AM Mass", date: "2026-08-16", time: "8:00 AM", intentionType: "Birthday", intentionDescription: "23rd birthday blessing", offeredBy: "Kevin Rodrigues", stipend: 100 },
      ],
    },
    {
      id: "BOOK-0345", bookingNumber: "MASS-BOOK-2026-0345", source: "ONLINE", bookingStatus: "Confirmed", paymentStatus: "Paid",
      paymentMethod: "Card", createdAt: "26 Jul 2026", receiptNumber: "IJS/RCPT/2026/0345",
      intentions: [
        { massName: "Sunday 6:30 AM Mass", date: "2026-08-23", time: "6:30 AM", intentionType: "Anniversary", intentionDescription: "Wedding anniversary blessing", offeredBy: "John Rodrigues", stipend: 100 },
        { massName: "Saturday Vigil Mass", date: "2026-08-29", time: "6:00 PM", intentionType: "For the Sick", intentionDescription: "Recovery for a family friend", offeredBy: "Grace Rodrigues", stipend: 100 },
      ],
    },
    {
      id: "BOOK-0204", bookingNumber: "MASS-BOOK-2026-0204", source: "PARISH_OFFICE", bookingStatus: "Confirmed", paymentStatus: "Paid",
      paymentMethod: "Cash", createdAt: "12 Jun 2026", receiptNumber: "IJS/RCPT/2026/0204",
      intentions: [
        { massName: "Sunday 8:00 AM Mass", date: "2026-06-14", time: "8:00 AM", intentionType: "In Memory Of", intentionDescription: "5th death anniversary — Michael Rodrigues", offeredBy: "John Rodrigues", stipend: 100 },
      ],
    },
  ];

  // A booking is "Upcoming" if any of its intentions fall on/after today; "Past" only if all are before today.
  function isUpcoming(b) { return b.intentions.some(it => it.date >= TODAY); }

  let currentFilter = 'Upcoming';
  let expandedId = null;

  function setFilter(f) {
    currentFilter = f;
    document.querySelectorAll('.filter-tab').forEach(btn => {
      const active = btn.dataset.filter === f;
      btn.className = `filter-tab px-4 py-2 rounded-badge text-xs font-semibold whitespace-nowrap transition-warm ${active ? 'bg-primary text-white' : 'bg-card-bg text-ink-muted'}`;
    });
    renderList();
  }

  function toggleExpand(id) {
    expandedId = expandedId === id ? null : id;
    renderList();
  }

  function totalFor(b) { return b.intentions.reduce((s, it) => s + it.stipend, 0); }

  function renderList() {
    const filtered = bookings
      .filter(b => currentFilter === 'Upcoming' ? isUpcoming(b) : !isUpcoming(b))
      .sort((a, b) => currentFilter === 'Upcoming' ? a.createdAt.localeCompare(b.createdAt) : b.createdAt.localeCompare(a.createdAt));
    const main = document.getElementById('main-content');

    if (filtered.length === 0) {
      main.innerHTML = `
        <div class="bg-card-bg rounded-card shadow-card p-8 text-center space-y-2 mt-2">
          <p class="text-sm font-semibold">No ${currentFilter.toLowerCase()} bookings</p>
          <p class="text-sm text-ink-muted">${currentFilter === 'Upcoming' ? "Book a Mass and it'll show up here." : "Past bookings will appear here."}</p>
        </div>
      `;
      return;
    }

    main.innerHTML = filtered.map(b => {
      const isOpen = expandedId === b.id;
      const paid = b.paymentStatus === 'Paid';
      return `
        <div class="bg-card-bg rounded-card shadow-card overflow-hidden">
          <button onclick="toggleExpand('${b.id}')" class="w-full text-left p-5 flex items-start justify-between gap-3 min-h-[44px] transition-warm hover:bg-section-bg">
            <div class="min-w-0">
              <p class="text-sm font-semibold">${b.bookingNumber}</p>
              <p class="text-xs text-ink-muted mt-1">${b.intentions.length} intention${b.intentions.length>1?'s':''} · ₹${totalFor(b)}</p>
              <p class="text-xs text-ink-muted mt-0.5">Booked ${b.createdAt}</p>
            </div>
            <div class="flex flex-col items-end gap-2 flex-shrink-0">
              <span class="${paid ? 'bg-green/20 text-[#2f6b45]' : 'bg-gold/20 text-[#8a5a10]'} text-xs font-semibold px-2.5 py-1 rounded-badge whitespace-nowrap inline-flex items-center gap-1">${icon(paid?'check':'clock','w-3 h-3')}${b.paymentStatus}</span>
              <span class="text-ink-muted transition-warm" style="transform: rotate(${isOpen ? '180' : '0'}deg)">${icon('chevronDown', 'w-4 h-4')}</span>
            </div>
          </button>
          ${isOpen ? `
            <div class="border-t border-divider px-5 py-4 space-y-3">
              ${b.intentions.map(it => `
                <div class="bg-section-bg rounded-card p-3">
                  <p class="text-sm font-semibold">${it.massName}</p>
                  <p class="text-xs text-ink-muted mt-0.5">${formatDateLabel(it.date)} · ${it.time}</p>
                  <p class="text-xs mt-1.5"><span class="font-semibold">${it.intentionType}</span> — ${it.intentionDescription}</p>
                  <p class="text-xs text-ink-muted mt-0.5">Offered by ${it.offeredBy} · ₹${it.stipend}</p>
                </div>
              `).join('')}
              <div class="flex items-center justify-between text-xs text-ink-muted pt-1">
                <span>Source: ${b.source === 'ONLINE' ? 'Booked online' : 'Booked at parish office'}</span>
                ${b.receiptNumber ? `<button onclick="toast('Downloading receipt ${b.receiptNumber}')" class="text-primary font-semibold">View Receipt</button>` : ''}
              </div>
              ${b.bookingStatus === 'Pending Payment' ? `<button onclick="payNow('${b.id}')" class="w-full bg-primary hover:bg-primary-hover text-white text-xs font-semibold py-2.5 rounded-button min-h-[36px] transition-warm">Pay Now — ₹${totalFor(b)}</button>` : ''}
            </div>
          ` : ''}
        </div>
      `;
    }).join('');
  }

  function payNow(id) {
    const b = bookings.find(x => x.id === id);
    if (b) {
      b.paymentStatus = 'Paid';
      b.bookingStatus = 'Confirmed';
      b.paymentMethod = 'UPI';
      b.receiptNumber = 'IJS/RCPT/2026/' + Math.floor(300 + Math.random()*90);
    }
    toast('Payment recorded — thank you!');
    renderList();
  }

  function renderLoading() {
    document.getElementById('main-content').innerHTML = `
      <div class="skeleton rounded-card" style="height:110px"></div>
      <div class="skeleton rounded-card" style="height:110px"></div>
    `;
  }

  renderLoading();
  setTimeout(renderList, 600);
</script>

</body>
</html>
