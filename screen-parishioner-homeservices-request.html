<!DOCTYPE html>
<html lang="en">
<head>
<title>Parish Connect — Request a Home Service</title>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          'bg-warm': '#FAFBFD', 'card-bg': '#FFFFFF', 'section-bg': '#F5F7FB', divider: '#E8EDF5',
          ink: '#1F2937', 'ink-muted': '#6B7280',
          primary: { DEFAULT: '#4F7CF5', hover: '#3F6CE4', light: '#EEF4FF' },
          coral: '#FF7F73', gold: '#F6C453', green: '#6CBF84', lavender: '#A88BFF',
          error: { DEFAULT: '#E5645A', bg: '#FDECEA' },
        },
        fontFamily: { heading: ['Manrope', 'sans-serif'], body: ['Inter', 'sans-serif'] },
        borderRadius: { card: '24px', button: '16px', input: '16px', badge: '999px' },
        boxShadow: { card: '0 6px 24px rgba(30,41,59,0.08)' },
      },
    },
  };
</script>
<style>
  body { font-family: 'Inter', sans-serif; background-color: #FAFBFD; color: #1F2937; line-height: 1.5; }
  h1, h2, .font-heading { font-family: 'Manrope', sans-serif; }
  :focus-visible { outline: 2px solid #4F7CF5; outline-offset: 2px; }
  .transition-warm { transition: all 200ms ease; }
  .icon { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .option-card { border: 2px solid #E8EDF5; }
  .option-card.selected { border-color: #4F7CF5; background: #EEF4FF; }
</style>
</head>
<body class="text-ink">

  <div class="max-w-[420px] mx-auto min-h-[100dvh] bg-bg-warm relative flex flex-col">

    <header class="px-5 pt-5 pb-3 flex items-center gap-3">
      <button onclick="goBack()" aria-label="Back" class="w-10 h-10 rounded-button flex items-center justify-center text-ink-muted hover:bg-section-bg transition-warm flex-shrink-0">
        <svg class="icon" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      </button>
      <div class="flex-1">
        <p class="font-heading font-bold text-base leading-tight">Request a Home Service</p>
        <p id="step-label" class="text-xs text-ink-muted mt-0.5">Step 1 of 3</p>
      </div>
    </header>

    <div class="px-5 pb-4">
      <div class="h-1.5 bg-divider rounded-badge overflow-hidden">
        <div id="progress-fill" class="h-full bg-primary rounded-badge transition-all duration-300" style="width: 33%"></div>
      </div>
    </div>

    <main id="step-content" class="px-5 flex-1 space-y-4 pb-4"></main>

    <div class="sticky bottom-0 bg-card-bg border-t border-divider px-5 py-4 flex gap-3">
      <button id="continue-btn" onclick="handleContinue()" class="flex-1 bg-primary hover:bg-primary-hover text-white text-sm font-semibold py-3.5 rounded-button min-h-[48px] transition-warm">Continue</button>
    </div>

  </div>

  <div id="toast" class="fixed bottom-24 left-1/2 -translate-x-1/2 bg-ink text-white text-sm px-4 py-2.5 rounded-button shadow-card opacity-0 pointer-events-none transition-opacity duration-200 max-w-[90%] text-center z-50"></div>

<script>
  const sessionParams = new URLSearchParams(window.location.search);

  // ---------------- Reference data: Home Services offered by this parish (mirrors Parish Services config, Active only) ----------------
  const HOME_SERVICES = [
    { id:"HS-001", name:"Home Communion", availability:"Weekdays, 10 AM – 4 PM", emergencyAllowed:false, instructions:"For homebound or ill parishioners unable to attend Mass." },
    { id:"HS-002", name:"House Blessing", availability:"Saturdays, by appointment", emergencyAllowed:false, instructions:"Typically for new homes or after renovation." },
    { id:"HS-003", name:"Sick Visit / Anointing", availability:"Any day, priority response", emergencyAllowed:true, instructions:"Emergency requests are prioritised and may be same-day." },
    { id:"HS-004", name:"Funeral Visit / Prayer", availability:"Any day", emergencyAllowed:true, instructions:"Contact the parish office as soon as possible after a death in the family." },
    { id:"HS-006", name:"Family Prayer / Rosary", availability:"Evenings, by appointment", emergencyAllowed:false, instructions:"" },
    { id:"HS-007", name:"Blessing of Vehicle / Business / Office", availability:"Weekdays, by appointment", emergencyAllowed:false, instructions:"" },
    { id:"HS-008", name:"Other Pastoral Visit", availability:"By appointment", emergencyAllowed:false, instructions:"For requests that don't fit another category." },
  ];

  const WIZARD_STEPS = ['service', 'details', 'review'];
  const STEP_LABELS = { service: 'Service', details: 'Details', review: 'Review' };
  let stepIndex = 0;

  const state = {
    serviceId: null,
    isEmergency: false,
    preferredDate: '',
    preferredTime: '',
    description: '',
  };

  function icon(paths, cls) { return `<svg class="${cls||'icon'}" viewBox="0 0 24 24">${paths}</svg>`; }
  const ICONS = { check: '<path d="M20 6 9 17l-5-5"/>' };

  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.remove('opacity-0'); t.classList.add('opacity-100');
    clearTimeout(window._t);
    window._t = setTimeout(() => { t.classList.remove('opacity-100'); t.classList.add('opacity-0'); }, 1800);
  }

  function serviceById(id) { return HOME_SERVICES.find(s => s.id === id); }

  function goBack() {
    if (stepIndex === 0) { window.location.href = 'screen-parishioner-services-hub.html?' + sessionParams.toString(); return; }
    stepIndex--;
    render();
  }

  function handleContinue() {
    const step = WIZARD_STEPS[stepIndex];
    if (!validateStep(step)) return;
    if (step === 'review') { submitRequest(); return; }
    stepIndex++;
    render();
  }

  function validateStep(step) {
    if (step === 'service' && !state.serviceId) { toast('Please choose a service.'); return false; }
    if (step === 'details') {
      if (!state.isEmergency && !state.preferredDate) { toast('Please choose a preferred date.'); return false; }
      if (!state.description.trim()) { toast('Please briefly describe your request.'); return false; }
    }
    return true;
  }

  function selectService(id) {
    state.serviceId = id;
    stepIndex = WIZARD_STEPS.indexOf('details');
    render();
  }

  function renderServiceStep() {
    return `
      <p class="font-heading font-bold text-xl mb-1">Which service?</p>
      <p class="text-ink-muted text-sm mb-4">Choose the home service you'd like to request.</p>
      <div class="space-y-2.5">
        ${HOME_SERVICES.map(s => `
          <button onclick="selectService('${s.id}')" class="option-card w-full rounded-card p-4 text-left transition-warm min-h-[44px] ${state.serviceId===s.id ? 'selected' : 'bg-card-bg'}">
            <div class="flex items-center justify-between gap-3">
              <div>
                <p class="text-sm font-semibold">${s.name}${s.emergencyAllowed ? ' <span class=\"text-error text-xs font-normal\">· emergency OK</span>' : ''}</p>
                <p class="text-xs text-ink-muted mt-0.5">${s.availability}</p>
              </div>
              ${state.serviceId===s.id ? `<span class="text-primary flex-shrink-0">${icon(ICONS.check,'w-5 h-5')}</span>` : ''}
            </div>
          </button>
        `).join('')}
      </div>
    `;
  }

  function renderDetailsStep() {
    const s = serviceById(state.serviceId);
    return `
      <p class="font-heading font-bold text-xl mb-1">${s.name}</p>
      <p class="text-ink-muted text-sm mb-4">${s.instructions || 'Tell us a bit more about your request.'}</p>
      <div class="bg-card-bg rounded-card shadow-card p-5 space-y-4">
        ${s.emergencyAllowed ? `
          <label class="flex items-center gap-2.5 bg-error-bg rounded-card p-3.5 cursor-pointer">
            <input type="checkbox" ${state.isEmergency ? 'checked' : ''} onchange="state.isEmergency=this.checked; render()" class="w-4 h-4">
            <span class="text-sm font-semibold text-error">This is an emergency — please prioritise</span>
          </label>
        ` : ''}
        ${!state.isEmergency ? `
          <div class="grid grid-cols-2 gap-3">
            <div class="space-y-1.5"><label class="text-sm font-medium">Preferred date</label><input id="in-date" type="date" value="${state.preferredDate}" oninput="state.preferredDate=this.value" class="w-full border border-divider rounded-input px-3 h-11 text-sm bg-bg-warm focus:ring-2 focus:ring-primary-light focus:outline-none"></div>
            <div class="space-y-1.5"><label class="text-sm font-medium">Preferred time</label><input id="in-time" type="time" value="${state.preferredTime}" oninput="state.preferredTime=this.value" class="w-full border border-divider rounded-input px-3 h-11 text-sm bg-bg-warm focus:ring-2 focus:ring-primary-light focus:outline-none"></div>
          </div>
        ` : `<p class="text-xs text-ink-muted">Emergency requests are handled as soon as possible — no need to pick a date.</p>`}
        <div class="space-y-1.5">
          <label class="text-sm font-medium">Tell us more</label>
          <textarea id="in-desc" rows="3" placeholder="e.g. Address, occasion, or any details the priest should know" oninput="state.description=this.value" class="w-full border border-divider rounded-input px-4 py-3 text-sm bg-bg-warm focus:ring-2 focus:ring-primary-light focus:outline-none resize-none">${state.description}</textarea>
        </div>
      </div>
    `;
  }

  function renderReviewStep() {
    const s = serviceById(state.serviceId);
    return `
      <p class="font-heading font-bold text-xl mb-1">Review your request</p>
      <p class="text-ink-muted text-sm mb-4">Confirm the details below before submitting.</p>
      <div class="bg-card-bg rounded-card shadow-card p-5 space-y-3">
        <div class="flex items-center justify-between"><span class="text-xs text-ink-muted">Service</span><span class="text-sm font-semibold">${s.name}</span></div>
        ${state.isEmergency
          ? `<div class="flex items-center justify-between"><span class="text-xs text-ink-muted">Priority</span><span class="text-sm font-semibold text-error">Emergency</span></div>`
          : `<div class="flex items-center justify-between"><span class="text-xs text-ink-muted">Preferred</span><span class="text-sm font-semibold">${state.preferredDate || '—'} ${state.preferredTime || ''}</span></div>`
        }
        <div><span class="text-xs text-ink-muted">Details</span><p class="text-sm mt-1">${state.description}</p></div>
      </div>
      <p class="text-xs text-ink-muted mt-4">This request will be sent to the parish office for review. There's no charge for home services.</p>
    `;
  }

  const RENDERERS = { service: renderServiceStep, details: renderDetailsStep, review: renderReviewStep };

  function render() {
    const step = WIZARD_STEPS[stepIndex];
    document.getElementById('step-content').innerHTML = RENDERERS[step]();
    document.getElementById('step-label').textContent = `Step ${stepIndex + 1} of ${WIZARD_STEPS.length} · ${STEP_LABELS[step]}`;
    document.getElementById('progress-fill').style.width = `${((stepIndex + 1) / WIZARD_STEPS.length) * 100}%`;
    document.getElementById('continue-btn').textContent = step === 'review' ? 'Submit Request' : 'Continue';
  }

  function submitRequest() {
    const btn = document.getElementById('continue-btn');
    btn.disabled = true; btn.textContent = 'Submitting…';
    setTimeout(() => {
      const s = serviceById(state.serviceId);
      const ref = 'HS-REQ-2026-' + Math.floor(1000 + Math.random() * 8999);
      document.getElementById('step-content').innerHTML = `
        <div class="pt-6 text-center space-y-4">
          <span class="w-16 h-16 rounded-badge bg-green/20 text-[#2f6b45] flex items-center justify-center mx-auto">${icon(ICONS.check, 'w-8 h-8')}</span>
          <p class="font-heading font-bold text-xl">Request submitted</p>
          <p class="text-sm text-ink-muted max-w-xs mx-auto">${ref} · ${s.name}${state.isEmergency ? ' · Marked as emergency' : ''}</p>
          <p class="text-xs text-ink-muted max-w-xs mx-auto">The parish office will confirm your appointment shortly.</p>
          <div class="pt-4 space-y-3">
            <button onclick="window.location.href='screen-parishioner-homeservices-myrequests.html?${sessionParams.toString()}'" class="w-full bg-primary hover:bg-primary-hover text-white text-sm font-semibold py-3.5 rounded-button min-h-[48px] transition-warm">View My Requests</button>
            <button onclick="window.location.href='screen-parishioner-services-hub.html?${sessionParams.toString()}'" class="w-full text-primary text-sm font-semibold py-2 min-h-[44px]">Back to Services</button>
          </div>
        </div>
      `;
      document.querySelector('.sticky').classList.add('hidden');
      document.getElementById('step-label').textContent = 'Done';
      document.getElementById('progress-fill').style.width = '100%';
    }, 900);
  }

  render();
</script>

</body>
</html>
