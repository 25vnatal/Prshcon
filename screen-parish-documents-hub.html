<!DOCTYPE html>
<html lang="en">
<head>
<title>Parish Connect — Documents</title>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700&family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;600;700&family=Libre+Baskerville:wght@400;700&family=Pinyon+Script&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          'bg-warm': '#FAFBFD', 'card-bg': '#FFFFFF', 'section-bg': '#F5F7FB', divider: '#E8EDF5',
          ink: '#1F2937', 'ink-muted': '#6B7280',
          primary: { DEFAULT: '#4F7CF5', hover: '#3F6CE4', light: '#EEF4FF' },
          coral: '#FF7F73', gold: '#F6C453', green: '#6CBF84', lavender: '#A88BFF',
          error: { DEFAULT: '#E5645A', bg: '#FDECEA' },
        },
        fontFamily: { heading: ['Manrope', 'sans-serif'], body: ['Inter', 'sans-serif'] },
        borderRadius: { card: '24px', button: '16px', input: '16px', badge: '999px' },
        boxShadow: { card: '0 6px 24px rgba(30,41,59,0.08)', 'card-hover': '0 12px 36px rgba(30,41,59,0.12)' },
        maxWidth: { content: '1440px' },
      },
    },
  };
</script>
<style>
  body { font-family: 'Inter', sans-serif; background-color: #FAFBFD; color: #1F2937; line-height: 1.5; }
  h1, h2, h3, .font-heading { font-family: 'Manrope', sans-serif; }
  :focus-visible { outline: 2px solid #4F7CF5; outline-offset: 2px; }
  .transition-warm { transition: all 200ms ease; }
  .icon { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .cert-paper { font-family: 'Georgia', 'Times New Roman', serif; }
  .cert-frame {
    background: #FFFEFB;
    border: 2px solid #C9A15A;
    box-shadow: 0 0 0 4px #FFFEFB, 0 0 0 6px #C9A15A, 0 10px 30px rgba(30,41,59,0.10);
  }
  .cert-display { font-family: 'Playfair Display', Georgia, serif; }
  .cert-corner { position: absolute; width: 28px; height: 28px; border: 2px solid #C9A15A; }

  /* ---------- Register-style certificate (A4) ---------- */
  .pc-cert { width: 210mm; height: 297mm; background: #fff; color: #222; position: relative; box-sizing: border-box; padding: 9mm; font-family: 'Libre Baskerville', Georgia, serif; }
  .pc-frame { position: absolute; inset: 6mm; border: 1.2mm double #9aa0a6; pointer-events: none; }
  .pc-inner { position: relative; height: 100%; display: flex; flex-direction: column; padding: 4mm 8mm 0; }
  .pc-head { position: relative; height: 54mm; flex: none; }
  .pc-angel { position: absolute; top: 2mm; width: 34mm; }
  .pc-angel.l { left: 0; } .pc-angel.r { right: 0; transform: scaleX(-1); }
  .pc-arch { position: absolute; left: 50%; top: 4mm; transform: translateX(-50%); width: 120mm; overflow: visible; }
  .pc-title { font-family: 'Pinyon Script', cursive; font-size: 40pt; text-align: center; line-height: 1.1; margin: 2mm 0 5mm; }
  .pc-ref { font-size: 10.5pt; margin-bottom: 3mm; }
  .pc-rows { position: relative; flex: 1; }
  .pc-wm { position: absolute; left: 14%; top: 0; height: 100%; width: 22mm; opacity: .08; }
  .pc-row { position: relative; display: grid; grid-template-columns: 40% 1fr; align-items: end; padding-left: 9mm; height: var(--rh, 10mm); font-size: 11.5pt; }
  .pc-row .k { padding-bottom: 1.2mm; }
  .pc-row .v { border-bottom: .4mm dotted #333; padding: 0 0 1mm 2mm; font-weight: 700; text-transform: uppercase; letter-spacing: .02em; min-height: 6mm; }
  .pc-letter { position: relative; flex: 1; padding: 6mm 9mm 0; font-size: 12.5pt; line-height: 2.1; text-align: justify; }
  .pc-certify { text-align: center; font-size: 10.5pt; line-height: 1.7; margin-top: 4mm; }
  .pc-sign { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 3mm; font-size: 10.5pt; position: relative; height: 30mm; flex: none; }
  .pc-sign .date { padding-bottom: 6mm; font-weight: 700; }
  .pc-seal { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); width: 31mm; opacity: .8; }
  .pc-sig { width: 62mm; text-align: center; padding-bottom: 3mm; }
  .pc-sig .line { border-top: .3mm solid #333; margin-bottom: 1mm; padding-top: 1mm; }
  .pc-foot { text-align: center; font-size: 8.5pt; color: #444; padding: 2mm 0 5mm; flex: none; }
  #print-root { display: none; }
  @media print {
    @page { size: A4; margin: 0; }
    body > *:not(#print-root) { display: none !important; }
    #print-root { display: block !important; }
  }
</style>
</head>
<body class="text-ink">

  <div class="flex min-h-screen">

    <!-- ============ SIDEBAR ============ -->
    <aside id="sidebar" class="w-[280px] bg-card-bg border-r border-divider flex-shrink-0 flex flex-col fixed lg:static inset-y-0 left-0 z-40 -translate-x-full lg:translate-x-0 transition-transform">
      <div class="px-6 pt-6 pb-5">
        <p class="font-heading font-bold text-base">Parish Connect</p>
        <p id="sidebar-parish-name" class="text-xs text-ink-muted mt-1 truncate">Infant Jesus Shrine</p>
      </div>
      <nav class="flex-1 px-4 space-y-1 overflow-y-auto">
        <button onclick="return goDash()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-button text-ink-muted text-sm hover:bg-section-bg transition-warm">

          Dashboard

        <button onclick="return goFamilyRecords()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-button text-ink-muted text-sm hover:bg-section-bg transition-warm">

          Family Records
        </button>
        <button onclick="return goMasses()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-button text-ink-muted text-sm hover:bg-section-bg transition-warm">
          <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18"/><path d="M8 3v4"/><path d="M16 3v4"/></svg>
          Masses
        </button>
        <button onclick="return goCalendar()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-button text-ink-muted text-sm hover:bg-section-bg transition-warm">
          <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M8 2v4"/><path d="M16 2v4"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/></svg>

        <button onclick="return goRequests()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-button text-ink-muted text-sm hover:bg-section-bg transition-warm">

        <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-button bg-primary-light text-primary font-semibold text-sm">
          <svg class="icon" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/><path d="M9 13h6"/><path d="M9 17h6"/></svg>

        </a>
        <button onclick="return goCommunication()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-button text-ink-muted text-sm hover:bg-section-bg transition-warm">
          <svg class="icon" viewBox="0 0 24 24"><path d="M4 4h16v12H7l-3 3V4Z"/></svg>
          Communication
        </button>
        <button onclick="return goFaithFormation()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-button text-ink-muted text-sm hover:bg-section-bg transition-warm">
          <svg class="icon" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/></svg>
          Faith Formation
        </button>
        <button onclick="return goFinance()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-button text-ink-muted text-sm hover:bg-section-bg transition-warm">
          <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.5a2.5 2.5 0 0 1 2.5-1h.5a2.5 2.5 0 0 1 0 5h-1a2.5 2.5 0 0 0 0 5h.5a2.5 2.5 0 0 0 2.5-1"/></svg>
          Finance
        </button>
        <button onclick="toggleAdminGroup()" class="w-full flex items-center justify-between px-3 py-2.5 rounded-button text-ink-muted text-sm hover:bg-section-bg transition-warm">
          <span class="flex items-center gap-3">
            <svg class="icon" viewBox="0 0 24 24"><path d="M12 3v4"/><path d="M9 6l3-2 3 2"/><path d="M5 21V11l7-5 7 5v10"/><path d="M9 21v-6a3 3 0 0 1 6 0v6"/></svg>
            Administration
          </span>
          <svg id="admin-chevron" class="icon w-4 h-4 transition-transform" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
        <div id="admin-children" class="hidden ml-4 pl-3 border-l border-divider space-y-0.5 my-1">
          <button id="admin-child-profile" onclick="return goAdminProfile()" class="w-full text-left px-3 py-2 rounded-button text-xs text-ink-muted hover:bg-section-bg transition-warm">Parish Profile</button>
          <button onclick="return goServices()" class="w-full text-left px-3 py-2 rounded-button text-xs text-ink-muted hover:bg-section-bg transition-warm">Services</button>
          <button id="admin-child-inventory" onclick="return goAdminInventory()" class="w-full text-left px-3 py-2 rounded-button text-xs text-ink-muted hover:bg-section-bg transition-warm">Inventory</button>
          <button id="admin-child-staff" onclick="return goAdminStaff()" class="w-full text-left px-3 py-2 rounded-button text-xs text-ink-muted hover:bg-section-bg transition-warm">Staff</button>
          <button onclick="return goCommittees()" class="w-full text-left px-3 py-2 rounded-button text-xs text-ink-muted hover:bg-section-bg transition-warm">Committees</button>
        </div>
        <button onclick="return goReports()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-button text-ink-muted text-sm hover:bg-section-bg transition-warm">
          <svg class="icon" viewBox="0 0 24 24"><path d="M4 20V10M12 20V4M20 20v-7"/></svg>
          Reports
        </button>
        <button onclick="return goSettings()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-button text-ink-muted text-sm hover:bg-section-bg transition-warm">
          <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.11-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1.11 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1Z"/></svg>
          Settings
        </button>
      </nav>
    </aside>
    <div id="sidebar-backdrop" onclick="toggleSidebar()" class="hidden fixed inset-0 bg-black/20 z-30 lg:hidden"></div>

    <!-- ============ MAIN ============ -->
    <div class="flex-1 min-w-0">

      <header class="bg-card-bg border-b border-divider px-6 lg:px-10 py-4 flex items-center justify-between sticky top-0 z-20">
        <div class="flex items-center gap-3">
          <button onclick="toggleSidebar()" aria-label="Toggle navigation" class="lg:hidden w-9 h-9 rounded-button flex items-center justify-center text-ink-muted hover:bg-section-bg">
            <svg class="icon" viewBox="0 0 24 24"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
          </button>
          <div>
            <p id="header-parish-name" class="text-sm font-semibold">Infant Jesus Shrine</p>
            <p class="text-xs text-ink-muted">Documents</p>
          </div>
        </div>
        <div class="flex items-center gap-3">
          <button id="avatar-btn" onclick="document.getElementById('account-menu').classList.toggle('hidden')" aria-label="Account menu" class="w-9 h-9 rounded-badge bg-primary text-white text-xs font-bold flex items-center justify-center flex-shrink-0">PS</button>
        </div>
        <div id="account-menu" class="hidden absolute right-6 lg:right-10 top-16 bg-card-bg rounded-card shadow-card w-56 z-50 overflow-hidden">
          <div class="px-4 py-3.5 border-b border-divider">
            <p class="text-sm font-semibold">Parish Staff</p>
            <p id="account-parish-name" class="text-xs text-ink-muted truncate">Infant Jesus Shrine</p>
          </div>
          <button onclick="window.location.href='screen-parish-login.html'" class="w-full text-left px-4 py-3.5 text-sm text-error hover:bg-error-bg min-h-[44px] transition-warm">Log out</button>
        </div>
      </header>

      <main class="px-6 lg:px-10 py-8 max-w-content">

        <div class="mb-6">
          <p class="font-heading font-bold text-2xl">Documents</p>
          <p class="text-ink-muted text-sm mt-1">Browse certificate templates and generate documents \u2014 the same engine that powers document requests approved in Requests.</p>
        </div>

        <div class="flex gap-2 mb-6 flex-wrap">
          <button onclick="setModule('templates')" data-module="templates" class="module-tab px-4 py-2.5 rounded-badge text-sm font-semibold whitespace-nowrap transition-warm bg-primary text-white">Templates</button>
          <button onclick="setModule('create')" data-module="create" class="module-tab px-4 py-2.5 rounded-badge text-sm font-semibold whitespace-nowrap transition-warm bg-card-bg text-ink-muted">Create Certificate</button>
          <button onclick="setModule('generated')" data-module="generated" class="module-tab px-4 py-2.5 rounded-badge text-sm font-semibold whitespace-nowrap transition-warm bg-card-bg text-ink-muted">Generated Documents</button>
        </div>

        <div id="module-content"></div>

      </main>

  </div>

  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-ink text-white text-sm px-4 py-2.5 rounded-button shadow-card opacity-0 pointer-events-none transition-opacity duration-200 max-w-[90%] text-center z-50"></div>

  <!-- ============ VIEW TEMPLATE MODAL ============ -->
  <div id="template-modal" class="hidden fixed inset-0 bg-black/30 z-50 flex items-center justify-center p-4">
    <div class="bg-card-bg rounded-card shadow-card w-full max-w-2xl max-h-[85vh] overflow-y-auto">
      <div class="px-6 pt-6 pb-4 border-b border-divider flex items-center justify-between">
        <p id="template-modal-title" class="font-heading font-bold text-lg">Template</p>
        <button onclick="closeModal('template-modal')" aria-label="Close" class="w-9 h-9 rounded-button flex items-center justify-center text-ink-muted hover:bg-section-bg">
          <svg class="icon" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="M6 6l12 12"/></svg>
        </button>
      </div>
      <div id="template-modal-body" class="px-6 py-5 space-y-4"></div>
      <div class="px-6 pb-6 pt-2">
        <button id="template-modal-use-btn" class="w-full bg-primary hover:bg-primary-hover text-white text-sm font-semibold py-3 rounded-button min-h-[44px] transition-warm">Use This Template</button>
      </div>
    </div>
  </div>

<script>
  const sessionParams = new URLSearchParams(window.location.search);
  function baseParams() {
    const p = new URLSearchParams();
    ['parish', 'parishName', 'name'].forEach(k => { if (sessionParams.get(k)) p.set(k, sessionParams.get(k)); });
    return p;
  }
  const parishName = sessionParams.get('parishName') || 'Infant Jesus Shrine';
  const staffName = sessionParams.get('name') || 'Parish Staff';
  document.getElementById('sidebar-parish-name').textContent = parishName;
  document.getElementById('header-parish-name').textContent = parishName;
  document.getElementById('account-parish-name').textContent = parishName;
  document.getElementById('avatar-btn').textContent = parishName.split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();

  function goDash() { window.location.href = 'screen-parish-dashboard-home.html?' + baseParams().toString(); return false; }
  function goFamilyRecords() { window.location.href = 'screen-parish-familyrecords-search.html?' + baseParams().toString(); return false; }
  function goCommittees() { window.location.href = 'screen-parish-committees-hub.html?' + baseParams().toString(); return false; }
  function goAdminProfile() { window.location.href = 'screen-parish-administration-hub.html?' + baseParams().toString() + '&module=profile'; return false; }
  function goAdminInventory() { window.location.href = 'screen-parish-administration-hub.html?' + baseParams().toString() + '&module=inventory'; return false; }
  function goAdminStaff() { window.location.href = 'screen-parish-administration-hub.html?' + baseParams().toString() + '&module=staff'; return false; }
  function toggleAdminGroup() {
    document.getElementById('admin-children').classList.toggle('hidden');
    document.getElementById('admin-chevron').classList.toggle('rotate-90');
  }
  function goMasses() { window.location.href = 'screen-parish-masses-hub.html?' + baseParams().toString(); return false; }
  function goCalendar() { window.location.href = 'screen-parish-calendar-hub.html?' + baseParams().toString(); return false; }
  function goRequests() { window.location.href = 'screen-parish-requests-hub.html?' + baseParams().toString(); return false; }
  function goServices() { window.location.href = 'screen-parish-services-hub.html?' + baseParams().toString(); return false; }
  function goCommunication() { window.location.href = 'screen-parish-communication-hub.html?' + baseParams().toString(); return false; }
  function goFaithFormation() { window.location.href = 'screen-parish-faithformation-hub.html?' + baseParams().toString(); return false; }
  function goFinance() { window.location.href = 'screen-parish-finance-hub.html?' + baseParams().toString(); return false; }
  function goAdministration() { window.location.href = 'screen-parish-administration-hub.html?' + baseParams().toString(); return false; }
  function goReports() { window.location.href = 'screen-parish-reports-hub.html?' + baseParams().toString(); return false; }
  function goSettings() { window.location.href = 'screen-parish-settings-hub.html?' + baseParams().toString(); return false; }
  function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('-translate-x-full');
    document.getElementById('sidebar-backdrop').classList.toggle('hidden');
  }
  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.remove('opacity-0'); t.classList.add('opacity-100');
    clearTimeout(window._t);
    window._t = setTimeout(() => { t.classList.remove('opacity-100'); t.classList.add('opacity-0'); }, 1800);
  }
  function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

  const ICON_PATHS = {
    eye: '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>',
    plus: '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
    check: '<path d="M20 6 9 17l-5-5"/>',
    download: '<path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/>',
    mail: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',
    print: '<path d="M6 9V3h12v6"/><rect x="6" y="14" width="12" height="7"/><path d="M4 9h16a2 2 0 0 1 2 2v5h-4M2 16v-5a2 2 0 0 1 2-2"/>',
  };
  function icon(name, cls) { return `<svg class="${cls||'icon'}" viewBox="0 0 24 24">${ICON_PATHS[name]}</svg>`; }

  function certEmblem() {
    return `
      <svg width="56" height="56" viewBox="0 0 56 56" fill="none">
        <circle cx="28" cy="28" r="24" stroke="#C9A15A" stroke-width="1.5"/>
        <circle cx="28" cy="28" r="19" stroke="#C9A15A" stroke-width="1"/>
        <path d="M28 15v18M22 21h12" stroke="#C9A15A" stroke-width="2" stroke-linecap="round"/>
        <path d="M11 34c3-5 6-6 9-4M11 34c1 3 3 5 6 6" stroke="#C9A15A" stroke-width="1.2" stroke-linecap="round" fill="none"/>
        <path d="M45 34c-3-5-6-6-9-4M45 34c-1 3-3 5-6 6" stroke="#C9A15A" stroke-width="1.2" stroke-linecap="round" fill="none"/>
      </svg>
    `;
  }
  const MONTH_NAMES = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  function formatDate(iso) {
    if (!iso) return '\u2014';
    const [y,m,d] = iso.split('-').map(Number);
    return `${d} ${MONTH_NAMES[m-1]} ${y}`;
  }
  function statusPill(status) {
    const map = { 'Published':['bg-green/20','text-[#2f6b45]'], 'Draft':['bg-gold/20','text-[#8a5a10]'], 'Archived':['bg-section-bg','text-ink-muted'] };
    const [bg, text] = map[status] || map['Published'];
    return `<span class="${bg} ${text} text-xs font-semibold px-2.5 py-1 rounded-badge whitespace-nowrap">${status}</span>`;
  }

  // ---------------- Mock data: Certificate Templates (schema DOC-ISD-003, seeded to match the ----------------
  // ---------------- document types already configured in Services \u2192 Documents & Certificates) ----------------
  const templates = [
    { id:"TPL-001", name:"Baptism Certificate", category:"Certificates", owner:"Parish", version:2, status:"Published", layout:"register", register:"Baptisms",
      description:"True copy of a Baptism register entry, in the parish's traditional certificate layout.",

    const record = sacramentType ? person.sacraments.find(s => s.sacrament === sacramentType) : null;
    if (!record) { toast(`No ${sacramentType} record on file for ${memberName}.`); return; }
    linkedMemberName = memberName;
    // Template field keys now match the sacrament record schema directly (fullName, dob, sacramentDate,
    // parish, etc.), so this is a straightforward per-field copy rather than a mapping table — a direct

      if (f.key in record) certFieldValues[f.key] = record[f.key];

  function mergeTemplateBody(t, vals) {
    const V = vals || certFieldValues;

      const displayValue = f.type === 'date' && V[f.key] ? formatDate(V[f.key]) : value;
      merged = merged.split(`{{${f.key}}}`).join(displayValue);
    });
    return merged;
  }

    const fs = Math.min(28, Math.floor(400 / (n.length * 0.78)));
    const angel = cls => `<svg class="pc-angel ${cls}" viewBox="0 0 100 130" fill="#f2f2f2" stroke="#555" stroke-width="1.6" stroke-linejoin="round"><path d="M42 50C28 30 10 22 4 8c18 2 30 10 40 24z"/><path d="M40 62C24 50 8 48 2 40c16-2 28 4 40 12z"/><path d="M40 76C26 70 12 72 8 66c14-2 24 0 34 6z"/><path d="M56 50C70 30 90 22 96 8 78 10 64 18 54 32z"/><circle cx="50" cy="38" r="9"/><path d="M42 36c2-8 14-8 16 0" fill="#ddd"/><path d="M40 50c-4 20-8 50-12 76h44c-4-26-8-56-12-76-4 4-16 4-20 0z"/><path d="M44 62c-2 20-4 40-6 62M56 62c2 20 4 40 6 62M50 70v54" fill="none" stroke-width="1"/></svg>`;
    const church = `<svg viewBox="0 0 240 110" fill="#f6f6f6" stroke="#444" stroke-width="1.6" stroke-linejoin="round" style="width:62mm;display:block;margin:0 auto"><path d="M20 108V50l50-22v80z"/><path d="M220 108V50l-50-22v80z"/><rect x="70" y="62" width="100" height="46"/><path d="M80 62a40 20 0 0 1 80 0"/><path d="M105 44a15 12 0 0 1 30 0z"/><path d="M120 8v22M113 15h14" stroke-width="2.4"/><path d="M86 78h68M86 92h68" stroke-width="1"/><rect x="108" y="88" width="24" height="20" fill="#ddd"/><path d="M30 70h30M30 84h30M30 98h30M180 70h30M180 84h30M180 98h30" stroke-width="1"/></svg>`;
    const seal = `<svg class="pc-seal" viewBox="0 0 120 120"><defs><path id="sc${u}" d="M60 60m-42 0a42 42 0 1 1 84 0a42 42 0 1 1-84 0"/></defs><circle cx="60" cy="60" r="57" fill="none" stroke="#2a4a8a" stroke-width="2"/><circle cx="60" cy="60" r="30" fill="none" stroke="#2a4a8a" stroke-width="1.5"/><text font-size="9" fill="#2a4a8a" font-family="Libre Baskerville,serif" letter-spacing="1"><textPath href="#sc${u}" startOffset="50%" text-anchor="middle">${escH(n)} \u00B7 BENGALURU</textPath></text><path d="M60 36v48M46 52h28" stroke="#2a4a8a" stroke-width="3" stroke-linecap="round"/></svg>`;
    const head = `<div class="pc-head">${angel('l')}${angel('r')}
      <svg class="pc-arch" viewBox="0 -20 400 150"><defs><path id="ar${u}" d="M30 128A170 108 0 0 1 370 128"/></defs><text font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="${fs}" letter-spacing="2" fill="#111"><textPath href="#ar${u}" startOffset="50%" text-anchor="middle">${escH(n)}</textPath></text></svg>
      <div style="position:absolute;left:0;right:0;top:22mm">${church}</div></div>`;
    const title = `<div class="pc-title">${escH(t.name)}</div>`;
    const ref = V.certificateNumber || '';
    let body, ending;
    if (t.layout === 'register') {
      const rowsF = t.fields.filter(f => f.key !== 'certificateNumber');
      const rh = rowsF.length > 11 ? '9mm' : '10mm';
      const rows = rowsF.map(f => {
        const raw = V[f.key] || '';
        return `<div class="pc-row" style="--rh:${rh}"><div class="k">${escH(f.label)}</div><div class="v">${escH(f.type === 'date' ? fmtDot(raw) : raw)}</div></div>`;
      }).join('');
      body = `<div class="pc-ref">Ref. No: ${escH(ref)}</div><div class="pc-rows"><svg class="pc-wm" viewBox="0 0 40 200" preserveAspectRatio="none" fill="none" stroke="#666" stroke-width="2"><path d="M14 0v50H0v22h14v128h12V72h14V50H26V0z"/></svg>${rows}</div>`;
      ending = `<div class="pc-certify">I certify that the above is a <b>TRUE COPY</b> of Entry in the Register of ${escH(t.register)}<br>Kept at ${escH(parishName)}, Bengaluru.</div>`;
    } else {
      body = `<div class="pc-letter"><p>${escH(mergeTemplateBody(t, V))}</p></div>`;
      ending = '';
    }
    const notesEl = (vals === undefined) ? document.getElementById('cert-notes') : null;
    const notes = notesEl ? notesEl.value.trim() : '';
    const notesH = notes ? `<p style="text-align:center;font-size:10pt;font-style:italic;color:#555;margin-top:3mm">${escH(notes)}</p>` : '';
    return `<div class="pc-cert"><div class="pc-frame"></div><div class="pc-inner">${head}${title}${body}${ending}${notesH}
      <div class="pc-sign"><div class="date">Date: ${ISSUE_DATE}</div>${seal}<div class="pc-sig"><div style="height:12mm"></div><div class="line">Registrar &amp; Parish Priest</div><div style="font-size:9pt">${escH(PARISH_PRIEST)}</div></div></div>
      <div class="pc-foot">${escH(PARISH_ADDRESS)}</div></div></div>`;
  }

  // Scale the fixed-size A4 certificate to fit its container (preview + modal)
  function fitScaled(wrapId, innerId) {
    const wrap = document.getElementById(wrapId), inner = document.getElementById(innerId);
    if (!wrap || !inner || !wrap.parentElement) return;
    const avail = wrap.parentElement.clientWidth;
    if (!avail) return;
    const sc = Math.min(1, avail / 793.7);
    inner.style.transformOrigin = 'top left';
    inner.style.transform = `scale(${sc})`;
    inner.style.width = '793.7px';
    wrap.style.width = (793.7 * sc) + 'px';
    wrap.style.height = (1122.5 * sc) + 'px';
  }
  window.addEventListener('resize', () => { fitScaled('cert-scale-wrap','cert-preview'); fitScaled('tpl-scale-wrap','tpl-scale-inner'); });

  function updateCertPreview() {
    const t = templateById(selectedTemplateId);
    const preview = document.getElementById('cert-preview');
    if (!preview || !t) return;
    preview.innerHTML = certHTML(t);
    fitScaled('cert-scale-wrap', 'cert-preview');
  }

  function printCertificate() {
    const t = templateById(selectedTemplateId);
    if (!t) return;
    let root = document.getElementById('print-root');
    if (!root) { root = document.createElement('div'); root.id = 'print-root'; document.body.appendChild(root); }
    root.innerHTML = certHTML(t);
    window.print();
  }

  function saveCertDraft() {
    toast('Certificate saved as draft.');
  }
  function generateCertificate() {
    const t = templateById(selectedTemplateId);
    const primaryField = t.fields[0];
    const subject = certFieldValues[primaryField.key] || 'Unnamed';
    const ref = 'CERT-2026-' + Math.floor(1000 + Math.random() * 8999);
    generatedDocuments.unshift({ id:'GEN-'+Math.floor(100+Math.random()*899), templateName: t.name, subject, referenceNumber: ref, generatedDate: '2026-07-31', generatedBy: staffName });
    toast(`${t.name} generated \u2014 ${ref}`);
    selectedTemplateId = null;
    setModule('generated');
  }

  // =========================================================================
  // MODULE 3: Generated Documents log
  // =========================================================================
  function renderGeneratedModule(el) {
    if (generatedDocuments.length === 0) {
      el.innerHTML = `<div class="bg-card-bg rounded-card shadow-card p-10 text-center"><p class="text-sm font-semibold">No documents generated yet</p><p class="text-sm text-ink-muted mt-1">Certificates you generate will appear here.</p></div>`;
      return;
    }
    el.innerHTML = `
      <div class="bg-card-bg rounded-card shadow-card overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead>
              <tr class="border-b border-divider text-left text-ink-muted text-xs uppercase tracking-wide">
                <th class="px-4 py-3 font-medium">Reference</th>
                <th class="px-4 py-3 font-medium">Document</th>
                <th class="px-4 py-3 font-medium">Subject</th>
                <th class="px-4 py-3 font-medium">Generated</th>
                <th class="px-4 py-3 font-medium">By</th>
                <th class="px-4 py-3 font-medium"></th>
              </tr>
            </thead>
            <tbody>
              ${generatedDocuments.map(g => `
                <tr class="border-b border-divider last:border-0">
                  <td class="px-4 py-3 font-medium">${g.referenceNumber}</td>
                  <td class="px-4 py-3 text-ink-muted">${g.templateName}</td>
                  <td class="px-4 py-3 text-ink-muted">${g.subject}</td>
                  <td class="px-4 py-3 text-ink-muted whitespace-nowrap">${formatDate(g.generatedDate)}</td>
                  <td class="px-4 py-3 text-ink-muted">${g.generatedBy}</td>
                  <td class="px-4 py-3">
                    <button onclick="toast('Download')" aria-label="Download" class="w-8 h-8 rounded-button flex items-center justify-center text-ink-muted hover:bg-section-bg transition-warm">${icon('download','icon w-4 h-4')}</button>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      </div>
    `;
  }

  renderModule();
</script>

</body>
</html>
