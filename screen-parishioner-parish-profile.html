  function findParish(id) { return parishDirectory.find(p => p.id === id) || parishDirectory.find(p => p.id === HOME_PARISH_ID); }

  function hashCode(str) {
    let hash = 0;
    for (let i = 0; i < str.length; i++) { hash = (hash * 31 + str.charCodeAt(i)) % 997; }
    return hash;
  }
  function seededRange(seedStr, min, max) { return min + (hashCode(seedStr) % (max - min + 1)); }

  // ---------------- Real weekly Mass schedule for the home parish (matches screen-parish-masses-hub.html ----------------
  // ---------------- exactly), plus real upcoming special/feast Masses from that same source. ----------------
  const HOME_WEEKLY_MASSES = [
    { label: "Sunday", value: "6:30 AM, 8:00 AM (Tamil), 10:00 AM (Konkani)" },
    { label: "Saturday Vigil", value: "6:00 PM (Kannada)" },
    { label: "Weekdays", value: "6:45 AM" },
  ];
  const HOME_SPECIAL_MASSES = [
    { name: "Feast of the Assumption", date: "2026-08-15", time: "7:00 AM" },
    { name: "Weekly Novena to Infant Jesus", date: null, time: "6:00 PM Thursdays" },
    { name: "Christmas Midnight Mass", date: "2026-12-25", time: "12:00 AM" },
  ];
  // St. Mary's Minor Basilica Church (PAR-0001) — the one non-home parish this app already references by
  // name (the Dashboard's hero banner and novena search result), so its Mass Timings and Upcoming Events
  // are real/consistent with those, not generated — everything else genuinely is generated, deterministically.
  const STMARYS_ID = 'PAR-0001';
  const STMARYS_WEEKLY_MASSES = [
    { label: "Sunday", value: "6:00 AM, 8:30 AM, 10:30 AM" },
    { label: "Saturday Vigil", value: "6:30 PM" },
  ];
  const STMARYS_SPECIAL_MASSES = [
    { name: "Feast Day Mass — St. Mary's Basilica Feast", date: "2026-09-08", time: "7:00 AM" },
  ];

  function weeklyMassesFor(parishId) {
    if (parishId === HOME_PARISH_ID) return HOME_WEEKLY_MASSES;
    if (parishId === STMARYS_ID) return STMARYS_WEEKLY_MASSES;
    const sundayHour = 6 + seededRange(parishId + 'sun', 0, 2);
    const vigilHour = 5 + seededRange(parishId + 'vig', 0, 2);
    return [
      { label: "Sunday", value: `${sundayHour}:00 AM, ${sundayHour + 2}:00 AM` },
      { label: "Saturday Vigil", value: `${vigilHour}:30 PM` },
    ];
  }
  function specialMassesFor(parishId) {
    if (parishId === HOME_PARISH_ID) return HOME_SPECIAL_MASSES;
    if (parishId === STMARYS_ID) return STMARYS_SPECIAL_MASSES;
    return [];
  }

  // ---------------- Upcoming events — home parish reuses the same 4 events already on ----------------
  // ---------------- screen-parishioner-events.html; St Mary's shows its real Feast; other parishes ----------------
  // ---------------- honestly show nothing published, rather than invented events. ----------------

    { name: "Feast Day Celebration", date: "2027-01-13", venue: "Infant Jesus Shrine Grounds" },
    { name: "Youth Retreat 2026", date: "2026-09-05", venue: "Parish Hall" },
    { name: "Winter Clothes Drive — Outreach Program", date: "2026-11-14", venue: "Parish Hall" },
    { name: "Christmas Celebration", date: "2026-12-24", venue: "Infant Jesus Shrine Grounds" },
  ];
  const STMARYS_EVENTS = [
    { name: "St. Mary's Basilica Feast — Novena begins 30 Aug", date: "2026-09-08", venue: "St. Mary's Basilica" },
  ];
  function eventsFor(parishId) {
    if (parishId === HOME_PARISH_ID) return HOME_EVENTS;
    if (parishId === STMARYS_ID) return STMARYS_EVENTS;
    return [];
  }

  // ---------------- screen-parishioner-committees.html and screen-parishioner-faithformation.html, a ----------------
  // ---------------- short summary here (not the full lists) with a "View all" link out to the full screen. ----------------

    { name: "Parish Finance Committee", coordinator: "Peter Fernandes" },
    { name: "Choir Committee", coordinator: "Kevin Rodrigues" },

  let expandedCards = new Set();
  function toggleCard(key) {
    if (expandedCards.has(key)) expandedCards.delete(key); else expandedCards.add(key);
    renderProfile();
  }

  function expandableCard(key, title, summary, bodyHtml) {
    const isOpen = expandedCards.has(key);
    return `
      <section id="card-${key}" class="bg-card-bg rounded-card shadow-card overflow-hidden">
        <button onclick="toggleCard('${key}')" class="w-full flex items-center justify-between gap-3 p-5 text-left min-h-[44px]">
          <div class="min-w-0">
            <p class="text-xs font-semibold text-ink-muted uppercase tracking-wide">${title}</p>
            <p class="text-sm font-medium mt-1">${summary}</p>
          </div>
          <svg class="icon w-4 h-4 text-ink-muted flex-shrink-0 transition-transform ${isOpen ? 'rotate-180' : ''}" viewBox="0 0 24 24">${ICON_PATHS.chevronDown}</svg>
        </button>
        ${isOpen ? `<div class="px-5 pb-5">${bodyHtml}</div>` : ''}
      </section>
    `;
  }

            <div><p class="text-sm font-medium">${p.parishPriest}</p><p class="text-xs text-ink-muted">Parish Priest</p></div>
          </div>
          ${isHome ? `
            <div class="flex items-center gap-3">
              <span class="w-10 h-10 rounded-badge bg-primary-light text-primary text-xs font-bold flex items-center justify-center flex-shrink-0">FB</span>
              <div><p class="text-sm font-medium">Fr. Francis Billemane</p><p class="text-xs text-ink-muted">Assistant Priest</p></div>
            </div>
          ` : ''}
        </div>
      </section>

      ${expandableCard('masstimes',
        'Mass Timings',
        `Sunday: ${weeklyMasses[0].value}`,
        `
          <div class="space-y-2 pt-1">
            ${weeklyMasses.map(m => `
              <div class="flex items-center justify-between bg-section-bg rounded-button px-3.5 py-2.5">

                <span class="text-sm text-ink-muted text-right">${m.value}</span>
              </div>
            `).join('')}
          </div>
          ${specialMasses.length > 0 ? `
            <p class="text-xs font-semibold text-ink-muted uppercase tracking-wide mt-4 mb-2">Upcoming Special Masses</p>
            <div class="space-y-2">
              ${specialMasses.map(s => `
                <div class="flex items-start gap-2.5">

                  <div class="min-w-0">
                    <p class="text-sm font-medium">${s.name}</p>
                    <p class="text-xs text-ink-muted mt-0.5">${s.date ? formatDate(s.date) + ' · ' : ''}${s.time}</p>
                  </div>
                </div>
              `).join('')}
            </div>
          ` : ''}
        `
      )}

      ${expandableCard('events',
        'Upcoming Events',
        events.length > 0 ? `${events.length} event${events.length === 1 ? '' : 's'} coming up` : 'No upcoming events published',
        events.length === 0

          : `<div class="space-y-2 pt-1">
              ${events.map(e => `

              `).join('')}

      )}

      <section id="card-contact" class="bg-card-bg rounded-card shadow-card p-5">

        </div>
        ${isHome ? `

      </section>

      ${isHome ? `
        ${expandableCard('committees',
          'Committees & Ministries',
          `${HOME_COMMITTEES_PREVIEW.length}+ active committees`,
          `

          `
        )}

        ${expandableCard('faithformation',
          'Faith Formation',
          'Daily prayers & reflections',
          `
            <div class="space-y-2 pt-1">
              ${HOME_FAITH_PREVIEW.map(f => `
                <div class="bg-section-bg rounded-button px-3.5 py-2.5">

                  <p class="text-sm font-medium mt-0.5">${f.title}</p>

            <button onclick="window.location.href='screen-parishioner-faithformation.html?' + baseParams().toString()" class="text-primary text-xs font-semibold mt-3">View all faith formation content</button>
          `
        )}

        <button onclick="window.location.href='screen-parishioner-events.html?' + baseParams().toString()" class="w-full bg-card-bg rounded-card shadow-card p-4 text-center transition-warm hover:shadow-card-hover min-h-[44px]">
          <p class="text-sm font-semibold">View All Parish Events</p>
        </button>
      ` : ''}
    `;
  }

  renderProfile();

  // Deep-link support: ?card=masstimes or ?card=events auto-expands and scrolls to that card.
  if (scrollToCard === 'masstimes' || scrollToCard === 'events') {
    expandedCards.add(scrollToCard);
    renderProfile();
  }
  if (scrollToCard) {
    setTimeout(() => {
      const target = document.getElementById('card-' + scrollToCard);
      if (target) {
        target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        target.classList.add('card-highlight');
      }
    }, 100);
  }
</script>
