    document.getElementById('sidebar').classList.toggle('-translate-x-full');

  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.remove('opacity-0'); t.classList.add('opacity-100');
    clearTimeout(window._t);
    window._t = setTimeout(() => { t.classList.remove('opacity-100'); t.classList.add('opacity-0'); }, 1800);

  function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

    if (!iso) return '\u2014';

    return `${d} ${MONTH_NAMES[m-1]} ${y}`;
  }
  function statusPill(status) {
    const map = { 'Published':['bg-green/20','text-[#2f6b45]'], 'Draft':['bg-gold/20','text-[#8a5a10]'] };

    return `<span class="${bg} ${text} text-xs font-semibold px-2.5 py-1 rounded-badge whitespace-nowrap">${status}</span>`;

    { id:'PAR-0108', name:'Sacred Heart Church', sizeTier:'Small' },
    { id:'PAR-0109', name:'St Anthony\'s Church', sizeTier:'Small' },
    { id:'PAR-0110', name:'St Anthony\'s Church', sizeTier:'Small' },
    { id:'PAR-0111', name:'St Anthony\'s Church', sizeTier:'Small' },
    { id:'PAR-0112', name:'St Anthony\'s Church', sizeTier:'Small' },
    { id:'PAR-0113', name:'St Anthony\'s Church', sizeTier:'Small' },
    { id:'PAR-0114', name:'St Francis de Sales Church', sizeTier:'Small' },
    { id:'PAR-0115', name:'St Francis Xavier\'s Church', sizeTier:'Small' },
    { id:'PAR-0116', name:'St Francis Xavier\'s Church', sizeTier:'Small' },
    { id:'PAR-0117', name:'St Joseph\'s Church', sizeTier:'Small' },
    { id:'PAR-0118', name:'St Joseph\'s Church', sizeTier:'Small' },
    { id:'PAR-0119', name:'St Joseph\'s Church', sizeTier:'Small' },
    { id:'PAR-0120', name:'St Joseph\'s Church', sizeTier:'Small' },
    { id:'PAR-0121', name:'St Joseph\'s Church', sizeTier:'Small' },
    { id:'PAR-0122', name:'St Joseph\'s Church', sizeTier:'Small' },
    { id:'PAR-0123', name:'St Paul\'s Church', sizeTier:'Small' },
    { id:'PAR-0124', name:'St Peter\'s Church', sizeTier:'Small' },
    { id:'PAR-0125', name:'St Rita\'s Church', sizeTier:'Small' },
    { id:'PAR-0126', name:'St Rita\'s Church', sizeTier:'Small' },
    { id:'PAR-0127', name:'St Rita\'s Church', sizeTier:'Small' },
    { id:'PAR-0128', name:'St Sebastian\'s Church', sizeTier:'Small' },
    { id:'PAR-0129', name:'St Theresa of Child Jesus Church', sizeTier:'Small' },
    { id:'PAR-0130', name:'St Theresa\'s Church', sizeTier:'Small' },
  ];

  let sharedDocuments = [
    { id:"SDOC-001", title:"Circular: Mass Timing Changes for Feast of Christ the King", templateName:"Diocesan Circular", scope:"All Parishes (130)", sharedDate:"2026-07-20", refNumber:"BA/CIRC/2026/0088" },
  ];

  let currentModule = 'templates';
  function setModule(m) {
    currentModule = m;
    document.querySelectorAll('.module-tab').forEach(btn => {
      const active = btn.dataset.module === m;
      btn.className = `module-tab px-4 py-2.5 rounded-badge text-sm font-semibold whitespace-nowrap transition-warm ${active ? 'bg-primary text-white' : 'bg-card-bg text-ink-muted'}`;
    });
    renderModule();
  }
  function renderModule() {
    const el = document.getElementById('module-content');
    if (currentModule === 'templates') renderTemplatesModule(el);
    else if (currentModule === 'create') renderCreateModule(el);
    else renderSharedModule(el);
  }
  function templateById(id) { return templates.find(t => t.id === id); }

  // =========================================================================
  // MODULE 1: Templates (view only — same scope decision as the Parish-side
  // Documents hub: template authoring is out of scope, this uses what exists).
  // =========================================================================
  function renderTemplatesModule(el) {
    el.innerHTML = `
      <div class="grid md:grid-cols-2 gap-4">
        ${templates.map(t => `
          <div class="bg-card-bg rounded-card shadow-card p-5">
            <div class="flex items-start justify-between gap-3 mb-2">
              <p class="text-sm font-semibold">${t.name}</p>
              ${statusPill(t.status)}
            </div>
            <p class="text-xs text-ink-muted">${t.category} \u00b7 ${t.fields.length} guided fields</p>
            <button onclick="useTemplate('${t.id}')" class="mt-3 bg-primary hover:bg-primary-hover text-white text-xs font-semibold px-3 py-2 rounded-button min-h-[36px] transition-warm">Use Template</button>
          </div>
        `).join('')}
      </div>
    `;
  }
  function useTemplate(id) {
    selectedTemplateId = id;
    docFieldValues = {};
    templateById(id).fields.forEach(f => { docFieldValues[f.key] = f.default || ''; });
    setModule('create');
  }

  // =========================================================================
  // MODULE 2: Create Document — 40/60 split, fixed-height letterhead preview,
  // matching the layout lessons already applied on the Parish-side Documents hub.
  // =========================================================================
  let selectedTemplateId = null;
  let docFieldValues = {};

  function renderCreateModule(el) {
    if (!selectedTemplateId) {
      el.innerHTML = `
        <p class="text-sm text-ink-muted mb-4">Choose a template to get started.</p>
        <div class="grid md:grid-cols-2 gap-4">
          ${templates.filter(t => t.status === 'Published').map(t => `
            <button onclick="useTemplate('${t.id}')" class="bg-card-bg rounded-card shadow-card p-5 text-left transition-warm hover:shadow-card-hover">
              <p class="text-sm font-semibold">${t.name}</p>
              <p class="text-xs text-ink-muted mt-1">${t.category}</p>
            </button>
          `).join('')}
        </div>
      `;
      return;
    }
    const t = templateById(selectedTemplateId);
    el.innerHTML = `
      <div class="flex items-center justify-between mb-4">
        <div>
          <p class="text-sm font-semibold">${t.name}</p>
          <p class="text-xs text-ink-muted mt-0.5">Fill in the details on the left \u2014 the document updates as you type.</p>
        </div>
        <button onclick="selectedTemplateId=null; renderModule()" class="text-primary text-xs font-semibold flex-shrink-0">Change template</button>
      </div>
      <div class="grid lg:grid-cols-5 gap-6">
        <div class="lg:col-span-2 bg-card-bg rounded-card shadow-card p-5 space-y-4">
          <p class="text-xs font-semibold text-ink-muted uppercase tracking-wide">Guided details</p>
          ${t.fields.map(f => `
            <div class="space-y-1.5">
              <label class="text-xs font-medium">${f.label}</label>
              ${f.type === 'textarea'
                ? `<textarea rows="4" oninput="docFieldValues['${f.key}']=this.value; updateDocPreview()" class="w-full border border-divider rounded-input px-3 py-2 text-sm bg-white focus:ring-2 focus:ring-primary-light focus:outline-none resize-none">${docFieldValues[f.key] || ''}</textarea>`
                : `<input type="${f.type === 'date' ? 'date' : 'text'}" value="${docFieldValues[f.key] || ''}" oninput="docFieldValues['${f.key}']=this.value; updateDocPreview()" class="w-full border border-divider rounded-input px-3 h-10 text-sm bg-white focus:ring-2 focus:ring-primary-light focus:outline-none">`
              }
            </div>
          `).join('')}
        </div>
        <div class="lg:col-span-3">
          <p class="text-xs font-semibold text-ink-muted uppercase tracking-wide mb-2">Live preview</p>
          <div class="bg-white rounded-card shadow-card border border-divider" style="height:560px; overflow-y:auto;">
            <div id="doc-preview" class="letter-paper px-10 py-10"></div>
          </div>
          <div class="flex flex-wrap gap-2 mt-4">
            <button onclick="saveDocDraft()" class="bg-white border border-divider text-ink text-sm font-semibold px-4 py-2.5 rounded-button min-h-[40px] transition-warm hover:bg-section-bg">Save as Draft</button>
            <button onclick="openShareModal()" class="bg-primary hover:bg-primary-hover text-white text-sm font-semibold px-4 py-2.5 rounded-button min-h-[40px] transition-warm flex items-center gap-1.5">${icon('send','icon w-4 h-4')}Generate &amp; Share</button>
          </div>
        </div>
      </div>
    `;
    updateDocPreview();
  }

  function docTitle(t) {
    if (docFieldValues.title) return docFieldValues.title;
    if (docFieldValues.eventName) return docFieldValues.eventName;
    if (t.id === 'DTPL-003') return 'Parish Visitation Report' + (docFieldValues.parishName ? ' \u2014 ' + docFieldValues.parishName : '');
    return t.name;
  }

  function updateDocPreview() {
    const t = templateById(selectedTemplateId);
    const preview = document.getElementById('doc-preview');
    if (!preview) return;
    const refDisplay = docFieldValues.refNumber ? docFieldValues.refNumber : ('BA/DOC/2026/' + selectedTemplateId.slice(-3));
    preview.innerHTML = `
      <div class="flex items-start justify-between border-b border-divider pb-4 mb-6">
        <div class="flex items-center gap-3">
          ${dioceseCrest()}
          <div>
            <p class="letter-display font-bold text-lg" style="color:#3C2E1A;">Bangalore Archdiocese</p>
            <p class="text-[10px] tracking-wide uppercase text-ink-muted mt-0.5">Office of the Bishop \u00b7 Bengaluru</p>
          </div>
        </div>
        <div class="text-right flex-shrink-0">
          <p class="text-[10px] text-ink-muted uppercase tracking-wide">Reference</p>
          <p class="text-xs font-medium mt-0.5">${refDisplay}</p>
          <p class="text-[10px] text-ink-muted mt-2">31 July 2026</p>
        </div>
      </div>
      <p class="letter-display font-bold text-2xl text-center mb-1" style="color:#3C2E1A;">${docTitle(t)}</p>
      ${docFieldValues.occasion ? `<p class="text-xs text-ink-muted text-center mb-6">${docFieldValues.occasion}</p>` : '<div class="mb-6"></div>'}
      ${t.id === 'DTPL-003' ? `
        <div class="grid grid-cols-2 gap-3 text-sm mb-4">
          <div><span class="text-ink-muted">Parish:</span> ${docFieldValues.parishName || '[Parish Name]'}</div>
          <div><span class="text-ink-muted">Date:</span> ${docFieldValues.visitDate ? formatDate(docFieldValues.visitDate) : '[Date]'}</div>
          <div><span class="text-ink-muted">Visiting Official:</span> ${docFieldValues.visitingOfficial || '[Official]'}</div>
        </div>
        <p class="text-xs font-semibold text-ink-muted uppercase tracking-wide mb-1">Observations</p>
        <p class="text-sm leading-relaxed mb-4">${docFieldValues.observations || '[Observations]'}</p>
        <p class="text-xs font-semibold text-ink-muted uppercase tracking-wide mb-1">Recommendations</p>
        <p class="text-sm leading-relaxed">${docFieldValues.recommendations || '[Recommendations]'}</p>
      ` : t.id === 'DTPL-004' ? `
        <p class="text-sm leading-relaxed text-center">You are cordially invited to <strong>${docFieldValues.eventName || '[Event Name]'}</strong>${docFieldValues.eventDate ? ', on ' + formatDate(docFieldValues.eventDate) : ''}${docFieldValues.venue ? ', at ' + docFieldValues.venue : ''}.</p>
        ${docFieldValues.rsvp ? `<p class="text-sm leading-relaxed text-center mt-4 text-ink-muted">${docFieldValues.rsvp}</p>` : ''}
      ` : `
        <p class="text-sm leading-relaxed">${(docFieldValues.body || '[Message body will appear here as you type.]').replace(/\n/g, '<br>')}</p>
      `}
      <div class="flex items-end justify-between mt-12 pt-6">
        <div>
          <p class="text-[10px] text-ink-muted uppercase tracking-wide">Issued by</p>
          <p class="text-sm font-medium mt-1">${docFieldValues.issuedBy || 'Diocese Communications Office'}</p>
        </div>
        <div class="text-center">
          <p class="letter-display text-base" style="color:#3C2E1A; border-top:1px solid #C9A15A; padding-top:6px; padding-left:20px; padding-right:20px;">${docFieldValues.signedBy || 'Bangalore Archdiocese'}</p>
        </div>
      </div>
    `;
  }

  function saveDocDraft() {
    toast('Document saved as draft.');
  }

  // =========================================================================
  // SHARE — recipient scope, matching the Communication hub's Broadcast
  // Notifications pattern (All Parishes / By Size Tier / Specific Parishes).
  // =========================================================================
  let shareScope = 'all';
  let shareSizeTier = 'Large';
  let shareSelectedParishes = [];
  function openShareModal() {
    shareScope = 'all';
    shareSelectedParishes = [];
    document.getElementById('share-modal').classList.remove('hidden');
    document.getElementById('share-form').innerHTML = `
      <div class="space-y-1.5">
        <label class="text-xs font-medium">Share with</label>
        <div class="flex gap-2 flex-wrap">
          <label class="flex items-center gap-1.5 text-sm bg-section-bg px-3 py-2 rounded-badge cursor-pointer"><input type="radio" name="share-scope" value="all" checked onchange="shareScope='all'; renderShareRecipientDetail()"> All Parishes (130)</label>
          <label class="flex items-center gap-1.5 text-sm bg-section-bg px-3 py-2 rounded-badge cursor-pointer"><input type="radio" name="share-scope" value="sizeTier" onchange="shareScope='sizeTier'; renderShareRecipientDetail()"> By Size Tier</label>
          <label class="flex items-center gap-1.5 text-sm bg-section-bg px-3 py-2 rounded-badge cursor-pointer"><input type="radio" name="share-scope" value="specific" onchange="shareScope='specific'; renderShareRecipientDetail()"> Specific Parishes</label>
        </div>
        <div id="share-recipient-detail" class="pt-2"></div>
      </div>
    `;
    renderShareRecipientDetail();
  }
  function renderShareRecipientDetail() {
    const el = document.getElementById('share-recipient-detail');
    if (!el) return;
    if (shareScope === 'sizeTier') {
      el.innerHTML = `
        <select onchange="shareSizeTier=this.value" class="border border-divider rounded-input px-3 h-10 text-sm bg-white focus:ring-2 focus:ring-primary-light focus:outline-none">
          <option>Large</option><option>Medium</option><option>Small</option>
        </select>
      `;
    } else if (shareScope === 'specific') {
      el.innerHTML = `
        <select multiple onchange="shareSelectedParishes=[...this.selectedOptions].map(o=>o.value)" class="w-full border border-divider rounded-input px-3 py-2 text-sm bg-white focus:ring-2 focus:ring-primary-light focus:outline-none" size="6">
          ${parishesLight.map(p => `<option value="${p.id}">${p.name}</option>`).join('')}
        </select>
        <p class="text-xs text-ink-muted mt-1">Hold Ctrl/Cmd to select multiple.</p>
      `;
    } else {
      el.innerHTML = '';
    }
  }
  function shareScopeLabel() {
    if (shareScope === 'all') return 'All Parishes (130)';
    if (shareScope === 'sizeTier') return shareSizeTier + ' parishes (' + parishesLight.filter(p=>p.sizeTier===shareSizeTier).length + ')';
    return shareSelectedParishes.length + ' selected parish' + (shareSelectedParishes.length === 1 ? '' : 'es');
  }
  function submitShare() {
    if (shareScope === 'specific' && shareSelectedParishes.length === 0) { toast('Please select at least one parish.'); return; }
    const t = templateById(selectedTemplateId);
    const refNumber = docFieldValues.refNumber || ('BA/DOC/2026/' + Math.floor(1000 + Math.random() * 8999));
    sharedDocuments.unshift({ id:'SDOC-'+Math.floor(100+Math.random()*899), title: docTitle(t), templateName: t.name, scope: shareScopeLabel(), sharedDate: '2026-07-31', refNumber });
    closeModal('share-modal');
    toast(`Shared with ${shareScopeLabel()}.`);
    selectedTemplateId = null;
    setModule('shared');
  }

  // =========================================================================
  // MODULE 3: Shared Documents log
  // =========================================================================
  function renderSharedModule(el) {
    if (sharedDocuments.length === 0) {
      el.innerHTML = `<div class="bg-card-bg rounded-card shadow-card p-10 text-center"><p class="text-sm font-semibold">No documents shared yet</p></div>`;
      return;
    }
    el.innerHTML = `
      <div class="bg-card-bg rounded-card shadow-card overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead><tr class="border-b border-divider text-left text-ink-muted text-xs uppercase tracking-wide">
              <th class="px-4 py-3 font-medium">Document</th>
              <th class="px-4 py-3 font-medium">Template</th>
              <th class="px-4 py-3 font-medium">Shared with</th>
              <th class="px-4 py-3 font-medium">Reference</th>
              <th class="px-4 py-3 font-medium">Date</th>
              <th class="px-4 py-3 font-medium"></th>
            </tr></thead>
            <tbody>
              ${sharedDocuments.map(d => `
                <tr class="border-b border-divider last:border-0">
                  <td class="px-4 py-3 font-medium">${d.title}</td>
                  <td class="px-4 py-3 text-ink-muted">${d.templateName}</td>
                  <td class="px-4 py-3 text-ink-muted">${d.scope}</td>
                  <td class="px-4 py-3 text-ink-muted whitespace-nowrap">${d.refNumber}</td>
                  <td class="px-4 py-3 text-ink-muted whitespace-nowrap">${formatDate(d.sharedDate)}</td>
                  <td class="px-4 py-3"><button onclick="toast('Downloading ${d.title}')" aria-label="Download" class="w-8 h-8 rounded-button flex items-center justify-center text-ink-muted hover:bg-section-bg transition-warm">${icon('download','icon w-4 h-4')}</button></td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      </div>
    `;
  }

  renderModule();
</script>

</body>
</html>
