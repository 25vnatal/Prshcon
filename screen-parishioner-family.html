<!DOCTYPE html>
<html lang="en">
<head>
<title>Parish Connect — My Family</title>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          'bg-warm': '#FAFBFD', 'card-bg': '#FFFFFF', 'section-bg': '#F5F7FB', divider: '#E8EDF5',
          ink: '#1F2937', 'ink-muted': '#6B7280',
          primary: { DEFAULT: '#4F7CF5', hover: '#3F6CE4', light: '#EEF4FF' },
          coral: '#FF7F73', gold: '#F6C453', green: '#6CBF84', lavender: '#A88BFF',
          error: { DEFAULT: '#E5645A', bg: '#FDECEA' },
        },
        fontFamily: { heading: ['Manrope', 'sans-serif'], body: ['Inter', 'sans-serif'] },
        borderRadius: { card: '24px', button: '16px', input: '16px', badge: '999px' },
        boxShadow: { card: '0 6px 24px rgba(30,41,59,0.08)' },
      },
    },
  };
</script>
<style>
  body { font-family: 'Inter', sans-serif; background-color: #FAFBFD; color: #1F2937; line-height: 1.5; }
  h1, h2, .font-heading { font-family: 'Manrope', sans-serif; }
  :focus-visible { outline: 2px solid #4F7CF5; outline-offset: 2px; }
  .transition-warm { transition: all 200ms ease; }
  .icon { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body class="text-ink">

  <div class="max-w-[420px] mx-auto min-h-screen bg-bg-warm pb-10 relative">

    <!-- ============ TOP BAR ============ -->
    <header class="px-5 pt-5 pb-4 flex items-center gap-3">
      <button onclick="window.location.href='screen-parishioner-dashboard-home.html?' + sessionParams.toString()" aria-label="Back" class="w-10 h-10 rounded-button flex items-center justify-center text-ink-muted hover:bg-section-bg transition-warm flex-shrink-0">
        <svg class="icon" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      </button>
      <p class="font-heading font-bold text-lg">My Family</p>
    </header>

    <main class="px-5 space-y-6">

      <!-- Family overview -->
      <section class="bg-card-bg rounded-card shadow-card p-5">
        <div class="flex items-center gap-3 mb-4">
          <span class="w-12 h-12 rounded-badge bg-primary-light text-primary font-heading font-bold text-base flex items-center justify-center flex-shrink-0" id="family-initials">RF</span>
          <div>
            <p class="font-heading font-bold text-lg" id="family-name">Rodrigues Family</p>
            <p class="text-xs text-ink-muted" id="family-record-number">IJS/FAM/1001</p>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-x-4 gap-y-3 text-sm">
          <div><p class="text-xs text-ink-muted">Ward</p><p class="font-medium mt-0.5" id="family-ward">Viveknagar</p></div>
          <div><p class="text-xs text-ink-muted">Preferred Language</p><p class="font-medium mt-0.5" id="family-lang">English</p></div>
          <div class="col-span-2"><p class="text-xs text-ink-muted">Address</p><p class="font-medium mt-0.5" id="family-address">—</p></div>
          <div><p class="text-xs text-ink-muted">Mobile</p><p class="font-medium mt-0.5" id="family-mobile">—</p></div>
          <div class="col-span-2"><p class="text-xs text-ink-muted">Email</p><p class="font-medium mt-0.5 break-all" id="family-email">—</p></div>
        </div>
      </section>

      <!-- Members -->
      <section>
        <h2 class="font-heading font-bold text-lg mb-3">Family Members</h2>
        <div id="members-list" class="space-y-2.5"></div>
      </section>

      <!-- Request an update -->
      <section>
        <button onclick="toggleRequestForm()" id="request-toggle-btn" class="w-full bg-primary hover:bg-primary-hover text-white text-sm font-semibold py-3 rounded-button min-h-[44px] transition-warm">Request an Update</button>
        <div id="request-form-area" class="mt-3"></div>
      </section>

      <!-- My update requests -->
      <section>
        <h2 class="font-heading font-bold text-lg mb-3">My Update Requests</h2>
        <div id="update-requests-list" class="space-y-2.5"></div>
      </section>

    </main>

  </div>

  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-ink text-white text-sm px-4 py-2.5 rounded-button shadow-card opacity-0 pointer-events-none transition-opacity duration-200 max-w-[90%] text-center z-50"></div>

<script>
  const sessionParams = new URLSearchParams(window.location.search);

  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.remove('opacity-0'); t.classList.add('opacity-100');
    clearTimeout(window._t);
    window._t = setTimeout(() => { t.classList.remove('opacity-100'); t.classList.add('opacity-0'); }, 1800);
  }

  const ICON_PATHS = {
    check: '<path d="M20 6 9 17l-5-5"/>',
    clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    x: '<path d="M18 6 6 18"/><path d="M6 6l12 12"/>',
  };
  function icon(name, cls) { return `<svg class="${cls||'icon'}" viewBox="0 0 24 24">${ICON_PATHS[name]}</svg>`; }
  function initials(name) { return name.split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase(); }
  function formatDate(iso) {
    if (!iso) return '—';
    const MONTH_NAMES = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    const [y,m,d] = iso.split('-').map(Number);
    return `${d} ${MONTH_NAMES[m-1]} ${y}`;
  }

  // ---------------- Mock data (matches screen-parish-familyrecords-search.html's Rodrigues record) ----------------
  const family = {
    familyRecordNumber: "IJS/FAM/1001", familyName: "Rodrigues Family", ward: "Viveknagar",
    address: "No. 27, 2nd Cross, Church Street, Viveknagar, Bengaluru 560047",
    mobile: "9845012345", email: "john.rodrigues@example.com", preferredLanguage: "English",
  };
  let members = [
    { name: "John Rodrigues", relationship: "Head", dob: "1975-03-14" },
    { name: "Grace Rodrigues", relationship: "Spouse", dob: "1978-07-02" },
    { name: "Kevin Rodrigues", relationship: "Son", dob: "2003-01-18" },
    { name: "Clara Rodrigues", relationship: "Daughter", dob: "2006-09-25" },
  ];

  document.getElementById('family-initials').textContent = initials(family.familyName.replace(' Family',''));
  document.getElementById('family-name').textContent = family.familyName;
  document.getElementById('family-record-number').textContent = family.familyRecordNumber;
  document.getElementById('family-ward').textContent = family.ward;
  document.getElementById('family-lang').textContent = family.preferredLanguage;
  document.getElementById('family-address').textContent = family.address;
  document.getElementById('family-mobile').textContent = family.mobile;
  document.getElementById('family-email').textContent = family.email;

  function renderMembers() {
    document.getElementById('members-list').innerHTML = members.map(m => `
      <div class="bg-card-bg rounded-card shadow-card p-4 flex items-center gap-3">
        <span class="w-9 h-9 rounded-badge bg-primary-light text-primary text-xs font-bold flex items-center justify-center flex-shrink-0">${initials(m.name)}</span>
        <div class="min-w-0">
          <p class="text-sm font-semibold truncate">${m.name} <span class="text-ink-muted font-normal">· ${m.relationship}</span></p>
          <p class="text-xs text-ink-muted mt-0.5">Born ${formatDate(m.dob)}</p>
        </div>
      </div>
    `).join('');
  }
  renderMembers();

  // ---------------- Update requests ----------------
  let myRequests = [
    { id: "UPD-4001", type: "Add a Family Member", submissionDate: "24 Jul 2026",
      proposedChanges: { name: "Baby Rodrigues", relationship: "Daughter", dob: "2026-07-01" },
      comments: "New baby born on 1 July, please add to our family record.", status: "Submitted", rejectionReason: null },
  ];
  const FIELD_LABELS = { name: "Name", relationship: "Relationship", dob: "Date of Birth", address: "Address", mobile: "Mobile", email: "Email", preferredLanguage: "Preferred Language", originalName: "Member" };

  function renderMyRequests() {
    const el = document.getElementById('update-requests-list');
    if (myRequests.length === 0) {
      el.innerHTML = `<div class="bg-card-bg rounded-card shadow-card p-6 text-center"><p class="text-sm text-ink-muted">No update requests yet.</p></div>`;
      return;
    }
    el.innerHTML = myRequests.map(r => {
      const style = r.status === 'Submitted' ? ['bg-gold/20','text-[#8a5a10]','clock'] : r.status === 'Approved' ? ['bg-green/20','text-[#2f6b45]','check'] : ['bg-error-bg','text-error','x'];
      const [bg, text, iconName] = style;
      return `
        <div class="bg-card-bg rounded-card shadow-card p-4">
          <div class="flex items-start justify-between gap-3 mb-2">
            <div>
              <p class="text-sm font-semibold">${r.type}</p>
              <p class="text-xs text-ink-muted mt-0.5">Submitted ${r.submissionDate}</p>
            </div>
            <span class="${bg} ${text} text-xs font-semibold px-2.5 py-1 rounded-badge whitespace-nowrap inline-flex items-center gap-1 flex-shrink-0">${icon(iconName,'w-3 h-3')}${r.status}</span>
          </div>
          ${r.status === 'Rejected' && r.rejectionReason ? `<div class="bg-error-bg rounded-card p-3 mt-2"><p class="text-xs text-error">${r.rejectionReason}</p></div>` : ''}
        </div>
      `;
    }).join('');
  }
  renderMyRequests();

  // ---------------- Request an update form (simple, not a wizard) ----------------
  let requestFormOpen = false;
  let requestType = '';

  function toggleRequestForm() {
    requestFormOpen = !requestFormOpen;
    requestType = '';
    document.getElementById('request-toggle-btn').textContent = requestFormOpen ? 'Cancel' : 'Request an Update';
    document.getElementById('request-form-area').innerHTML = requestFormOpen ? renderRequestForm() : '';
  }

  function renderRequestForm() {
    return `
      <div class="bg-card-bg rounded-card shadow-card p-5 space-y-4">
        <div class="space-y-1.5">
          <label class="text-sm font-medium">What would you like to update?</label>
          <select id="req-type" onchange="requestType=this.value; refreshRequestFormFields()" class="w-full border border-divider rounded-input px-3 h-11 text-sm bg-bg-warm focus:ring-2 focus:ring-primary-light focus:outline-none">
            <option value="">Select…</option>
            <option value="Update Family Details">Update our family details (address, mobile, etc.)</option>
            <option value="Update a Member's Details">Update a family member's details</option>
            <option value="Add a Family Member">Add a new family member</option>
          </select>
        </div>
        <div id="req-fields"></div>
        <div class="space-y-1.5">
          <label class="text-sm font-medium">Comments</label>
          <textarea id="req-comments" rows="2" placeholder="Tell the parish office a bit more…" class="w-full border border-divider rounded-input px-3 py-2 text-sm bg-bg-warm focus:ring-2 focus:ring-primary-light focus:outline-none resize-none"></textarea>
        </div>
        <button onclick="submitUpdateRequest()" class="w-full bg-primary hover:bg-primary-hover text-white text-sm font-semibold py-3 rounded-button min-h-[44px] transition-warm">Submit Request</button>
      </div>
    `;
  }

  function refreshRequestFormFields() {
    const el = document.getElementById('req-fields');
    if (requestType === 'Update Family Details') {
      el.innerHTML = `
        <div class="grid grid-cols-1 gap-3">
          <div class="space-y-1.5"><label class="text-xs font-medium">Address</label><textarea id="rf-address" rows="2" class="w-full border border-divider rounded-input px-3 py-2 text-sm bg-bg-warm focus:ring-2 focus:ring-primary-light focus:outline-none resize-none">${family.address}</textarea></div>
          <div class="space-y-1.5"><label class="text-xs font-medium">Mobile</label><input id="rf-mobile" type="text" value="${family.mobile}" class="w-full border border-divider rounded-input px-3 h-11 text-sm bg-bg-warm focus:ring-2 focus:ring-primary-light focus:outline-none"></div>
          <div class="space-y-1.5"><label class="text-xs font-medium">Email</label><input id="rf-email" type="email" value="${family.email}" class="w-full border border-divider rounded-input px-3 h-11 text-sm bg-bg-warm focus:ring-2 focus:ring-primary-light focus:outline-none"></div>
          <div class="space-y-1.5"><label class="text-xs font-medium">Preferred Language</label><input id="rf-lang" type="text" value="${family.preferredLanguage}" class="w-full border border-divider rounded-input px-3 h-11 text-sm bg-bg-warm focus:ring-2 focus:ring-primary-light focus:outline-none"></div>
        </div>
        <p class="text-xs text-ink-muted mt-2">Edit only what's changed — this is pre-filled from your current record.</p>
      `;
    } else if (requestType === "Update a Member's Details") {
      el.innerHTML = `
        <div class="space-y-1.5">
          <label class="text-xs font-medium">Which member?</label>
          <select id="rf-member" onchange="prefillMemberFields()" class="w-full border border-divider rounded-input px-3 h-11 text-sm bg-bg-warm focus:ring-2 focus:ring-primary-light focus:outline-none">
            <option value="">Select…</option>
            ${members.map(m => `<option value="${m.name}">${m.name}</option>`).join('')}
          </select>
        </div>
        <div id="rf-member-fields" class="mt-3"></div>
      `;
    } else if (requestType === 'Add a Family Member') {
      el.innerHTML = `
        <div class="grid grid-cols-1 gap-3">
          <div class="space-y-1.5"><label class="text-xs font-medium">Full name</label><input id="rf-newname" type="text" class="w-full border border-divider rounded-input px-3 h-11 text-sm bg-bg-warm focus:ring-2 focus:ring-primary-light focus:outline-none"></div>
          <div class="space-y-1.5"><label class="text-xs font-medium">Relationship</label>
            <select id="rf-newrel" class="w-full border border-divider rounded-input px-3 h-11 text-sm bg-bg-warm focus:ring-2 focus:ring-primary-light focus:outline-none">
              <option>Son</option><option>Daughter</option><option>Spouse</option><option>Parent</option><option>Other</option>
            </select>
          </div>
          <div class="space-y-1.5"><label class="text-xs font-medium">Date of birth</label><input id="rf-newdob" type="date" class="w-full border border-divider rounded-input px-3 h-11 text-sm bg-bg-warm focus:ring-2 focus:ring-primary-light focus:outline-none"></div>
        </div>
      `;
    } else {
      el.innerHTML = '';
    }
  }

  function prefillMemberFields() {
    const name = document.getElementById('rf-member').value;
    const m = members.find(mm => mm.name === name);
    const el = document.getElementById('rf-member-fields');
    if (!m) { el.innerHTML = ''; return; }
    el.innerHTML = `
      <div class="grid grid-cols-1 gap-3">
        <div class="space-y-1.5"><label class="text-xs font-medium">Full name</label><input id="rf-editname" type="text" value="${m.name}" class="w-full border border-divider rounded-input px-3 h-11 text-sm bg-bg-warm focus:ring-2 focus:ring-primary-light focus:outline-none"></div>
        <div class="space-y-1.5"><label class="text-xs font-medium">Relationship</label>
          <select id="rf-editrel" class="w-full border border-divider rounded-input px-3 h-11 text-sm bg-bg-warm focus:ring-2 focus:ring-primary-light focus:outline-none">
            ${["Head","Spouse","Son","Daughter","Parent","Other"].map(r => `<option ${m.relationship===r?'selected':''}>${r}</option>`).join('')}
          </select>
        </div>
        <div class="space-y-1.5"><label class="text-xs font-medium">Date of birth</label><input id="rf-editdob" type="date" value="${m.dob||''}" class="w-full border border-divider rounded-input px-3 h-11 text-sm bg-bg-warm focus:ring-2 focus:ring-primary-light focus:outline-none"></div>
      </div>
    `;
  }

  function submitUpdateRequest() {
    if (!requestType) { toast('Please select what you\'d like to update.'); return; }
    const comments = document.getElementById('req-comments').value.trim();
    let proposedChanges = {};

    if (requestType === 'Update Family Details') {
      proposedChanges = {
        address: document.getElementById('rf-address').value.trim(),
        mobile: document.getElementById('rf-mobile').value.trim(),
        email: document.getElementById('rf-email').value.trim(),
        preferredLanguage: document.getElementById('rf-lang').value.trim(),
      };
    } else if (requestType === "Update a Member's Details") {
      const originalName = document.getElementById('rf-member')?.value;
      if (!originalName) { toast('Please select which member.'); return; }
      proposedChanges = {
        originalName,
        name: document.getElementById('rf-editname').value.trim(),
        relationship: document.getElementById('rf-editrel').value,
        dob: document.getElementById('rf-editdob').value,
      };
    } else if (requestType === 'Add a Family Member') {
      const name = document.getElementById('rf-newname').value.trim();
      if (!name) { toast('Please enter the new member\'s name.'); return; }
      proposedChanges = {
        name,
        relationship: document.getElementById('rf-newrel').value,
        dob: document.getElementById('rf-newdob').value,
      };
    }

    myRequests.unshift({
      id: 'UPD-' + Math.floor(4100 + Math.random() * 800),
      type: requestType,
      submissionDate: '26 Jul 2026',
      proposedChanges, comments, status: 'Submitted', rejectionReason: null,
    });
    toggleRequestForm();
    renderMyRequests();
    toast('Update request submitted to the parish office.');
  }
</script>

</body>
</html>
