<!DOCTYPE html>
<html lang="en">
<head>
<title>Parish Connect — My Requests</title>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          'bg-warm': '#FAFBFD', 'card-bg': '#FFFFFF', 'section-bg': '#F5F7FB', divider: '#E8EDF5',
          ink: '#1F2937', 'ink-muted': '#6B7280',
          primary: { DEFAULT: '#4F7CF5', hover: '#3F6CE4', light: '#EEF4FF' },
          coral: '#FF7F73', gold: '#F6C453', green: '#6CBF84', lavender: '#A88BFF',
          error: { DEFAULT: '#E5645A', bg: '#FDECEA' },
        },
        fontFamily: { heading: ['Manrope', 'sans-serif'], body: ['Inter', 'sans-serif'] },
        borderRadius: { card: '24px', button: '16px', input: '16px', badge: '999px' },
        boxShadow: { card: '0 6px 24px rgba(30,41,59,0.08)' },
      },
    },
  };
</script>
<style>
  body { font-family: 'Inter', sans-serif; background-color: #FAFBFD; color: #1F2937; line-height: 1.5; }
  h1, h2, .font-heading { font-family: 'Manrope', sans-serif; }
  :focus-visible { outline: 2px solid #4F7CF5; outline-offset: 2px; }
  .transition-warm { transition: all 200ms ease; }
  .icon { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .skeleton { background: linear-gradient(90deg, #E8EDF5 25%, #F2F5FA 37%, #E8EDF5 63%); background-size: 400% 100%; animation: shimmer 1.4s ease infinite; }
  @keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }
</style>
</head>
<body class="text-ink">

  <div class="max-w-[420px] mx-auto min-h-screen bg-bg-warm pb-28 relative">

    <!-- ============ TOP BAR ============ -->
    <header class="px-5 pt-5 pb-3 flex items-center gap-3">
      <button onclick="window.location.href='screen-parishioner-dashboard-home.html?' + sessionParams.toString()" aria-label="Back" class="w-10 h-10 rounded-button flex items-center justify-center text-ink-muted hover:bg-section-bg transition-warm flex-shrink-0">
        <svg class="icon" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      </button>
      <p class="font-heading font-bold text-lg">My Requests</p>
    </header>

    <!-- ============ FILTER TABS ============ -->
    <div class="px-5 pb-3 flex gap-2 overflow-x-auto">
      <button onclick="setFilter('All')" data-filter="All" class="filter-tab px-4 py-2 rounded-badge text-xs font-semibold whitespace-nowrap transition-warm bg-primary text-white">All</button>
      <button onclick="setFilter('New')" data-filter="New" class="filter-tab px-4 py-2 rounded-badge text-xs font-semibold whitespace-nowrap transition-warm bg-card-bg text-ink-muted">New</button>
      <button onclick="setFilter('In Progress')" data-filter="In Progress" class="filter-tab px-4 py-2 rounded-badge text-xs font-semibold whitespace-nowrap transition-warm bg-card-bg text-ink-muted">In Progress</button>
      <button onclick="setFilter('Awaiting Action')" data-filter="Awaiting Action" class="filter-tab px-4 py-2 rounded-badge text-xs font-semibold whitespace-nowrap transition-warm bg-card-bg text-ink-muted">Awaiting Action</button>
      <button onclick="setFilter('Completed')" data-filter="Completed" class="filter-tab px-4 py-2 rounded-badge text-xs font-semibold whitespace-nowrap transition-warm bg-card-bg text-ink-muted">Completed</button>
    </div>

    <main id="main-content" class="px-5 space-y-3"></main>

    <div class="px-5 mt-6">
      <button onclick="window.location.href='screen-parishioner-documents-request.html?' + sessionParams.toString()" class="w-full bg-primary hover:bg-primary-hover text-white text-sm font-semibold py-3.5 rounded-button min-h-[48px] transition-warm">Request Another Document</button>
    </div>

  </div>

  <!-- ============ BOTTOM NAV (5 items) ============ -->
  <nav class="fixed bottom-0 left-0 right-0 bg-card-bg border-t border-divider max-w-[420px] mx-auto">
    <div class="grid grid-cols-5">
      <button onclick="window.location.href='screen-parishioner-dashboard-home.html?' + sessionParams.toString()" class="flex flex-col items-center gap-1 py-3 text-ink-muted">
        <svg class="icon" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/></svg>
        <span class="text-[10.5px]">Home</span>
      </button>
      <button onclick="window.location.href='screen-parishioner-services-hub.html?' + sessionParams.toString()" class="flex flex-col items-center gap-1 py-3 text-primary">
        <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="4" width="7" height="7" rx="1.5"/><rect x="14" y="4" width="7" height="7" rx="1.5"/><rect x="3" y="15" width="7" height="7" rx="1.5"/><rect x="14" y="15" width="7" height="7" rx="1.5"/></svg>
        <span class="text-[10.5px] font-semibold">Services</span>
      </button>
      <button onclick="window.location.href='screen-parishioner-donate-hub.html?' + sessionParams.toString()"" class="flex flex-col items-center gap-1 py-3 text-ink-muted">
        <svg class="icon" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-10-9.3C.4 8.4 2.3 5 5.7 5 8 5 10 6.3 12 9c2-2.7 4-4 6.3-4 3.4 0 5.3 3.4 3.7 6.7C19.5 16.4 12 21 12 21Z"/></svg>
        <span class="text-[10.5px]">Give</span>
      </button>
      <button onclick="window.location.href='screen-parishioner-family.html?' + sessionParams.toString()" class="flex flex-col items-center gap-1 py-3 text-ink-muted">
        <svg class="icon" viewBox="0 0 24 24"><circle cx="9" cy="7" r="3.5"/><path d="M2 21v-1a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v1"/><circle cx="18" cy="8" r="2.5"/></svg>
        <span class="text-[10.5px]">My Family</span>
      </button>
      <button onclick="window.location.href='screen-parishioner-me-hub.html?' + sessionParams.toString()"" class="flex flex-col items-center gap-1 py-3 text-ink-muted">
        <svg class="icon" viewBox="0 0 24 24"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
        <span class="text-[10.5px]">Menu</span>
      </button>
    </div>
  </nav>

<script>
  const sessionParams = new URLSearchParams(window.location.search);

  // ---------------- Mock data (from mock-seed.json documentRequests) ----------------
  const requests = [
    {
      id: "REQ-3001", documentTypeName: "Baptism Certificate", forMemberName: "Clara Rodrigues",
      purpose: "School admission for Clara", requestStatus: "Under Review", submissionDate: "20 Jul 2026", lastUpdated: "22 Jul 2026",
      requestReference: "DOC-REQ-2026-0142", paymentStatus: "Paid", deliveryStatus: "Not Ready",
      internalNotes: "",
    },
    {
      id: "REQ-3002", documentTypeName: "No Objection / Good Standing Certificate", forMemberName: "John Rodrigues",
      purpose: "Godparent eligibility for a relative's child", requestStatus: "Submitted", submissionDate: "24 Jul 2026", lastUpdated: "24 Jul 2026",
      requestReference: "DOC-REQ-2026-0158", paymentStatus: "Paid", deliveryStatus: "Not Ready",
      internalNotes: "",
    },
    {
      id: "REQ-3003", documentTypeName: "Confirmation Certificate", forMemberName: "Kevin Rodrigues",
      purpose: "College admission documentation", requestStatus: "Awaiting Information", submissionDate: "15 Jul 2026", lastUpdated: "25 Jul 2026",
      requestReference: "DOC-REQ-2026-0121", paymentStatus: "Paid", deliveryStatus: "Not Ready",
      internalNotes: "The baptism certificate copy you uploaded is illegible — please upload a clearer scan.",
    },
    {
      id: "REQ-3004", documentTypeName: "First Communion Certificate", forMemberName: "Clara Rodrigues",
      purpose: "Confirmation preparation enrollment", requestStatus: "Completed", submissionDate: "10 Jun 2026", lastUpdated: "13 Jun 2026",
      requestReference: "DOC-REQ-2026-0079", paymentStatus: "Paid", deliveryStatus: "Delivered", deliveredDate: "13 Jun 2026",
      internalNotes: "",
    },
    {
      id: "REQ-3005", documentTypeName: "Parish Transfer Certificate", forMemberName: "John Rodrigues",
      purpose: "Requested in error — family is not transferring parish", requestStatus: "Rejected", submissionDate: "2 May 2026", lastUpdated: "3 May 2026",
      requestReference: "DOC-REQ-2026-0044", paymentStatus: "Not Required", deliveryStatus: "Not Ready",
      internalNotes: "Parishioner confirmed this was submitted by mistake; no transfer intended.",
    },
  ];

  const MONTH_NAMES = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const TODAY = new Date(2026, 6, 26); // 26 Jul 2026
  function parseDate(str) {
    const [d, mon, y] = str.split(' ');
    return new Date(Number(y), MONTH_NAMES.indexOf(mon), Number(d));
  }
  function daysAgo(str) {
    return Math.round((TODAY - parseDate(str)) / 86400000);
  }
  function isRecentlyUpdated(r) {
    return daysAgo(r.lastUpdated) <= 3;
  }

  function displayStage(status) {
    if (['Draft','Submitted'].includes(status)) return 'New';
    if (['Under Review','Pending Approval'].includes(status)) return 'In Progress';
    if (status === 'Awaiting Information') return 'Awaiting Action';
    if (['Approved','Completed'].includes(status)) return 'Completed';
    if (['Rejected','Cancelled'].includes(status)) return 'Rejected';
    return status;
  }

  const STAGE_STYLE = {
    'New': ['bg-lavender/20', 'text-[#5b3fc4]', 'plus'],
    'In Progress': ['bg-gold/20', 'text-[#8a5a10]', 'clock'],
    'Awaiting Action': ['bg-coral/20', 'text-[#b1402f]', 'alert'],
    'Completed': ['bg-green/20', 'text-[#2f6b45]', 'check'],
    'Rejected': ['bg-error-bg', 'text-error', 'x'],
  };

  const ICON_PATHS = {
    plus: '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
    clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    alert: '<path d="M12 9v4"/><circle cx="12" cy="16.5" r="0.75" fill="currentColor" stroke="none"/><path d="M10.3 3.9 2.6 17a2 2 0 0 0 1.7 3h15.4a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/>',
    check: '<path d="M20 6 9 17l-5-5"/>',
    x: '<path d="M18 6 6 18"/><path d="M6 6l12 12"/>',
    chevronDown: '<polyline points="6 9 12 15 18 9"/>',
  };
  function icon(name, cls) { return `<svg class="${cls||'icon'}" viewBox="0 0 24 24">${ICON_PATHS[name]}</svg>`; }

  // Builds a simple linear activity timeline per request based on its current status/notes.
  function buildTimeline(r) {
    const submitted = { label: 'Submitted', date: r.submissionDate, state: 'done' };
    if (r.requestStatus === 'Submitted') {
      return [{ ...submitted, state: 'current' }];
    }
    if (r.requestStatus === 'Under Review') {
      return [submitted, { label: 'Under Review', date: 'In progress', state: 'current' }];
    }
    if (r.requestStatus === 'Awaiting Information') {
      return [
        submitted,
        { label: 'Under Review', date: '', state: 'done' },
        { label: 'Awaiting Information', date: r.internalNotes, state: 'current-alert' },
      ];
    }
    if (r.requestStatus === 'Completed') {
      return [
        submitted,
        { label: 'Under Review', date: '', state: 'done' },
        { label: 'Approved', date: '', state: 'done' },
        { label: 'Document Generated', date: '', state: 'done' },
        { label: 'Delivered', date: r.deliveredDate, state: 'done' },
      ];
    }
    if (r.requestStatus === 'Rejected') {
      return [
        submitted,
        { label: 'Under Review', date: '', state: 'done' },
        { label: 'Rejected', date: r.internalNotes, state: 'current-reject' },
      ];
    }
    return [submitted];
  }

  function renderTimeline(r) {
    const steps = buildTimeline(r);
    return `
      <div class="px-5 pb-5 pt-1 space-y-0">
        ${steps.map((s, i) => `
          <div class="flex gap-3">
            <div class="flex flex-col items-center">
              <span class="w-3 h-3 rounded-full flex-shrink-0 mt-1 ${
                s.state === 'current-reject' ? 'bg-error' :
                s.state === 'current-alert' ? 'bg-coral' :
                s.state === 'current' ? 'bg-primary' : 'bg-green'
              }"></span>
              ${i < steps.length - 1 ? '<span class="w-px flex-1 bg-divider my-1"></span>' : ''}
            </div>
            <div class="pb-4 min-w-0">
              <p class="text-sm font-semibold">${s.label}</p>
              ${s.date ? `<p class="text-xs text-ink-muted mt-0.5">${s.date}</p>` : ''}
            </div>
          </div>
        `).join('')}
      </div>
    `;
  }

  let expandedId = null;
  let currentFilter = 'All';

  function toggleExpand(id) {
    expandedId = expandedId === id ? null : id;
    renderList();
  }

  function setFilter(f) {
    currentFilter = f;
    document.querySelectorAll('.filter-tab').forEach(btn => {
      const active = btn.dataset.filter === f;
      btn.className = `filter-tab px-4 py-2 rounded-badge text-xs font-semibold whitespace-nowrap transition-warm ${active ? 'bg-primary text-white' : 'bg-card-bg text-ink-muted'}`;
    });
    renderList();
  }

  function renderList() {
    const main = document.getElementById('main-content');
    const filtered = requests
      .filter(r => currentFilter === 'All' || displayStage(r.requestStatus) === currentFilter)
      .sort((a, b) => parseDate(b.lastUpdated) - parseDate(a.lastUpdated));

    if (filtered.length === 0) {
      main.innerHTML = `
        <div class="bg-card-bg rounded-card shadow-card p-8 text-center space-y-2 mt-2">
          <p class="text-sm font-semibold">No requests here</p>
          <p class="text-sm text-ink-muted">Nothing in "${currentFilter}" right now.</p>
        </div>
      `;
      return;
    }

    main.innerHTML = filtered.map(r => {
      const stage = displayStage(r.requestStatus);
      const [bg, text, iconName] = STAGE_STYLE[stage];
      const isOpen = expandedId === r.id;
      const recent = isRecentlyUpdated(r);
      return `
        <div class="bg-card-bg rounded-card shadow-card overflow-hidden ${recent ? 'border-l-4 border-primary' : ''}">
          <button onclick="toggleExpand('${r.id}')" class="w-full text-left p-5 flex items-start justify-between gap-3 min-h-[44px] transition-warm hover:bg-section-bg">
            <div class="min-w-0">
              ${recent ? `<span class="bg-primary-light text-primary text-[10px] font-bold px-2 py-0.5 rounded-badge inline-block mb-1.5">UPDATED</span>` : ''}
              <p class="text-sm font-semibold">${r.documentTypeName}</p>
              <p class="text-xs text-ink-muted mt-1">For ${r.forMemberName} · ${r.requestReference}</p>
              <p class="text-xs text-ink-muted mt-0.5">Last updated ${r.lastUpdated}</p>
            </div>
            <div class="flex flex-col items-end gap-2 flex-shrink-0">
              <span class="${bg} ${text} text-xs font-semibold px-3 py-1.5 rounded-badge whitespace-nowrap flex items-center gap-1.5">${icon(iconName, 'w-3 h-3')}${stage}</span>
              <span class="text-ink-muted transition-warm" style="transform: rotate(${isOpen ? '180' : '0'}deg)">${icon('chevronDown', 'w-4 h-4')}</span>
            </div>
          </button>
          ${isOpen ? `<div class="border-t border-divider"><p class="text-xs font-semibold text-ink-muted uppercase tracking-wide px-5 pt-4 pb-1">Activity Timeline</p>${renderTimeline(r)}</div>` : ''}
        </div>
      `;
    }).join('');
  }

  function renderLoading() {
    document.getElementById('main-content').innerHTML = `
      <div class="skeleton rounded-card" style="height:88px"></div>
      <div class="skeleton rounded-card" style="height:88px"></div>
      <div class="skeleton rounded-card" style="height:88px"></div>
    `;
  }

  renderLoading();
  setTimeout(renderList, 700);
</script>

</body>
</html>
