    return p;
  }

  function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('-translate-x-full');
    document.getElementById('sidebar-backdrop').classList.toggle('hidden');
  }
  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.remove('opacity-0'); t.classList.add('opacity-100');
    clearTimeout(window._t);
    window._t = setTimeout(() => { t.classList.remove('opacity-100'); t.classList.add('opacity-0'); }, 1800);

  function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
  const MONTH_NAMES = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

    if (!iso) return '\u2014';

    return `${d} ${MONTH_NAMES[m-1]} ${y}`;
  }
  function statusPill(status) {
    const map = { 'Published':['bg-green/20','text-[#2f6b45]'], 'Draft':['bg-gold/20','text-[#8a5a10]'], 'Archived':['bg-section-bg','text-ink-muted'] };

  let dioceseTemplates = [
    { id:"DTPL-001", name:"Diocesan Circular Template", category:"Parish Communications", status:"Published" },
    { id:"DTPL-002", name:"Bishop's Pastoral Letter Template", category:"Administrative Letters", status:"Published" },
    { id:"DTPL-003", name:"Parish Visitation Report Template", category:"Reports", status:"Published" },
    { id:"DTPL-004", name:"Diocesan Event Invitation Template", category:"Event Documents", status:"Draft" },
  ];
  function renderTemplatesModule(el) {
    el.innerHTML = `
      <div class="flex justify-end mb-4">
        <button onclick="openTemplateModal()" class="bg-primary hover:bg-primary-hover text-white text-sm font-semibold px-4 py-2.5 rounded-button min-h-[40px] transition-warm flex items-center gap-1.5">${icon('plus','icon w-4 h-4')}Add Template</button>
      </div>
      <div class="grid md:grid-cols-2 gap-4">
        ${dioceseTemplates.map(t => `
          <div class="bg-card-bg rounded-card shadow-card p-5">
            <div class="flex items-start justify-between gap-3 mb-1">
              <p class="text-sm font-semibold">${t.name}</p>
              ${statusPill(t.status)}
            </div>
            <p class="text-xs text-ink-muted">${t.category} · Available to all parishes once published</p>
            <div class="flex gap-2 mt-3">
              <button onclick="openTemplateModal('${t.id}')" class="bg-section-bg text-ink text-xs font-semibold px-3 py-2 rounded-button min-h-[36px] transition-warm hover:bg-primary-light">Edit</button>
              ${t.status !== 'Archived' ? `<button onclick="archiveTemplate('${t.id}')" class="bg-white border border-divider text-ink-muted text-xs font-semibold px-3 py-2 rounded-button min-h-[36px] transition-warm hover:bg-section-bg">Archive</button>` : ''}
            </div>
          </div>
        `).join('')}
      </div>
    `;
  }
  const TEMPLATE_CATEGORIES = ["Certificates", "Letters & Testimonials", "Administrative Letters", "Parish Communications", "Reports", "Event Documents"];
  let editingTemplateId = null;
  function openTemplateModal(editId) {
    editingTemplateId = editId || null;
    const t = editId ? dioceseTemplates.find(x => x.id === editId) : null;
    document.getElementById('template-modal-title').textContent = t ? 'Edit Template' : 'Add Template';
    document.getElementById('template-modal').classList.remove('hidden');
    document.getElementById('template-form').innerHTML = `
      <div class="space-y-1.5"><label class="text-xs font-medium">Template name</label><input id="tf-name" type="text" value="${t ? t.name : ''}" class="w-full border border-divider rounded-input px-3 h-10 text-sm bg-white focus:ring-2 focus:ring-primary-light focus:outline-none"></div>
      <div class="space-y-1.5"><label class="text-xs font-medium">Category</label>
        <select id="tf-category" class="w-full border border-divider rounded-input px-3 h-10 text-sm bg-white focus:ring-2 focus:ring-primary-light focus:outline-none">
          ${TEMPLATE_CATEGORIES.map(cat => `<option ${t && t.category===cat ? 'selected' : ''}>${cat}</option>`).join('')}
        </select>
      </div>
      <p class="text-xs text-ink-muted">Template layout and placeholder design happen outside this prototype's scope \u2014 this manages the template's availability to parishes, not its content.</p>
    `;
  }
  function submitTemplate(status) {
    const name = document.getElementById('tf-name').value.trim();
    if (!name) { toast('Please enter a template name.'); return; }
    const category = document.getElementById('tf-category').value;
    if (editingTemplateId) {
      Object.assign(dioceseTemplates.find(x => x.id === editingTemplateId), { name, category, status });
    } else {
      dioceseTemplates.unshift({ id:'DTPL-'+Math.floor(100+Math.random()*899), name, category, status });
    }
    toast(`${name} ${status === 'Published' ? 'published' : 'saved as draft'}.`);
    editingTemplateId = null;
    closeModal('template-modal');
    renderModule();
  }
  function archiveTemplate(id) {
    const t = dioceseTemplates.find(x => x.id === id);
    t.status = 'Archived';
    toast(`${t.name} archived.`);
    renderModule();
  }

  renderModule();
</script>

</body>
</html>
