  }
  function refreshListBody() {
    const k = kindNow, all = messages.filter(m => m.kind === k.key), q = listSearch.trim().toLowerCase();
    const list = all.filter(m => (listStatus === 'All' || m.status === listStatus) && (!q || (m.title + ' ' + plain(m.body) + ' ' + m.refNo).toLowerCase().includes(q))).sort((a, b) => (b.sentDate || b.scheduledFor || b.createdDate).localeCompare(a.sentDate || a.scheduledFor || a.createdDate));

  function defaults(kind) {

      body:'', attachments:[], audience: aud('all', {}, roles), channels:{ inApp:true, email: kind !== 'broadcast', sms:false, whatsapp:false }, status:'Draft', createdBy:'Diocese Office', createdDate:TODAY, sentDate:null, scheduledFor:null, when:'now', schedDate:'', schedTime:'09:00' };
  }

    openComposer();
  }
  function duplicateMessage(id) {

  function deleteMessage(id) { const m = messages.find(x => x.id === id); messages = messages.filter(x => x.id !== id); deletingMsgId = null; toast(`${m.kind === 'broadcast' ? 'Broadcast' : '\u201c' + m.title + '\u201d'} deleted.`); rerender(); }

  function smsHTML(m) {
    return `<div style="width:340px;background:#F5F7FB;border-radius:28px;padding:24px 18px 30px;font-family:'Inter',sans-serif;">
      <p style="margin:0 0 4px;text-align:center;font-size:12px;font-weight:600;">DIOCESE-BLR</p><p style="margin:0 0 16px;text-align:center;font-size:11px;color:#9CA3AF;">Text message \u00b7 ${dotDate(TODAY)}</p>
      <div style="background:#fff;border-radius:18px 18px 18px 4px;padding:12px 14px;font-size:14px;line-height:1.45;box-shadow:0 2px 8px rgba(30,41,59,.06);">${esc(m.body || 'Your message appears here\u2026')}</div>
      <p style="margin:8px 0 0;font-size:11px;color:#9CA3AF;">${(m.body || '').length} characters${(m.body || '').length > 160 ? ' \u00b7 will be sent as ' + Math.ceil((m.body || '').length / 153) + ' messages' : ''}</p></div>`;
  }
  function previewFor(m, tab) {
    if (tab === 'notif') return notifHTML(m);

  }
  function setPreviewTabC(t) { previewTabC = t; rerender(true); }
  function previewBody(tab) {
    const isLetter = cm.kind === 'circular' && tab === 'doc';
    return isLetter ? `<div id="prev-wrap" class="mx-auto shadow-card bg-white overflow-hidden" style="border:1px solid #E8EDF5;"><div id="prev-inner" style="transform-origin:top left;width:${LETTER_W}px;">${previewFor(cm, tab)}</div></div>` : `<div class="flex justify-center overflow-x-auto pb-1">${previewFor(cm, tab)}</div>`;
  }
  function refreshPreview() { const el = document.getElementById('prev-body'); if (el) { el.innerHTML = previewBody(previewTabC); fitDoc('prev-wrap', 'prev-inner'); } }
  function fitDoc(wrapId, innerId) {
    const wrap = document.getElementById(wrapId), inner = document.getElementById(innerId); if (!wrap || !inner) return;
    const avail = wrap.parentElement.clientWidth; if (!avail) return;
    const sc = Math.min(1, avail / LETTER_W);
    inner.style.transform = `scale(${sc})`; wrap.style.width = Math.round(LETTER_W * sc) + 'px'; wrap.style.height = Math.round(inner.offsetHeight * sc) + 'px';
  }

  function toggleRow(label, hint, checked, fn) {
    return `<label class="flex items-center justify-between gap-3 py-2.5 cursor-pointer"><span><span class="text-sm font-medium block">${label}</span><span class="text-xs text-ink-muted">${hint}</span></span><input type="checkbox" ${checked ? 'checked' : ''} onchange="${fn}" class="w-5 h-5 accent-[#4F7CF5] flex-shrink-0"></label>`;

    const tab = (id, label) => `<button onclick="setPreviewTabC('${id}')" aria-pressed="${previewTabC === id}" class="px-3.5 h-9 rounded-badge text-xs font-semibold transition-warm ${previewTabC === id ? 'bg-white text-primary shadow-card' : 'text-ink-muted hover:text-ink'}">${label}</button>`;
    const sendLabel = cm.when === 'later' ? 'Schedule' : (cm.kind === 'broadcast' ? 'Send broadcast' : 'Send now');
    const rte = k.key !== 'broadcast';
    return `
      <button onclick="backToList()" class="inline-flex items-center gap-1.5 text-sm font-semibold text-ink-muted hover:text-primary mb-3 min-h-[40px] transition-warm">${icon('back','icon w-4 h-4')}All ${k.plural}</button>

      <div class="grid lg:grid-cols-[minmax(0,1fr)_440px] gap-6 items-start">
        <div class="space-y-5 min-w-0">
          <section class="bg-card-bg rounded-card shadow-card p-5 sm:p-6 space-y-4">

            : `
              <div class="space-y-1.5"><label class="text-xs font-medium" for="f-title">${k.key === 'circular' ? 'Subject' : 'Title'}</label><input id="f-title" type="text" value="${esc(cm.title)}" oninput="setC('title', this.value)" placeholder="${k.key === 'circular' ? 'e.g. Mass timing changes for the Feast of Christ the King' : 'e.g. Chrism Mass \u2014 Save the Date'}" class="w-full border border-divider rounded-input px-3.5 h-11 text-sm bg-white focus:ring-2 focus:ring-primary-light focus:outline-none"></div>
              ${k.key === 'circular' ? `<div class="grid sm:grid-cols-3 gap-3">
                <div class="space-y-1.5 min-w-0"><label class="text-xs font-medium" for="f-ref">Circular number</label><input id="f-ref" type="text" value="${esc(cm.refNo)}" oninput="setC('refNo', this.value)" class="w-full min-w-0 box-border border border-divider rounded-input px-3 h-11 text-sm bg-white focus:ring-2 focus:ring-primary-light focus:outline-none"></div>
                <div class="space-y-1.5 min-w-0"><label class="text-xs font-medium" for="f-cat">Category</label><select id="f-cat" onchange="setC('category', this.value)" class="w-full min-w-0 box-border border border-divider rounded-input px-3 h-11 text-sm bg-white focus:ring-2 focus:ring-primary-light focus:outline-none">${CIRCULAR_CATEGORIES.map(c => `<option ${cm.category === c ? 'selected' : ''}>${c}</option>`).join('')}</select></div>
                <div class="space-y-1.5 min-w-0"><label class="text-xs font-medium" for="f-sign">Signed by</label><input id="f-sign" type="text" value="${esc(cm.signer)}" oninput="setC('signer', this.value)" class="w-full min-w-0 box-border border border-divider rounded-input px-3 h-11 text-sm bg-white focus:ring-2 focus:ring-primary-light focus:outline-none"></div>
              </div>` : ''}
              <div class="space-y-1.5">
                <div class="flex items-center justify-between gap-2"><label class="text-xs font-medium" id="body-label">Content</label>
                  <span class="flex items-center gap-3"><span id="body-count" class="text-xs text-ink-muted">${plain(cm.body).split(' ').filter(Boolean).length} words</span>
                  <span class="relative"><button type="button" onclick="openStarter=!openStarter; rerender(true)" aria-expanded="${openStarter}" class="text-primary text-xs font-semibold hover:underline">Start from a template</button>
                  ${openStarter ? `<div class="absolute right-0 top-7 z-20 bg-card-bg rounded-card shadow-card w-60 py-1.5 border border-divider">${STARTERS[cm.kind].map((s, i) => `<button onclick="useStarter(${i})" class="w-full text-left px-4 py-2.5 text-sm hover:bg-section-bg min-h-[44px]">${s[0]}</button>`).join('')}</div>` : ''}</span></span></div>
                <div class="rte-wrap border border-divider rounded-input bg-white overflow-hidden">
                  <div class="flex items-center gap-1 px-2 py-1.5 border-b border-divider bg-bg-warm" role="toolbar" aria-label="Text formatting">
                    <button type="button" onmousedown="event.preventDefault(); fmtCmd('bold')" aria-label="Bold" class="w-9 h-9 rounded-button text-sm font-bold text-ink-muted hover:bg-section-bg">B</button>
                    <button type="button" onmousedown="event.preventDefault(); fmtCmd('italic')" aria-label="Italic" class="w-9 h-9 rounded-button text-sm italic font-semibold text-ink-muted hover:bg-section-bg">I</button>
                    <button type="button" onmousedown="event.preventDefault(); fmtCmd('insertUnorderedList')" aria-label="Bulleted list" class="px-2.5 h-9 rounded-button text-xs font-semibold text-ink-muted hover:bg-section-bg">\u2022 List</button>
                    <button type="button" onmousedown="event.preventDefault(); fmtCmd('insertOrderedList')" aria-label="Numbered list" class="px-2.5 h-9 rounded-button text-xs font-semibold text-ink-muted hover:bg-section-bg">1. List</button>
                    <button type="button" onmousedown="event.preventDefault(); fmtCmd('removeFormat')" aria-label="Clear formatting" class="px-2.5 h-9 rounded-button text-xs font-semibold text-ink-muted hover:bg-section-bg">Clear</button>
                  </div>
                  <div class="rte px-4 py-3 text-sm leading-relaxed" contenteditable="true" role="textbox" aria-multiline="true" aria-labelledby="body-label" data-placeholder="Type or paste the full text here\u2026" oninput="onBody(this)" onpaste="pasteText(event)">${cm.body}</div>
                </div>
              </div>
              <div class="space-y-2">
                <p class="text-xs font-medium">Attachments</p>
                <div class="flex flex-wrap items-center gap-2">
                  ${cm.attachments.map((f, i) => `<span class="bg-section-bg text-ink text-xs font-medium pl-3 pr-1.5 py-1.5 rounded-badge inline-flex items-center gap-1.5">${icon('attachment','icon w-3.5 h-3.5')}${esc(f)}<button onclick="removeAttachment(${i})" aria-label="Remove ${esc(f)}" class="w-6 h-6 rounded-full hover:bg-white flex items-center justify-center">${icon('close','icon w-3.5 h-3.5')}</button></span>`).join('')}
                  <label class="inline-flex items-center gap-1.5 text-primary text-xs font-semibold px-3 h-9 rounded-badge border border-dashed border-primary cursor-pointer hover:bg-primary-light transition-warm focus-within:ring-2 focus-within:ring-primary">${icon('plus','icon w-3.5 h-3.5')}Add file<input type="file" multiple class="sr-only" onchange="addAttachment(this)"></label>
                </div>
              </div>`}
          </section>

          <section class="bg-card-bg rounded-card shadow-card p-5 sm:p-6">
            <h2 class="font-heading font-semibold text-lg mb-4">2. Who should receive it?</h2>
            <div id="aud-body">${audienceBody()}</div>
          </section>

          <section class="bg-card-bg rounded-card shadow-card p-5 sm:p-6 space-y-4">
            <h2 class="font-heading font-semibold text-lg">3. How and when</h2>
            <div><p class="text-xs font-medium mb-2">Send through</p>
              <div class="flex flex-wrap gap-2" role="group" aria-label="Channels">${CHANNELS.map(([c, l]) => `<label class="flex items-center gap-2 text-sm px-4 py-2.5 rounded-badge cursor-pointer min-h-[44px] ${cm.channels[c] ? 'bg-primary-light text-primary font-semibold' : 'bg-section-bg'}"><input type="checkbox" ${cm.channels[c] ? 'checked' : ''} onchange="setChannel('${c}', this.checked); rerender(true)" class="accent-[#4F7CF5]">${l}</label>`).join('')}</div>
              <p class="text-xs text-ink-muted mt-2">In-app messages appear inside Parish Connect. Email, SMS and WhatsApp go to the phone numbers and addresses parishes have on file.</p></div>
            <div class="divide-y divide-divider">
              ${cm.kind === 'circular' ? toggleRow('Ask parish priests to acknowledge receipt', 'You will see which parishes have confirmed.', cm.requireAck, "cm.requireAck=this.checked; touch(); refreshPreview()") : ''}
              ${cm.kind === 'announcement' ? toggleRow('Pin to the top of parish announcements', 'Stays at the top until you unpin it.', cm.pinned, "cm.pinned=this.checked; touch(); refreshPreview()") : ''}
            </div>

              <div class="flex flex-wrap gap-2 mb-3" role="radiogroup" aria-label="When to send">
                <label class="flex items-center gap-2 text-sm px-4 py-2.5 rounded-badge cursor-pointer min-h-[44px] ${cm.when === 'now' ? 'bg-primary-light text-primary font-semibold' : 'bg-section-bg'}"><input type="radio" name="when" ${cm.when === 'now' ? 'checked' : ''} onchange="setCStruct('when','now')" class="accent-[#4F7CF5]">Send now</label>
                <label class="flex items-center gap-2 text-sm px-4 py-2.5 rounded-badge cursor-pointer min-h-[44px] ${cm.when === 'later' ? 'bg-primary-light text-primary font-semibold' : 'bg-section-bg'}"><input type="radio" name="when" ${cm.when === 'later' ? 'checked' : ''} onchange="setCStruct('when','later')" class="accent-[#4F7CF5]">Schedule for later</label>

  }

  // --- validate, save, send ---
  function validateMsg() {
    const items = [];
    if (cm.kind !== 'broadcast' && !cm.title.trim()) items.push(cm.kind === 'circular' ? 'Add the subject.' : 'Add a title.');
    if (cm.kind === 'circular' && !cm.refNo.trim()) items.push('Add the circular number.');
    if (cm.kind === 'broadcast' ? !cm.body.trim() : !plain(cm.body)) items.push(cm.kind === 'broadcast' ? 'Write the message.' : 'Write the content.');
    if (cm.kind === 'broadcast' && cm.body.length > 480) items.push('The message is too long even for several texts. Please shorten it.');
    const r = reachOf(cm.audience);
    if (r.parishes === 0) items.push(cm.audience.scope === 'tier' ? 'Choose at least one parish size.' : 'Choose at least one parish.');
    else if (r.total === 0) items.push('Choose who in those parishes should receive it.');
    if (!Object.values(cm.channels).some(Boolean)) items.push('Choose at least one way to send it.');
    if (cm.when === 'later') {
      if (!cm.schedDate) items.push('Pick the date to send it.');
      else if (cm.schedDate < TODAY || (cm.schedDate === TODAY && cm.schedTime <= '09:00' && false)) items.push('The date to send it can\u2019t be in the past.');
    }
    return items;
  }
  function failCompose(title, items) { composeErrors = { title, items }; rerender(true); window.scrollTo({ top: 0, behavior: 'smooth' }); }
  function commitMsg(status) {
    const out = JSON.parse(JSON.stringify(cm));
    out.status = status;
    if (status === 'Sent') { out.sentDate = TODAY; out.scheduledFor = null; }
    else if (status === 'Scheduled') { out.scheduledFor = cm.schedDate + 'T' + (cm.schedTime || '09:00'); out.sentDate = null; }
    else { out.scheduledFor = null; out.sentDate = null; }
    if (cm.kind === 'broadcast') out.title = '';
    ['when', 'schedDate', 'schedTime'].forEach(k => delete out[k]);
    const i = messages.findIndex(m => m.id === out.id);
    if (i >= 0) messages[i] = out; else messages.unshift(out);
    dirtyMsg = false; commView = 'list'; cm = null; return out;
  }
  function saveMessageDraft() {
    if (!cm.title.trim() && !plain(cm.body)) { failCompose('There is nothing to save yet', ['Add a title or some content first.']); return; }
    if (cm.kind !== 'broadcast' && !cm.title.trim()) cm.title = 'Untitled';
    const out = commitMsg('Draft'); toast('Draft saved.'); rerender();
  }
  function startSend() {
    const items = validateMsg();
    if (items.length) { failCompose('A few things are needed before this can go out', items); return; }
    const r = reachOf(cm.audience), later = cm.when === 'later', k = KINDS[cm.kind];
    const names = parishesOf(cm.audience).slice(0, 3).map(p => esc(p.name));
    confirmDialog({
      title: later ? `Schedule this ${k.noun.toLowerCase()}?` : `Send this ${k.noun.toLowerCase()} now?`,
      body: `<p><b class="text-ink">${esc(cm.kind === 'broadcast' ? plain(cm.body).slice(0, 70) : cm.title)}</b></p>
        <div class="bg-section-bg rounded-card px-4 py-3 space-y-1"><p><b class="text-ink">${scopeText(cm.audience)}</b>${cm.audience.scope === 'specific' ? ': ' + names.join(', ') + (cm.audience.parishIds.length > 3 ? ' and ' + (cm.audience.parishIds.length - 3) + ' more' : '') : ''}</p><p>${rolesText(cm.audience)}</p><p><b class="text-ink">${fmtNum(r.total)}</b> people (estimated) \u00b7 ${channelNames(cm).join(', ')}</p></div>
        <p>${later ? 'It will go out on <b class="text-ink">' + longDate(cm.schedDate) + ' at ' + timeOf(cm.schedDate + 'T' + cm.schedTime) + '</b>. You can still edit or cancel it before then.' : 'Once sent, it <b class="text-ink">can\u2019t be recalled or edited</b>.'}</p>`,
      label: later ? 'Schedule' : 'Send now', onConfirm: doSend });
  }
  function doSend() {
    const btn = document.getElementById('send-btn'); if (btn) { btn.disabled = true; btn.textContent = cm.when === 'later' ? 'Scheduling\u2026' : 'Sending\u2026'; }
    setTimeout(() => {
      const later = cm.when === 'later', k = KINDS[cm.kind], r = reachOf(cm.audience), when = later ? longDate(cm.schedDate) : '';
      const out = commitMsg(later ? 'Scheduled' : 'Sent');
      toast(later ? `${k.noun} scheduled for ${formatDate(out.scheduledFor.slice(0, 10))}.` : `${k.noun} sent to ${fmtNum(r.total)} people in ${r.parishes} ${r.parishes === 1 ? 'parish' : 'parishes'}.`);
      listStatus = 'All'; rerender();
    }, 800);
  }

  // =========================================================================
  // VIEW (read-only, with audience + delivery)
  // =========================================================================
  function renderViewPage() {
    const m = messages.find(x => x.id === viewId); if (!m) { commView = 'list'; return renderCommList(); }
    const k = KINDS[m.kind], r = reachOf(m.audience), st = m.status === 'Sent' ? statsOf(m) : null;
    const ps = parishesOf(m.audience);
    const doc = m.kind === 'circular' ? `<div id="view-wrap" class="mx-auto shadow-card bg-white overflow-hidden" style="border:1px solid #E8EDF5;"><div id="view-inner" style="transform-origin:top left;width:${LETTER_W}px;">${letterHTML(m)}</div></div>`
      : m.kind === 'announcement' ? `<div class="flex justify-center overflow-x-auto">${announcementCardHTML(m)}</div>`
      : `<div class="flex flex-wrap gap-6 justify-center">${notifHTML(m)}${m.channels.sms ? smsHTML(m) : ''}</div>`;
    const bar = (label, pct, tone) => `<div><div class="flex items-center justify-between text-xs mb-1"><span class="text-ink-muted">${label}</span><span class="font-semibold">${pct}%</span></div><div class="h-2 bg-section-bg rounded-badge overflow-hidden"><div class="h-full ${tone} rounded-badge" style="width:${pct}%"></div></div></div>`;
    return `
      <button onclick="backToList()" class="inline-flex items-center gap-1.5 text-sm font-semibold text-ink-muted hover:text-primary mb-3 min-h-[40px] transition-warm">${icon('back','icon w-4 h-4')}All ${k.plural}</button>
      <div class="flex flex-wrap items-start justify-between gap-4 mb-5">
        <div class="min-w-0"><div class="flex flex-wrap items-center gap-2 mb-1">${statusPill(m)}${m.pinned ? '<span class="bg-gold/20 text-[#8a5a10] text-xs font-semibold px-2.5 py-1 rounded-badge">Pinned</span>' : ''}<span class="text-xs text-ink-muted">${whenText(m)}</span></div>
          <p class="font-heading font-bold text-2xl">${esc(m.kind === 'broadcast' ? 'Broadcast' : m.title)}</p>${m.kind === 'circular' ? `<p class="text-sm text-ink-muted mt-0.5">${esc(m.refNo)} \u00b7 ${esc(m.category)}</p>` : ''}</div>
        <div class="flex flex-wrap items-center gap-2">
          ${m.kind === 'circular' ? `<button onclick="printCircular('${m.id}')" class="bg-white border-2 border-primary text-primary text-sm font-semibold px-4 py-2.5 rounded-button min-h-[44px] transition-warm">Print</button>` : ''}
          <button onclick="duplicateMessage('${m.id}')" class="bg-white border-2 border-primary text-primary text-sm font-semibold px-4 py-2.5 rounded-button min-h-[44px] transition-warm">Duplicate</button>
          ${m.status !== 'Sent' ? `<button onclick="editMessage('${m.id}')" class="bg-primary hover:bg-primary-hover text-white text-sm font-semibold px-5 py-2.5 rounded-button min-h-[44px] transition-warm">Edit</button>` : ''}
        </div>
      </div>
      <div class="grid lg:grid-cols-[minmax(0,1fr)_360px] gap-6 items-start">
        <div class="bg-section-bg rounded-card p-4 sm:p-6 min-w-0"><div>${doc}</div></div>
        <aside class="space-y-5 min-w-0">
          <section class="bg-card-bg rounded-card shadow-card p-5">
            <h2 class="font-heading font-semibold text-base mb-3">Sent to</h2>
            <p class="text-sm font-semibold">${scopeText(m.audience)}</p>
            <div class="flex flex-wrap gap-1.5 mt-2">${ROLES.filter(x => m.audience.roles[x.k]).map(x => `<span class="bg-primary-light text-primary text-xs font-semibold px-2.5 py-1 rounded-badge">${x.label}</span>`).join('')}</div>
            <p class="text-sm mt-3"><b class="font-heading text-lg">${fmtNum(r.total)}</b> <span class="text-ink-muted">people in ${r.parishes} ${r.parishes === 1 ? 'parish' : 'parishes'} (estimated)</span></p>
            ${m.audience.scope !== 'all' ? `<details class="mt-3"><summary class="text-xs font-semibold text-primary cursor-pointer min-h-[32px] flex items-center">See the ${ps.length} ${ps.length === 1 ? 'parish' : 'parishes'}</summary><ul class="mt-2 max-h-48 overflow-y-auto divide-y divide-divider text-sm">${ps.map(p => `<li class="py-2 flex justify-between gap-3"><span class="truncate">${esc(p.name)}</span><span class="text-xs text-ink-muted flex-shrink-0">${p.sizeTier}</span></li>`).join('')}</ul></details>` : ''}
            <p class="text-xs text-ink-muted mt-3">Through ${channelNames(m).join(', ') || '\u2014'}</p>
          </section>
          ${st ? `<section class="bg-card-bg rounded-card shadow-card p-5 space-y-3">
            <h2 class="font-heading font-semibold text-base">Delivery</h2>
            ${bar('Delivered', 100, 'bg-primary')}${bar('Opened', st.opened, 'bg-green')}
            ${st.ack !== null ? `${bar(`Acknowledged (${st.ack} of ${st.parishes} parishes)`, Math.round(st.ack / st.parishes * 100), 'bg-lavender')}${st.ack < st.parishes ? `<button onclick="toast('Reminder sent to ${st.parishes - st.ack} parishes.')" class="w-full bg-white border-2 border-primary text-primary text-sm font-semibold px-4 py-2.5 rounded-button min-h-[44px] transition-warm">Remind ${st.parishes - st.ack} parishes</button>` : ''}` : ''}
            <p class="text-xs text-ink-muted">Figures are sample data for this demo.</p></section>
          <p class="text-xs text-ink-muted px-1">Sent messages can\u2019t be edited. Duplicate it to send an updated version.</p>` : `<section class="bg-card-bg rounded-card shadow-card p-5"><h2 class="font-heading font-semibold text-base mb-1">${m.status === 'Scheduled' ? 'Waiting to send' : 'Not sent yet'}</h2><p class="text-sm text-ink-muted">${m.status === 'Scheduled' ? `Goes out on ${longDate(m.scheduledFor)} at ${timeOf(m.scheduledFor)}. Edit it to change the time or the audience.` : 'This is a draft. Only diocese staff can see it.'}</p></section>`}
        </aside>
      </div>`;
  }
  function printCircular(id) {
    const m = messages.find(x => x.id === id);
    let root = document.getElementById('print-root'); if (!root) { root = document.createElement('div'); root.id = 'print-root'; document.body.appendChild(root); }
    root.innerHTML = letterHTML(m, true); window.print();
  }

  // =========================================================================
  // MODULE 4: Diocese Templates — view/status-manage diocese-owned templates
  // inherited by parishes (schema DOC-ISD-003's Diocese tier). Template
  // authoring/placeholder editing is out of scope, same as the Parish side.
  // =========================================================================
  let dioceseTemplates = [
    { id:"DTPL-001", name:"Diocesan Circular Template", category:"Parish Communications", status:"Published" },
    { id:"DTPL-002", name:"Bishop's Pastoral Letter Template", category:"Administrative Letters", status:"Published" },
    { id:"DTPL-003", name:"Parish Visitation Report Template", category:"Reports", status:"Published" },
    { id:"DTPL-004", name:"Diocesan Event Invitation Template", category:"Event Documents", status:"Draft" },
  ];
  function renderTemplatesModule(el) {
    el.innerHTML = `
      <div class="flex justify-end mb-4">
        <button onclick="openTemplateModal()" class="bg-primary hover:bg-primary-hover text-white text-sm font-semibold px-4 py-2.5 rounded-button min-h-[40px] transition-warm flex items-center gap-1.5">${icon('plus','icon w-4 h-4')}Add Template</button>
      </div>
      <div class="grid md:grid-cols-2 gap-4">
        ${dioceseTemplates.map(t => `
          <div class="bg-card-bg rounded-card shadow-card p-5">
            <div class="flex items-start justify-between gap-3 mb-1">
              <p class="text-sm font-semibold">${t.name}</p>
              ${statusPill(t.status)}
            </div>
            <p class="text-xs text-ink-muted">${t.category} · Available to all parishes once published</p>
            <div class="flex gap-2 mt-3">
              <button onclick="openTemplateModal('${t.id}')" class="bg-section-bg text-ink text-xs font-semibold px-3 py-2 rounded-button min-h-[36px] transition-warm hover:bg-primary-light">Edit</button>
              ${t.status !== 'Archived' ? `<button onclick="archiveTemplate('${t.id}')" class="bg-white border border-divider text-ink-muted text-xs font-semibold px-3 py-2 rounded-button min-h-[36px] transition-warm hover:bg-section-bg">Archive</button>` : ''}
            </div>
          </div>
        `).join('')}
      </div>
    `;
  }
  const TEMPLATE_CATEGORIES = ["Certificates", "Letters & Testimonials", "Administrative Letters", "Parish Communications", "Reports", "Event Documents"];
  let editingTemplateId = null;
  function openTemplateModal(editId) {
    editingTemplateId = editId || null;
    const t = editId ? dioceseTemplates.find(x => x.id === editId) : null;
    document.getElementById('template-modal-title').textContent = t ? 'Edit Template' : 'Add Template';
    document.getElementById('template-modal').classList.remove('hidden');
    document.getElementById('template-form').innerHTML = `
      <div class="space-y-1.5"><label class="text-xs font-medium">Template name</label><input id="tf-name" type="text" value="${t ? t.name : ''}" class="w-full border border-divider rounded-input px-3 h-10 text-sm bg-white focus:ring-2 focus:ring-primary-light focus:outline-none"></div>
      <div class="space-y-1.5"><label class="text-xs font-medium">Category</label>
        <select id="tf-category" class="w-full border border-divider rounded-input px-3 h-10 text-sm bg-white focus:ring-2 focus:ring-primary-light focus:outline-none">
          ${TEMPLATE_CATEGORIES.map(cat => `<option ${t && t.category===cat ? 'selected' : ''}>${cat}</option>`).join('')}
        </select>
      </div>
      <p class="text-xs text-ink-muted">Template layout and placeholder design happen outside this prototype's scope \u2014 this manages the template's availability to parishes, not its content.</p>
    `;
  }
  function submitTemplate(status) {
    const name = document.getElementById('tf-name').value.trim();
    if (!name) { toast('Please enter a template name.'); return; }
    const category = document.getElementById('tf-category').value;
    if (editingTemplateId) {
      Object.assign(dioceseTemplates.find(x => x.id === editingTemplateId), { name, category, status });
    } else {
      dioceseTemplates.unshift({ id:'DTPL-'+Math.floor(100+Math.random()*899), name, category, status });
    }
    toast(`${name} ${status === 'Published' ? 'published' : 'saved as draft'}.`);
    editingTemplateId = null;
    closeModal('template-modal');
    renderModule();
  }
  function archiveTemplate(id) {
    const t = dioceseTemplates.find(x => x.id === id);
    t.status = 'Archived';
    toast(`${t.name} archived.`);
    renderModule();
  }

  renderModule();
</script>

</body>
</html>
