  // ---------------- Deterministic mock augmentation: module enablement, onboarding stage, health status. ----------------
  // Real per-parish operational data only exists for Infant Jesus Shrine (PAR-0002, our seeded flagship parish) elsewhere
  // in this app. For the other 129 — which have no operational data anywhere — we derive plausible, CONSISTENT (not
  // re-randomized on every page load) mock status from each parish's own ID, so the demo is explorable and stable.
  const MODULES = ["Family Records", "Requests", "Masses", "Communication", "Finance", "Documents", "Faith Formation"];
  const HEALTH_REASONS = [
    "Monthly report overdue",
    "No Mass schedule published",
    "High volume of pending document requests",
    "Large number of pending approvals",
    "Parish profile incomplete",
    "No recent staff login activity",
    "Subscription collection below 50%",
  ];
  function hashCode(str) {
    let hash = 0;
    for (let i = 0; i < str.length; i++) { hash = (hash * 31 + str.charCodeAt(i)) % 997; }
    return hash;
  }
  function modulesFor(parishId) {
    if (parishId === 'PAR-0002') return [...MODULES]; // Infant Jesus Shrine — our flagship live example
    const count = hashCode(parishId) % 8; // 0-7 modules enabled
    return MODULES.slice(0, count);
  }
  function onboardingStageFor(enabledModules) {
    if (enabledModules.length === 0) return 'Not Started';
    if (enabledModules.length < 4) return 'In Progress';
    return 'Live';
  }
  function healthFor(parishId, enabledModules) {
    if (parishId === 'PAR-0002') return { status: 'Healthy', reason: null };
    if (enabledModules.length === 0) return { status: 'Not Onboarded', reason: null };
    const h = hashCode(parishId + 'health');
    if (h % 5 === 0) return { status: 'At Risk', reason: HEALTH_REASONS[h % HEALTH_REASONS.length] };
    if (h % 3 === 0) return { status: 'Needs Attention', reason: HEALTH_REASONS[(h + 1) % HEALTH_REASONS.length] };
    return { status: 'Healthy', reason: null };
  }
  function parishStatus(p) {
    const mods = modulesFor(p.id);
    return { modules: mods, stage: onboardingStageFor(mods), health: healthFor(p.id, mods) };
  }
  function localityOf(address) {
    const parts = address.split(',').map(s => s.trim());
    return parts.length >= 2 ? parts[parts.length - 2] : address;
  }

  function statusPill(status) {
    const map = {
      'Healthy': ['bg-green/20', 'text-[#2f6b45]'], 'Needs Attention': ['bg-gold/20', 'text-[#8a5a10]'],
      'At Risk': ['bg-error-bg', 'text-error'], 'Not Onboarded': ['bg-section-bg', 'text-ink-muted'],
      'Live': ['bg-green/20', 'text-[#2f6b45]'], 'In Progress': ['bg-gold/20', 'text-[#8a5a10]'], 'Not Started': ['bg-section-bg', 'text-ink-muted'],
    };
    const [bg, text] = map[status] || ['bg-section-bg', 'text-ink-muted'];
    return `<span class="${bg} ${text} text-xs font-semibold px-2.5 py-1 rounded-badge whitespace-nowrap">${status}</span>`;
  }

  let currentModule = 'directory';
  function setModule(m) {
    currentModule = m;
    document.querySelectorAll('.module-tab').forEach(btn => {
      const active = btn.dataset.module === m;
      btn.className = `module-tab px-4 py-2.5 rounded-badge text-sm font-semibold whitespace-nowrap transition-warm ${active ? 'bg-primary text-white' : 'bg-card-bg text-ink-muted'}`;
    });
    renderModule();
  }
  function renderModule() {
    const el = document.getElementById('module-content');
    if (currentModule === 'directory') renderDirectoryModule(el);
    else if (currentModule === 'health') renderHealthModule(el);
    else renderSupportModule(el);
  }

  // =========================================================================
  // DIRECTORY
  // =========================================================================
  let directorySearch = '';
  let directorySizeFilter = 'All';
  function directoryFiltered() {
    const q = directorySearch.trim().toLowerCase();
    return parishes.filter(p => {
      const matchesSearch = !q || p.name.toLowerCase().includes(q) || p.address.toLowerCase().includes(q);
      const matchesSize = directorySizeFilter === 'All' || p.sizeTier === directorySizeFilter;
      return matchesSearch && matchesSize;
    });
  }
  function renderDirectoryModule(el) {
    el.innerHTML = `
      <div class="bg-card-bg rounded-card shadow-card p-4 mb-4 flex flex-wrap items-center gap-3">
        <div class="relative flex-1 min-w-[200px]">
          <span class="absolute left-3 top-1/2 -translate-y-1/2 text-ink-muted">${icon('search','icon w-4 h-4')}</span>
          <input id="dir-search" type="text" placeholder="Search by name or locality…" value="${directorySearch}" oninput="directorySearch=this.value; renderDirectoryList()" class="w-full border border-divider rounded-input pl-9 pr-3 h-10 text-sm bg-bg-warm focus:ring-2 focus:ring-primary-light focus:outline-none">
        </div>
        <select onchange="directorySizeFilter=this.value; renderDirectoryList()" class="border border-divider rounded-input px-3 h-10 text-sm bg-bg-warm focus:ring-2 focus:ring-primary-light focus:outline-none flex-shrink-0">
          <option value="All">All sizes</option>
          <option>Large</option><option>Medium</option><option>Small</option>
        </select>
      </div>
      <p id="dir-count" class="text-xs text-ink-muted mb-3"></p>
      <div id="dir-list" class="bg-card-bg rounded-card shadow-card overflow-hidden"></div>
    `;
    renderDirectoryList();
  }
  function renderDirectoryList() {
    const list = directoryFiltered();
    document.getElementById('dir-count').textContent = `${list.length} of ${parishes.length} parishes`;
    document.getElementById('dir-list').innerHTML = list.length === 0
      ? '<div class="p-10 text-center"><p class="text-sm font-semibold">No parishes found</p><p class="text-sm text-ink-muted mt-1">Try a different search term or size filter.</p></div>'
      : `<div class="divide-y divide-divider">${list.map(p => {
          const st = parishStatus(p);
          return `
            <button onclick="viewParish('${p.id}')" class="w-full text-left px-5 py-4 flex items-center justify-between gap-3 transition-warm hover:bg-section-bg min-h-[44px]">
              <div class="min-w-0">
                <p class="text-sm font-semibold truncate">${p.name}</p>
                <p class="text-xs text-ink-muted mt-0.5 truncate">${localityOf(p.address)} · ${p.sizeTier} · Est. families ${p.estFamilies}</p>
              </div>
              <div class="flex items-center gap-2 flex-shrink-0">
                ${statusPill(st.stage)}
                <span class="text-ink-muted">${icon('chevronRight','w-4 h-4')}</span>
              </div>
            </button>
          `;
        }).join('')}</div>`;
  }
  function viewParish(id) {
    const p = parishes.find(x => x.id === id);
    const st = parishStatus(p);
    document.getElementById('parish-modal-title').textContent = p.name;
    document.getElementById('parish-modal').classList.remove('hidden');
    document.getElementById('parish-modal-body').innerHTML = `
      <div class="grid grid-cols-2 gap-3 text-xs">
        <div><p class="text-ink-muted">Parish Priest</p><p class="font-medium mt-0.5">${p.parishPriest}</p></div>
        <div><p class="text-ink-muted">Established</p><p class="font-medium mt-0.5">${p.yearEstablished || 'Not on record'}</p></div>
        <div><p class="text-ink-muted">Size Tier</p><p class="font-medium mt-0.5">${p.sizeTier}</p></div>
        <div><p class="text-ink-muted">Est. Families</p><p class="font-medium mt-0.5">${p.estFamilies}</p></div>
      </div>
      <div><p class="text-xs text-ink-muted mb-1">Address</p><p class="text-sm">${p.address}</p></div>
      <div class="flex items-center gap-2">
        <span class="text-xs text-ink-muted">Onboarding:</span>${statusPill(st.stage)}
        <span class="text-xs text-ink-muted ml-2">Health:</span>${statusPill(st.health.status)}
      </div>
      ${st.health.reason ? `<p class="text-xs text-error">${st.health.reason}</p>` : ''}
      <div>
        <p class="text-xs text-ink-muted uppercase tracking-wide font-semibold mb-2">Enabled modules (${st.modules.length} of ${MODULES.length})</p>
        <div class="flex flex-wrap gap-1.5">
          ${MODULES.map(m => `<span class="${st.modules.includes(m) ? 'bg-primary-light text-primary' : 'bg-section-bg text-ink-muted'} text-xs font-medium px-2.5 py-1.5 rounded-badge">${m}</span>`).join('')}
        </div>
      </div>
    `;
  }

  // =========================================================================
  // PARISH HEALTH
  // =========================================================================
  let healthFilter = 'All';
  function renderHealthModule(el) {
    const all = parishes.map(p => ({ p, st: parishStatus(p) }));
    const counts = { Healthy: 0, 'Needs Attention': 0, 'At Risk': 0, 'Not Onboarded': 0 };
    all.forEach(({ st }) => { counts[st.health.status] = (counts[st.health.status] || 0) + 1; });
    el.innerHTML = `
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
        ${Object.entries(counts).map(([status, count]) => `
          <button onclick="healthFilter='${status}'; renderHealthList()" class="bg-card-bg rounded-card shadow-card p-4 text-left transition-warm hover:shadow-card-hover">
            <p class="font-heading font-bold text-2xl">${count}</p>
            <p class="text-xs text-ink-muted mt-1">${status}</p>
          </button>
        `).join('')}
      </div>
      <div class="flex gap-2 mb-4 flex-wrap" id="health-filter-tabs"></div>
      <div id="health-list" class="bg-card-bg rounded-card shadow-card overflow-hidden"></div>
    `;
    renderHealthFilterTabs();
    renderHealthList();
  }
  function renderHealthFilterTabs() {
    const tabs = ['All', 'Healthy', 'Needs Attention', 'At Risk', 'Not Onboarded'];
    document.getElementById('health-filter-tabs').innerHTML = tabs.map(t =>
      `<button onclick="healthFilter='${t}'; renderHealthFilterTabs(); renderHealthList()" class="px-3.5 py-2 rounded-badge text-xs font-semibold whitespace-nowrap transition-warm ${healthFilter === t ? 'bg-primary text-white' : 'bg-card-bg text-ink-muted border border-divider'}">${t}</button>`
    ).join('');
  }
  function renderHealthList() {
    const list = parishes.map(p => ({ p, st: parishStatus(p) })).filter(({ st }) => healthFilter === 'All' || st.health.status === healthFilter);
    document.getElementById('health-list').innerHTML = list.length === 0
      ? '<div class="p-10 text-center"><p class="text-sm font-semibold">No parishes in this category</p></div>'
      : `<div class="divide-y divide-divider">${list.map(({ p, st }) => `
          <button onclick="viewParish('${p.id}')" class="w-full text-left px-5 py-4 flex items-center justify-between gap-3 transition-warm hover:bg-section-bg min-h-[44px]">
            <div class="min-w-0">
              <p class="text-sm font-semibold truncate">${p.name}</p>
              <p class="text-xs text-ink-muted mt-0.5 truncate">${localityOf(p.address)}${st.health.reason ? ' · ' + st.health.reason : ''}</p>
            </div>
            ${statusPill(st.health.status)}
          </button>
        `).join('')}</div>`;
  }

  // =========================================================================
  // PARISH SUPPORT (Onboarding + Module Enablement + Adoption)
  // =========================================================================
  let supportStageFilter = 'All';
  function renderSupportModule(el) {
    const all = parishes.map(p => ({ p, st: parishStatus(p) }));
    const stageCounts = { 'Live': 0, 'In Progress': 0, 'Not Started': 0 };
    all.forEach(({ st }) => { stageCounts[st.stage]++; });
    const totalModulesEnabled = all.reduce((s, { st }) => s + st.modules.length, 0);
    const avgModules = (totalModulesEnabled / parishes.length).toFixed(1);
    const topAdopters = [...all].sort((a, b) => b.st.modules.length - a.st.modules.length).slice(0, 5);

    el.innerHTML = `
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
        <div class="bg-card-bg rounded-card shadow-card p-4"><p class="font-heading font-bold text-2xl">${stageCounts['Live']}</p><p class="text-xs text-ink-muted mt-1">Live</p></div>
        <div class="bg-card-bg rounded-card shadow-card p-4"><p class="font-heading font-bold text-2xl">${stageCounts['In Progress']}</p><p class="text-xs text-ink-muted mt-1">In Progress</p></div>
        <div class="bg-card-bg rounded-card shadow-card p-4"><p class="font-heading font-bold text-2xl">${stageCounts['Not Started']}</p><p class="text-xs text-ink-muted mt-1">Not Started</p></div>
        <div class="bg-card-bg rounded-card shadow-card p-4"><p class="font-heading font-bold text-2xl">${avgModules}</p><p class="text-xs text-ink-muted mt-1">Avg. modules enabled</p></div>
      </div>

      <div class="bg-card-bg rounded-card shadow-card p-5 mb-6">
        <p class="text-sm font-semibold mb-3">Top adopters</p>
        <div class="space-y-2">
          ${topAdopters.map(({ p, st }) => `
            <button onclick="viewParish('${p.id}')" class="w-full flex items-center justify-between gap-3 text-left transition-warm hover:bg-section-bg rounded-button px-2 py-1.5 -mx-2">
              <span class="text-sm">${p.name}</span>
              <span class="text-xs text-ink-muted font-semibold flex-shrink-0">${st.modules.length} of ${MODULES.length} modules</span>
            </button>
          `).join('')}
        </div>
      </div>

      <div class="flex items-center justify-between mb-3">
        <p class="text-sm font-semibold">Onboarding &amp; module enablement</p>
        <div class="flex gap-2" id="support-filter-tabs"></div>
      </div>
      <div id="support-list" class="bg-card-bg rounded-card shadow-card overflow-hidden"></div>
    `;
    renderSupportFilterTabs();
    renderSupportList();
  }
  function renderSupportFilterTabs() {
    const tabs = ['All', 'Live', 'In Progress', 'Not Started'];
    document.getElementById('support-filter-tabs').innerHTML = tabs.map(t =>
      `<button onclick="supportStageFilter='${t}'; renderSupportFilterTabs(); renderSupportList()" class="px-3 py-1.5 rounded-badge text-xs font-semibold whitespace-nowrap transition-warm ${supportStageFilter === t ? 'bg-primary text-white' : 'bg-card-bg text-ink-muted border border-divider'}">${t}</button>`
    ).join('');
  }
  function renderSupportList() {
    const list = parishes.map(p => ({ p, st: parishStatus(p) })).filter(({ st }) => supportStageFilter === 'All' || st.stage === supportStageFilter);
    document.getElementById('support-list').innerHTML = list.length === 0
      ? '<div class="p-10 text-center"><p class="text-sm font-semibold">No parishes in this category</p></div>'
      : `<div class="divide-y divide-divider">${list.map(({ p, st }) => `
          <button onclick="viewParish('${p.id}')" class="w-full text-left px-5 py-4 flex items-center justify-between gap-3 transition-warm hover:bg-section-bg min-h-[44px]">
            <div class="min-w-0">
              <p class="text-sm font-semibold truncate">${p.name}</p>
              <p class="text-xs text-ink-muted mt-0.5 truncate">${st.modules.length > 0 ? st.modules.join(', ') : 'No modules enabled'}</p>
            </div>
            ${statusPill(st.stage)}
          </button>
        `).join('')}</div>`;
  }

  const initialModule = sessionParams.get('module');
  if (initialModule === 'directory' || initialModule === 'health' || initialModule === 'support') { setModule(initialModule); } else { renderModule(); }
</script>

</body>
</html>
