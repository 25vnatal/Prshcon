  // ---------------- Deterministic mock augmentation: region, phone numbers, and a three-pillar health ----------------
  // ---------------- model. Health is now computed independently per pillar from its own seeded metric — ----------------
  // ---------------- NOT from onboarding stage or enabled modules, which used to (wrongly) gate whether a ----------------
  // ---------------- parish was even evaluated. Real operational data only exists for Infant Jesus Shrine ----------------
  // ---------------- (PAR-0002) anywhere in this app; every other parish's figures are derived deterministically ----------------
  // ---------------- from its own ID (never Math.random()), so results are stable across reloads. ----------------
  function hashCode(str) {
    let hash = 0;
    for (let i = 0; i < str.length; i++) { hash = (hash * 31 + str.charCodeAt(i)) % 997; }
    return hash;
  }
  function seededRange(seedStr, min, max) {
    const h = hashCode(seedStr);
    return min + (h % (max - min + 1));
  }
  function phoneDigits(seedStr, seed, numDigits) {
    let result = '';
    for (let i = 0; i < numDigits; i++) { result += hashCode(seedStr + seed + i) % 10; }
    return result;
  }
  function officePhoneFor(parishId) {
    if (parishId === 'PAR-0002') return '25301206';
    return '2' + phoneDigits(parishId, 'office', 7);
  }
  function priestPhoneFor(parishId) {
    return '9' + phoneDigits(parishId, 'priest', 9);
  }

  // Region classification from real pincode prefixes embedded in each address — not invented, derived
  // from the actual archdiocese-wide geographic spread in the real 130-parish dataset.
  const REGIONS = [
    { label: 'Bengaluru City', prefixes: ['560'] },
    { label: 'Bengaluru Rural', prefixes: ['561', '562'] },
    { label: 'Kolar & Chikkaballapura', prefixes: ['563', '564'] },
    { label: 'Tumkuru', prefixes: ['571', '572'] },
  ];
  function regionFor(address) {
    for (const r of REGIONS) {
      for (const pre of r.prefixes) {
        if (new RegExp('\\b' + pre + '\\s?\\d{3}\\b').test(address)) return r.label;
      }
    }
    return 'Other';
  }
  function localityOf(address) {
    const parts = address.split(',').map(s => s.trim());
    return parts.length >= 2 ? parts[parts.length - 2] : address;
  }

  // Three pillars — Financial, Community, Governance — each with its own seeded metric and real
  // number behind its status, correlated through a shared per-parish "wellness" base rather than
  // three fully independent dice rolls: a parish genuinely struggling tends to show it across more
  // than one dimension, not have anti-correlated pillars. Each pillar still has its own noise on top
  // of that shared base, so pillars can and do diverge — verified via script test that a meaningful
  // share of parishes show genuinely mixed Green/Amber/Red across their three pillars, not one score
  // copied three times.
  function baseWellness(parishId) { return hashCode(parishId + 'wellness') % 100; }
  function financialHealth(parishId) {
    if (parishId === 'PAR-0002') return { status: 'Green', metric: 82, label: 'Subscription collection rate' };
    const base = baseWellness(parishId);
    const noise = seededRange(parishId + 'fin', -15, 15);
    const rate = Math.max(20, Math.min(98, base + noise));
    const status = rate >= 65 ? 'Green' : rate >= 45 ? 'Amber' : 'Red';
    return { status, metric: rate, label: 'Subscription collection rate' };
  }
  function communityHealth(parishId) {
    if (parishId === 'PAR-0002') return { status: 'Green', metric: 4, label: 'Registered family growth (YoY)' };
    const base = baseWellness(parishId);
    const scaled = Math.round((base - 50) / 3.5) + seededRange(parishId + 'comm-n2', -3, 3);
    const status = scaled >= 0 ? 'Green' : scaled >= -6 ? 'Amber' : 'Red';
    return { status, metric: scaled, label: 'Registered family growth (YoY)' };
  }
  function governanceHealth(parishId) {
    if (parishId === 'PAR-0002') return { status: 'Green', metric: 6, label: 'Monthly reports submitted on time (of last 6)' };
    const base = baseWellness(parishId);
    const submitted = Math.max(0, Math.min(6, Math.round(base / 100 * 6) + seededRange(parishId + 'gov', -1, 1)));
    const status = submitted >= 5 ? 'Green' : submitted >= 3 ? 'Amber' : 'Red';
    return { status, metric: submitted, label: 'Monthly reports submitted on time (of last 6)' };
  }
  function healthFor(parishId) {
    return { financial: financialHealth(parishId), community: communityHealth(parishId), governance: governanceHealth(parishId) };
  }
  function parishStatus(p) {
    return { region: regionFor(p.address), health: healthFor(p.id) };
  }

  const RAG_COLORS = { Green: '#6CBF84', Amber: '#F6C453', Red: '#E5645A' };
  function ragDot(status, label) {
    return `<span title="${label}: ${status}" style="display:inline-block; width:10px; height:10px; border-radius:999px; background:${RAG_COLORS[status]};"></span>`;
  }
  function healthCell(h) {
    return `<div class="flex items-center gap-1.5">${ragDot(h.financial.status, 'Financial')}${ragDot(h.community.status, 'Community')}${ragDot(h.governance.status, 'Governance')}</div>`;
  }
  function ragBadge(status) {
    const map = { Green: ['bg-green/20', 'text-[#2f6b45]'], Amber: ['bg-gold/20', 'text-[#8a5a10]'], Red: ['bg-error-bg', 'text-error'] };
    const [bg, text] = map[status];
    return `<span class="${bg} ${text} text-xs font-semibold px-2.5 py-1 rounded-badge whitespace-nowrap">${status}</span>`;
  }

  // ---------------- Directory + Health, merged into one filterable, searchable table. ----------------
  let dirSearch = '';
  let dirSizeFilter = 'All';
  let dirRegionFilter = 'All';
  function directoryFiltered() {
    const q = dirSearch.trim().toLowerCase();
    return parishes.filter(p => {
      const matchesSearch = !q || p.name.toLowerCase().includes(q) || p.address.toLowerCase().includes(q);
      const matchesSize = dirSizeFilter === 'All' || p.sizeTier === dirSizeFilter;
      const matchesRegion = dirRegionFilter === 'All' || regionFor(p.address) === dirRegionFilter;
      return matchesSearch && matchesSize && matchesRegion;
    });
  }
  function renderModule() {
    const el = document.getElementById('module-content');
    el.innerHTML = `
      <div class="bg-card-bg rounded-card shadow-card p-4 mb-4 flex flex-wrap items-center gap-3">

          <span class="absolute left-3 top-1/2 -translate-y-1/2 text-ink-muted">${icon('search','icon w-4 h-4')}</span>
          <input id="dir-search" type="text" placeholder="Search by name or locality…" value="${dirSearch}" oninput="dirSearch=this.value; renderDirectoryList()" class="w-full border border-divider rounded-input pl-9 pr-3 h-10 text-sm bg-bg-warm focus:ring-2 focus:ring-primary-light focus:outline-none">

          <option value="All">All sizes</option>

          <option value="All">All regions</option>

          <option>Other</option>
        </select>

    `;
    renderDirectoryList();
  }
  function renderDirectoryList() {
    const list = directoryFiltered();
    document.getElementById('dir-count').textContent = `${list.length} of ${parishes.length} parishes`;
    const shown = list.slice(0, 30);
    document.getElementById('dir-list').innerHTML = shown.length === 0
      ? '<div class="p-10 text-center"><p class="text-sm font-semibold">No parishes found</p><p class="text-sm text-ink-muted mt-1">Try a different search term or filter.</p></div>'
      : `<div class="overflow-x-auto"><table class="w-full text-sm">
          <thead><tr class="border-b border-divider text-left text-ink-muted text-xs uppercase tracking-wide">
            <th class="px-4 py-3 font-medium">Parish</th>
            <th class="px-4 py-3 font-medium">Size</th>
            <th class="px-4 py-3 font-medium">Parish priest</th>
            <th class="px-4 py-3 font-medium">Office phone</th>
            <th class="px-4 py-3 font-medium">Health</th>
          </tr></thead>
          <tbody>
            ${shown.map(p => {
              const health = healthFor(p.id);
              return `
                <tr onclick="viewParish('${p.id}')" class="border-b border-divider last:border-0 cursor-pointer transition-warm hover:bg-section-bg">
                  <td class="px-4 py-3">
                    <p class="font-medium">${p.name}</p>
                    <p class="text-xs text-ink-muted mt-0.5">${localityOf(p.address)}</p>
                  </td>
                  <td class="px-4 py-3 text-ink-muted">${p.sizeTier}</td>
                  <td class="px-4 py-3">
                    <p class="text-ink-muted">${p.parishPriest}</p>
                    <p class="text-xs text-ink-muted mt-0.5">${priestPhoneFor(p.id)}</p>
                  </td>
                  <td class="px-4 py-3 text-ink-muted whitespace-nowrap">${officePhoneFor(p.id)}</td>
                  <td class="px-4 py-3">${healthCell(health)}</td>
                </tr>
              `;
            }).join('')}
          </tbody>
        </table></div>
        ${list.length > 30 ? `<p class="px-4 py-3 text-xs text-ink-muted text-center border-t border-divider">Showing 30 of ${list.length} parishes — refine your search or filters to see more</p>` : ''}`;
  }

  function viewParish(id) {
    const p = parishes.find(x => x.id === id);
    const region = regionFor(p.address);
    const health = healthFor(p.id);
    document.getElementById('parish-modal-title').textContent = p.name;
    document.getElementById('parish-modal').classList.remove('hidden');
    document.getElementById('parish-modal-body').innerHTML = `
      <div class="grid grid-cols-2 gap-3 text-xs">
        <div><p class="text-ink-muted">Parish Priest</p><p class="font-medium mt-0.5">${p.parishPriest}</p></div>
        <div><p class="text-ink-muted">Established</p><p class="font-medium mt-0.5">${p.yearEstablished || 'Not on record'}</p></div>
        <div><p class="text-ink-muted">Size</p><p class="font-medium mt-0.5">${p.sizeTier}</p></div>
        <div><p class="text-ink-muted">Region</p><p class="font-medium mt-0.5">${region}</p></div>
      </div>
      <div class="grid grid-cols-2 gap-3 text-xs">
        <div><p class="text-ink-muted flex items-center gap-1">${icon('phone','w-3 h-3')}Priest phone</p><p class="font-medium mt-0.5">${priestPhoneFor(p.id)}</p></div>
        <div><p class="text-ink-muted flex items-center gap-1">${icon('phone','w-3 h-3')}Parish office phone</p><p class="font-medium mt-0.5">${officePhoneFor(p.id)}</p></div>
      </div>
      <div><p class="text-xs text-ink-muted mb-1">Address</p><p class="text-sm">${p.address}</p></div>
      <div>
        <p class="text-xs text-ink-muted uppercase tracking-wide font-semibold mb-2">Parish health</p>
        <div class="space-y-2">
          <div class="flex items-center justify-between bg-section-bg rounded-card px-3.5 py-2.5">
            <div class="flex items-center gap-2">${ragDot(health.financial.status,'Financial')}<span class="text-sm font-medium">Financial</span></div>
            <div class="text-right">${ragBadge(health.financial.status)}<p class="text-xs text-ink-muted mt-1">${health.financial.label}: ${health.financial.metric}%</p></div>
          </div>
          <div class="flex items-center justify-between bg-section-bg rounded-card px-3.5 py-2.5">
            <div class="flex items-center gap-2">${ragDot(health.community.status,'Community')}<span class="text-sm font-medium">Community</span></div>
            <div class="text-right">${ragBadge(health.community.status)}<p class="text-xs text-ink-muted mt-1">${health.community.label}: ${health.community.metric >= 0 ? '+' : ''}${health.community.metric}%</p></div>
          </div>
          <div class="flex items-center justify-between bg-section-bg rounded-card px-3.5 py-2.5">
            <div class="flex items-center gap-2">${ragDot(health.governance.status,'Governance')}<span class="text-sm font-medium">Governance</span></div>
            <div class="text-right">${ragBadge(health.governance.status)}<p class="text-xs text-ink-muted mt-1">${health.governance.label}: ${health.governance.metric} of 6</p></div>
          </div>
        </div>
      </div>
    `;
  }

  renderModule();
</script>

</body>
</html>
