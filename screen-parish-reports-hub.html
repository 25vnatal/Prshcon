<!DOCTYPE html>
<html lang="en">
<head>
<title>Parish Connect — Reports</title>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          'bg-warm': '#FAFBFD', 'card-bg': '#FFFFFF', 'section-bg': '#F5F7FB', divider: '#E8EDF5',
          ink: '#1F2937', 'ink-muted': '#6B7280',
          primary: { DEFAULT: '#4F7CF5', hover: '#3F6CE4', light: '#EEF4FF' },
          coral: '#FF7F73', gold: '#F6C453', green: '#6CBF84', lavender: '#A88BFF',
          error: { DEFAULT: '#E5645A', bg: '#FDECEA' },
        },
        fontFamily: { heading: ['Manrope', 'sans-serif'], body: ['Inter', 'sans-serif'] },
        borderRadius: { card: '24px', button: '16px', input: '16px', badge: '999px' },
        boxShadow: { card: '0 6px 24px rgba(30,41,59,0.08)' },
        maxWidth: { content: '1440px' },
      },
    },
  };
</script>
<style>
  body { font-family: 'Inter', sans-serif; background-color: #FAFBFD; color: #1F2937; line-height: 1.5; }
  h1, h2, h3, .font-heading { font-family: 'Manrope', sans-serif; }
  :focus-visible { outline: 2px solid #4F7CF5; outline-offset: 2px; }
  .transition-warm { transition: all 200ms ease; }
  .icon { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body class="text-ink">

  <div class="flex min-h-screen">

    <!-- ============ SIDEBAR ============ -->
    <aside id="sidebar" class="w-[280px] bg-card-bg border-r border-divider flex-shrink-0 flex flex-col fixed lg:static inset-y-0 left-0 z-40 -translate-x-full lg:translate-x-0 transition-transform">
      <div class="px-6 pt-6 pb-5">
        <p class="font-heading font-bold text-base">Parish Connect</p>
        <p id="sidebar-parish-name" class="text-xs text-ink-muted mt-1 truncate">Infant Jesus Shrine</p>
      </div>
      <nav class="flex-1 px-4 space-y-1 overflow-y-auto">
        <button onclick="return goDash()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-button text-ink-muted text-sm hover:bg-section-bg transition-warm">
          <svg class="icon" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/></svg>
          Dashboard
        </button>
        <button onclick="return goFamilyRecords()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-button text-ink-muted text-sm hover:bg-section-bg transition-warm">
          <svg class="icon" viewBox="0 0 24 24"><circle cx="9" cy="7" r="4"/><path d="M2 21v-2a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v2"/></svg>
          Family Records
        </button>
        <button onclick="return goMasses()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-button text-ink-muted text-sm hover:bg-section-bg transition-warm">
          <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18"/><path d="M8 3v4"/><path d="M16 3v4"/></svg>
          Masses
        </button>
        <button onclick="return goCalendar()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-button text-ink-muted text-sm hover:bg-section-bg transition-warm">
          <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M8 2v4"/><path d="M16 2v4"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/></svg>
          Parish Calendar
        </button>
        <button onclick="return goRequests()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-button text-ink-muted text-sm hover:bg-section-bg transition-warm">
          <svg class="icon" viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          Requests
        </button>
        <button onclick="return goDocuments()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-button text-ink-muted text-sm hover:bg-section-bg transition-warm">
          <svg class="icon" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/><path d="M9 13h6"/><path d="M9 17h6"/></svg>
          Documents
        </button>
        <button onclick="return goCommunication()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-button text-ink-muted text-sm hover:bg-section-bg transition-warm">
          <svg class="icon" viewBox="0 0 24 24"><path d="M4 4h16v12H7l-3 3V4Z"/></svg>
          Communication
        </button>
        <button onclick="return goFaithFormation()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-button text-ink-muted text-sm hover:bg-section-bg transition-warm">
          <svg class="icon" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/></svg>
          Faith Formation
        </button>
        <button onclick="return goFinance()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-button text-ink-muted text-sm hover:bg-section-bg transition-warm">
          <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.5a2.5 2.5 0 0 1 2.5-1h.5a2.5 2.5 0 0 1 0 5h-1a2.5 2.5 0 0 0 0 5h.5a2.5 2.5 0 0 0 2.5-1"/></svg>
          Finance
        </button>
        <button onclick="toggleAdminGroup()" class="w-full flex items-center justify-between px-3 py-2.5 rounded-button text-ink-muted text-sm hover:bg-section-bg transition-warm">
          <span class="flex items-center gap-3">
            <svg class="icon" viewBox="0 0 24 24"><path d="M12 3v4"/><path d="M9 6l3-2 3 2"/><path d="M5 21V11l7-5 7 5v10"/><path d="M9 21v-6a3 3 0 0 1 6 0v6"/></svg>
            Administration
          </span>
          <svg id="admin-chevron" class="icon w-4 h-4 transition-transform" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
        <div id="admin-children" class="hidden ml-4 pl-3 border-l border-divider space-y-0.5 my-1">
          <button id="admin-child-profile" onclick="return goAdminProfile()" class="w-full text-left px-3 py-2 rounded-button text-xs text-ink-muted hover:bg-section-bg transition-warm">Parish Profile</button>
          <button onclick="return goServices()" class="w-full text-left px-3 py-2 rounded-button text-xs text-ink-muted hover:bg-section-bg transition-warm">Services</button>
          <button id="admin-child-inventory" onclick="return goAdminInventory()" class="w-full text-left px-3 py-2 rounded-button text-xs text-ink-muted hover:bg-section-bg transition-warm">Inventory</button>
          <button id="admin-child-staff" onclick="return goAdminStaff()" class="w-full text-left px-3 py-2 rounded-button text-xs text-ink-muted hover:bg-section-bg transition-warm">Staff</button>
          <button onclick="return goCommittees()" class="w-full text-left px-3 py-2 rounded-button text-xs text-ink-muted hover:bg-section-bg transition-warm">Committees</button>
        </div>
        <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-button bg-primary-light text-primary font-semibold text-sm">
          <svg class="icon" viewBox="0 0 24 24"><path d="M4 20V10M12 20V4M20 20v-7"/></svg>
          Reports
        </a>
        <button onclick="return goSettings()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-button text-ink-muted text-sm hover:bg-section-bg transition-warm">
          <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.11-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1.11 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1Z"/></svg>
          Settings
        </button>
      </nav>
    </aside>
    <div id="sidebar-backdrop" onclick="toggleSidebar()" class="hidden fixed inset-0 bg-black/20 z-30 lg:hidden"></div>

    <!-- ============ MAIN ============ -->
    <div class="flex-1 min-w-0">

      <header class="bg-card-bg border-b border-divider px-6 lg:px-10 py-4 flex items-center justify-between sticky top-0 z-20">
        <div class="flex items-center gap-3">
          <button onclick="toggleSidebar()" aria-label="Toggle navigation" class="lg:hidden w-9 h-9 rounded-button flex items-center justify-center text-ink-muted hover:bg-section-bg">
            <svg class="icon" viewBox="0 0 24 24"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
          </button>
          <div>
            <p id="header-parish-name" class="text-sm font-semibold">Infant Jesus Shrine</p>
            <p class="text-xs text-ink-muted">Reports</p>
          </div>
        </div>
        <div class="flex items-center gap-3">
          <button id="avatar-btn" onclick="document.getElementById('account-menu').classList.toggle('hidden')" aria-label="Account menu" class="w-9 h-9 rounded-badge bg-primary text-white text-xs font-bold flex items-center justify-center flex-shrink-0">PS</button>
        </div>
        <div id="account-menu" class="hidden absolute right-6 lg:right-10 top-16 bg-card-bg rounded-card shadow-card w-56 z-50 overflow-hidden">
          <div class="px-4 py-3.5 border-b border-divider">
            <p class="text-sm font-semibold">Parish Staff</p>
            <p id="account-parish-name" class="text-xs text-ink-muted truncate">Infant Jesus Shrine</p>
          </div>
          <button onclick="window.location.href='screen-parish-login.html'" class="w-full text-left px-4 py-3.5 text-sm text-error hover:bg-error-bg min-h-[44px] transition-warm">Log out</button>
        </div>
      </header>

      <main class="px-6 lg:px-10 py-8 max-w-content">

        <div class="mb-6">
          <p class="font-heading font-bold text-2xl">Reports</p>
          <p id="reports-subtitle" class="text-ink-muted text-sm mt-1">Operational, financial, sacramental, and audit reporting.</p>
        </div>

        <div class="flex gap-2 mb-6 flex-wrap">
          <button onclick="setModule('operational')" data-module="operational" class="module-tab px-4 py-2.5 rounded-badge text-sm font-semibold whitespace-nowrap transition-warm bg-primary text-white">Operational</button>
          <button onclick="setModule('financial')" data-module="financial" class="module-tab px-4 py-2.5 rounded-badge text-sm font-semibold whitespace-nowrap transition-warm bg-card-bg text-ink-muted">Financial</button>
          <button onclick="setModule('sacramental')" data-module="sacramental" class="module-tab px-4 py-2.5 rounded-badge text-sm font-semibold whitespace-nowrap transition-warm bg-card-bg text-ink-muted">Sacramental</button>
          <button onclick="setModule('audit')" data-module="audit" class="module-tab px-4 py-2.5 rounded-badge text-sm font-semibold whitespace-nowrap transition-warm bg-card-bg text-ink-muted">Audit</button>
          <button onclick="setModule('export')" data-module="export" class="module-tab px-4 py-2.5 rounded-badge text-sm font-semibold whitespace-nowrap transition-warm bg-card-bg text-ink-muted">Export</button>
        </div>

        <div id="module-content"></div>

      </main>
    </div>
  </div>

  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-ink text-white text-sm px-4 py-2.5 rounded-button shadow-card opacity-0 pointer-events-none transition-opacity duration-200 max-w-[90%] text-center z-50"></div>

<script>
  const sessionParams = new URLSearchParams(window.location.search);
  function baseParams() {
    const p = new URLSearchParams();
    ['parish', 'parishName', 'name'].forEach(k => { if (sessionParams.get(k)) p.set(k, sessionParams.get(k)); });
    return p;
  }
  const parishName = sessionParams.get('parishName') || 'Infant Jesus Shrine';
  document.getElementById('sidebar-parish-name').textContent = parishName;
  document.getElementById('header-parish-name').textContent = parishName;
  document.getElementById('account-parish-name').textContent = parishName;
  document.getElementById('avatar-btn').textContent = parishName.split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();
  document.getElementById('reports-subtitle').textContent = `Operational, financial, sacramental, and audit reporting for ${parishName}.`;

  function goDash() { window.location.href = 'screen-parish-dashboard-home.html?' + baseParams().toString(); return false; }
  function goFamilyRecords() { window.location.href = 'screen-parish-familyrecords-search.html?' + baseParams().toString(); return false; }
  function goCommittees() { window.location.href = 'screen-parish-committees-hub.html?' + baseParams().toString(); return false; }
  function goAdminProfile() { window.location.href = 'screen-parish-administration-hub.html?' + baseParams().toString() + '&module=profile'; return false; }
  function goAdminInventory() { window.location.href = 'screen-parish-administration-hub.html?' + baseParams().toString() + '&module=inventory'; return false; }
  function goAdminStaff() { window.location.href = 'screen-parish-administration-hub.html?' + baseParams().toString() + '&module=staff'; return false; }
  function toggleAdminGroup() {
    document.getElementById('admin-children').classList.toggle('hidden');
    document.getElementById('admin-chevron').classList.toggle('rotate-90');
  }
  function goMasses() { window.location.href = 'screen-parish-masses-hub.html?' + baseParams().toString(); return false; }
  function goCalendar() { window.location.href = 'screen-parish-calendar-hub.html?' + baseParams().toString(); return false; }
  function goRequests() { window.location.href = 'screen-parish-requests-hub.html?' + baseParams().toString(); return false; }
  function goServices() { window.location.href = 'screen-parish-services-hub.html?' + baseParams().toString(); return false; }
  function goDocuments() { window.location.href = 'screen-parish-documents-hub.html?' + baseParams().toString(); return false; }
  function goCommunication() { window.location.href = 'screen-parish-communication-hub.html?' + baseParams().toString(); return false; }
  function goFaithFormation() { window.location.href = 'screen-parish-faithformation-hub.html?' + baseParams().toString(); return false; }
  function goFinance() { window.location.href = 'screen-parish-finance-hub.html?' + baseParams().toString(); return false; }
  function goAdministration() { window.location.href = 'screen-parish-administration-hub.html?' + baseParams().toString(); return false; }
  function goSettings() { window.location.href = 'screen-parish-settings-hub.html?' + baseParams().toString(); return false; }
  function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('-translate-x-full');
    document.getElementById('sidebar-backdrop').classList.toggle('hidden');
  }
  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.remove('opacity-0'); t.classList.add('opacity-100');
    clearTimeout(window._t);
    window._t = setTimeout(() => { t.classList.remove('opacity-100'); t.classList.add('opacity-0'); }, 1800);
  }

  const ICON_PATHS = {
    users: '<circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M2 21v-1a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v1"/><path d="M15 15.5a4 4 0 0 1 5 3.5"/>',
    file: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/>',
    clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    cash: '<circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.5a2.5 2.5 0 0 1 2.5-1h.5a2.5 2.5 0 0 1 0 5h-1a2.5 2.5 0 0 0 0 5h.5a2.5 2.5 0 0 0 2.5-1"/>',
    check: '<path d="M20 6 9 17l-5-5"/>',
    cross: '<path d="M12 2v20M5 7h14"/>',
    download: '<path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/>',
  };
  function icon(name, cls) { return `<svg class="${cls||'icon'}" viewBox="0 0 24 24">${ICON_PATHS[name]}</svg>`; }
  function formatMoney(n) { return '\u20b9' + n.toLocaleString('en-IN'); }

  function statCard(label, value, iconName, tone) {
    const toneMap = { primary:['bg-primary-light','text-primary'], green:['bg-green/20','text-[#2f6b45]'], gold:['bg-gold/20','text-[#8a5a10]'], coral:['bg-coral/20','text-[#b1402f]'], lavender:['bg-lavender/20','text-[#5b3fc4]'] };
    const [bg, text] = toneMap[tone || 'primary'];
    return `
      <div class="bg-card-bg rounded-card shadow-card p-5">
        <span class="w-10 h-10 rounded-badge ${bg} ${text} flex items-center justify-center mb-3">${icon(iconName,'icon w-4 h-4')}</span>
        <p class="font-heading font-bold text-2xl">${value}</p>
        <p class="text-xs text-ink-muted mt-1">${label}</p>
      </div>
    `;
  }

  // Simple horizontal CSS bar chart — label, value (display string), and raw number for bar-width scaling.
  function barChart(title, rows, tone) {
    const toneMap = { primary:'bg-primary', green:'bg-green', gold:'bg-gold', coral:'bg-coral', lavender:'bg-lavender' };
    const barColor = toneMap[tone || 'primary'];
    const max = Math.max(...rows.map(r => r.value));
    return `
      <div class="bg-card-bg rounded-card shadow-card p-5">
        <p class="text-sm font-semibold mb-4">${title}</p>
        <div class="space-y-3">
          ${rows.map(r => `
            <div>
              <div class="flex items-center justify-between mb-1">
                <span class="text-xs text-ink-muted">${r.label}</span>
                <span class="text-xs font-semibold">${r.display}</span>
              </div>
              <div class="h-2 bg-section-bg rounded-badge overflow-hidden">
                <div class="h-full ${barColor} rounded-badge" style="width:${Math.max(4, Math.round((r.value / max) * 100))}%"></div>
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }

  let currentModule = 'operational';
  function setModule(m) {
    currentModule = m;
    document.querySelectorAll('.module-tab').forEach(btn => {
      const active = btn.dataset.module === m;
      btn.className = `module-tab px-4 py-2.5 rounded-badge text-sm font-semibold whitespace-nowrap transition-warm ${active ? 'bg-primary text-white' : 'bg-card-bg text-ink-muted'}`;
    });
    renderModule();
  }
  function renderModule() {
    const el = document.getElementById('module-content');
    if (currentModule === 'operational') renderOperational(el);
    else if (currentModule === 'financial') renderFinancial(el);
    else if (currentModule === 'sacramental') renderSacramental(el);
    else if (currentModule === 'audit') renderAudit(el);
    else renderExport(el);
  }

  // =========================================================================
  // OPERATIONAL REPORT
  // =========================================================================
  function renderOperational(el) {
    el.innerHTML = `
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
        ${statCard('Registered families', '1,842', 'users', 'primary')}
        ${statCard('Active parishioners', '6,120', 'users', 'green')}
        ${statCard('New registrations (this quarter)', '34', 'users', 'lavender')}
        ${statCard('Avg. request turnaround', '3.2 days', 'clock', 'gold')}
      </div>
      <div class="grid lg:grid-cols-2 gap-6 mb-6">
        ${barChart('Requests by type (this quarter)', [
          { label:'Documents & Certificates', value:128, display:'128' },
          { label:'Home Services', value:67, display:'67' },
          { label:'Sacraments', value:42, display:'42' },
          { label:'Family Updates', value:23, display:'23' },
          { label:'Facility Bookings', value:19, display:'19' },
        ], 'primary')}
        ${barChart('Requests by status (this quarter)', [
          { label:'Completed', value:210, display:'210' },
          { label:'Pending / In Progress', value:45, display:'45' },
          { label:'Rejected', value:12, display:'12' },
          { label:'Awaiting Information', value:12, display:'12' },
        ], 'green')}
      </div>
      <div class="grid lg:grid-cols-2 gap-6">
        ${barChart('Monthly request volume (last 6 months)', [
          { label:'Feb 2026', value:58, display:'58' },
          { label:'Mar 2026', value:64, display:'64' },
          { label:'Apr 2026', value:71, display:'71' },
          { label:'May 2026', value:69, display:'69' },
          { label:'Jun 2026', value:78, display:'78' },
          { label:'Jul 2026', value:85, display:'85' },
        ], 'lavender')}
        <div class="bg-card-bg rounded-card shadow-card p-5">
          <p class="text-sm font-semibold mb-4">Committees</p>
          <div class="grid grid-cols-2 gap-4">
            ${statCard('Active committees', '8', 'users', 'primary')}
            ${statCard('Total committee members', '96', 'users', 'coral')}
          </div>
          <p class="text-xs text-ink-muted mt-4">Full committee-level detail is available in Committees.</p>
        </div>
      </div>
    `;
  }

  // =========================================================================
  // FINANCIAL REPORT
  // =========================================================================
  function renderFinancial(el) {
    el.innerHTML = `
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
        ${statCard('Total income (YTD)', formatMoney(1842600), 'cash', 'green')}
        ${statCard('Total expenses (YTD)', formatMoney(1425300), 'cash', 'coral')}
        ${statCard('Net balance (YTD)', formatMoney(417300), 'cash', 'primary')}
        ${statCard('Subscription collection rate', '82%', 'check', 'gold')}
      </div>
      <div class="grid lg:grid-cols-2 gap-6 mb-6">
        ${barChart('Income by category (YTD)', [
          { label:'Sunday Collection', value:640000, display:formatMoney(640000) },
          { label:'Subscription', value:480000, display:formatMoney(480000) },
          { label:'Donations', value:380000, display:formatMoney(380000) },
          { label:'Mass Offering', value:210000, display:formatMoney(210000) },
          { label:'Facility Rental', value:85000, display:formatMoney(85000) },
          { label:'Other Income', value:47600, display:formatMoney(47600) },
        ], 'green')}
        ${barChart('Expenses by category (YTD)', [
          { label:'Salaries', value:620000, display:formatMoney(620000) },
          { label:'Charity & Outreach', value:290000, display:formatMoney(290000) },
          { label:'Maintenance', value:240000, display:formatMoney(240000) },
          { label:'Utilities', value:180000, display:formatMoney(180000) },
          { label:'Other Expense', value:150300, display:formatMoney(150300) },
          { label:'Office Supplies', value:45000, display:formatMoney(45000) },
        ], 'coral')}
      </div>
      <div class="grid lg:grid-cols-2 gap-6">
        ${barChart('Net position (last 6 months)', [
          { label:'Feb 2026', value:52000, display:formatMoney(52000) },
          { label:'Mar 2026', value:61000, display:formatMoney(61000) },
          { label:'Apr 2026', value:48000, display:formatMoney(48000) },
          { label:'May 2026', value:70000, display:formatMoney(70000) },
          { label:'Jun 2026', value:65000, display:formatMoney(65000) },
          { label:'Jul 2026', value:74000, display:formatMoney(74000) },
        ], 'primary')}
        <div class="bg-card-bg rounded-card shadow-card p-5">
          <p class="text-sm font-semibold mb-4">Payroll</p>
          <div class="grid grid-cols-2 gap-4">
            ${statCard('Total monthly payroll', formatMoney(86000), 'cash', 'gold')}
            ${statCard('Staff on payroll', '4', 'users', 'primary')}
          </div>
          <p class="text-xs text-ink-muted mt-4">Payment status per staff member is managed in Finance \u2192 Payroll.</p>
        </div>
      </div>
    `;
  }

  // =========================================================================
  // SACRAMENTAL REPORT
  // =========================================================================
  function renderSacramental(el) {
    el.innerHTML = `
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
        ${statCard('Baptisms (YTD)', '42', 'users', 'primary')}
        ${statCard('First Communions (YTD)', '38', 'users', 'green')}
        ${statCard('Confirmations (YTD)', '29', 'users', 'gold')}
        ${statCard('Marriages (YTD)', '14', 'users', 'coral')}
      </div>
      <div class="grid lg:grid-cols-2 gap-6 mb-6">
        ${barChart('Baptisms by month (last 6 months)', [
          { label:'Feb 2026', value:5, display:'5' },
          { label:'Mar 2026', value:8, display:'8' },
          { label:'Apr 2026', value:6, display:'6' },
          { label:'May 2026', value:7, display:'7' },
          { label:'Jun 2026', value:9, display:'9' },
          { label:'Jul 2026', value:7, display:'7' },
        ], 'primary')}
        ${barChart('Sacraments YTD, this year vs last year', [
          { label:'Baptisms \u2014 2026', value:42, display:'42' },
          { label:'Baptisms \u2014 2025', value:37, display:'37' },
          { label:'Confirmations \u2014 2026', value:29, display:'29' },
          { label:'Confirmations \u2014 2025', value:31, display:'31' },
        ], 'lavender')}
      </div>
      <div class="bg-card-bg rounded-card shadow-card overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead>
              <tr class="border-b border-divider text-left text-ink-muted text-xs uppercase tracking-wide">
                <th class="px-4 py-3 font-medium">Sacrament</th>
                <th class="px-4 py-3 font-medium">This year (YTD)</th>
                <th class="px-4 py-3 font-medium">Same period last year</th>
                <th class="px-4 py-3 font-medium">Change</th>
              </tr>
            </thead>
            <tbody>
              ${[
                { name:'Baptism', thisYear:42, lastYear:37 },
                { name:'First Communion', thisYear:38, lastYear:40 },
                { name:'Confirmation', thisYear:29, lastYear:31 },
                { name:'Marriage', thisYear:14, lastYear:11 },
              ].map(s => {
                const change = Math.round(((s.thisYear - s.lastYear) / s.lastYear) * 100);
                const up = change >= 0;
                return `
                  <tr class="border-b border-divider last:border-0">
                    <td class="px-4 py-3 font-medium">${s.name}</td>
                    <td class="px-4 py-3">${s.thisYear}</td>
                    <td class="px-4 py-3 text-ink-muted">${s.lastYear}</td>
                    <td class="px-4 py-3"><span class="${up ? 'text-[#2f6b45]' : 'text-error'} font-semibold">${up ? '+' : ''}${change}%</span></td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        </div>
      </div>
    `;
  }

  // =========================================================================
  // AUDIT REPORT
  // =========================================================================
  const auditLog = [
    { date:'2026-07-31', time:'11:20 AM', actor:'Parish Office', action:'Approved Document Request', details:'Baptism Certificate \u2014 Rodrigues family (DOC-REQ-2026-0142)' },
    { date:'2026-07-30', time:'3:40 PM', actor:'Fr. John Anthony', action:'Approved Sacrament Registration', details:'Confirmation \u2014 Clara Rodrigues' },
    { date:'2026-07-29', time:'9:05 AM', actor:'Parish Office', action:'Published Announcement', details:'Feast of Infant Jesus - Novena Begins' },
    { date:'2026-07-28', time:'4:15 PM', actor:'Parish Office', action:'Marked Staff Inactive', details:'Sunitha D\u2019Souza \u2014 Choir Director' },
    { date:'2026-07-26', time:'10:00 AM', actor:'Parish Office', action:'Recorded Payment', details:'Rodrigues family subscription \u2014 \u20b91,200' },
    { date:'2026-07-22', time:'2:30 PM', actor:'Parish Office', action:'Registered New Family', details:'Fernandes family added to Family Records' },
    { date:'2026-07-20', time:'1:10 PM', actor:'Parish Office', action:'Generated Certificate', details:'Baptism Certificate \u2014 Clara Rodrigues (CERT-2026-0098)' },
    { date:'2026-07-18', time:'8:45 AM', actor:'Parish Office', action:'Rejected Document Request', details:'NOC request \u2014 missing destination parish details' },
    { date:'2026-07-15', time:'5:00 PM', actor:'Fr. Francis Billemane', action:'Approved Home Service Request', details:'House Blessing \u2014 Rodrigues family' },
  ];
  const AUDIT_ACTION_TYPES = ['All', 'Approved Document Request', 'Approved Sacrament Registration', 'Published Announcement', 'Marked Staff Inactive', 'Recorded Payment', 'Registered New Family', 'Generated Certificate', 'Rejected Document Request', 'Approved Home Service Request'];
  let auditActionFilter = 'All';
  let auditDateFilter = '';

  function filteredAuditLog() {
    return auditLog.filter(a => {
      const matchesAction = auditActionFilter === 'All' || a.action === auditActionFilter;
      const matchesDate = !auditDateFilter || a.date === auditDateFilter;
      return matchesAction && matchesDate;
    });
  }
  function renderAudit(el) {
    el.innerHTML = `
      <div class="bg-card-bg rounded-card shadow-card p-4 mb-4 flex flex-wrap items-center gap-3">
        <select id="audit-action-filter" onchange="auditActionFilter=this.value; renderAuditList()" class="border border-divider rounded-input px-3 h-10 text-sm bg-bg-warm focus:ring-2 focus:ring-primary-light focus:outline-none flex-1 min-w-[200px]">
          ${AUDIT_ACTION_TYPES.map(t => `<option value="${t}">${t === 'All' ? 'All actions' : t}</option>`).join('')}
        </select>
        <input id="audit-date-filter" type="date" onchange="auditDateFilter=this.value; renderAuditList()" class="border border-divider rounded-input px-3 h-10 text-sm bg-bg-warm focus:ring-2 focus:ring-primary-light focus:outline-none flex-shrink-0">
        ${auditDateFilter ? `<button onclick="auditDateFilter=''; document.getElementById('audit-date-filter').value=''; renderAuditList()" class="text-primary text-xs font-semibold flex-shrink-0">Clear date</button>` : ''}
      </div>
      <div id="audit-list"></div>
    `;
    renderAuditList();
  }
  function renderAuditList() {
    const list = filteredAuditLog();
    const container = document.getElementById('audit-list');
    if (list.length === 0) {
      container.innerHTML = `<div class="bg-card-bg rounded-card shadow-card p-10 text-center"><p class="text-sm font-semibold">No matching audit entries</p><p class="text-sm text-ink-muted mt-1">Try a different action type or date.</p></div>`;
      return;
    }
    container.innerHTML = `
      <div class="bg-card-bg rounded-card shadow-card divide-y divide-divider overflow-hidden">
        ${list.map(a => `
          <div class="px-5 py-4 flex items-start justify-between gap-3">
            <div>
              <p class="text-sm font-semibold">${a.action}</p>
              <p class="text-xs text-ink-muted mt-0.5">${a.details}</p>
              <p class="text-xs text-ink-muted mt-1">${a.actor} \u00b7 ${formatDate(a.date)} at ${a.time}</p>
            </div>
          </div>
        `).join('')}
      </div>
    `;
  }
  const MONTH_NAMES = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  function formatDate(iso) {
    const [y,m,d] = iso.split('-').map(Number);
    return `${d} ${MONTH_NAMES[m-1]} ${y}`;
  }

  // =========================================================================
  // EXPORT
  // =========================================================================
  let recentExports = [
    { id:'EXP-001', report:'Financial Summary', range:'1 Apr 2026 \u2013 30 Jun 2026', format:'PDF', exportedOn:'2026-07-05' },
    { id:'EXP-002', report:'Sacramental Report', range:'1 Jan 2026 \u2013 30 Jun 2026', format:'CSV', exportedOn:'2026-07-02' },
  ];
  function renderExport(el) {
    el.innerHTML = `
      <div class="bg-card-bg rounded-card shadow-card p-5 mb-6 max-w-xl">
        <p class="text-sm font-semibold mb-4">Export a report</p>
        <div class="space-y-4">
          <div class="space-y-1.5">
            <label class="text-xs font-medium">Report type</label>
            <select id="exp-type" class="w-full border border-divider rounded-input px-3 h-10 text-sm bg-white focus:ring-2 focus:ring-primary-light focus:outline-none">
              <option>Operational Report</option>
              <option>Financial Summary</option>
              <option>Sacramental Report</option>
              <option>Audit Log</option>
            </select>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div class="space-y-1.5"><label class="text-xs font-medium">From</label><input id="exp-from" type="date" class="w-full border border-divider rounded-input px-3 h-10 text-sm bg-white focus:ring-2 focus:ring-primary-light focus:outline-none"></div>
            <div class="space-y-1.5"><label class="text-xs font-medium">To</label><input id="exp-to" type="date" class="w-full border border-divider rounded-input px-3 h-10 text-sm bg-white focus:ring-2 focus:ring-primary-light focus:outline-none"></div>
          </div>
          <div class="space-y-1.5">
            <label class="text-xs font-medium">Format</label>
            <div class="flex gap-2">
              <label class="flex items-center gap-1.5 text-sm bg-section-bg px-3 py-2 rounded-badge cursor-pointer flex-1 justify-center"><input type="radio" name="exp-format" value="PDF" checked class="exp-format-radio"> PDF</label>
              <label class="flex items-center gap-1.5 text-sm bg-section-bg px-3 py-2 rounded-badge cursor-pointer flex-1 justify-center"><input type="radio" name="exp-format" value="CSV" class="exp-format-radio"> CSV</label>
            </div>
          </div>
          <button onclick="runExport()" class="w-full bg-primary hover:bg-primary-hover text-white text-sm font-semibold py-3 rounded-button min-h-[44px] transition-warm flex items-center justify-center gap-1.5">${icon('download','icon w-4 h-4')}Export</button>
        </div>
      </div>
      <p class="text-xs font-semibold text-ink-muted uppercase tracking-wide mb-3">Recent exports</p>
      <div id="export-list"></div>
    `;
    renderExportList();
  }
  function renderExportList() {
    const container = document.getElementById('export-list');
    if (recentExports.length === 0) {
      container.innerHTML = `<div class="bg-card-bg rounded-card shadow-card p-8 text-center"><p class="text-sm text-ink-muted">No exports yet.</p></div>`;
      return;
    }
    container.innerHTML = `
      <div class="bg-card-bg rounded-card shadow-card divide-y divide-divider overflow-hidden">
        ${recentExports.map(e => `
          <div class="px-5 py-4 flex items-center justify-between gap-3">
            <div>
              <p class="text-sm font-semibold">${e.report}</p>
              <p class="text-xs text-ink-muted mt-0.5">${e.range} \u00b7 ${e.format} \u00b7 Exported ${formatDate(e.exportedOn)}</p>
            </div>
            <button onclick="toast('Downloading ${e.report}')" aria-label="Download" class="w-8 h-8 rounded-button flex items-center justify-center text-ink-muted hover:bg-section-bg transition-warm">${icon('download','icon w-4 h-4')}</button>
          </div>
        `).join('')}
      </div>
    `;
  }
  function runExport() {
    const type = document.getElementById('exp-type').value;
    const from = document.getElementById('exp-from').value;
    const to = document.getElementById('exp-to').value;
    const format = [...document.querySelectorAll('.exp-format-radio')].find(r => r.checked).value;
    if (!from || !to) { toast('Please choose a date range.'); return; }
    const range = `${formatDate(from)} \u2013 ${formatDate(to)}`;
    recentExports.unshift({ id:'EXP-'+Math.floor(100+Math.random()*899), report: type, range, format, exportedOn: '2026-07-31' });
    toast(`${type} exported as ${format}.`);
    renderExportList();
  }

  renderModule();
</script>

</body>
</html>
