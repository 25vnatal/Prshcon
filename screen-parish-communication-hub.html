<script>

    theme: {

        colors: {

          coral: '#FF7F73', gold: '#F6C453', green: '#6CBF84', lavender: '#A88BFF',
          error: { DEFAULT: '#E5645A', bg: '#FDECEA' },

        fontFamily: { heading: ['Manrope', 'sans-serif'], body: ['Inter', 'sans-serif'] },
        borderRadius: { card: '24px', button: '16px', input: '16px', badge: '999px' },
        boxShadow: { card: '0 6px 24px rgba(30,41,59,0.08)', 'card-hover': '0 12px 36px rgba(30,41,59,0.12)' },
        maxWidth: { content: '1440px' },
      },
    },
  };
</script>
<style>
  body { font-family: 'Inter', sans-serif; background-color: #FAFBFD; color: #1F2937; line-height: 1.5; }

  :focus-visible { outline: 2px solid #4F7CF5; outline-offset: 2px; }

  .icon { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

<script>
  const sessionParams = new URLSearchParams(window.location.search);
  function baseParams() {
    const p = new URLSearchParams();
    ['parish', 'parishName', 'name'].forEach(k => { if (sessionParams.get(k)) p.set(k, sessionParams.get(k)); });
    return p;
  }
  const parishName = sessionParams.get('parishName') || 'Infant Jesus Shrine';
  const staffName = sessionParams.get('name') || 'Parish Staff';
  document.getElementById('sidebar-parish-name').textContent = parishName;
  document.getElementById('header-parish-name').textContent = parishName;
  document.getElementById('account-parish-name').textContent = parishName;
  document.getElementById('avatar-btn').textContent = parishName.split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();

  function goDash() { window.location.href = 'screen-parish-dashboard-home.html?' + baseParams().toString(); return false; }
  function goFamilyRecords() { window.location.href = 'screen-parish-familyrecords-search.html?' + baseParams().toString(); return false; }
  function goCommittees() { window.location.href = 'screen-parish-committees-hub.html?' + baseParams().toString(); return false; }
  function goMasses() { window.location.href = 'screen-parish-masses-hub.html?' + baseParams().toString(); return false; }
  function goServices() { window.location.href = 'screen-parish-services-hub.html?' + baseParams().toString(); return false; }
  function goRequests() { window.location.href = 'screen-parish-requests-hub.html?' + baseParams().toString(); return false; }
  function goFinance() { window.location.href = 'screen-parish-finance-hub.html?' + baseParams().toString(); return false; }
  function goAdministration() { window.location.href = 'screen-parish-administration-hub.html?' + baseParams().toString(); return false; }
  function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('-translate-x-full');
    document.getElementById('sidebar-backdrop').classList.toggle('hidden');
  }
  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.remove('opacity-0'); t.classList.add('opacity-100');
    clearTimeout(window._t);
    window._t = setTimeout(() => { t.classList.remove('opacity-100'); t.classList.add('opacity-0'); }, 1800);
  }
  function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

  const ICON_PATHS = {
    plus: '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
    edit: '<path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="m18.5 2.5 3 3L12 15l-4 1 1-4Z"/>',
    trash: '<path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>',
    check: '<path d="M20 6 9 17l-5-5"/>',
    users: '<circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M2 21v-1a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v1"/><path d="M15 15.5a4 4 0 0 1 5 3.5"/>',
  };
  function icon(name, cls) { return `<svg class="${cls||'icon'}" viewBox="0 0 24 24">${ICON_PATHS[name]}</svg>`; }

  const MONTH_NAMES = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  function formatDate(iso) {
    if (!iso) return '—';
    const [y,m,d] = iso.split('-').map(Number);
    return `${d} ${MONTH_NAMES[m-1]} ${y}`;
  }
  function statusPill(status) {
    const map = { 'Published':['bg-green/20','text-[#2f6b45]'], 'Draft':['bg-gold/20','text-[#8a5a10]'], 'Archived':['bg-section-bg','text-ink-muted'] };
    const [bg, text] = map[status] || map['Draft'];
    return `<span class="${bg} ${text} text-xs font-semibold px-2.5 py-1 rounded-badge whitespace-nowrap">${status}</span>`;
  }

  // ---------------- Mock data: Announcements (schema section 4.5, mirrors mock-seed.json) ----------------
  let announcements = [
    { id:"ANN-4001", title:"Feast of Infant Jesus - Novena Begins", content:"The nine-day novena in preparation for the Feast of Infant Jesus begins this Friday at 6:00 PM. All parishioners are invited.", status:"Published", createdBy:"Parish Office", createdDate:"2026-07-18", publishedDate:"2026-07-18" },
    { id:"ANN-4002", title:"Parish Office Closed for Maintenance", content:"The parish office will be closed on Monday, 3 August for electrical maintenance. Normal hours resume Tuesday.", status:"Draft", createdBy:"Parish Office", createdDate:"2026-07-29", publishedDate:null },
    { id:"ANN-4003", title:"Sunday School Registration Open", content:"Registration for the new Sunday School year is now open. Visit the parish office or register online.", status:"Published", createdBy:"Parish Office", createdDate:"2026-06-10", publishedDate:"2026-06-10" },
  ];

  // ---------------- Mock data: Circulars (no documented schema — designed pragmatically) ----------------
  let circulars = [
    { id:"CIR-001", title:"Revised Mass Timings for Monsoon Season", category:"Liturgical", fileName:"mass-timings-monsoon-2026.pdf", status:"Published", publishedDate:"2026-07-05" },
    { id:"CIR-002", title:"Annual Parish Financial Statement 2025-26", category:"Financial", fileName:"financial-statement-2025-26.pdf", status:"Published", publishedDate:"2026-06-01" },
    { id:"CIR-003", title:"Updated Facility Booking Guidelines", category:"Administrative", fileName:"", status:"Draft", publishedDate:null },
  ];

  // ---------------- Mock data: Events (schema section 4.7, mirrors mock-seed.json) ----------------
  let events = [
    { id:"EVT-6001", name:"Feast Day Celebration", description:"Annual feast day celebration with Mass, procession, and fellowship lunch.", category:"Feast", status:"Published", eventDate:"2027-01-13", startTime:"07:00 AM", endTime:"01:00 PM", venue:"Infant Jesus Shrine Grounds", registrationRequired:true, capacity:500, paidEvent:false,

                ${statusPill(f.status)}
                <button onclick="openFaithContentModal('${f.id}')" aria-label="Edit content" class="w-8 h-8 rounded-button flex items-center justify-center text-ink-muted hover:bg-section-bg transition-warm">${icon('edit','icon w-4 h-4')}</button>
                <button onclick="deleteFaithContent('${f.id}')" aria-label="Delete content" class="w-8 h-8 rounded-button flex items-center justify-center text-error hover:bg-error-bg transition-warm">${icon('trash','icon w-4 h-4')}</button>
              </div>
            </div>
            <p class="text-xs text-ink-muted">${f.body}</p>
            <p class="text-xs text-ink-muted mt-2">${f.status === 'Published' ? 'Published ' + formatDate(f.publishedDate) : 'Not yet published'}</p>
          </div>
        `).join('')}
      </div>
    `;
  }
  const FAITH_TYPES = ["Daily Readings", "Reflections", "Prayer Content", "Feast Day Content"];
  let editingFaithContentId = null;
  function openFaithContentModal(editId) {
    editingFaithContentId = editId || null;
    const f = editId ? faithContent.find(x => x.id === editId) : null;
    document.getElementById('faithcontent-modal-title').textContent = f ? 'Edit Content' : 'Add Content';
    document.getElementById('faithcontent-modal-save-label').textContent = f ? 'Save Changes' : 'Save';
    document.getElementById('faithcontent-modal').classList.remove('hidden');
    document.getElementById('faithcontent-form').innerHTML = `
      <div class="space-y-1.5"><label class="text-xs font-medium">Type</label>
        <select id="ffc-type" class="w-full border border-divider rounded-input px-3 h-10 text-sm bg-white focus:ring-2 focus:ring-primary-light focus:outline-none">
          ${FAITH_TYPES.map(t => `<option ${f && f.type===t ? 'selected' : ''}>${t}</option>`).join('')}
        </select>
      </div>
      <div class="space-y-1.5"><label class="text-xs font-medium">Title</label><input id="ffc-title" type="text" value="${f ? f.title : ''}" class="w-full border border-divider rounded-input px-3 h-10 text-sm bg-white focus:ring-2 focus:ring-primary-light focus:outline-none"></div>
      <div class="space-y-1.5"><label class="text-xs font-medium">Content</label><textarea id="ffc-body" rows="4" class="w-full border border-divider rounded-input px-3 py-2 text-sm bg-white focus:ring-2 focus:ring-primary-light focus:outline-none resize-none">${f ? f.body : ''}</textarea></div>
      <div class="space-y-1.5"><label class="text-xs font-medium">Status</label>
        <select id="ffc-status" class="w-full border border-divider rounded-input px-3 h-10 text-sm bg-white focus:ring-2 focus:ring-primary-light focus:outline-none">
          <option ${f && f.status==='Draft' ? 'selected' : ''}>Draft</option>
          <option ${!f || f.status==='Published' ? 'selected' : ''}>Published</option>
        </select>
      </div>
    `;
  }
  function submitFaithContent() {
    const title = document.getElementById('ffc-title').value.trim();
    const body = document.getElementById('ffc-body').value.trim();
    if (!title || !body) { toast('Please fill in title and content.'); return; }
    const type = document.getElementById('ffc-type').value;
    const status = document.getElementById('ffc-status').value;
    if (editingFaithContentId) {
      const existing = faithContent.find(x => x.id === editingFaithContentId);
      Object.assign(existing, { type, title, body, status, publishedDate: status==='Published' ? (existing.publishedDate || '2026-07-31') : existing.publishedDate });
      toast(`${title} updated.`);
    } else {
      faithContent.unshift({ id:'FF-'+Math.floor(100+Math.random()*899), type, title, body, status, publishedDate: status==='Published' ? '2026-07-31' : null });
      toast(`${title} added.`);
    }
    editingFaithContentId = null;
    closeModal('faithcontent-modal');
    renderModule();
  }
  function deleteFaithContent(id) {
    const f = faithContent.find(x => x.id === id);
    faithContent = faithContent.filter(x => x.id !== id);
    toast(`${f.title} deleted.`);
    renderModule();
  }

  renderModule();
</script>

</body>
</html>
