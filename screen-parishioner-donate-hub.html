<!DOCTYPE html>
<html lang="en">
<head>
<title>Parish Connect — Donate</title>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          'bg-warm': '#FAFBFD', 'card-bg': '#FFFFFF', 'section-bg': '#F5F7FB', divider: '#E8EDF5',
          ink: '#1F2937', 'ink-muted': '#6B7280',
          primary: { DEFAULT: '#4F7CF5', hover: '#3F6CE4', light: '#EEF4FF' },
          coral: '#FF7F73', gold: '#F6C453', green: '#6CBF84', lavender: '#A88BFF',
          error: { DEFAULT: '#E5645A', bg: '#FDECEA' },
        },
        fontFamily: { heading: ['Manrope', 'sans-serif'], body: ['Inter', 'sans-serif'] },
        borderRadius: { card: '24px', button: '16px', input: '16px', badge: '999px' },
        boxShadow: { card: '0 6px 24px rgba(30,41,59,0.08)' },
      },
    },
  };
</script>
<style>
  body { font-family: 'Inter', sans-serif; background-color: #FAFBFD; color: #1F2937; line-height: 1.5; }
  h1, h2, .font-heading { font-family: 'Manrope', sans-serif; }
  :focus-visible { outline: 2px solid #4F7CF5; outline-offset: 2px; }
  .transition-warm { transition: all 200ms ease; }
  .icon { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body class="text-ink">

  <div class="max-w-[420px] mx-auto min-h-screen bg-bg-warm pb-28 relative">

    <!-- ============ TOP BAR ============ -->
    <header class="px-5 pt-5 pb-4 flex items-center gap-3">
      <button onclick="window.location.href='screen-parishioner-dashboard-home.html?' + sessionParams.toString()" aria-label="Back" class="w-10 h-10 rounded-button flex items-center justify-center text-ink-muted hover:bg-section-bg transition-warm flex-shrink-0">
        <svg class="icon" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      </button>
      <p class="font-heading font-bold text-lg">Donate</p>
    </header>

    <!-- ============ TABS ============ -->
    <div class="px-5 flex gap-2 mb-4">
      <button onclick="setModule('give')" data-module="give" class="module-tab flex-1 px-4 py-2.5 rounded-badge text-sm font-semibold transition-warm bg-primary text-white">Give</button>
      <button onclick="setModule('history')" data-module="history" class="module-tab flex-1 px-4 py-2.5 rounded-badge text-sm font-semibold transition-warm bg-card-bg text-ink-muted border border-divider">History</button>
    </div>

    <main class="px-5 space-y-5">
      <div id="module-content"></div>
    </main>

  </div>

  <!-- ============ BOTTOM NAV (5 items) ============ -->
  <nav class="fixed bottom-0 left-0 right-0 bg-card-bg border-t border-divider max-w-[420px] mx-auto">
    <div class="grid grid-cols-5">
      <button onclick="window.location.href='screen-parishioner-dashboard-home.html?' + sessionParams.toString()" class="flex flex-col items-center gap-1 py-3 text-ink-muted">
        <svg class="icon" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/></svg>
        <span class="text-[10.5px]">Home</span>
      </button>
      <button onclick="window.location.href='screen-parishioner-services-hub.html?' + sessionParams.toString()" class="flex flex-col items-center gap-1 py-3 text-ink-muted">
        <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="4" width="7" height="7" rx="1.5"/><rect x="14" y="4" width="7" height="7" rx="1.5"/><rect x="3" y="15" width="7" height="7" rx="1.5"/><rect x="14" y="15" width="7" height="7" rx="1.5"/></svg>
        <span class="text-[10.5px]">Services</span>
      </button>
      <button class="flex flex-col items-center gap-1 py-3 text-primary">
        <svg class="icon" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-10-9.3C.4 8.4 2.3 5 5.7 5 8 5 10 6.3 12 9c2-2.7 4-4 6.3-4 3.4 0 5.3 3.4 3.7 6.7C19.5 16.4 12 21 12 21Z"/></svg>
        <span class="text-[10.5px] font-semibold">Give</span>
      </button>
      <button onclick="window.location.href='screen-parishioner-family.html?' + sessionParams.toString()" class="flex flex-col items-center gap-1 py-3 text-ink-muted">
        <svg class="icon" viewBox="0 0 24 24"><circle cx="9" cy="7" r="3.5"/><path d="M2 21v-1a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v1"/><circle cx="18" cy="8" r="2.5"/></svg>
        <span class="text-[10.5px]">My Family</span>
      </button>
      <button onclick="window.location.href='screen-parishioner-me-hub.html?' + sessionParams.toString()" class="flex flex-col items-center gap-1 py-3 text-ink-muted">
        <svg class="icon" viewBox="0 0 24 24"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
        <span class="text-[10.5px]">Menu</span>
      </button>
    </div>
  </nav>

  <div id="toast" class="fixed bottom-24 left-1/2 -translate-x-1/2 bg-ink text-white text-sm px-4 py-2.5 rounded-button shadow-card opacity-0 pointer-events-none transition-opacity duration-200 max-w-[90%] text-center z-50"></div>

  <!-- ============ GIVE FLOW MODAL ============ -->
  <div id="give-modal" class="hidden fixed inset-0 bg-black/30 z-50 flex items-end justify-center">
    <div class="bg-card-bg rounded-t-card shadow-card w-full max-w-[420px] max-h-[85vh] overflow-y-auto">
      <div class="px-5 pt-5 pb-4 border-b border-divider flex items-center justify-between">
        <p id="give-modal-title" class="font-heading font-bold text-lg">Give</p>
        <button onclick="closeGiveModal()" aria-label="Close" class="w-9 h-9 rounded-button flex items-center justify-center text-ink-muted hover:bg-section-bg">
          <svg class="icon" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="M6 6l12 12"/></svg>
        </button>
      </div>
      <div id="give-form" class="px-5 py-5 space-y-4"></div>
    </div>
  </div>

<script>
  const sessionParams = new URLSearchParams(window.location.search);
  const sessionName = sessionParams.get('name') || 'John Rodrigues';
  const sessionFirstName = sessionName.split(' ')[0];
  const sessionInitials = sessionName.split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();

  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.remove('opacity-0'); t.classList.add('opacity-100');
    clearTimeout(window._t);
    window._t = setTimeout(() => { t.classList.remove('opacity-100'); t.classList.add('opacity-0'); }, 1800);
  }
  const MONTH_NAMES = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  function formatDate(iso) {
    const [y,m,d] = iso.split('-').map(Number);
    return `${d} ${MONTH_NAMES[m-1]} ${y}`;
  }
  function formatMoney(n) { return '\u20b9' + n.toLocaleString('en-IN'); }
  const ICON_PATHS = {
    check: '<path d="M20 6 9 17l-5-5"/>',
    download: '<path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/>',
  };
  function icon(name, cls) { return `<svg class="${cls||'icon'}" viewBox="0 0 24 24">${ICON_PATHS[name]}</svg>`; }

  // ---------------- Real donation causes (mock-seed.json donationCauses — same 2 already ----------------
  // ---------------- referenced on the Dashboard's Community section, kept consistent here). ----------------
  const causes = [
    { id:"CAUSE-5001", name:"Church Renovation Fund", description:"Support the ongoing renovation of the parish worship hall.", donationType:"Goal-based", suggestedAmounts:[500,1000,2500], allowCustomAmount:true, targetAmount:2500000, raisedAmount:1642000 },
    { id:"CAUSE-5002", name:"Education Support Fund", description:"Scholarships for children from economically weaker families in the parish.", donationType:"Open", suggestedAmounts:[250,500,1000], allowCustomAmount:true, raisedAmount:184500 },
  ];

  // ---------------- Donation history (mirrors schema 4.6's Donation entity) ----------------
  let donations = [
    { id:"DON-001", causeName:"Church Renovation Fund", amount:1000, paymentMethod:"UPI", donationDate:"2026-06-15", receiptNumber:"RCPT-DON-0142", paymentStatus:"Successful" },
    { id:"DON-002", causeName:"Education Support Fund", amount:500, paymentMethod:"Card", donationDate:"2026-04-02", receiptNumber:"RCPT-DON-0098", paymentStatus:"Successful" },
  ];

  let currentModule = 'give';
  function setModule(m) {
    currentModule = m;
    document.querySelectorAll('.module-tab').forEach(btn => {
      const active = btn.dataset.module === m;
      btn.className = `module-tab flex-1 px-4 py-2.5 rounded-badge text-sm font-semibold transition-warm ${active ? 'bg-primary text-white' : 'bg-card-bg text-ink-muted border border-divider'}`;
    });
    renderModule();
  }
  function renderModule() {
    const el = document.getElementById('module-content');
    if (currentModule === 'give') renderGiveModule(el);
    else renderHistoryModule(el);
  }

  // =========================================================================
  // GIVE — cause list with progress bars, tapping opens a guided give flow.
  // =========================================================================
  function renderGiveModule(el) {
    el.innerHTML = causes.map(c => {
      const pct = c.targetAmount ? Math.min(100, Math.round((c.raisedAmount / c.targetAmount) * 100)) : null;
      return `
        <div class="bg-card-bg rounded-card shadow-card p-5 mb-4">
          <p class="font-heading font-bold text-base">${c.name}</p>
          <p class="text-sm text-ink-muted mt-1 leading-relaxed">${c.description}</p>
          ${pct !== null ? `
            <div class="mt-3">
              <div class="h-2 bg-section-bg rounded-badge overflow-hidden"><div class="h-full bg-primary rounded-badge" style="width:${pct}%"></div></div>
              <p class="text-xs text-ink-muted mt-1.5">${formatMoney(c.raisedAmount)} raised of ${formatMoney(c.targetAmount)} goal \u00b7 ${pct}%</p>
            </div>
          ` : `<p class="text-xs text-ink-muted mt-3">${formatMoney(c.raisedAmount)} raised so far</p>`}
          <button onclick="openGiveFlow('${c.id}')" class="mt-4 w-full bg-primary hover:bg-primary-hover text-white text-sm font-semibold py-3 rounded-button min-h-[44px] transition-warm">Give</button>
        </div>
      `;
    }).join('');
  }

  let giveState = { causeId: null, amount: null, customAmount: '', paymentMethod: null };
  function openGiveFlow(causeId) {
    giveState = { causeId, amount: null, customAmount: '', paymentMethod: null };
    const c = causes.find(x => x.id === causeId);
    document.getElementById('give-modal-title').textContent = 'Give to ' + c.name;
    document.getElementById('give-modal').classList.remove('hidden');
    renderGiveStep();
  }
  function closeGiveModal() { document.getElementById('give-modal').classList.add('hidden'); }
  function renderGiveStep() {
    const c = causes.find(x => x.id === giveState.causeId);
    document.getElementById('give-form').innerHTML = `
      <div>
        <p class="text-sm font-medium mb-2">Choose an amount</p>
        <div class="grid grid-cols-3 gap-2">
          ${c.suggestedAmounts.map(a => `
            <button onclick="selectGiveAmount(${a})" class="py-3 rounded-button text-sm font-semibold border transition-warm ${giveState.amount === a ? 'bg-primary text-white border-primary' : 'bg-white border-divider text-ink hover:bg-section-bg'}">${formatMoney(a)}</button>
          `).join('')}
        </div>
        ${c.allowCustomAmount ? `
          <div class="mt-3 space-y-1.5">
            <label class="text-xs font-medium">Or enter a custom amount</label>
            <input id="gf-custom" type="number" placeholder="e.g. 1500" value="${giveState.customAmount}" oninput="giveState.customAmount=this.value; giveState.amount=null; renderGiveStep()" class="w-full border border-divider rounded-input px-3 h-11 text-sm bg-white focus:ring-2 focus:ring-primary-light focus:outline-none">
          </div>
        ` : ''}
      </div>
      <div>
        <p class="text-sm font-medium mb-2">Payment method</p>
        <div class="grid grid-cols-3 gap-2">
          ${["UPI","Card","Net Banking"].map(m => `
            <button onclick="giveState.paymentMethod='${m}'; renderGiveStep()" class="py-3 rounded-button text-xs font-semibold border transition-warm ${giveState.paymentMethod === m ? 'bg-primary text-white border-primary' : 'bg-white border-divider text-ink hover:bg-section-bg'}">${m}</button>
          `).join('')}
        </div>
      </div>
      <button onclick="submitDonation()" class="w-full bg-primary hover:bg-primary-hover text-white text-sm font-semibold py-3.5 rounded-button min-h-[44px] transition-warm">Confirm &amp; Give ${(giveState.amount || giveState.customAmount) ? formatMoney(giveState.amount || parseInt(giveState.customAmount) || 0) : ''}</button>
    `;
  }
  function selectGiveAmount(a) {
    giveState.amount = a;
    giveState.customAmount = '';
    renderGiveStep();
  }
  function submitDonation() {
    const amount = giveState.amount || parseInt(giveState.customAmount) || 0;
    if (!amount || amount <= 0) { toast('Please choose or enter an amount.'); return; }
    if (!giveState.paymentMethod) { toast('Please choose a payment method.'); return; }
    const c = causes.find(x => x.id === giveState.causeId);
    c.raisedAmount += amount;
    const receiptNumber = 'RCPT-DON-' + Math.floor(1000 + Math.random() * 8999);
    donations.unshift({ id:'DON-'+Math.floor(100+Math.random()*899), causeName: c.name, amount, paymentMethod: giveState.paymentMethod, donationDate: '2026-07-31', receiptNumber, paymentStatus: 'Successful' });
    closeGiveModal();
    toast(`Thank you! ${formatMoney(amount)} given to ${c.name}.`);
    renderModule();
  }

  // =========================================================================
  // HISTORY — past donations with receipts.
  // =========================================================================
  function renderHistoryModule(el) {
    if (donations.length === 0) {
      el.innerHTML = `<div class="bg-card-bg rounded-card shadow-card p-8 text-center"><p class="text-sm text-ink-muted">No donations yet.</p></div>`;
      return;
    }
    el.innerHTML = donations.map(d => `
      <div class="bg-card-bg rounded-card shadow-card p-5 mb-3">
        <div class="flex items-start justify-between gap-3">
          <div>
            <p class="text-sm font-semibold">${d.causeName}</p>
            <p class="text-xs text-ink-muted mt-0.5">${formatDate(d.donationDate)} \u00b7 ${d.paymentMethod}</p>
          </div>
          <p class="font-heading font-bold text-base">${formatMoney(d.amount)}</p>
        </div>
        <div class="flex items-center justify-between mt-3 pt-3 border-t border-divider">
          <span class="bg-green/20 text-[#2f6b45] text-xs font-semibold px-2.5 py-1 rounded-badge flex items-center gap-1">${icon('check','w-3 h-3')}${d.paymentStatus}</span>
          <button onclick="toast('Downloading receipt ${d.receiptNumber}')" class="text-primary text-xs font-semibold flex items-center gap-1">${icon('download','w-3.5 h-3.5')}${d.receiptNumber}</button>
        </div>
      </div>
    `).join('');
  }

  renderModule();
</script>

</body>
</html>
