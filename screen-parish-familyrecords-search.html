  function initials(name) { return name.split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase(); }

  function renderList() {
    const q = (document.getElementById('search-input').value || '').trim().toLowerCase();
    const filtered = families.filter(f => {
      const matchesFilter = currentFilter === 'All' || f.status === currentFilter;
      const matchesSearch = !q || [f.familyName, f.headOfFamily, f.familyRecordNumber, f.mobile].some(v => v.toLowerCase().includes(q));
      return matchesFilter && matchesSearch;
    });
    const listEl = document.getElementById('family-list');

    if (filtered.length === 0) {
      listEl.innerHTML = `<div class="bg-card-bg rounded-card shadow-card p-8 text-center"><p class="text-sm font-semibold">No families found</p><p class="text-xs text-ink-muted mt-1">Try a different search term or filter.</p></div>`;
      return;
    }

    listEl.innerHTML = filtered.map(f => {
      const selected = f.id === selectedFamilyId;
      return `
        <button onclick="selectFamily('${f.id}')" class="w-full text-left bg-card-bg rounded-card p-4 transition-warm min-h-[44px] ${selected ? 'shadow-card-hover ring-2 ring-primary' : 'shadow-card hover:shadow-card-hover'}">

            ${pill(f.status, STATUS_STYLE)}
            ${pill(f.subscriptionStatus, SUB_STYLE)}
          </div>
        </button>
      `;
    }).join('');
  }

  function selectFamily(id) {
    selectedFamilyId = id;
    activeTab = 'overview';

  function findFamily(id) { return families.find(f => f.id === id); }
