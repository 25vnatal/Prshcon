<!DOCTYPE html>
<html lang="en">
<head>
<title>Parish Connect — A Minute with Jesus</title>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700&family=Inter:wght@400;500;600&family=Newsreader:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          'bg-warm': '#FAFBFD', 'card-bg': '#FFFFFF', 'section-bg': '#F5F7FB', divider: '#E8EDF5',
          ink: '#1F2937', 'ink-muted': '#6B7280',
          primary: { DEFAULT: '#4F7CF5', hover: '#3F6CE4', light: '#EEF4FF' },
          coral: '#FF7F73', gold: '#F6C453', green: '#6CBF84', lavender: '#A88BFF',
          error: { DEFAULT: '#E5645A', bg: '#FDECEA' },
        },
        fontFamily: { heading: ['Manrope', 'sans-serif'], body: ['Inter', 'sans-serif'], verse: ['Newsreader', 'serif'] },
        borderRadius: { card: '24px', button: '16px', input: '16px', badge: '999px' },
        boxShadow: { card: '0 6px 24px rgba(30,41,59,0.08)' },
      },
    },
  };
</script>
<style>
  body { font-family: 'Inter', sans-serif; background-color: #FAFBFD; color: #1F2937; line-height: 1.5; }
  h1, h2, .font-heading { font-family: 'Manrope', sans-serif; }
  .font-verse { font-family: 'Newsreader', serif; font-style: italic; }
  :focus-visible { outline: 2px solid #4F7CF5; outline-offset: 2px; }
  .transition-warm { transition: all 300ms cubic-bezier(0.4, 0, 0.2, 1); }
  .icon { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .stagger-1 { animation: fadeUp 500ms ease both; animation-delay: 60ms; }
  .stagger-2 { animation: fadeUp 500ms ease both; animation-delay: 160ms; }
  .stagger-3 { animation: fadeUp 500ms ease both; animation-delay: 260ms; }
  .stagger-4 { animation: fadeUp 500ms ease both; animation-delay: 360ms; }
  @media (prefers-reduced-motion: reduce) {
    .stagger-1, .stagger-2, .stagger-3, .stagger-4 { animation: none; }
  }
</style>
</head>
<body class="text-ink">

  <div class="max-w-[420px] mx-auto min-h-screen relative" id="frame"></div>

  <div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 bg-ink text-white text-sm px-4 py-2.5 rounded-button shadow-card opacity-0 pointer-events-none transition-opacity duration-200 max-w-[90%] text-center z-50"></div>

<script>
  const sessionParams = new URLSearchParams(window.location.search);
  // Same fix as screen-parishioner-parish-profile.html and screen-parishioner-faithformation.html:
  // this screen has no page-specific params of its own today, but baseParams() is used for all
  // outbound navigation anyway, on the same principle — never propagate more than the durable
  // identity param, so nothing this screen might carry in the future can leak forward either.
  function baseParams() {
    const p = new URLSearchParams();
    ['name'].forEach(k => { if (sessionParams.get(k)) p.set(k, sessionParams.get(k)); });
    return p;
  }

  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.remove('opacity-0'); t.classList.add('opacity-100');
    clearTimeout(window._t);
    window._t = setTimeout(() => { t.classList.remove('opacity-100'); t.classList.add('opacity-0'); }, 1800);
  }

  const ICON_PATHS = {
    volume: '<path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/>',
    muted: '<path d="M11 5 6 9H2v6h4l5 4V5Z"/><line x1="16" y1="9" x2="22" y2="15"/><line x1="22" y1="9" x2="16" y2="15"/>',
    share: '<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4"/><path d="m15.4 6.5-6.8 4"/>',
    check: '<path d="M20 6 9 17l-5-5"/>',
    x: '<path d="M18 6 6 18"/><path d="M6 6l12 12"/>',
  };
  function icon(name, cls) { return `<svg class="${cls||'icon'}" viewBox="0 0 24 24">${ICON_PATHS[name]}</svg>`; }

  // ---------------- Today's content. This is a single representative example (the Feast of the ----------------
  // ---------------- Assumption), not a full liturgical-year content calendar — matching how this app's ----------------
  // ---------------- other content areas work (Faith Formation is a curated list, not 365 auto-generated ----------------
  // ---------------- entries). Diocese-authored in spirit: no per-parish setup, same content for every parish. ----------------
  // ---------------- Ordinary Time would use the default primary-blue accent; Advent/Lent would use lavender ----------------
  // ---------------- (already documented in design-tokens.css as "reflection, prayer") — same layout, different ----------------
  // ---------------- accent token, not built out yet since this is the one state carried through from the ----------------
  // ---------------- reviewed mockup. All text below is original composition, not a scripture quotation. ----------------
  const today = {
    occasion: "Memorial of Saint Faustina Kowalska",
    verseLine: "Today the Church remembers Saint Faustina, a quiet Polish sister who spent her short life trusting in God’s mercy and sharing it with others.",
    reflection: "Faustina held no great title and had no famous project. She cooked, opened the door, tended the garden, and through those ordinary days she kept returning to one message: God’s mercy is bigger than our failures. A new week begins today. Perhaps you carry something you regret, or someone you find hard to forgive. Mercy is not a prize for the tidy; it is where the broken begin again.",
    prayerLine: "Jesus, I trust in You. Where I have failed, help me return to You without fear. And where someone has failed me, give me the grace to be merciful today.",
    weekCount: 5,
  };

  let audioOn = false;
  let currentState = 'minute';

  // =========================================================================
  // STATE 1 — THE MINUTE (full-bleed, single scroll, calm)
  // =========================================================================
  function renderMinute() {
    return `
      <div class="min-h-screen flex flex-col" style="background: linear-gradient(180deg, #FFF9F8 0%, #FFEDEA 45%, #FFDCD6 100%);">
        <header class="px-5 pt-6 pb-2 flex items-center justify-between">
          <button onclick="window.location.href='screen-parishioner-dashboard-home.html?' + baseParams().toString()" aria-label="Close" class="w-10 h-10 rounded-button flex items-center justify-center text-ink-muted/70 hover:bg-black/5 transition-warm">
            ${icon('x','icon w-5 h-5')}
          </button>
          <button onclick="toggleAudio()" id="audio-toggle" aria-label="Toggle gentle audio" class="w-10 h-10 rounded-button flex items-center justify-center transition-warm ${audioOn ? 'text-gold bg-gold/15' : 'text-ink-muted/60 hover:bg-black/5'}">
            ${icon(audioOn ? 'volume' : 'muted','icon w-5 h-5')}
          </button>
        </header>

        <main class="flex-1 flex flex-col justify-center px-8 py-10 space-y-9 max-w-[420px] mx-auto">

          <div class="text-center stagger-1">
            <p class="text-[11px] font-semibold uppercase tracking-wider mb-4" style="color:#B3463C;">${today.occasion}</p>
            <p class="font-verse text-2xl leading-snug text-ink">${today.verseLine}</p>
          </div>

          <div class="w-8 h-px mx-auto stagger-2" style="background: rgba(179,70,60,0.25);"></div>

          <p class="text-base leading-relaxed text-ink/85 text-center stagger-2">${today.reflection}</p>

          <div class="w-8 h-px mx-auto stagger-3" style="background: rgba(179,70,60,0.25);"></div>

          <div class="text-center stagger-3">
            <p class="font-verse text-base leading-relaxed text-ink/90">${today.prayerLine}</p>
          </div>

        </main>

        <footer class="px-8 pb-10 pt-4 stagger-4">
          <button onclick="setState('share')" class="w-full text-center py-4">
            <span class="font-heading font-semibold text-lg" style="color:#B3463C;">Amen</span>
          </button>
        </footer>
      </div>
    `;
  }

  function toggleAudio() {
    audioOn = !audioOn;
    const btn = document.getElementById('audio-toggle');
    btn.className = `w-10 h-10 rounded-button flex items-center justify-center transition-warm ${audioOn ? 'text-gold bg-gold/15' : 'text-ink-muted/60 hover:bg-black/5'}`;
    btn.innerHTML = icon(audioOn ? 'volume' : 'muted', 'icon w-5 h-5');
    toast(audioOn ? 'Gentle audio on' : 'Gentle audio off');
  }

  // =========================================================================
  // STATE 2 — END / SHARE
  // =========================================================================
  function renderShare() {
    return `
      <div class="min-h-screen flex flex-col bg-bg-warm">
        <header class="px-5 pt-6 pb-2 flex items-center justify-between">
          <button onclick="window.location.href='screen-parishioner-dashboard-home.html?' + baseParams().toString()" aria-label="Close" class="w-10 h-10 rounded-button flex items-center justify-center text-ink-muted hover:bg-section-bg transition-warm">
            ${icon('x','icon w-5 h-5')}
          </button>
          <span class="w-10 h-10"></span>
        </header>

        <main class="flex-1 flex flex-col items-center px-6 pt-2 pb-6 max-w-[420px] mx-auto w-full">

          <!-- Shareable card — 9:16, sized for WhatsApp Status / Instagram Stories. Shows the same prayer -->
          <!-- line as the Minute screen above (today.prayerLine), one source, so the card can never drift -->
          <!-- from what was actually prayed. Motif is deliberately abstract (crescent moon, radiating light, -->
          <!-- simple stars — drawing on the Woman-Clothed-with-the-Sun imagery tied to this feast) rather -->
          <!-- than a literal figure, per this app's own "no busy religious motifs" guidance. -->
          <div class="stagger-1 w-full max-w-[280px] aspect-[9/16] rounded-card overflow-hidden shadow-card relative" style="background: linear-gradient(165deg, #FFE3DD 0%, #FFA79B 50%, #F57F6E 100%);">

            <div class="absolute inset-0" style="background: radial-gradient(circle at 50% 34%, rgba(255,255,255,0.6) 0%, rgba(255,255,255,0) 58%);"></div>

            <svg class="absolute inset-0 w-full h-full" viewBox="0 0 280 498" fill="none">
              <g stroke="#FFFDF3" stroke-width="3" stroke-linecap="round" opacity="0.6"><line x1="92.4" y1="82.5" x2="63.9" y2="73.3"/><line x1="99.5" y1="68.6" x2="75.3" y2="51.0"/><line x1="110.6" y1="57.5" x2="93.0" y2="33.3"/><line x1="124.5" y1="50.4" x2="115.3" y2="21.9"/><line x1="140.0" y1="48.0" x2="140.0" y2="18.0"/><line x1="155.5" y1="50.4" x2="164.7" y2="21.9"/><line x1="169.4" y1="57.5" x2="187.0" y2="33.3"/><line x1="180.5" y1="68.6" x2="204.7" y2="51.0"/><line x1="187.6" y1="82.5" x2="216.1" y2="73.3"/></g>
              <circle cx="140" cy="98" r="34" fill="#FFFDF3" opacity="0.92"/>
              <path d="M38 410 l2 5.5 5.5 2 -5.5 2 -2 5.5 -2 -5.5 -5.5 -2 5.5 -2 Z" fill="#FFFDF3" opacity="0.6"/>
              <path d="M236 392 l2 5.5 5.5 2 -5.5 2 -2 5.5 -2 -5.5 -5.5 -2 5.5 -2 Z" fill="#FFFDF3" opacity="0.5"/>
              <circle cx="60" cy="40" r="1.5" fill="#FFFDF3" opacity="0.7"/>
              <circle cx="230" cy="52" r="1.5" fill="#FFFDF3" opacity="0.6"/>
            </svg>

            <div class="relative h-full flex flex-col justify-between px-7 pt-40 pb-8 text-center">
              <p class="text-[11px] font-semibold uppercase tracking-wider" style="color:#7A2820;">${today.occasion}</p>

              <p class="font-verse text-base leading-relaxed" style="color:#4A1510;">"${today.prayerLine}"</p>

              <div class="space-y-1.5">
                <div class="w-8 h-px mx-auto" style="background: rgba(74,21,16,0.3);"></div>
                <p class="text-[10px] tracking-wide" style="color:#7A2820;">Reflections by Parish Connect</p>
              </div>
            </div>
          </div>

          <div class="w-full max-w-[280px] mt-6 space-y-3 stagger-2">
            <button onclick="toast('Preparing to share…')" class="w-full bg-ink text-white text-sm font-semibold py-3.5 rounded-button flex items-center justify-center gap-2 transition-warm hover:opacity-90">
              ${icon('share','w-4 h-4')} Share
            </button>
            <button onclick="toast('Saving image…')" class="w-full text-ink-muted text-xs font-semibold py-1 transition-warm hover:text-ink">
              Save image
            </button>
          </div>

          <p class="stagger-3 text-sm text-ink-muted/80 pt-6 text-center">You've paused with us ${today.weekCount} days this week.</p>

        </main>

        <footer class="px-8 pb-10 pt-2 stagger-4">
          <button onclick="window.location.href='screen-parishioner-dashboard-home.html?' + baseParams().toString()" class="w-full text-center text-sm font-semibold text-ink-muted/70 hover:text-ink transition-warm py-3">
            Back to today
          </button>
        </footer>
      </div>
    `;
  }

  function setState(s) {
    currentState = s;
    render();
    window.scrollTo({ top: 0, behavior: 'instant' });
  }
  function render() {
    document.getElementById('frame').innerHTML = currentState === 'minute' ? renderMinute() : renderShare();
  }

  render();
</script>

</body>
</html>
