<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          'bg-warm': '#FAFBFD', 'card-bg': '#FFFFFF', 'section-bg': '#F5F7FB', divider: '#E8EDF5',
          ink: '#1F2937', 'ink-muted': '#6B7280',
          primary: { DEFAULT: '#4F7CF5', hover: '#3F6CE4', light: '#EEF4FF' },
          coral: '#FF7F73', gold: '#F6C453', green: '#6CBF84', lavender: '#A88BFF',
          error: { DEFAULT: '#E5645A', bg: '#FDECEA' },
        },
        fontFamily: { heading: ['Manrope', 'sans-serif'], body: ['Inter', 'sans-serif'] },
        borderRadius: { card: '24px', button: '16px', input: '16px', badge: '999px' },
        boxShadow: { card: '0 6px 24px rgba(30,41,59,0.08)', 'card-hover': '0 12px 36px rgba(30,41,59,0.12)' },
        maxWidth: { content: '1440px' },

<style>
  body { font-family: 'Inter', sans-serif; background-color: #FAFBFD; color: #1F2937; line-height: 1.5; }

  :focus-visible { outline: 2px solid #4F7CF5; outline-offset: 2px; }
  .transition-warm { transition: all 200ms ease; }
  .icon { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .skeleton { background: linear-gradient(90deg, #E8EDF5 25%, #F2F5FA 37%, #E8EDF5 63%); background-size: 400% 100%; animation: shimmer 1.4s ease infinite; }
  @keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }
</style>

<body class="text-ink">

<script>
  const sessionParams = new URLSearchParams(window.location.search);
  // Only these identity params should ever propagate between pages via navigation —
  // page-specific deep-link params (family, tab, module, openRegister, etc.) must NOT
  // leak forward, or every subsequent "go somewhere" link keeps re-opening whatever
  // deep link the user originally arrived on (e.g. Family Records always reopening
  // a specific family's Updates tab instead of showing the plain list).
  function baseParams() {
    const p = new URLSearchParams();
    ['parish', 'parishName', 'name'].forEach(k => { if (sessionParams.get(k)) p.set(k, sessionParams.get(k)); });
    return p;
  }
  const parishName = sessionParams.get('parishName') || 'Infant Jesus Shrine';
  document.getElementById('sidebar-parish-name').textContent = parishName;
  document.getElementById('header-parish-name').textContent = parishName;
  document.getElementById('account-parish-name').textContent = parishName;
  document.getElementById('avatar-btn').textContent = parishName.split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();

  function goDash() { window.location.href = 'screen-parish-dashboard-home.html?' + baseParams().toString(); return false; }
  function goFamilyRecords() { window.location.href = 'screen-parish-familyrecords-search.html?' + baseParams().toString(); return false; }
  function goMasses() { window.location.href = 'screen-parish-masses-hub.html?' + baseParams().toString(); return false; }
  function goCalendar() { window.location.href = 'screen-parish-calendar-hub.html?' + baseParams().toString(); return false; }
  function goServices() { window.location.href = 'screen-parish-services-hub.html?' + baseParams().toString(); return false; }
  function goCommunication() { window.location.href = 'screen-parish-communication-hub.html?' + baseParams().toString(); return false; }
  function goDocuments() { window.location.href = 'screen-parish-documents-hub.html?' + baseParams().toString(); return false; }
  function goFaithFormation() { window.location.href = 'screen-parish-faithformation-hub.html?' + baseParams().toString(); return false; }
  function goCommittees() { window.location.href = 'screen-parish-committees-hub.html?' + baseParams().toString(); return false; }
  function goAdminProfile() { window.location.href = 'screen-parish-administration-hub.html?' + baseParams().toString() + '&module=profile'; return false; }
  function goAdminInventory() { window.location.href = 'screen-parish-administration-hub.html?' + baseParams().toString() + '&module=inventory'; return false; }
  function goAdminStaff() { window.location.href = 'screen-parish-administration-hub.html?' + baseParams().toString() + '&module=staff'; return false; }
  function toggleAdminGroup() {
    document.getElementById('admin-children').classList.toggle('hidden');
    document.getElementById('admin-chevron').classList.toggle('rotate-90');
  }
  function goFinance() { window.location.href = 'screen-parish-finance-hub.html?' + baseParams().toString(); return false; }
  function goAdministration() { window.location.href = 'screen-parish-administration-hub.html?' + baseParams().toString(); return false; }
  function goReports() { window.location.href = 'screen-parish-reports-hub.html?' + baseParams().toString(); return false; }
  function goSettings() { window.location.href = 'screen-parish-settings-hub.html?' + baseParams().toString(); return false; }
  function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('-translate-x-full');
    document.getElementById('sidebar-backdrop').classList.toggle('hidden');
  }
  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.remove('opacity-0'); t.classList.add('opacity-100');
    clearTimeout(window._t);
    window._t = setTimeout(() => { t.classList.remove('opacity-100'); t.classList.add('opacity-0'); }, 1800);
  }

  const ICON_PATHS = {
    check: '<path d="M20 6 9 17l-5-5"/>',
    clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    alert: '<path d="M12 9v4"/><circle cx="12" cy="16.5" r="0.75" fill="currentColor" stroke="none"/><path d="M10.3 3.9 2.6 17a2 2 0 0 0 1.7 3h15.4a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/>',
    x: '<path d="M18 6 6 18"/><path d="M6 6l12 12"/>',
    chevronDown: '<polyline points="6 9 12 15 18 9"/>',
    fileCheck: '<path d="M14 3v5a1 1 0 0 0 1 1h5"/><path d="M6 3h8l6 6v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z"/><path d="m9 15 2 2 4-4"/>',
    archive: '<rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9"/><path d="M10 13h4"/>',
  };
  function icon(name, cls) { return `<svg class="${cls||'icon'}" viewBox="0 0 24 24">${ICON_PATHS[name]}</svg>`; }

  // ---------------- Reference data: family + per-document-type field specs (mirrors parishioner side) ----------------
  const familyMembers = [
    { id: "MEM-2001", name: "John Rodrigues", relationship: "Head", email: "john.rodrigues@example.com", dateOfBirth: "14 Mar 1975", fatherName: "Michael Rodrigues", motherName: "Teresa Rodrigues", membershipStatus: "Active",
      sacraments: { Baptism: { date: "20 Apr 1975", church: "Infant Jesus Shrine, Viveknagar" } } },
    { id: "MEM-2002", name: "Grace Rodrigues", relationship: "Spouse", email: "grace.rodrigues@example.com", dateOfBirth: "2 Jul 1978", fatherName: "Anthony Pinto", motherName: "Rose Pinto", membershipStatus: "Active", sacraments: {} },
    { id: "MEM-2003", name: "Kevin Rodrigues", relationship: "Son", email: "kevin.rodrigues@example.com", dateOfBirth: "18 Jan 2003", fatherName: "John Rodrigues", motherName: "Grace Rodrigues", membershipStatus: "Active",
      sacraments: { Baptism: { date: "14 Feb 2003", church: "Infant Jesus Shrine, Viveknagar" }, "First Communion": { date: "10 Apr 2011", church: "Infant Jesus Shrine, Viveknagar" }, Confirmation: { date: "3 Sep 2017", church: "Infant Jesus Shrine, Viveknagar" } } },
    { id: "MEM-2004", name: "Clara Rodrigues", relationship: "Daughter", email: null, dateOfBirth: "25 Sep 2006", fatherName: "John Rodrigues", motherName: "Grace Rodrigues", membershipStatus: "Active",
      sacraments: { Baptism: { date: "15 Oct 2006", church: "Infant Jesus Shrine, Viveknagar" }, "First Communion": { date: "6 Apr 2014", church: "Infant Jesus Shrine, Viveknagar" } } },
  ];
  const familyAddress = "No. 27, 2nd Cross, Church Street, Viveknagar, Bengaluru, Karnataka 560047";
  const family = { familyRecordNumber: "IJS/FAM/1001", familyName: "Rodrigues Family", headOfFamily: "John Rodrigues", spouseName: "Grace Rodrigues", marriageDate: "24 Nov 2001", marriageChurch: "Infant Jesus Shrine, Viveknagar", address: familyAddress };

  const FIELD_LABELS = {
    fullName: "Full Name", dateOfBirth: "Date of Birth", fatherName: "Father's Name", motherName: "Mother's Name",
    baptismDate: "Baptism Date", baptismParish: "Baptism Parish",
    communionDate: "First Communion Date", communionParish: "Parish",

    familyRecordNumber: "Family Record Number", familyName: "Family Name", headOfFamily: "Head of Family",
    familyMembers: "Family Members", address: "Address", membershipStatus: "Membership Status",
    godfather: "Godfather", godmother: "Godmother", witness1: "Witness 1", witness2: "Witness 2", celebrant: "Celebrant (Priest)",
    destination: "Destination (Parish / Institution / Organization)", destinationParish: "Destination Parish", transferDate: "Transfer Date",
  };

            <div class="mt-3 space-y-2">
              <textarea id="sac-reject-reason-${r.id}" rows="2" placeholder="Reason for rejection (shown to the parishioner)" class="w-full border border-divider rounded-input px-3 py-2 text-sm bg-white focus:ring-2 focus:ring-primary-light focus:outline-none resize-none"></textarea>
              <div class="flex gap-2">
                <button onclick="rejectSacrament('${r.id}')" class="bg-error text-white text-xs font-semibold px-3 py-2 rounded-button min-h-[36px] transition-warm">Confirm Rejection</button>
                <button onclick="sacramentsRejectPromptId=null; renderSacramentsList()" class="text-ink-muted text-xs font-semibold px-3 py-2 rounded-button min-h-[36px] hover:bg-section-bg transition-warm">Cancel</button>
              </div>
            </div>
          ` : ''}
        ` : ''}
      </div>
    `;
  }
  function approveSacrament(id) {
    const r = sacramentRequests.find(x => x.id === id);
    r.status = 'Approved';
    toast(`${r.sacramentName} registration approved \u2014 ${r.candidateName}.`);
    updateSacramentsBadge();
    renderSacramentsStageTabs();
    renderSacramentsList();
  }
  function rejectSacrament(id) {
    const r = sacramentRequests.find(x => x.id === id);
    const reason = document.getElementById(`sac-reject-reason-${id}`).value.trim();
    if (!reason) { toast('Please provide a reason before rejecting.'); return; }
    r.status = 'Rejected';
    r.internalNotes = reason;
    sacramentsRejectPromptId = null;
    toast(`${r.sacramentName} registration rejected \u2014 parishioner notified.`);
    updateSacramentsBadge();
    renderSacramentsStageTabs();
    renderSacramentsList();
  }

  // =========================================================================
  // HOME SERVICES MODULE — Pending Approval \u2192 Scheduled \u2192 Completed, or Rejected.
  // No payment/fee involved (home services are free), so the workflow is simpler
  // still than Sacraments: Approve-and-schedule captures a date/time (defaulting
  // to the parishioner's preferred slot, editable by staff), then a separate
  // "Mark Completed" step once the visit has actually happened.
  // =========================================================================
  const HOMESERVICE_TABS = ['All', 'Pending Approval', 'Scheduled', 'Completed'];
  let homeServicesTab = 'All';
  let homeServicesExpandedId = null;
  let homeServicesRejectPromptId = null;
  let homeServicesSchedulePromptId = null;

  function homeServicesFiltered() {
    if (homeServicesTab === 'All') return homeServiceRequests;
    return homeServiceRequests.filter(r => r.status === homeServicesTab);
  }
  function renderHomeServicesModule(el) {
    el.innerHTML = `
      <div class="flex gap-2 mb-5 overflow-x-auto" id="homeservices-stage-tabs"></div>
      <div id="homeservices-list" class="space-y-3"></div>
    `;
    renderHomeServicesStageTabs();
    renderHomeServicesList();
  }
  function renderHomeServicesStageTabs() {
    document.getElementById('homeservices-stage-tabs').innerHTML = HOMESERVICE_TABS.map(t => {
      const count = t === 'All' ? homeServiceRequests.length : homeServiceRequests.filter(r => r.status === t).length;
      const active = homeServicesTab === t;
      return `<button onclick="setHomeServicesTab('${t}')" class="px-3.5 py-2 rounded-badge text-xs font-semibold whitespace-nowrap transition-warm ${active ? 'bg-primary text-white' : 'bg-card-bg text-ink-muted border border-divider'}">${t}${count ? ` (${count})` : ''}</button>`;
    }).join('');
  }
  function setHomeServicesTab(t) {
    homeServicesTab = t;
    homeServicesExpandedId = null;
    renderHomeServicesStageTabs();
    renderHomeServicesList();
  }
  function homeServiceStatusPill(status) {
    const map = { 'Pending Approval':['bg-gold/20','text-[#8a5a10]','clock'], 'Scheduled':['bg-primary-light','text-primary','clock'], 'Completed':['bg-green/20','text-[#2f6b45]','check'], 'Rejected':['bg-error-bg','text-error','x'] };
    const [bg, text, iconName] = map[status] || map['Pending Approval'];
    return `<span class="${bg} ${text} text-xs font-semibold px-2.5 py-1 rounded-badge whitespace-nowrap inline-flex items-center gap-1">${icon(iconName,'w-3 h-3')}${status}</span>`;
  }
  function renderHomeServicesList() {
    const list = homeServicesFiltered();
    const container = document.getElementById('homeservices-list');
    if (list.length === 0) {
      container.innerHTML = `<div class="bg-card-bg rounded-card shadow-card p-10 text-center"><p class="text-sm font-semibold">No requests here</p><p class="text-sm text-ink-muted mt-1">Home service requests submitted by parishioners will appear here.</p></div>`;
      return;
    }
    container.innerHTML = list.map(r => {
      const isExpanded = homeServicesExpandedId === r.id;
      return `
        <div class="bg-card-bg rounded-card shadow-card overflow-hidden ${r.isEmergency && r.status === 'Pending Approval' ? 'ring-2 ring-error' : ''}">
          <button onclick="toggleHomeServiceExpand('${r.id}')" class="w-full text-left px-5 py-4 flex items-center justify-between gap-3 transition-warm hover:bg-section-bg min-h-[44px]">
            <div class="min-w-0">
              <p class="text-sm font-semibold">${r.serviceName}${r.isEmergency ? ' <span class="text-error text-xs font-normal">\u00b7 emergency</span>' : ''}</p>
              <p class="text-xs text-ink-muted mt-0.5">${r.familyName} \u00b7 ${r.preferredDate ? 'Preferred ' + r.preferredDate + (r.preferredTime ? ' \u00b7 ' + r.preferredTime : '') : 'No preferred date given'}</p>
            </div>
            ${homeServiceStatusPill(r.status)}
          </button>
          ${isExpanded ? renderHomeServiceDetail(r) : ''}
        </div>
      `;
    }).join('');
  }
  function toggleHomeServiceExpand(id) {
    homeServicesExpandedId = homeServicesExpandedId === id ? null : id;
    homeServicesRejectPromptId = null;
    homeServicesSchedulePromptId = null;
    renderHomeServicesList();
  }
  function renderHomeServiceDetail(r) {
    return `
      <div class="px-5 pb-5 pt-1 border-t border-divider">
        <div>
          <p class="text-xs text-ink-muted uppercase tracking-wide font-semibold mb-1">Requested by</p>
          <p class="text-sm">${r.requestedBy}</p>
        </div>
        <div class="mt-3">
          <p class="text-xs text-ink-muted uppercase tracking-wide font-semibold mb-1">Details from parishioner</p>
          <p class="text-sm">${r.description}</p>
        </div>
        ${r.status === 'Scheduled' || r.status === 'Completed' ? `
          <div class="mt-3 bg-primary-light rounded-card p-3">
            <p class="text-xs text-primary uppercase tracking-wide font-semibold mb-1">Scheduled</p>
            <p class="text-sm font-medium">${r.scheduledDate} \u00b7 ${r.scheduledTime}</p>
          </div>
        ` : ''}
        ${r.internalNotes ? `<div class="mt-3 bg-section-bg rounded-card p-3"><p class="text-xs text-ink-muted uppercase tracking-wide font-semibold mb-1">Internal notes</p><p class="text-sm">${r.internalNotes}</p></div>` : ''}

        ${r.status === 'Pending Approval' ? `
          <div class="flex flex-wrap gap-2 mt-4 pt-4 border-t border-divider">
            ${homeServicesSchedulePromptId === r.id ? '' : `<button onclick="homeServicesSchedulePromptId='${r.id}'; renderHomeServicesList()" class="bg-primary hover:bg-primary-hover text-white text-sm font-semibold px-4 py-2.5 rounded-button min-h-[40px] transition-warm">Approve &amp; Schedule</button>`}
            ${homeServicesRejectPromptId === r.id ? '' : `<button onclick="homeServicesRejectPromptId='${r.id}'; renderHomeServicesList()" class="bg-white border border-divider text-error text-sm font-semibold px-4 py-2.5 rounded-button min-h-[40px] transition-warm hover:bg-error-bg">Reject</button>`}
          </div>
          ${homeServicesSchedulePromptId === r.id ? `
            <div class="mt-3 space-y-2">
              <div class="grid grid-cols-2 gap-2">
                <input id="hs-schedule-date-${r.id}" type="date" class="border border-divider rounded-input px-3 h-10 text-sm bg-white focus:ring-2 focus:ring-primary-light focus:outline-none">
                <input id="hs-schedule-time-${r.id}" type="text" placeholder="e.g. 10:00 AM" value="${r.preferredTime || ''}" class="border border-divider rounded-input px-3 h-10 text-sm bg-white focus:ring-2 focus:ring-primary-light focus:outline-none">
              </div>
              <div class="flex gap-2">
                <button onclick="scheduleHomeService('${r.id}')" class="bg-primary hover:bg-primary-hover text-white text-xs font-semibold px-3 py-2 rounded-button min-h-[36px] transition-warm">Confirm Schedule</button>
                <button onclick="homeServicesSchedulePromptId=null; renderHomeServicesList()" class="text-ink-muted text-xs font-semibold px-3 py-2 rounded-button min-h-[36px] hover:bg-section-bg transition-warm">Cancel</button>
              </div>
            </div>
          ` : ''}
          ${homeServicesRejectPromptId === r.id ? `
            <div class="mt-3 space-y-2">
              <textarea id="hs-reject-reason-${r.id}" rows="2" placeholder="Reason for rejection (shown to the parishioner)" class="w-full border border-divider rounded-input px-3 py-2 text-sm bg-white focus:ring-2 focus:ring-primary-light focus:outline-none resize-none"></textarea>
              <div class="flex gap-2">
                <button onclick="rejectHomeService('${r.id}')" class="bg-error text-white text-xs font-semibold px-3 py-2 rounded-button min-h-[36px] transition-warm">Confirm Rejection</button>
                <button onclick="homeServicesRejectPromptId=null; renderHomeServicesList()" class="text-ink-muted text-xs font-semibold px-3 py-2 rounded-button min-h-[36px] hover:bg-section-bg transition-warm">Cancel</button>
              </div>
            </div>
          ` : ''}
        ` : ''}
        ${r.status === 'Scheduled' ? `
          <div class="mt-4 pt-4 border-t border-divider">
            <button onclick="completeHomeService('${r.id}')" class="bg-primary hover:bg-primary-hover text-white text-sm font-semibold px-4 py-2.5 rounded-button min-h-[40px] transition-warm">Mark Completed</button>
          </div>
        ` : ''}
      </div>
    `;
  }
  function scheduleHomeService(id) {
    const r = homeServiceRequests.find(x => x.id === id);
    const date = document.getElementById(`hs-schedule-date-${id}`).value;
    const time = document.getElementById(`hs-schedule-time-${id}`).value.trim();
    if (!date || !time) { toast('Please choose a date and time.'); return; }
    r.status = 'Scheduled';
    r.scheduledDate = formatShortDate(date);
    r.scheduledTime = time;
    homeServicesSchedulePromptId = null;
    toast(`${r.serviceName} scheduled for ${r.familyName}.`);
    updateHomeServicesBadge();
    renderHomeServicesStageTabs();
    renderHomeServicesList();
  }
  function rejectHomeService(id) {
    const r = homeServiceRequests.find(x => x.id === id);
    const reason = document.getElementById(`hs-reject-reason-${id}`).value.trim();
    if (!reason) { toast('Please provide a reason before rejecting.'); return; }
    r.status = 'Rejected';
    r.internalNotes = reason;
    homeServicesRejectPromptId = null;
    toast(`${r.serviceName} request rejected \u2014 parishioner notified.`);
    updateHomeServicesBadge();
    renderHomeServicesStageTabs();
    renderHomeServicesList();
  }
  function completeHomeService(id) {
    const r = homeServiceRequests.find(x => x.id === id);
    r.status = 'Completed';
    toast(`${r.serviceName} marked completed.`);
    renderHomeServicesStageTabs();
    renderHomeServicesList();
  }
  function formatShortDate(iso) {
    const MONTH_NAMES = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    const [y,m,d] = iso.split('-').map(Number);
    return `${d} ${MONTH_NAMES[m-1]} ${y}`;
  }
  function updateHomeServicesBadge() {
    const pendingCount = homeServiceRequests.filter(r => r.status === 'Pending Approval').length;
    const badge = document.getElementById('homeservices-badge');
    if (pendingCount > 0) {
      badge.textContent = pendingCount;
      badge.classList.remove('hidden');
    } else {
      badge.classList.add('hidden');
    }
  }

  // =========================================================================
  // FACILITY BOOKINGS MODULE — Pending Approval \u2192 Confirmed, or Rejected.
  // Has a fee like Sacraments (so payment status is shown), but no multi-step
  // scheduling like Home Services \u2014 the parishioner already picked a specific
  // date and slot when booking, staff just approves or rejects it as-is.
  // =========================================================================
  const FACILITIES_TABS = ['All', 'Pending Approval', 'Confirmed', 'Rejected'];
  let facilitiesTab = 'All';
  let facilitiesExpandedId = null;
  let facilitiesRejectPromptId = null;

  function facilitiesFiltered() {
    if (facilitiesTab === 'All') return facilityBookingRequests;
    return facilityBookingRequests.filter(r => r.status === facilitiesTab);
  }
  function renderFacilitiesModule(el) {
    el.innerHTML = `
      <div class="flex gap-2 mb-5 overflow-x-auto" id="facilities-stage-tabs"></div>
      <div id="facilities-list" class="space-y-3"></div>
    `;
    renderFacilitiesStageTabs();
    renderFacilitiesList();
  }
  function renderFacilitiesStageTabs() {
    document.getElementById('facilities-stage-tabs').innerHTML = FACILITIES_TABS.map(t => {
      const count = t === 'All' ? facilityBookingRequests.length : facilityBookingRequests.filter(r => r.status === t).length;
      const active = facilitiesTab === t;
      return `<button onclick="setFacilitiesTab('${t}')" class="px-3.5 py-2 rounded-badge text-xs font-semibold whitespace-nowrap transition-warm ${active ? 'bg-primary text-white' : 'bg-card-bg text-ink-muted border border-divider'}">${t}${count ? ` (${count})` : ''}</button>`;
    }).join('');
  }
  function setFacilitiesTab(t) {
    facilitiesTab = t;
    facilitiesExpandedId = null;
    renderFacilitiesStageTabs();
    renderFacilitiesList();
  }
  function facilityStatusPill(status) {
    const map = { 'Pending Approval':['bg-gold/20','text-[#8a5a10]','clock'], 'Confirmed':['bg-green/20','text-[#2f6b45]','check'], 'Rejected':['bg-error-bg','text-error','x'] };
    const [bg, text, iconName] = map[status] || map['Pending Approval'];
    return `<span class="${bg} ${text} text-xs font-semibold px-2.5 py-1 rounded-badge whitespace-nowrap inline-flex items-center gap-1">${icon(iconName,'w-3 h-3')}${status}</span>`;
  }
  function renderFacilitiesList() {
    const list = facilitiesFiltered();
    const container = document.getElementById('facilities-list');
    if (list.length === 0) {
      container.innerHTML = `<div class="bg-card-bg rounded-card shadow-card p-10 text-center"><p class="text-sm font-semibold">No bookings here</p><p class="text-sm text-ink-muted mt-1">Facility booking requests submitted by parishioners will appear here.</p></div>`;
      return;
    }
    container.innerHTML = list.map(r => {
      const isExpanded = facilitiesExpandedId === r.id;
      return `
        <div class="bg-card-bg rounded-card shadow-card overflow-hidden">
          <button onclick="toggleFacilityExpand('${r.id}')" class="w-full text-left px-5 py-4 flex items-center justify-between gap-3 transition-warm hover:bg-section-bg min-h-[44px]">
            <div class="min-w-0">
              <p class="text-sm font-semibold">${r.facilityName} \u2014 ${r.familyName}</p>
              <p class="text-xs text-ink-muted mt-0.5">${r.date} \u00b7 ${r.slotName} (${r.startTime} \u2013 ${r.endTime})</p>
            </div>
            <div class="flex items-center gap-2 flex-shrink-0">
              ${pill(r.paymentStatus, PAYMENT_STYLE)}
              ${facilityStatusPill(r.status)}
            </div>
          </button>
          ${isExpanded ? renderFacilityDetail(r) : ''}
        </div>
      `;
    }).join('');
  }
  function toggleFacilityExpand(id) {
    facilitiesExpandedId = facilitiesExpandedId === id ? null : id;
    facilitiesRejectPromptId = null;
    renderFacilitiesList();
  }
  function renderFacilityDetail(r) {
    return `
      <div class="px-5 pb-5 pt-1 border-t border-divider">
        <div class="grid sm:grid-cols-2 gap-4">
          <div><p class="text-xs text-ink-muted uppercase tracking-wide font-semibold mb-1">Requested by</p><p class="text-sm">${r.requestedBy}</p></div>
          <div><p class="text-xs text-ink-muted uppercase tracking-wide font-semibold mb-1">Expected attendees</p><p class="text-sm">${r.attendees}</p></div>
        </div>
        <div class="mt-3">
          <p class="text-xs text-ink-muted uppercase tracking-wide font-semibold mb-1">Purpose</p>
          <p class="text-sm">${r.purpose}</p>
        </div>
        <div class="mt-3">
          <p class="text-xs text-ink-muted uppercase tracking-wide font-semibold mb-1">Booking fee</p>
          <p class="text-sm font-semibold">\u20b9${r.bookingFee} \u00b7 ${r.paymentStatus}</p>
        </div>
        ${r.internalNotes ? `<div class="mt-3 bg-section-bg rounded-card p-3"><p class="text-xs text-ink-muted uppercase tracking-wide font-semibold mb-1">Internal notes</p><p class="text-sm">${r.internalNotes}</p></div>` : ''}
        ${r.status === 'Pending Approval' ? `
          <div class="flex flex-wrap gap-2 mt-4 pt-4 border-t border-divider">
            <button onclick="confirmFacilityBooking('${r.id}')" class="bg-primary hover:bg-primary-hover text-white text-sm font-semibold px-4 py-2.5 rounded-button min-h-[40px] transition-warm">Confirm Booking</button>
            ${facilitiesRejectPromptId === r.id ? '' : `<button onclick="facilitiesRejectPromptId='${r.id}'; renderFacilitiesList()" class="bg-white border border-divider text-error text-sm font-semibold px-4 py-2.5 rounded-button min-h-[40px] transition-warm hover:bg-error-bg">Reject</button>`}
          </div>
          ${facilitiesRejectPromptId === r.id ? `
            <div class="mt-3 space-y-2">
              <textarea id="fb-reject-reason-${r.id}" rows="2" placeholder="Reason for rejection (shown to the parishioner)" class="w-full border border-divider rounded-input px-3 py-2 text-sm bg-white focus:ring-2 focus:ring-primary-light focus:outline-none resize-none"></textarea>
              <div class="flex gap-2">
                <button onclick="rejectFacilityBooking('${r.id}')" class="bg-error text-white text-xs font-semibold px-3 py-2 rounded-button min-h-[36px] transition-warm">Confirm Rejection</button>
                <button onclick="facilitiesRejectPromptId=null; renderFacilitiesList()" class="text-ink-muted text-xs font-semibold px-3 py-2 rounded-button min-h-[36px] hover:bg-section-bg transition-warm">Cancel</button>
              </div>
            </div>
          ` : ''}
        ` : ''}
      </div>
    `;
  }
  function confirmFacilityBooking(id) {
    const r = facilityBookingRequests.find(x => x.id === id);
    r.status = 'Confirmed';
    toast(`${r.facilityName} booking confirmed for ${r.familyName}.`);
    updateFacilitiesBadge();
    renderFacilitiesStageTabs();
    renderFacilitiesList();
  }
  function rejectFacilityBooking(id) {
    const r = facilityBookingRequests.find(x => x.id === id);
    const reason = document.getElementById(`fb-reject-reason-${id}`).value.trim();
    if (!reason) { toast('Please provide a reason before rejecting.'); return; }
    r.status = 'Rejected';
    r.internalNotes = reason;
    facilitiesRejectPromptId = null;
    toast(`${r.facilityName} booking rejected \u2014 parishioner notified.`);
    updateFacilitiesBadge();
    renderFacilitiesStageTabs();
    renderFacilitiesList();
  }
  function updateFacilitiesBadge() {
    const pendingCount = facilityBookingRequests.filter(r => r.status === 'Pending Approval').length;
    const badge = document.getElementById('facilities-badge');
    if (pendingCount > 0) {
      badge.textContent = pendingCount;
      badge.classList.remove('hidden');
    } else {
      badge.classList.add('hidden');
    }
  }

  function renderStageTabs() {
    document.getElementById('stage-tabs').innerHTML = TABS.map(t => {
      const count = t === 'All' ? documentRequests.length : documentRequests.filter(r => pipelineStage(r) === t).length;
      const active = currentTab === t;
      return `<button onclick="setTab('${t}')" class="px-3.5 py-2 rounded-badge text-xs font-semibold whitespace-nowrap transition-warm ${active ? 'bg-ink text-white' : 'bg-section-bg text-ink-muted'}">${t} <span class="opacity-70">${count}</span></button>`;
    }).join('');
  }

  function setTab(t) {
    currentTab = t;
    expandedId = null;
    openPrompt = null;
    uploadFormOpenFor = null;
    renderStageTabs();
    renderList();
  }

  function toggleExpand(id) {
    expandedId = expandedId === id ? null : id;
    openPrompt = null;
    uploadFormOpenFor = null;
    renderList();
  }

  function renderLoading() {
    document.getElementById('request-list').innerHTML = `
      <div class="skeleton rounded-card" style="height:80px"></div>
      <div class="skeleton rounded-card" style="height:80px"></div>
      <div class="skeleton rounded-card" style="height:80px"></div>
    `;
  }

  function renderList() {
    const listEl = document.getElementById('request-list');
    if (!listEl) return;
    const filtered = currentTab === 'All' ? documentRequests : documentRequests.filter(r => pipelineStage(r) === currentTab);

    if (filtered.length === 0) {
      listEl.innerHTML = `
        <div class="bg-card-bg rounded-card shadow-card p-10 text-center space-y-2">
          <p class="text-sm font-semibold">Nothing here right now</p>
          <p class="text-sm text-ink-muted">No requests currently sit in "${currentTab}".</p>
        </div>
      `;
      return;
    }

    listEl.innerHTML = filtered.map(r => {
      const stage = pipelineStage(r);
      const [bg, text, iconName] = STAGE_STYLE[stage];
      const isOpen = expandedId === r.id;
      return `
        <div class="bg-card-bg rounded-card shadow-card overflow-hidden">
          <button onclick="toggleExpand('${r.id}')" class="w-full text-left p-5 flex items-start justify-between gap-3 min-h-[44px] transition-warm hover:bg-section-bg">
            <div class="min-w-0">
              <p class="text-sm font-semibold">${r.documentTypeName} <span class="text-ink-muted font-normal">— ${r.forMemberName}</span></p>
              <p class="text-xs text-ink-muted mt-1">${r.requestReference} · Submitted ${r.submissionDate}${stage === 'Completed' && r.completedDate ? ` · Completed ${r.completedDate}` : ''}</p>
              <p class="text-xs text-ink-muted mt-0.5">${r.purpose}</p>
            </div>
            <div class="flex flex-col items-end gap-2 flex-shrink-0">
              <div class="flex items-center gap-1.5">
                ${pill(r.paymentStatus, PAYMENT_STYLE)}
                <span class="${bg} ${text} text-xs font-semibold px-3 py-1.5 rounded-badge whitespace-nowrap flex items-center gap-1.5">${icon(iconName, 'w-3 h-3')}${stage === 'Exception' ? r.requestStatus : stage}</span>
              </div>
              <span class="text-ink-muted transition-warm" style="transform: rotate(${isOpen ? '180' : '0'}deg)">${icon('chevronDown', 'w-4 h-4')}</span>
            </div>
          </button>
          ${isOpen ? renderDetail(r, stage) : ''}
        </div>
      `;
    }).join('');
  }

  function renderDetail(r, stage) {
    const spec = FIELD_SPECS[r.documentTypeId] || { autoFields: [], inputFields: [] };
    const member = memberByName(r.forMemberName);
    return `
      <div class="border-t border-divider px-5 py-4 space-y-4">
        <div class="grid grid-cols-2 gap-3 text-xs">
          <div><p class="text-ink-muted">Delivery method</p><p class="font-medium mt-0.5">${r.deliveryMethod}${r.recipientEmail ? ` — ${r.recipientEmail}` : ''}${r.mailingAddress ? ` — ${r.mailingAddress}` : ''}</p></div>
          <div><p class="text-ink-muted">Uploaded documents</p><p class="font-medium mt-0.5">${r.uploadedDocuments.length ? r.uploadedDocuments.join(', ') : '—'}</p></div>
        </div>

        ${(spec.autoFields.length || spec.inputFields.length) ? `
          <div>
            <p class="text-xs font-semibold text-ink-muted uppercase tracking-wide mb-2">Certificate details</p>
            <div class="bg-section-bg rounded-card divide-y divide-divider overflow-hidden">
              ${spec.autoFields.map(key => `<div class="px-4 py-2.5 flex items-center justify-between gap-3"><span class="text-xs text-ink-muted">${FIELD_LABELS[key]}</span><span class="text-xs font-medium text-right">${resolveAutoField(key, member) || '—'}</span></div>`).join('')}
              ${spec.inputFields.map(key => `<div class="px-4 py-2.5 flex items-center justify-between gap-3"><span class="text-xs text-ink-muted">${FIELD_LABELS[key]}</span><span class="text-xs font-medium text-right">${r.capturedFields[key] || '—'}</span></div>`).join('')}
            </div>
          </div>
        ` : ''}

        ${r.clarificationMessage ? `<div class="bg-error-bg rounded-card p-3"><p class="text-xs text-error font-semibold uppercase tracking-wide mb-1">${stage === 'Exception' && r.requestStatus === 'Rejected' ? 'Rejection reason sent to parishioner' : 'Message sent to parishioner'}</p><p class="text-xs text-error">${r.clarificationMessage}</p></div>` : ''}
        <div>
          <p class="text-xs font-semibold text-ink-muted uppercase tracking-wide mb-2">Workflow</p>
          ${renderWorkflow(r, stage)}
        </div>
      </div>
    `;
  }

  // ---------------- Mini workflow checklist ----------------
  function workflowStep(label, state, actionHtml) {
    // state: 'done' | 'current' | 'locked'
    const dot = state === 'done' ? 'bg-green' : state === 'current' ? 'bg-primary' : 'bg-divider';
    const textClass = state === 'locked' ? 'text-ink-muted' : 'text-ink';
    return `
      <div class="flex gap-3 ${state === 'locked' ? 'opacity-50' : ''}">
        <div class="flex flex-col items-center pt-1">
          <span class="w-2.5 h-2.5 rounded-full flex-shrink-0 ${dot}"></span>
          <span class="w-px flex-1 bg-divider my-1"></span>
        </div>
        <div class="pb-4 flex-1 min-w-0">
          <p class="text-sm font-medium ${textClass}">${label}</p>
          ${actionHtml || ''}
        </div>
      </div>
    `;
  }

  function renderWorkflow(r, stage) {
    if (stage === 'Exception') {
      return `<p class="text-xs text-ink-muted">This request is paused — ${r.requestStatus === 'Rejected' ? 'it was rejected.' : 'awaiting the parishioner\'s response before staff work can continue.'}</p>`;
    }
    if (stage === 'Completed') {
      return `<p class="text-xs text-ink-muted">Completed on ${r.completedDate || 'file'} — no further action needed.</p>`;
    }

    let html = '';

    // Step 1: Verify
    html += workflowStep(
      'Verify request details',
      r.verified ? 'done' : 'current',
      r.verified ? '' : `
        <div class="mt-2 flex flex-wrap gap-2">
          <button onclick="doVerify('${r.id}')" class="bg-primary hover:bg-primary-hover text-white text-xs font-semibold px-4 py-2.5 rounded-button min-h-[40px] transition-warm">Mark as Verified</button>
          <button onclick="openPromptFor('${r.id}', 'info')" class="bg-white border border-divider text-ink text-xs font-semibold px-4 py-2.5 rounded-button min-h-[40px] transition-warm">Request More Information</button>
          <button onclick="openPromptFor('${r.id}', 'reject')" class="text-error text-xs font-semibold px-4 py-2.5 rounded-button min-h-[40px] transition-warm hover:bg-error-bg">Reject</button>
        </div>
        ${openPrompt && openPrompt.id === r.id ? renderPrompt(r) : ''}
      `
    );

    // Step 2: Prepare & upload certificate (captures Certificate Number + Issue Date)
    html += workflowStep(
      'Prepare &amp; upload the certificate',
      r.generatedFileName ? 'done' : (r.verified ? 'current' : 'locked'),
      !r.verified ? '' : r.generatedFileName
        ? `<p class="text-xs text-green mt-1">${icon('check','w-3.5 h-3.5 inline mb-0.5')} ${r.generatedFileName} · Cert. No. ${r.certificateNumber} · Issued ${r.issueDate} <button onclick="openUploadForm('${r.id}')" class="text-primary font-semibold ml-1">Replace</button></p>`
        : (uploadFormOpenFor === r.id ? renderUploadForm(r) : `<button onclick="openUploadForm('${r.id}')" class="mt-2 bg-primary hover:bg-primary-hover text-white text-xs font-semibold px-4 py-2.5 rounded-button min-h-[40px] transition-warm">Upload Generated Document</button>`)
    );

    // Step 3: Request approval — shows the note field directly, no extra reveal click
    html += workflowStep(
      `Request approval from Fr. John Anthony`,
      r.approvalRequested ? 'done' : (r.generatedFileName ? 'current' : 'locked'),
      !r.generatedFileName ? '' : r.approvalRequested
        ? (r.approvalNotes ? `<p class="text-xs text-ink-muted mt-1">Note: "${r.approvalNotes}"</p>` : '')
        : `
          <div class="mt-2 space-y-2">
            <textarea id="approval-note-${r.id}" rows="2" placeholder="Optional note for the priest…"
              class="w-full border border-divider rounded-input px-3 py-2 text-sm bg-section-bg focus:ring-2 focus:ring-primary-light focus:outline-none resize-none"></textarea>
            <button onclick="doRequestApproval('${r.id}')" class="bg-primary hover:bg-primary-hover text-white text-xs font-semibold px-4 py-2.5 rounded-button min-h-[40px] transition-warm">Request Approval</button>
          </div>
        `
    );

    // Step 4: Priest approval
    html += workflowStep(
      'Awaiting Fr. John Anthony\'s approval',
      r.approved ? 'done' : (r.approvalRequested ? 'current' : 'locked'),
      !r.approvalRequested || r.approved ? '' : `<button onclick="doApprove('${r.id}')" class="mt-2 bg-primary hover:bg-primary-hover text-white text-xs font-semibold px-4 py-2.5 rounded-button min-h-[40px] transition-warm">Record Priest's Approval</button>`
    );

    // Step 5: Delivery action (method-specific)
    html += renderDeliveryStep(r);

    return `<div class="mt-1">${html}</div>`;
  }

  let uploadFormOpenFor = null;
  function openUploadForm(id) {
    uploadFormOpenFor = id;
    renderList();
  }

  function renderUploadForm(r) {
    const suggestedNumber = `IJS/CERT/2026/0${300 + Math.floor(Math.random() * 90)}`;
    return `
      <div class="mt-2 bg-section-bg rounded-card p-4 space-y-3">
        <div class="space-y-1.5">
          <label class="text-xs font-medium">Certificate number</label>
          <input id="certnum-${r.id}" type="text" value="${suggestedNumber}" class="w-full border border-divider rounded-input px-3 h-10 text-sm bg-white focus:ring-2 focus:ring-primary-light focus:outline-none">
        </div>
        <div class="space-y-1.5">
          <label class="text-xs font-medium">Issue date</label>
          <input id="issuedate-${r.id}" type="text" value="Today" class="w-full border border-divider rounded-input px-3 h-10 text-sm bg-white focus:ring-2 focus:ring-primary-light focus:outline-none">
        </div>
        <button onclick="doUpload('${r.id}')" class="bg-primary hover:bg-primary-hover text-white text-xs font-semibold px-4 py-2.5 rounded-button min-h-[40px] transition-warm">Attach &amp; Save</button>
      </div>
    `;
  }

  function renderDeliveryStep(r) {
    const active = r.approved && !r.deliveryActionDone;
    const state = r.deliveryActionDone ? 'done' : (r.approved ? 'current' : 'locked');

    if (r.deliveryMethod === 'Email') {
      return workflowStep(
        `Send email to ${r.recipientEmail || 'the parishioner'}`,
        state,
        !active ? '' : `<button onclick="doDeliver('${r.id}')" class="mt-2 bg-primary hover:bg-primary-hover text-white text-xs font-semibold px-4 py-2.5 rounded-button min-h-[40px] transition-warm">Send Email</button>`
      );
    }
    if (r.deliveryMethod === 'Post / Courier') {
      return workflowStep(
        `Post to ${r.mailingAddress || "the parishioner's address"}`,
        state,
        !active ? '' : `<button onclick="doDeliver('${r.id}')" class="mt-2 bg-primary hover:bg-primary-hover text-white text-xs font-semibold px-4 py-2.5 rounded-button min-h-[40px] transition-warm">Mark as Posted</button>`
      );
    }
    if (r.deliveryMethod === 'Collect at the Parish') {
      if (!active) return workflowStep('Notify parishioner &amp; hand over at the parish office', state, '');
      if (!r.notified) {
        return workflowStep('Notify parishioner &amp; hand over at the parish office', 'current', `<button onclick="doNotify('${r.id}')" class="mt-2 bg-primary hover:bg-primary-hover text-white text-xs font-semibold px-4 py-2.5 rounded-button min-h-[40px] transition-warm">Notify Parishioner — Ready for Collection</button>`);
      }
      return workflowStep('Notify parishioner &amp; hand over at the parish office', 'current', `<p class="text-xs text-ink-muted mt-1 mb-2">Parishioner notified — awaiting collection.</p><button onclick="doDeliver('${r.id}')" class="bg-primary hover:bg-primary-hover text-white text-xs font-semibold px-4 py-2.5 rounded-button min-h-[40px] transition-warm">Mark as Collected</button>`);
    }
    // In-app Download
    return workflowStep(
      'Publish to parishioner\'s My Documents',
      state,
      !active ? '' : `<button onclick="doDeliver('${r.id}')" class="mt-2 bg-primary hover:bg-primary-hover text-white text-xs font-semibold px-4 py-2.5 rounded-button min-h-[40px] transition-warm">Publish for Download</button>`
    );
  }

  function renderPrompt(r) {
    const type = openPrompt.type;
    const config = {
      info: { label: 'What information do you need from the parishioner?', placeholder: 'e.g. Please upload a clearer scan of the baptism certificate.', confirmLabel: 'Send Request', confirmClass: 'bg-primary hover:bg-primary-hover text-white' },
      reject: { label: 'Let the parishioner know why this request is being rejected.', placeholder: 'e.g. This document type isn\'t applicable to your situation.', confirmLabel: 'Confirm Rejection', confirmClass: 'bg-error hover:bg-error text-white' },
    }[type];
    return `
      <div class="mt-3 bg-section-bg rounded-card p-4 space-y-2">
        <label class="text-xs font-medium">${config.label}</label>
        <textarea id="prompt-textarea" rows="2" placeholder="${config.placeholder}"
          class="w-full border border-divider rounded-input px-3 py-2 text-sm bg-white focus:ring-2 focus:ring-primary-light focus:outline-none resize-none"></textarea>
        <div class="flex gap-2 pt-1">
          <button onclick="submitPrompt('${r.id}')" class="${config.confirmClass} text-xs font-semibold px-4 py-2.5 rounded-button min-h-[40px] transition-warm">${config.confirmLabel}</button>
          <button onclick="openPrompt=null; renderList()" class="text-ink-muted text-xs font-semibold px-4 py-2.5 rounded-button min-h-[40px] transition-warm hover:bg-white">Cancel</button>
        </div>
      </div>
    `;
  }

  function openPromptFor(id, type) {
    openPrompt = { id, type };
    renderList();
    setTimeout(() => document.getElementById('prompt-textarea')?.focus(), 50);
  }

  function submitPrompt(id) {
    const r = findReq(id);
    const text = document.getElementById('prompt-textarea').value.trim();
    if (!text) { toast('Please add a message before continuing.'); return; }
    if (openPrompt.type === 'info') {
      r.requestStatus = 'Awaiting Information';
      r.clarificationMessage = text;
      toast('Requested more information from the parishioner.');
    }
    if (openPrompt.type === 'reject') {
      r.requestStatus = 'Rejected';
      r.clarificationMessage = text;
      toast('Request rejected — parishioner notified.');
    }
    openPrompt = null;
    renderStageTabs();
    renderList();
  }

  function doRequestApproval(id) {
    const r = findReq(id);
    const text = document.getElementById(`approval-note-${id}`).value.trim();
    r.approvalRequested = true;
    r.approvalNotes = text;
    toast('Approval requested from Fr. John Anthony.');
    renderStageTabs();
    renderList();
  }

  function findReq(id) { return documentRequests.find(r => r.id === id); }

  function doVerify(id) {
    const r = findReq(id);
    r.verified = true;
    toast('Marked as verified.');
    renderList();
  }

  function doUpload(id) {
    const r = findReq(id);
    const certInput = document.getElementById(`certnum-${id}`);
    const dateInput = document.getElementById(`issuedate-${id}`);
    r.certificateNumber = certInput ? certInput.value.trim() : `IJS/CERT/2026/0${300 + Math.floor(Math.random()*90)}`;
    r.issueDate = (dateInput && dateInput.value.trim() && dateInput.value.trim() !== 'Today') ? dateInput.value.trim() : '26 Jul 2026';
    r.generatedFileName = r.documentTypeName.toLowerCase().replace(/[^a-z0-9]+/g, '_') + '.pdf';
    uploadFormOpenFor = null;
    toast('Generated document attached.');
    renderList();
  }

  function doApprove(id) {
    const r = findReq(id);
    r.approved = true;
    r.requestStatus = 'Approved';
    toast('Approval recorded.');
    renderStageTabs();
    renderList();
  }

  function doNotify(id) {
    const r = findReq(id);
    r.notified = true;
    toast('Parishioner notified — ready for collection.');
    renderList();
  }

  function doDeliver(id) {
    const r = findReq(id);
    r.deliveryActionDone = true;
    r.completed = true;
    r.completedDate = '26 Jul 2026';
    r.requestStatus = 'Completed';
    toast('Marked as completed.');
    renderStageTabs();
    renderList();
  }

  // ---------------- New Request modal (walk-in / offline requests, Parish Office) ----------------
  const newRequestState = { documentTypeId: '', forMemberId: 'MEM-2001', purpose: '', deliveryMethod: '', recipientEmail: '', mailingAddress: familyAddress, paymentMethod: '' };

  function openNewRequestModal() {
    Object.assign(newRequestState, { documentTypeId: '', forMemberId: 'MEM-2001', purpose: '', deliveryMethod: '', recipientEmail: '', mailingAddress: familyAddress, paymentMethod: '' });
    document.getElementById('new-request-modal').classList.remove('hidden');
    renderNewRequestForm();
  }
  function closeNewRequestModal() {
    document.getElementById('new-request-modal').classList.add('hidden');
  }

  function renderNewRequestForm() {
    const docType = DOCUMENT_TYPES.find(d => d.id === newRequestState.documentTypeId);
    document.getElementById('new-request-form').innerHTML = `
      <div class="space-y-1.5">
        <label class="text-xs font-medium">Family</label>
        <div class="w-full border border-divider rounded-input px-3 h-10 text-sm bg-section-bg flex items-center text-ink-muted">Rodrigues Family (IJS/FAM/1001)</div>
        <p class="text-[11px] text-ink-muted">In production this searches across all registered families.</p>
      </div>
      <div class="space-y-1.5">
        <label class="text-xs font-medium">For whom</label>
        <select id="nr-member" onchange="newRequestState.forMemberId=this.value" class="w-full border border-divider rounded-input px-3 h-10 text-sm bg-white focus:ring-2 focus:ring-primary-light focus:outline-none">
          ${familyMembers.map(m => `<option value="${m.id}" ${newRequestState.forMemberId===m.id?'selected':''}>${m.name} — ${m.relationship}</option>`).join('')}
        </select>
      </div>
      <div class="space-y-1.5">
        <label class="text-xs font-medium">Document type</label>
        <select id="nr-doctype" onchange="newRequestState.documentTypeId=this.value; newRequestState.deliveryMethod=''; renderNewRequestForm()" class="w-full border border-divider rounded-input px-3 h-10 text-sm bg-white focus:ring-2 focus:ring-primary-light focus:outline-none">
          <option value="">Select a document type…</option>
          ${DOCUMENT_TYPES.map(d => `<option value="${d.id}" ${newRequestState.documentTypeId===d.id?'selected':''}>${d.name} ${d.adminCharge>0?'— ₹'+d.adminCharge:'— No charge'}</option>`).join('')}
        </select>
      </div>
      <div class="space-y-1.5">
        <label class="text-xs font-medium">Purpose</label>
        <input id="nr-purpose" type="text" value="${newRequestState.purpose}" oninput="newRequestState.purpose=this.value" placeholder="e.g. School admission"
          class="w-full border border-divider rounded-input px-3 h-10 text-sm bg-white focus:ring-2 focus:ring-primary-light focus:outline-none">
      </div>
      ${docType ? `
        <div class="space-y-1.5">
          <label class="text-xs font-medium">Delivery method</label>
          <select id="nr-delivery" onchange="newRequestState.deliveryMethod=this.value; renderNewRequestForm()" class="w-full border border-divider rounded-input px-3 h-10 text-sm bg-white focus:ring-2 focus:ring-primary-light focus:outline-none">
            <option value="">Select delivery method…</option>
            ${docType.deliveryOptions.map(o => `<option value="${o}" ${newRequestState.deliveryMethod===o?'selected':''}>${o}</option>`).join('')}
          </select>
        </div>
        ${newRequestState.deliveryMethod === 'Email' ? `
          <div class="space-y-1.5">
            <label class="text-xs font-medium">Recipient email</label>
            <input type="email" value="${newRequestState.recipientEmail || (familyMembers.find(m=>m.id===newRequestState.forMemberId)||{}).email || ''}" oninput="newRequestState.recipientEmail=this.value" class="w-full border border-divider rounded-input px-3 h-10 text-sm bg-white focus:ring-2 focus:ring-primary-light focus:outline-none">
          </div>
        ` : ''}
        ${newRequestState.deliveryMethod === 'Post / Courier' ? `
          <div class="space-y-1.5">
            <label class="text-xs font-medium">Mailing address</label>
            <textarea rows="2" oninput="newRequestState.mailingAddress=this.value" class="w-full border border-divider rounded-input px-3 py-2 text-sm bg-white focus:ring-2 focus:ring-primary-light focus:outline-none resize-none">${newRequestState.mailingAddress}</textarea>
          </div>
        ` : ''}
        ${docType.adminCharge > 0 ? `
          <div class="space-y-1.5">
            <label class="text-xs font-medium">Payment (₹${docType.adminCharge})</label>
            <select id="nr-payment" onchange="newRequestState.paymentMethod=this.value" class="w-full border border-divider rounded-input px-3 h-10 text-sm bg-white focus:ring-2 focus:ring-primary-light focus:outline-none">
              <option value="">Select payment method…</option>
              <option value="Cash at Office" ${newRequestState.paymentMethod==='Cash at Office'?'selected':''}>Cash at Office</option>
              <option value="UPI" ${newRequestState.paymentMethod==='UPI'?'selected':''}>UPI</option>
              <option value="Card" ${newRequestState.paymentMethod==='Card'?'selected':''}>Card</option>
            </select>
          </div>
        ` : ''}
      ` : ''}
    `;
  }

  function submitNewRequest() {
    const s = newRequestState;
    const docType = DOCUMENT_TYPES.find(d => d.id === s.documentTypeId);
    const member = familyMembers.find(m => m.id === s.forMemberId);
    if (!docType) { toast('Please select a document type.'); return; }
    if (!s.purpose.trim()) { toast('Please enter a purpose.'); return; }
    if (!s.deliveryMethod) { toast('Please select a delivery method.'); return; }
    if (docType.adminCharge > 0 && !s.paymentMethod) { toast('Please select a payment method.'); return; }

    nextRequestSeq++;
    const newReq = {
      id: `REQ-NEW-${nextRequestSeq}`,
      documentTypeId: docType.id,
      documentTypeName: docType.name,
      forMemberName: member.name,
      purpose: s.purpose,
      submissionDate: '26 Jul 2026',
      requestReference: `DOC-REQ-2026-0${200 + nextRequestSeq}`,
      paymentStatus: docType.adminCharge > 0 ? 'Paid' : 'Not Required',
      deliveryMethod: s.deliveryMethod,
      recipientEmail: s.deliveryMethod === 'Email' ? s.recipientEmail : undefined,
      mailingAddress: s.deliveryMethod === 'Post / Courier' ? s.mailingAddress : undefined,
      uploadedDocuments: [],
      capturedFields: {},
      verified: false, generatedFileName: null, certificateNumber: null, issueDate: null,
      approvalRequested: false, approvalNotes: '', approved: false, notified: false,
      deliveryActionDone: false, completed: false, completedDate: null,
      clarificationMessage: null, requestStatus: 'Submitted',
    };
    documentRequests.unshift(newReq);
    closeNewRequestModal();
    toast('Request created for ' + member.name + '.');
    setTab('Pending');
  }

  updateFamilyUpdatesBadge();
  updateSacramentsBadge();
  updateHomeServicesBadge();
  updateFacilitiesBadge();
  const initialModule = sessionParams.get('module');
  if (initialModule === 'familyupdates' || initialModule === 'sacraments' || initialModule === 'homeservices' || initialModule === 'facilities') { setModule(initialModule); } else { renderModule(); }
</script>

</body>
</html>
