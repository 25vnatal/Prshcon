  function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('-translate-x-full');
    document.getElementById('sidebar-backdrop').classList.toggle('hidden');

  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.remove('opacity-0'); t.classList.add('opacity-100');

    window._t = setTimeout(() => { t.classList.remove('opacity-100'); t.classList.add('opacity-0'); }, 1800);

    const [bg, text] = map[status] || map['Active'];

    parishesMgmt.unshift({ id:'PAR-NEW-'+Math.floor(1000+Math.random()*8999), name, sizeTier, parishPriest, status:'Active' });

        </div>
      </div>
      <div class="bg-card-bg rounded-card shadow-card p-5 max-w-xl">
        <p class="text-sm font-semibold mb-4">Diocese-wide defaults for new parishes</p>
        <div class="space-y-4">
          <div class="space-y-1.5"><label class="text-xs font-medium">Suggested minimum subscription (monthly)</label><input type="text" value="\u20b9200" readonly class="w-full border border-divider rounded-input px-3 h-10 text-sm bg-section-bg text-ink-muted"></div>
          <div class="flex items-center justify-between">
            <div><p class="text-sm font-medium">Require diocesan approval for new parish document templates</p></div>
            ${toggleEl(true, "toast('Setting updated.')")}
          </div>
          <div class="flex items-center justify-between">
            <div><p class="text-sm font-medium">Auto-enable Family Records and Requests for newly onboarded parishes</p></div>
            ${toggleEl(true, "toast('Setting updated.')")}
          </div>
        </div>
      </div>
    `;
  }

  // =========================================================================
  // MODULE 4: Notification Settings
  // =========================================================================
  let dioceseChannels = { inApp: true, email: true, sms: false, whatsapp: false };
  let dioceseNotificationEvents = [
    { key:'parishOnboarded', label:'Parish Onboarding Complete', channels:{ inApp:true, email:true, sms:false, whatsapp:false } },
    { key:'parishAtRisk', label:'Parish Health Alert (At Risk)', channels:{ inApp:true, email:true, sms:false, whatsapp:false } },
    { key:'broadcastSent', label:'Broadcast Sent Confirmation', channels:{ inApp:true, email:false, sms:false, whatsapp:false } },
    { key:'userInvited', label:'New User Invited', channels:{ inApp:true, email:true, sms:false, whatsapp:false } },
  ];
  function renderNotificationsModule(el) {
    el.innerHTML = `
      <div class="bg-card-bg rounded-card shadow-card p-5 mb-6">
        <p class="text-sm font-semibold mb-4">Channels</p>
        <div class="space-y-3">
          <div class="flex items-center justify-between"><div><p class="text-sm font-medium">In-App</p><p class="text-xs text-ink-muted">Always enabled</p></div>${toggleEl(true, "toast('In-App notifications cannot be disabled.')")}</div>
          <div class="flex items-center justify-between"><div><p class="text-sm font-medium">Email</p></div>${toggleEl(dioceseChannels.email, "toggleDioceseChannel('email')")}</div>
          <div class="flex items-center justify-between"><div><p class="text-sm font-medium">SMS</p></div>${toggleEl(dioceseChannels.sms, "toggleDioceseChannel('sms')")}</div>
          <div class="flex items-center justify-between"><div><p class="text-sm font-medium">WhatsApp</p></div>${toggleEl(dioceseChannels.whatsapp, "toggleDioceseChannel('whatsapp')")}</div>
        </div>
      </div>
      <div class="bg-card-bg rounded-card shadow-card overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead><tr class="border-b border-divider text-left text-ink-muted text-xs uppercase tracking-wide">
              <th class="px-4 py-3 font-medium">Event</th><th class="px-4 py-3 font-medium text-center">In-App</th><th class="px-4 py-3 font-medium text-center">Email</th><th class="px-4 py-3 font-medium text-center">SMS</th><th class="px-4 py-3 font-medium text-center">WhatsApp</th>
            </tr></thead>
            <tbody>
              ${dioceseNotificationEvents.map(ev => `
                <tr class="border-b border-divider last:border-0">
                  <td class="px-4 py-3 font-medium">${ev.label}</td>
                  <td class="px-4 py-3 text-center"><input type="checkbox" checked disabled class="w-4 h-4 opacity-60"></td>
                  <td class="px-4 py-3 text-center"><input type="checkbox" ${ev.channels.email ? 'checked' : ''} onchange="toggleDioceseEventChannel('${ev.key}','email')" class="w-4 h-4" ${dioceseChannels.email ? '' : 'disabled'}></td>
                  <td class="px-4 py-3 text-center"><input type="checkbox" ${ev.channels.sms ? 'checked' : ''} onchange="toggleDioceseEventChannel('${ev.key}','sms')" class="w-4 h-4" ${dioceseChannels.sms ? '' : 'disabled'}></td>
                  <td class="px-4 py-3 text-center"><input type="checkbox" ${ev.channels.whatsapp ? 'checked' : ''} onchange="toggleDioceseEventChannel('${ev.key}','whatsapp')" class="w-4 h-4" ${dioceseChannels.whatsapp ? '' : 'disabled'}></td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      </div>
    `;
  }
  function toggleDioceseChannel(ch) {
    dioceseChannels[ch] = !dioceseChannels[ch];
    renderModule();
  }
  function toggleDioceseEventChannel(eventKey, ch) {
    dioceseNotificationEvents.find(e => e.key === eventKey).channels[ch] = !dioceseNotificationEvents.find(e => e.key === eventKey).channels[ch];
    renderModule();
  }

  renderModule();
</script>

</body>
</html>
