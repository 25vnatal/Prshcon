<!DOCTYPE html>
<html lang="en">
<head>
<title>Parish Connect — My Sacrament Registrations</title>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          'bg-warm': '#FAFBFD', 'card-bg': '#FFFFFF', 'section-bg': '#F5F7FB', divider: '#E8EDF5',
          ink: '#1F2937', 'ink-muted': '#6B7280',
          primary: { DEFAULT: '#4F7CF5', hover: '#3F6CE4', light: '#EEF4FF' },
          coral: '#FF7F73', gold: '#F6C453', green: '#6CBF84', lavender: '#A88BFF',
          error: { DEFAULT: '#E5645A', bg: '#FDECEA' },
        },
        fontFamily: { heading: ['Manrope', 'sans-serif'], body: ['Inter', 'sans-serif'] },
        borderRadius: { card: '24px', button: '16px', input: '16px', badge: '999px' },
        boxShadow: { card: '0 6px 24px rgba(30,41,59,0.08)' },
      },
    },
  };
</script>
<style>
  body { font-family: 'Inter', sans-serif; background-color: #FAFBFD; color: #1F2937; line-height: 1.5; }
  h1, h2, .font-heading { font-family: 'Manrope', sans-serif; }
  :focus-visible { outline: 2px solid #4F7CF5; outline-offset: 2px; }
  .transition-warm { transition: all 200ms ease; }
  .icon { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body class="text-ink">

  <div class="max-w-[420px] mx-auto min-h-screen bg-bg-warm pb-28 relative">

    <header class="px-5 pt-5 pb-3 flex items-center gap-3">
      <button onclick="window.location.href='screen-parishioner-services-hub.html?' + sessionParams.toString()" aria-label="Back" class="w-10 h-10 rounded-button flex items-center justify-center text-ink-muted hover:bg-section-bg transition-warm flex-shrink-0">
        <svg class="icon" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      </button>
      <p class="font-heading font-bold text-lg">My Sacrament Registrations</p>
    </header>

    <main class="px-5 space-y-3" id="main-content"></main>

    <div class="px-5 mt-6">
      <button onclick="window.location.href='screen-parishioner-sacraments-register.html?' + sessionParams.toString()" class="w-full bg-primary hover:bg-primary-hover text-white text-sm font-semibold py-3.5 rounded-button min-h-[48px] transition-warm">Register for Another Sacrament</button>
    </div>

  </div>

  <nav class="fixed bottom-0 left-0 right-0 bg-card-bg border-t border-divider max-w-[420px] mx-auto">
    <div class="grid grid-cols-5">
      <button onclick="window.location.href='screen-parishioner-dashboard-home.html?' + sessionParams.toString()" class="flex flex-col items-center gap-1 py-3 text-ink-muted">
        <svg class="icon" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/></svg>
        <span class="text-[10.5px]">Home</span>
      </button>
      <button onclick="window.location.href='screen-parishioner-services-hub.html?' + sessionParams.toString()" class="flex flex-col items-center gap-1 py-3 text-primary">
        <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="4" width="7" height="7" rx="1.5"/><rect x="14" y="4" width="7" height="7" rx="1.5"/><rect x="3" y="15" width="7" height="7" rx="1.5"/><rect x="14" y="15" width="7" height="7" rx="1.5"/></svg>
        <span class="text-[10.5px] font-semibold">Services</span>
      </button>
      <button onclick="window.location.href='screen-parishioner-dashboard-home.html?' + sessionParams.toString()" class="flex flex-col items-center gap-1 py-3 text-ink-muted">
        <svg class="icon" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-10-9.3C.4 8.4 2.3 5 5.7 5 8 5 10 6.3 12 9c2-2.7 4-4 6.3-4 3.4 0 5.3 3.4 3.7 6.7C19.5 16.4 12 21 12 21Z"/></svg>
        <span class="text-[10.5px]">Give</span>
      </button>
      <button onclick="window.location.href='screen-parishioner-family.html?' + sessionParams.toString()" class="flex flex-col items-center gap-1 py-3 text-ink-muted">
        <svg class="icon" viewBox="0 0 24 24"><circle cx="9" cy="7" r="3.5"/><path d="M2 21v-1a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v1"/><circle cx="18" cy="8" r="2.5"/></svg>
        <span class="text-[10.5px]">My Family</span>
      </button>
      <button onclick="window.location.href='screen-parishioner-dashboard-home.html?' + sessionParams.toString()" class="flex flex-col items-center gap-1 py-3 text-ink-muted">
        <svg class="icon" viewBox="0 0 24 24"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
        <span class="text-[10.5px]">Menu</span>
      </button>
    </div>
  </nav>

<script>
  const sessionParams = new URLSearchParams(window.location.search);
  const MONTH_NAMES = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  function formatDate(iso) {
    const [y,m,d] = iso.split('-').map(Number);
    return `${d} ${MONTH_NAMES[m-1]} ${y}`;
  }
  const ICON_PATHS = { check: '<path d="M20 6 9 17l-5-5"/>', clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>' };
  function icon(name, cls) { return `<svg class="${cls||'icon'}" viewBox="0 0 24 24">${ICON_PATHS[name]}</svg>`; }

  // ---------------- Mock data: registrations (mirrors mock-seed.json's sacramentRegistrations, plus one Submitted example) ----------------
  const registrations = [
    { id:"REQ-3201", sacramentName:"Confirmation", candidateName:"Clara Rodrigues", registrationStatus:"Approved", paymentStatus:"Paid", submissionDate:"2026-06-01", registrationReference:"SAC-REG-2026-0087", celebrationDate:"2026-09-20", preparationProgress:"Classes in progress" },
    { id:"REQ-3202", sacramentName:"Baptism", candidateName:"Kevin Rodrigues", registrationStatus:"Submitted", paymentStatus:"Paid", submissionDate:"2026-07-28", registrationReference:"SAC-REG-2026-0142", celebrationDate:null, preparationProgress:"Awaiting document review" },
  ];

  function statusPill(status) {
    const map = {
      'Submitted': ['bg-gold/20', 'text-[#8a5a10]', 'clock'],
      'Under Review': ['bg-gold/20', 'text-[#8a5a10]', 'clock'],
      'Approved': ['bg-green/20', 'text-[#2f6b45]', 'check'],
      'Rejected': ['bg-error-bg', 'text-error', 'clock'],
    };
    const [bg, text, iconName] = map[status] || map['Submitted'];
    return `<span class="${bg} ${text} text-xs font-semibold px-2.5 py-1 rounded-badge whitespace-nowrap inline-flex items-center gap-1">${icon(iconName,'w-3 h-3')}${status}</span>`;
  }

  function render() {
    const main = document.getElementById('main-content');
    if (registrations.length === 0) {
      main.innerHTML = `<div class="bg-card-bg rounded-card shadow-card p-8 text-center space-y-2 mt-2"><p class="text-sm font-semibold">No sacrament registrations yet</p><p class="text-sm text-ink-muted">Register a family member for a sacrament to see it here.</p></div>`;
      return;
    }
    main.innerHTML = registrations.map(r => `
      <div class="bg-card-bg rounded-card shadow-card p-5">
        <div class="flex items-start justify-between gap-3 mb-2">
          <div>
            <p class="text-sm font-semibold">${r.sacramentName} — ${r.candidateName}</p>
            <p class="text-xs text-ink-muted mt-0.5">${r.registrationReference}</p>
          </div>
          ${statusPill(r.registrationStatus)}
        </div>
        <p class="text-xs text-ink-muted mt-2">Submitted ${formatDate(r.submissionDate)}${r.celebrationDate ? ' · Celebration ' + formatDate(r.celebrationDate) : ''}</p>
        <div class="flex items-center justify-between mt-3 pt-3 border-t border-divider">
          <p class="text-xs text-ink-muted">${r.preparationProgress}</p>
          <span class="${r.paymentStatus==='Paid' ? 'bg-green/20 text-[#2f6b45]' : 'bg-gold/20 text-[#8a5a10]'} text-xs font-semibold px-2.5 py-1 rounded-badge whitespace-nowrap">${r.paymentStatus}</span>
        </div>
      </div>
    `).join('');
  }

  render();
</script>

</body>
</html>
