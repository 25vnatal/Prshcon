<!DOCTYPE html>
<html lang="en">
<head>
<title>Parish Connect — Events</title>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          'bg-warm': '#FAFBFD', 'card-bg': '#FFFFFF', 'section-bg': '#F5F7FB', divider: '#E8EDF5',
          ink: '#1F2937', 'ink-muted': '#6B7280',
          primary: { DEFAULT: '#4F7CF5', hover: '#3F6CE4', light: '#EEF4FF' },
          coral: '#FF7F73', gold: '#F6C453', green: '#6CBF84', lavender: '#A88BFF',
          error: { DEFAULT: '#E5645A', bg: '#FDECEA' },
        },
        fontFamily: { heading: ['Manrope', 'sans-serif'], body: ['Inter', 'sans-serif'] },
        borderRadius: { card: '24px', button: '16px', input: '16px', badge: '999px' },
        boxShadow: { card: '0 6px 24px rgba(30,41,59,0.08)' },
      },
    },
  };
</script>
<style>
  body { font-family: 'Inter', sans-serif; background-color: #FAFBFD; color: #1F2937; line-height: 1.5; }
  h1, h2, .font-heading { font-family: 'Manrope', sans-serif; }
  :focus-visible { outline: 2px solid #4F7CF5; outline-offset: 2px; }
  .transition-warm { transition: all 200ms ease; }
  .icon { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body class="text-ink">

  <div class="max-w-[420px] mx-auto min-h-screen bg-bg-warm pb-28 relative">

    <header class="px-5 pt-5 pb-4 flex items-center gap-3">
      <button onclick="window.location.href='screen-parishioner-dashboard-home.html?' + sessionParams.toString()" aria-label="Back" class="w-10 h-10 rounded-button flex items-center justify-center text-ink-muted hover:bg-section-bg transition-warm flex-shrink-0">
        <svg class="icon" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      </button>
      <p class="font-heading font-bold text-lg">Parish Events</p>
    </header>

    <div class="px-5 flex gap-2 mb-4">
      <button onclick="setModule('upcoming')" data-module="upcoming" class="module-tab flex-1 px-4 py-2.5 rounded-badge text-sm font-semibold transition-warm bg-primary text-white">Upcoming</button>
      <button onclick="setModule('mine')" data-module="mine" class="module-tab flex-1 px-4 py-2.5 rounded-badge text-sm font-semibold transition-warm bg-card-bg text-ink-muted border border-divider">My Registrations</button>
    </div>

    <main class="px-5 space-y-3">
      <div id="module-content"></div>
    </main>

  </div>

  <nav class="fixed bottom-0 left-0 right-0 bg-card-bg border-t border-divider max-w-[420px] mx-auto">
    <div class="grid grid-cols-5">
      <button onclick="window.location.href='screen-parishioner-dashboard-home.html?' + sessionParams.toString()" class="flex flex-col items-center gap-1 py-3 text-ink-muted">
        <svg class="icon" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/></svg>
        <span class="text-[10.5px]">Home</span>
      </button>
      <button onclick="window.location.href='screen-parishioner-services-hub.html?' + sessionParams.toString()" class="flex flex-col items-center gap-1 py-3 text-ink-muted">
        <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="4" width="7" height="7" rx="1.5"/><rect x="14" y="4" width="7" height="7" rx="1.5"/><rect x="3" y="15" width="7" height="7" rx="1.5"/><rect x="14" y="15" width="7" height="7" rx="1.5"/></svg>
        <span class="text-[10.5px]">Services</span>
      </button>
      <button onclick="window.location.href='screen-parishioner-donate-hub.html?' + sessionParams.toString()" class="flex flex-col items-center gap-1 py-3 text-ink-muted">
        <svg class="icon" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-10-9.3C.4 8.4 2.3 5 5.7 5 8 5 10 6.3 12 9c2-2.7 4-4 6.3-4 3.4 0 5.3 3.4 3.7 6.7C19.5 16.4 12 21 12 21Z"/></svg>
        <span class="text-[10.5px]">Give</span>
      </button>
      <button onclick="window.location.href='screen-parishioner-family.html?' + sessionParams.toString()" class="flex flex-col items-center gap-1 py-3 text-ink-muted">
        <svg class="icon" viewBox="0 0 24 24"><circle cx="9" cy="7" r="3.5"/><path d="M2 21v-1a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v1"/><circle cx="18" cy="8" r="2.5"/></svg>
        <span class="text-[10.5px]">My Family</span>
      </button>
      <button onclick="window.location.href='screen-parishioner-me-hub.html?' + sessionParams.toString()" class="flex flex-col items-center gap-1 py-3 text-ink-muted">
        <svg class="icon" viewBox="0 0 24 24"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
        <span class="text-[10.5px]">Menu</span>
      </button>
    </div>
  </nav>

  <div id="toast" class="fixed bottom-24 left-1/2 -translate-x-1/2 bg-ink text-white text-sm px-4 py-2.5 rounded-button shadow-card opacity-0 pointer-events-none transition-opacity duration-200 max-w-[90%] text-center z-50"></div>

  <!-- RSVP MODAL -->
  <div id="rsvp-modal" class="hidden fixed inset-0 bg-black/30 z-50 flex items-end justify-center">
    <div class="bg-card-bg rounded-t-card shadow-card w-full max-w-[420px]">
      <div class="px-5 pt-5 pb-4 border-b border-divider flex items-center justify-between">
        <p id="rsvp-modal-title" class="font-heading font-bold text-lg">Register</p>
        <button onclick="closeModal('rsvp-modal')" aria-label="Close" class="w-9 h-9 rounded-button flex items-center justify-center text-ink-muted hover:bg-section-bg">
          <svg class="icon" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="M6 6l12 12"/></svg>
        </button>
      </div>
      <div id="rsvp-form" class="px-5 py-5 space-y-4"></div>
    </div>
  </div>

<script>
  const sessionParams = new URLSearchParams(window.location.search);
  const sessionName = sessionParams.get('name') || 'John Rodrigues';

  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.remove('opacity-0'); t.classList.add('opacity-100');
    clearTimeout(window._t);
    window._t = setTimeout(() => { t.classList.remove('opacity-100'); t.classList.add('opacity-0'); }, 1800);
  }
  function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
  function formatMoney(n) { return '\u20b9' + n.toLocaleString('en-IN'); }
  const ICON_PATHS = {
    calendar: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18"/><path d="M8 3v4"/><path d="M16 3v4"/>',
    pin: '<path d="M12 21s7-6.5 7-12a7 7 0 0 0-14 0c0 5.5 7 12 7 12Z"/><circle cx="12" cy="9" r="2.5"/>',
    check: '<path d="M20 6 9 17l-5-5"/>',
  };
  function icon(name, cls) { return `<svg class="${cls||'icon'}" viewBox="0 0 24 24">${ICON_PATHS[name]}</svg>`; }

  // ---------------- Same 4 Published events already on screen-parish-communication-hub.html (the Draft, ----------------
  // ---------------- Marian Procession, correctly excluded — a parishioner shouldn't see or register for an ----------------
  // ---------------- unpublished event). Registrations logged here are what feeds that hub's own registration ----------------
  // ---------------- tracking in a live system; kept as separate consistent seed data here per Option A. ----------------
  const events = [
    { id:"EVT-6001", name:"Feast Day Celebration", description:"Annual feast day celebration with Mass, procession, and fellowship lunch.", category:"Feast", eventDate:"2027-01-13", startTime:"07:00 AM", endTime:"01:00 PM", venue:"Infant Jesus Shrine Grounds", registrationRequired:true, capacity:0, paidEvent:false },
    { id:"EVT-6002", name:"Youth Retreat 2026", description:"Weekend retreat for parish youth, focused on faith and fellowship.", category:"Retreat", eventDate:"2026-09-05", startTime:"09:00 AM", endTime:"05:00 PM", venue:"Parish Hall", registrationRequired:true, capacity:60, paidEvent:true, registrationFee:500 },
    { id:"EVT-6004", name:"Winter Clothes Drive — Outreach Program", description:"Volunteers collect and distribute winter clothing to underprivileged families in the neighbourhood.", category:"Outreach", eventDate:"2026-11-14", startTime:"09:00 AM", endTime:"01:00 PM", venue:"Parish Hall", registrationRequired:true, capacity:30, paidEvent:false },
    { id:"EVT-6005", name:"Christmas Celebration", description:"Christmas Eve Mass followed by a community fellowship dinner for the whole parish.", category:"Celebration", eventDate:"2026-12-24", startTime:"08:00 PM", endTime:"11:00 PM", venue:"Infant Jesus Shrine Grounds", registrationRequired:true, capacity:0, paidEvent:false },
  ];
  let myRegistrations = [];

  function eventDateLabel(iso) {
    const MONTH_NAMES = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    const [y,m,d] = iso.split('-').map(Number);
    return `${d} ${MONTH_NAMES[m-1]} ${y}`;
  }
  function isRegistered(eventId) { return myRegistrations.some(r => r.eventId === eventId); }

  let currentModule = 'upcoming';
  function setModule(m) {
    currentModule = m;
    document.querySelectorAll('.module-tab').forEach(btn => {
      const active = btn.dataset.module === m;
      btn.className = `module-tab flex-1 px-4 py-2.5 rounded-badge text-sm font-semibold transition-warm ${active ? 'bg-primary text-white' : 'bg-card-bg text-ink-muted border border-divider'}`;
    });
    renderModule();
  }
  function renderModule() {
    const el = document.getElementById('module-content');
    if (currentModule === 'upcoming') renderUpcomingModule(el);
    else renderMyRegistrationsModule(el);
  }

  function renderUpcomingModule(el) {
    el.innerHTML = events.map(e => `
      <div class="bg-card-bg rounded-card shadow-card p-5">
        <p class="text-sm font-semibold">${e.name}</p>
        <p class="text-xs text-ink-muted mt-1.5 leading-relaxed">${e.description}</p>
        <div class="flex items-center gap-1.5 mt-3 text-xs text-ink-muted">${icon('calendar','w-3.5 h-3.5')}${eventDateLabel(e.eventDate)} · ${e.startTime}–${e.endTime}</div>
        <div class="flex items-center gap-1.5 mt-1 text-xs text-ink-muted">${icon('pin','w-3.5 h-3.5')}${e.venue}</div>
        ${e.paidEvent ? `<p class="text-xs text-coral font-semibold mt-2">${formatMoney(e.registrationFee)} registration fee</p>` : ''}
        ${isRegistered(e.id)
          ? `<div class="mt-3 bg-green/20 text-[#2f6b45] text-xs font-semibold px-3 py-2 rounded-button flex items-center gap-1.5 w-fit">${icon('check','w-3.5 h-3.5')}You're registered</div>`
          : `<button onclick="openRsvpModal('${e.id}')" class="mt-3 bg-primary hover:bg-primary-hover text-white text-sm font-semibold px-4 py-2.5 rounded-button min-h-[40px] transition-warm">Register</button>`
        }
      </div>
    `).join('');
  }

  function renderMyRegistrationsModule(el) {
    if (myRegistrations.length === 0) {
      el.innerHTML = `<div class="bg-card-bg rounded-card shadow-card p-8 text-center"><p class="text-sm text-ink-muted">You haven't registered for any events yet.</p></div>`;
      return;
    }
    el.innerHTML = myRegistrations.map(r => {
      const e = events.find(x => x.id === r.eventId);
      return `
        <div class="bg-card-bg rounded-card shadow-card p-5">
          <div class="flex items-start justify-between gap-3">
            <p class="text-sm font-semibold">${e.name}</p>
            <span class="bg-green/20 text-[#2f6b45] text-xs font-semibold px-2.5 py-1 rounded-badge whitespace-nowrap">Confirmed</span>
          </div>
          <div class="flex items-center gap-1.5 mt-2 text-xs text-ink-muted">${icon('calendar','w-3.5 h-3.5')}${eventDateLabel(e.eventDate)}</div>
          <p class="text-xs text-ink-muted mt-1">${r.attendees} attendee${r.attendees === 1 ? '' : 's'} · Registered ${r.registeredDate}</p>
        </div>
      `;
    }).join('');
  }

  let rsvpEventId = null;
  function openRsvpModal(eventId) {
    rsvpEventId = eventId;
    const e = events.find(x => x.id === eventId);
    document.getElementById('rsvp-modal-title').textContent = 'Register — ' + e.name;
    document.getElementById('rsvp-modal').classList.remove('hidden');
    document.getElementById('rsvp-form').innerHTML = `
      <div class="space-y-1.5">
        <label class="text-xs font-medium">Registering as</label>
        <input type="text" value="${sessionName}" readonly class="w-full border border-divider rounded-input px-3 h-11 text-sm bg-section-bg text-ink-muted">
      </div>
      <div class="space-y-1.5">
        <label class="text-xs font-medium">Number of attendees from your family</label>
        <input id="rsvp-attendees" type="number" min="1" value="1" class="w-full border border-divider rounded-input px-3 h-11 text-sm bg-white focus:ring-2 focus:ring-primary-light focus:outline-none">
      </div>
      ${e.paidEvent ? `<p class="text-xs text-ink-muted">This event has a registration fee of ${formatMoney(e.registrationFee)} per attendee, payable at the venue.</p>` : ''}
      <button onclick="submitRsvp()" class="w-full bg-primary hover:bg-primary-hover text-white text-sm font-semibold py-3.5 rounded-button min-h-[44px] transition-warm">Confirm Registration</button>
    `;
  }
  function submitRsvp() {
    const attendees = parseInt(document.getElementById('rsvp-attendees').value) || 1;
    const e = events.find(x => x.id === rsvpEventId);
    myRegistrations.unshift({ eventId: rsvpEventId, attendees, registeredDate: '31 Jul 2026' });
    closeModal('rsvp-modal');
    toast(`Registered for ${e.name}.`);
    renderModule();
  }

  renderModule();
</script>

</body>
</html>
