  // ---------------- Deterministic mock data model, consistent with the Parishes hub's approach: derived from ----------------
  // ---------------- each parish's own ID (not Math.random()), so results are stable across reloads. Real ----------------
  // ---------------- operational data only exists for Infant Jesus Shrine (PAR-0002) elsewhere in this app. ----------------
  const MODULES = ["Family Records", "Requests", "Masses", "Communication", "Finance", "Documents", "Faith Formation"];
  const SIZE_MULTIPLIER = { Large: 3, Medium: 1.6, Small: 1 };
  function hashCode(str) {
    let hash = 0;
    for (let i = 0; i < str.length; i++) { hash = (hash * 31 + str.charCodeAt(i)) % 997; }
    return hash;
  }
  function modulesFor(parishId) {
    if (parishId === 'PAR-0002') return [...MODULES];
    return MODULES.slice(0, hashCode(parishId) % 8);
  }
  // Deterministic "pseudo-random" integer in [min, max], seeded by a string — used to generate plausible,
  // size-tier-weighted metrics (larger parishes get proportionally bigger numbers, not just noise).
  function seededRange(seedStr, min, max) {
    const h = hashCode(seedStr);
    return min + (h % (max - min + 1));
  }
  function metricsFor(p) {
    const mult = SIZE_MULTIPLIER[p.sizeTier];
    const isFlagship = p.id === 'PAR-0002';
    return {
      requestsProcessed: isFlagship ? 249 : Math.round(seededRange(p.id + 'req', 5, 60) * mult),
      familiesRegistered: isFlagship ? 1842 : Math.round(seededRange(p.id + 'fam', 80, 900) * mult / 2),
      baptisms: isFlagship ? 42 : Math.round(seededRange(p.id + 'bap', 2, 15) * mult),
      firstCommunions: isFlagship ? 38 : Math.round(seededRange(p.id + 'fc', 2, 14) * mult),
      confirmations: isFlagship ? 29 : Math.round(seededRange(p.id + 'conf', 1, 10) * mult),
      marriages: isFlagship ? 14 : Math.round(seededRange(p.id + 'mar', 0, 6) * mult),
      totalIncome: isFlagship ? 1842600 : Math.round(seededRange(p.id + 'inc', 40000, 250000) * mult),
      subscriptionRate: isFlagship ? 82 : seededRange(p.id + 'sub', 35, 95),
      faithContentPublished: isFlagship ? 12 : seededRange(p.id + 'ffc', 0, 9),
    };
  }

  let currentModule = 'activity';
  function setModule(m) {
    currentModule = m;
    document.querySelectorAll('.module-tab').forEach(btn => {
      const active = btn.dataset.module === m;
      btn.className = `module-tab px-4 py-2.5 rounded-badge text-sm font-semibold whitespace-nowrap transition-warm ${active ? 'bg-primary text-white' : 'bg-card-bg text-ink-muted'}`;
    });
    renderModule();
  }
  function renderModule() {
    const el = document.getElementById('module-content');
    if (currentModule === 'activity') renderActivity(el);
    else if (currentModule === 'sacraments') renderSacraments(el);
    else if (currentModule === 'finance') renderFinance(el);
    else if (currentModule === 'events') renderEvents(el);
    else if (currentModule === 'faithformation') renderFaithFormation(el);
    else if (currentModule === 'comparison') renderComparison(el);
    else renderExport(el);
  }

  function statCard(label, value) {
    return `<div class="bg-card-bg rounded-card shadow-card p-5"><p class="font-heading font-bold text-2xl">${value}</p><p class="text-xs text-ink-muted mt-1">${label}</p></div>`;
  }
  function barChart(title, rows, tone) {
    const toneMap = { primary:'bg-primary', green:'bg-green', gold:'bg-gold', coral:'bg-coral', lavender:'bg-lavender' };
    const barColor = toneMap[tone || 'primary'];
    const max = Math.max(...rows.map(r => r.value), 1);
    return `
      <div class="bg-card-bg rounded-card shadow-card p-5">
        <p class="text-sm font-semibold mb-4">${title}</p>
        <div class="space-y-3">
          ${rows.map(r => `
            <div>
              <div class="flex items-center justify-between mb-1"><span class="text-xs text-ink-muted">${r.label}</span><span class="text-xs font-semibold">${r.display}</span></div>
              <div class="h-2 bg-section-bg rounded-badge overflow-hidden"><div class="h-full ${barColor} rounded-badge" style="width:${Math.max(4, Math.round((r.value / max) * 100))}%"></div></div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }
  function rankedList(title, entries, valueLabel) {
    return `
      <div class="bg-card-bg rounded-card shadow-card p-5">
        <p class="text-sm font-semibold mb-3">${title}</p>
        <div class="space-y-2">
          ${entries.map(({ p, value }, i) => `
            <div class="flex items-center justify-between gap-3">
              <span class="text-sm truncate">${i + 1}. ${p.name}</span>
              <span class="text-xs text-ink-muted font-semibold flex-shrink-0">${value}${valueLabel || ''}</span>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }

  // =========================================================================
  // PARISH ACTIVITY
  // =========================================================================
  function renderActivity(el) {
    const withMetrics = parishes.map(p => ({ p, m: metricsFor(p) }));
    const totalRequests = withMetrics.reduce((s, { m }) => s + m.requestsProcessed, 0);
    const totalFamilies = withMetrics.reduce((s, { m }) => s + m.familiesRegistered, 0);
    const avgRequests = Math.round(totalRequests / parishes.length);
    const mostActive = [...withMetrics].sort((a, b) => b.m.requestsProcessed - a.m.requestsProcessed).slice(0, 10).map(({ p, m }) => ({ p, value: m.requestsProcessed }));
    const leastActive = [...withMetrics].sort((a, b) => a.m.requestsProcessed - b.m.requestsProcessed).slice(0, 10).map(({ p, m }) => ({ p, value: m.requestsProcessed }));
    el.innerHTML = `
      <div class="grid grid-cols-2 md:grid-cols-3 gap-4 mb-6">
        ${statCard('Total requests processed (YTD)', totalRequests.toLocaleString('en-IN'))}
        ${statCard('Total registered families', totalFamilies.toLocaleString('en-IN'))}
        ${statCard('Avg. requests per parish', avgRequests)}
      </div>
      <div class="grid lg:grid-cols-2 gap-6 mb-6">
        ${rankedList('Most active parishes', mostActive, ' requests')}
        ${rankedList('Least active parishes', leastActive, ' requests')}
      </div>
      ${barChart('Diocese-wide monthly request volume (last 6 months)', [
        { label:'Feb 2026', value: Math.round(totalRequests*0.13), display: Math.round(totalRequests*0.13) },
        { label:'Mar 2026', value: Math.round(totalRequests*0.14), display: Math.round(totalRequests*0.14) },
        { label:'Apr 2026', value: Math.round(totalRequests*0.15), display: Math.round(totalRequests*0.15) },
        { label:'May 2026', value: Math.round(totalRequests*0.16), display: Math.round(totalRequests*0.16) },
        { label:'Jun 2026', value: Math.round(totalRequests*0.17), display: Math.round(totalRequests*0.17) },
        { label:'Jul 2026', value: Math.round(totalRequests*0.18), display: Math.round(totalRequests*0.18) },
      ], 'primary')}
    `;
  }

  // =========================================================================
  // SACRAMENTS
  // =========================================================================
  function renderSacraments(el) {
    const withMetrics = parishes.map(p => ({ p, m: metricsFor(p) }));
    const totals = { baptisms:0, firstCommunions:0, confirmations:0, marriages:0 };
    withMetrics.forEach(({ m }) => { totals.baptisms += m.baptisms; totals.firstCommunions += m.firstCommunions; totals.confirmations += m.confirmations; totals.marriages += m.marriages; });
    const bySizeTier = ['Large', 'Medium', 'Small'].map(tier => {
      const inTier = withMetrics.filter(({ p }) => p.sizeTier === tier);
      const avg = Math.round(inTier.reduce((s, { m }) => s + m.baptisms, 0) / inTier.length);
      return { label: tier + ' parishes (avg. Baptisms)', value: avg, display: avg };
    });
    el.innerHTML = `
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
        ${statCard('Baptisms (YTD)', totals.baptisms.toLocaleString('en-IN'))}
        ${statCard('First Communions (YTD)', totals.firstCommunions.toLocaleString('en-IN'))}
        ${statCard('Confirmations (YTD)', totals.confirmations.toLocaleString('en-IN'))}
        ${statCard('Marriages (YTD)', totals.marriages.toLocaleString('en-IN'))}
      </div>
      <div class="grid lg:grid-cols-2 gap-6">
        ${barChart('Average Baptisms by parish size tier', bySizeTier, 'green')}
        ${barChart('Diocese-wide Baptisms by month (last 6 months)', [
          { label:'Feb 2026', value: Math.round(totals.baptisms*0.14), display: Math.round(totals.baptisms*0.14) },
          { label:'Mar 2026', value: Math.round(totals.baptisms*0.15), display: Math.round(totals.baptisms*0.15) },
          { label:'Apr 2026', value: Math.round(totals.baptisms*0.16), display: Math.round(totals.baptisms*0.16) },
          { label:'May 2026', value: Math.round(totals.baptisms*0.17), display: Math.round(totals.baptisms*0.17) },
          { label:'Jun 2026', value: Math.round(totals.baptisms*0.18), display: Math.round(totals.baptisms*0.18) },
          { label:'Jul 2026', value: Math.round(totals.baptisms*0.20), display: Math.round(totals.baptisms*0.20) },
        ], 'primary')}
      </div>
    `;
  }

  // =========================================================================
  // FINANCE
  // =========================================================================
  function renderFinance(el) {
    const withMetrics = parishes.map(p => ({ p, m: metricsFor(p) }));
    const totalIncome = withMetrics.reduce((s, { m }) => s + m.totalIncome, 0);
    const avgCollectionRate = Math.round(withMetrics.reduce((s, { m }) => s + m.subscriptionRate, 0) / parishes.length);
    const bySizeTier = ['Large', 'Medium', 'Small'].map(tier => {
      const inTier = withMetrics.filter(({ p }) => p.sizeTier === tier);
      const total = inTier.reduce((s, { m }) => s + m.totalIncome, 0);
      return { label: tier + ' parishes', value: total, display: formatMoney(total) };
    });
    const lowestCollecting = [...withMetrics].sort((a, b) => a.m.subscriptionRate - b.m.subscriptionRate).slice(0, 10).map(({ p, m }) => ({ p, value: m.subscriptionRate + '%' }));
    el.innerHTML = `
      <div class="grid grid-cols-2 md:grid-cols-3 gap-4 mb-6">
        ${statCard('Total income (diocese-wide, YTD)', formatMoney(totalIncome))}
        ${statCard('Avg. subscription collection rate', avgCollectionRate + '%')}
        ${statCard('Parishes reporting', parishes.length)}
      </div>
      <div class="grid lg:grid-cols-2 gap-6">
        ${barChart('Income by parish size tier', bySizeTier, 'green')}
        ${rankedList('Lowest subscription collection rate', lowestCollecting, '')}
      </div>
    `;
  }

  // =========================================================================
  // EVENTS
  // =========================================================================
  const dioceseEvents = [
    { name:"Confirmation Mass — Cathedral", organizer:"Diocese", date:"2026-08-03", venue:"St Francis Xavier Cathedral", attendance:850 },
    { name:"Annual Priests' Retreat", organizer:"Diocese", date:"2026-08-18", venue:"Diocesan Retreat Centre", attendance:120 },
    { name:"Feast Day Celebration", organizer:"Parish (Infant Jesus Shrine)", date:"2027-01-13", venue:"Infant Jesus Shrine Grounds", attendance:500 },
    { name:"Youth Retreat 2026", organizer:"Parish (Infant Jesus Shrine)", date:"2026-09-05", venue:"Parish Hall", attendance:60 },
    { name:"Diocesan Youth Convention", organizer:"Diocese", date:"2026-10-10", venue:"St Francis Xavier Cathedral", attendance:1200 },
  ];
  function renderEvents(el) {
    const dioceseCount = dioceseEvents.filter(e => e.organizer === 'Diocese').length;
    const parishCount = dioceseEvents.filter(e => e.organizer !== 'Diocese').length;
    const topByAttendance = [...dioceseEvents].sort((a, b) => b.attendance - a.attendance).slice(0, 5);
    el.innerHTML = `
      <div class="grid grid-cols-2 md:grid-cols-3 gap-4 mb-6">
        ${statCard('Total events (this year)', dioceseEvents.length)}
        ${statCard('Diocese-organized', dioceseCount)}
        ${statCard('Parish-organized', parishCount)}
      </div>
      <div class="grid lg:grid-cols-2 gap-6">
        <div class="bg-card-bg rounded-card shadow-card overflow-hidden">
          <div class="px-5 py-3 border-b border-divider"><p class="text-sm font-semibold">Upcoming events</p></div>
          <div class="divide-y divide-divider">
            ${dioceseEvents.map(e => `
              <div class="px-5 py-4">
                <p class="text-sm font-semibold">${e.name}</p>
                <p class="text-xs text-ink-muted mt-0.5">${formatDate(e.date)} · ${e.venue} · ${e.organizer}</p>
              </div>
            `).join('')}
          </div>
        </div>
        ${barChart('Attendance — largest events', topByAttendance.map(e => ({ label: e.name, value: e.attendance, display: e.attendance.toLocaleString('en-IN') })), 'lavender')}
      </div>
    `;
  }

  // =========================================================================
  // FAITH FORMATION
  // =========================================================================
  function renderFaithFormation(el) {
    const withMetrics = parishes.map(p => ({ p, m: metricsFor(p) }));
    const publishing = withMetrics.filter(({ m }) => m.faithContentPublished > 0);
    const totalContent = withMetrics.reduce((s, { m }) => s + m.faithContentPublished, 0);
    const notPublishing = withMetrics.filter(({ m }) => m.faithContentPublished === 0).slice(0, 10).map(({ p }) => ({ p, value: '' }));
    const categories = [
      { label:'Daily Prayers', value: Math.round(totalContent*0.28), display: Math.round(totalContent*0.28) },
      { label:'Readings & Reflections', value: Math.round(totalContent*0.24), display: Math.round(totalContent*0.24) },
      { label:'Special Prayers', value: Math.round(totalContent*0.18), display: Math.round(totalContent*0.18) },
      { label:'Rosary', value: Math.round(totalContent*0.16), display: Math.round(totalContent*0.16) },
      { label:'Feast Day Content', value: Math.round(totalContent*0.14), display: Math.round(totalContent*0.14) },
    ];
    el.innerHTML = `
      <div class="grid grid-cols-2 md:grid-cols-3 gap-4 mb-6">
        ${statCard('Parishes publishing content', publishing.length + ' of ' + parishes.length)}
        ${statCard('Total content pieces (diocese-wide)', totalContent.toLocaleString('en-IN'))}
        ${statCard('Adoption rate', Math.round((publishing.length / parishes.length) * 100) + '%')}
      </div>
      <div class="grid lg:grid-cols-2 gap-6">
        ${barChart('Content volume by category', categories, 'lavender')}
        ${rankedList('Parishes not yet publishing (sample)', notPublishing, '')}
      </div>
    `;
  }

  // =========================================================================
  // PARISH COMPARISON
  // =========================================================================
  let comparisonSelection = ['PAR-0002', 'PAR-0001'];
  function renderComparison(el) {
    el.innerHTML = `
      <div class="bg-card-bg rounded-card shadow-card p-5 mb-6">
        <p class="text-sm font-semibold mb-3">Compare up to 3 parishes</p>
        <div class="grid sm:grid-cols-3 gap-3">
          ${[0,1,2].map(i => `
            <select onchange="setComparisonSlot(${i}, this.value)" class="border border-divider rounded-input px-3 h-10 text-sm bg-bg-warm focus:ring-2 focus:ring-primary-light focus:outline-none">
              <option value="">${i === 0 ? 'Select a parish…' : 'Add a parish (optional)…'}</option>
              ${parishes.map(p => `<option value="${p.id}" ${comparisonSelection[i] === p.id ? 'selected' : ''}>${p.name}</option>`).join('')}
            </select>
          `).join('')}
        </div>
      </div>
      <div id="comparison-table"></div>
    `;
    renderComparisonTable();
  }
  function setComparisonSlot(i, id) {
    comparisonSelection[i] = id || null;
    renderComparisonTable();
  }
  function renderComparisonTable() {
    const selected = comparisonSelection.filter(Boolean).map(id => parishes.find(p => p.id === id)).filter(Boolean);
    const container = document.getElementById('comparison-table');
    if (selected.length === 0) {
      container.innerHTML = '<div class="bg-card-bg rounded-card shadow-card p-10 text-center"><p class="text-sm text-ink-muted">Select at least one parish to compare.</p></div>';
      return;
    }
    const rows = [
      { label: 'Size tier', get: (p, m) => p.sizeTier },
      { label: 'Est. families', get: (p, m) => p.estFamilies },
      { label: 'Modules enabled', get: (p, m) => modulesFor(p.id).length + ' of ' + MODULES.length },
      { label: 'Requests processed (YTD)', get: (p, m) => m.requestsProcessed.toLocaleString('en-IN') },
      { label: 'Sacraments YTD (all types)', get: (p, m) => (m.baptisms + m.firstCommunions + m.confirmations + m.marriages).toLocaleString('en-IN') },
      { label: 'Income (YTD)', get: (p, m) => formatMoney(m.totalIncome) },
      { label: 'Subscription collection rate', get: (p, m) => m.subscriptionRate + '%' },
    ];
    container.innerHTML = `
      <div class="bg-card-bg rounded-card shadow-card overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead>
              <tr class="border-b border-divider text-left text-ink-muted text-xs uppercase tracking-wide">
                <th class="px-4 py-3 font-medium">Metric</th>
                ${selected.map(p => `<th class="px-4 py-3 font-medium">${p.name}</th>`).join('')}
              </tr>
            </thead>
            <tbody>
              ${rows.map(r => `
                <tr class="border-b border-divider last:border-0">
                  <td class="px-4 py-3 text-ink-muted">${r.label}</td>
                  ${selected.map(p => `<td class="px-4 py-3 font-medium">${r.get(p, metricsFor(p))}</td>`).join('')}
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      </div>
    `;
  }

  // =========================================================================
  // EXPORT
  // =========================================================================
  let recentExports = [
    { report:'Parish Activity', range:'1 Apr 2026 – 30 Jun 2026', format:'PDF', exportedOn:'2026-07-04' },
  ];
  function renderExport(el) {
    el.innerHTML = `
      <div class="bg-card-bg rounded-card shadow-card p-5 mb-6 max-w-xl">
        <p class="text-sm font-semibold mb-4">Export a report</p>
        <div class="space-y-4">
          <div class="space-y-1.5">
            <label class="text-xs font-medium">Report type</label>
            <select id="exp-type" class="w-full border border-divider rounded-input px-3 h-10 text-sm bg-white focus:ring-2 focus:ring-primary-light focus:outline-none">
              <option>Parish Activity</option><option>Sacraments</option><option>Finance</option><option>Events</option><option>Faith Formation</option><option>Parish Comparison</option>
            </select>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div class="space-y-1.5"><label class="text-xs font-medium">From</label><input id="exp-from" type="date" class="w-full border border-divider rounded-input px-3 h-10 text-sm bg-white focus:ring-2 focus:ring-primary-light focus:outline-none"></div>
            <div class="space-y-1.5"><label class="text-xs font-medium">To</label><input id="exp-to" type="date" class="w-full border border-divider rounded-input px-3 h-10 text-sm bg-white focus:ring-2 focus:ring-primary-light focus:outline-none"></div>
          </div>
          <div class="flex gap-2">
            <label class="flex items-center gap-1.5 text-sm bg-section-bg px-3 py-2 rounded-badge cursor-pointer flex-1 justify-center"><input type="radio" name="exp-format" value="PDF" checked class="exp-format-radio"> PDF</label>
            <label class="flex items-center gap-1.5 text-sm bg-section-bg px-3 py-2 rounded-badge cursor-pointer flex-1 justify-center"><input type="radio" name="exp-format" value="CSV" class="exp-format-radio"> CSV</label>
          </div>
          <button onclick="runExport()" class="w-full bg-primary hover:bg-primary-hover text-white text-sm font-semibold py-3 rounded-button min-h-[44px] transition-warm">Export</button>
        </div>
      </div>
      <p class="text-xs font-semibold text-ink-muted uppercase tracking-wide mb-3">Recent exports</p>
      <div id="export-list"></div>
    `;
    renderExportList();
  }
  function renderExportList() {
    document.getElementById('export-list').innerHTML = recentExports.length === 0
      ? '<div class="bg-card-bg rounded-card shadow-card p-8 text-center"><p class="text-sm text-ink-muted">No exports yet.</p></div>'
      : `<div class="bg-card-bg rounded-card shadow-card divide-y divide-divider overflow-hidden">${recentExports.map(e => `
          <div class="px-5 py-4"><p class="text-sm font-semibold">${e.report}</p><p class="text-xs text-ink-muted mt-0.5">${e.range} · ${e.format} · Exported ${formatDate(e.exportedOn)}</p></div>
        `).join('')}</div>`;
  }
  function runExport() {
    const type = document.getElementById('exp-type').value;
    const from = document.getElementById('exp-from').value;
    const to = document.getElementById('exp-to').value;
    const format = [...document.querySelectorAll('.exp-format-radio')].find(r => r.checked).value;
    if (!from || !to) { toast('Please choose a date range.'); return; }
    recentExports.unshift({ report: type, range: `${formatDate(from)} – ${formatDate(to)}`, format, exportedOn: '2026-07-31' });
    toast(`${type} exported as ${format}.`);
    renderExportList();
  }

  renderModule();
</script>

</body>
</html>
