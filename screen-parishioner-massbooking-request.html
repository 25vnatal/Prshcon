    if (period === 'AM' && h === 12) h = 0;

    const activities = massActivitiesByParish[parishId] || [];
    const instances = [];
    activities.filter(a => a.status === 'Active').forEach(a => {
      a.days.forEach(day => {
        const targetDow = DAY_NAMES.indexOf(day);
        for (let week = 0; week < 3; week++) {
          const d = new Date(TODAY);
          let base = (targetDow - d.getDay() + 7) % 7;
          if (base === 0) base = 7; // never today itself — always the next occurrence onward
          d.setDate(d.getDate() + base + week * 7);
          const iso = toLocalISODate(d);
          const key = a.id + '_' + iso;
          const booked = existingIntentionCounts[key] || 0;
          instances.push({ massActivityId: a.id, massName: a.massName, massType: a.massType, time: a.time, date: iso, maxIntentions: a.maxIntentions, bookingFee: a.bookingFee, booked });
        }
      });
    });
    instances.sort((x,y) => x.date.localeCompare(y.date) || timeToMinutes(x.time) - timeToMinutes(y.time));
    return instances;
  }

  function instanceKey(i) { return i.massActivityId + '_' + i.date; }

  // ---------------- Wizard state ----------------
  // A booking = one or more intentions. Each intention carries its own Mass Instance selection,
  // per the spec's "each intention may have its own Mass selection" rule.
  const state = {
    parishId: null,
    parishName: null,
    intentions: [],       // committed intentions for this booking
    draft: {               // the intention currently being built
      instanceKey: null,
      intentionType: '',
      intentionDescription: '',
      offeredBy: sessionName,
      stipend: 0,
    },
    paymentMethod: null,
  };

  const STEPS = ['parish', 'dateMass', 'intention', 'review', 'payment', 'confirmation'];
  // 'confirmation' is rendered specially (not part of the normal step flow / progress bar).
  const WIZARD_STEPS = ['parish', 'dateMass', 'intention', 'review', 'payment'];
  const STEP_LABELS = { parish: 'Parish', dateMass: 'Date & Mass', intention: 'Intention', review: 'Review', payment: 'Payment' };
  let stepIndex = 0;
  let expandedDate = null;

  function icon(paths, cls) { return `<svg class="${cls||'icon'}" viewBox="0 0 24 24">${paths}</svg>`; }
  const ICONS = {
    check: '<path d="M20 6 9 17l-5-5"/>',
    users: '<circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M2 21v-1a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v1"/><path d="M15 15.5a4 4 0 0 1 5 3.5"/>',
    plus: '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
    trash: '<path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>',
    search: '<circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>',
    chevronDown: '<polyline points="6 9 12 15 18 9"/>',
  };

  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.remove('opacity-0'); t.classList.add('opacity-100');
    clearTimeout(window._t);
    window._t = setTimeout(() => { t.classList.remove('opacity-100'); t.classList.add('opacity-0'); }, 1800);
  }

  let cartExpanded = false;

  function updateCartBadge() {
    const badge = document.getElementById('cart-badge');
    if (state.intentions.length > 0) {
      badge.textContent = `${state.intentions.length} intention${state.intentions.length>1?'s':''}`;
      badge.classList.remove('hidden');
    } else {
      badge.classList.add('hidden');
    }
  }

  function goBack() {
    if (stepIndex === 0) { window.location.href = 'screen-parishioner-dashboard-home.html?' + sessionParams.toString(); return; }
    stepIndex--;
    render();
  }

  function goToReview() {
    stepIndex = WIZARD_STEPS.indexOf('review');
    render();
  }

  function handleContinue() {
    const step = WIZARD_STEPS[stepIndex];
    if (!validateStep(step)) return;
    if (step === 'payment') { submitBooking(); return; }
    stepIndex++;
    render();
  }

  function validateStep(step) {
    if (step === 'parish' && !state.parishId) { toast('Please select a parish.'); return false; }
    if (step === 'dateMass' && !state.draft.instanceKey) { toast('Please choose a date and Mass.'); return false; }
    if (step === 'intention') {
      if (!state.draft.intentionType) { toast('Please choose an intention type.'); return false; }
      if (!state.draft.intentionDescription.trim()) { toast('Please describe the intention.'); return false; }
      if (!state.draft.offeredBy.trim()) { toast('Please enter who this is offered by.'); return false; }
    }
    if (step === 'review' && state.intentions.length === 0) { toast('Please add at least one intention.'); return false; }
    if (step === 'payment' && !state.paymentMethod) { toast('Please choose a payment method.'); return false; }
    return true;
  }

  function selectParish(parishId, parishName) {
    state.parishId = parishId;
    state.parishName = parishName;
    render();
  }

  function toggleDateAccordion(d) {
    expandedDate = expandedDate === d ? null : d;
    render();
  }

  function selectMass(key, fee) {
    const inst = generateInstances(state.parishId).find(i => instanceKey(i) === key);
    if (inst.maxIntentions && inst.booked >= inst.maxIntentions) { toast('This Mass is fully booked — please choose another.'); return; }
    state.draft.instanceKey = key;
    state.draft.stipend = fee;
    stepIndex = WIZARD_STEPS.indexOf('intention');
    render();
  }

  function commitIntentionAndAddAnother() {
    if (!validateStep('intention')) return;
    state.intentions.push({ ...state.draft, instanceKey: state.draft.instanceKey });
    resetDraft();
    expandedDate = null;
    stepIndex = WIZARD_STEPS.indexOf('dateMass');
    updateCartBadge();
    render();
  }

  function commitIntentionAndReview() {
    if (!validateStep('intention')) return;
    state.intentions.push({ ...state.draft, instanceKey: state.draft.instanceKey });
    resetDraft();
    expandedDate = null;
    stepIndex = WIZARD_STEPS.indexOf('review');
    updateCartBadge();
    render();
  }

  function resetDraft() {
    state.draft = { instanceKey: null, intentionType: '', intentionDescription: '', offeredBy: sessionName, stipend: 0 };
  }

  function removeIntention(idx) {
    state.intentions.splice(idx, 1);
    updateCartBadge();
    if (state.intentions.length === 0) { stepIndex = WIZARD_STEPS.indexOf('dateMass'); }
    render();
  }

  function addAnotherFromReview() {
    expandedDate = null;
    stepIndex = WIZARD_STEPS.indexOf('dateMass');
    render();
  }

  function toggleCart() {
    cartExpanded = !cartExpanded;
    render();
  }

  // ---------------- Step renderers ----------------
  let parishSearchQuery = '';

  function renderParish() {
    return `
      <p class="font-heading font-bold text-xl mb-1">Find a parish</p>
      <p class="text-ink-muted text-sm mb-4">Search for the parish whose Mass you'd like to book.</p>
      <div class="relative mb-4">
        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-ink-muted">${icon(ICONS.search,'icon w-4 h-4')}</span>
        <input id="parish-search" type="text" placeholder="Search for a parish…" value="${parishSearchQuery}"
          oninput="onParishSearchInput(this.value)"
          class="w-full border border-divider rounded-input pl-10 pr-4 h-12 text-sm bg-card-bg focus:ring-2 focus:ring-primary-light focus:outline-none">
      </div>
      <div id="parish-step-body">${renderParishStepBody()}</div>
    `;
  }

  function renderParishStepBody() {
    return parishSearchQuery.trim() ? renderParishSearchResults() : renderSuggestedParishes();
  }

  function renderSuggestedParishes() {
    return `
      <p class="text-xs font-semibold text-ink-muted uppercase tracking-wide mb-2">Suggested parishes</p>
      <div class="space-y-2.5">
        <button onclick="selectParish('${HOME_PARISH_ID}', 'Infant Jesus Shrine')" class="option-card w-full rounded-card p-4 text-left transition-warm min-h-[44px] ${state.parishId===HOME_PARISH_ID ? 'selected' : 'bg-card-bg'}">
          <div class="flex items-center justify-between">
            <div><p class="text-sm font-semibold">Infant Jesus Shrine</p><p class="text-xs text-ink-muted mt-0.5">Viveknagar, Bengaluru · Your home parish</p></div>
            ${state.parishId===HOME_PARISH_ID ? `<span class="text-primary">${icon(ICONS.check,'w-5 h-5')}</span>` : ''}
          </div>
        </button>
        ${SUGGESTED_PARISH_IDS.map(id => {
          const p = PARISHES.find(x => x.id === id);
          if (!p) return '';
          const isSelected = state.parishId === id;
          return `
            <button onclick="selectParishById('${p.id}')" class="option-card w-full rounded-card p-4 text-left transition-warm min-h-[44px] ${isSelected ? 'selected' : 'bg-card-bg'}">
              <div class="flex items-center justify-between">
                <div><p class="text-sm font-semibold">${p.name}</p><p class="text-xs text-ink-muted mt-0.5">${p.address}</p></div>
                ${isSelected ? `<span class="text-primary">${icon(ICONS.check,'w-5 h-5')}</span>` : ''}
              </div>
            </button>
          `;
        }).join('')}
      </div>
    `;
  }

  function renderParishSearchResults() {
    const q = parishSearchQuery.trim().toLowerCase();
    const matches = PARISHES.filter(p => p.name.toLowerCase().includes(q)).slice(0, 6);
    if (matches.length === 0) {
      return `<div class="bg-card-bg rounded-card shadow-card p-6 text-center"><p class="text-sm text-ink-muted">No parishes found for "${parishSearchQuery}".</p></div>`;
    }
    return `
      <p class="text-xs font-semibold text-ink-muted uppercase tracking-wide mb-2">${matches.length} result${matches.length>1?'s':''}</p>
      <div class="space-y-2.5">
        ${matches.map(p => {
          const isSelected = state.parishId === p.id;
          return `
            <button onclick="selectParishById('${p.id}')" class="option-card w-full rounded-card p-4 text-left transition-warm min-h-[44px] ${isSelected ? 'selected' : 'bg-card-bg'}">
              <div class="flex items-center justify-between">
                <div><p class="text-sm font-semibold">${p.name}</p><p class="text-xs text-ink-muted mt-0.5">${p.address}</p></div>
                ${isSelected ? `<span class="text-primary">${icon(ICONS.check,'w-5 h-5')}</span>` : ''}
              </div>
            </button>
          `;
        }).join('')}
      </div>
    `;
  }

  function onParishSearchInput(v) {
    parishSearchQuery = v;
    document.getElementById('parish-step-body').innerHTML = renderParishStepBody();
  }

  function selectParishById(id) {
    const p = PARISHES.find(x => x.id === id);
    if (p) selectParish(p.id, p.name);
  }

  function renderCartStrip() {
    if (state.intentions.length === 0) return '';
    return `
      <div class="bg-primary-light rounded-card p-3 mb-4">
        <div class="flex items-center justify-between gap-2">
          <button onclick="toggleCart()" class="flex items-center gap-1.5 text-xs font-semibold text-primary min-h-[32px]">
            ${state.intentions.length} intention${state.intentions.length>1?'s':''} added
            <span class="inline-flex transition-warm" style="transform: rotate(${cartExpanded ? '180' : '0'}deg)">${icon(ICONS.chevronDown,'icon w-3.5 h-3.5')}</span>
          </button>
          <button onclick="goToReview()" class="text-xs font-semibold text-primary underline underline-offset-2 flex-shrink-0">Review &amp; Pay →</button>
        </div>
        ${cartExpanded ? `
          <div class="space-y-1.5 mt-2.5">
            ${state.intentions.map((it, idx) => {
              const inst = generateInstances(state.parishId).find(i => instanceKey(i) === it.instanceKey);
              return `
                <div class="bg-white rounded-button px-3 py-2 flex items-center justify-between gap-2">
                  <div class="min-w-0">
                    <p class="text-xs font-semibold truncate">${it.intentionType} — ${inst.massName}</p>
                    <p class="text-[11px] text-ink-muted">${formatDateLabel(inst.date)}</p>
                  </div>
                  <button onclick="removeIntention(${idx})" aria-label="Remove intention" class="text-error flex-shrink-0">${icon(ICONS.trash,'w-3.5 h-3.5')}</button>
                </div>
              `;
            }).join('')}
          </div>
        ` : ''}
      </div>
    `;
  }

  function renderDateMass() {
    const instances = generateInstances(state.parishId);
    if (instances.length === 0) {
      return `
        <p class="font-heading font-bold text-xl mb-1">Choose date &amp; Mass</p>
        <div class="bg-card-bg rounded-card shadow-card p-8 text-center mt-4">
          <p class="text-sm font-semibold">No Masses configured</p>
          <p class="text-sm text-ink-muted mt-1">${state.parishName} hasn't set up online Mass booking yet.</p>
        </div>
      `;
    }
    const dates = [...new Set(instances.map(i => i.date))].sort();
    return `
      <p class="font-heading font-bold text-xl mb-1">Choose date &amp; Mass</p>
      <p class="text-ink-muted text-sm mb-4">${state.parishName} · tap a date to see its Masses</p>
      <div class="space-y-2.5">
        ${dates.map(d => {
          const dayInstances = instances.filter(i => i.date === d);
          const isExpanded = expandedDate === d;
          const hasSelection = dayInstances.some(i => instanceKey(i) === state.draft.instanceKey);
          return `
            <div class="rounded-card bg-card-bg shadow-card overflow-hidden ${hasSelection ? 'ring-2 ring-primary' : ''}">
              <button onclick="toggleDateAccordion('${d}')" class="w-full p-4 flex items-center justify-between text-left min-h-[44px]">
                <span class="text-sm font-semibold">${formatDateLabel(d)}</span>
                <span class="flex items-center gap-2 text-xs text-ink-muted">
                  ${dayInstances.length} Mass${dayInstances.length>1?'es':''}
                  <span class="inline-flex transition-warm" style="transform: rotate(${isExpanded ? '180' : '0'}deg)">${icon(ICONS.chevronDown,'icon w-4 h-4')}</span>
                </span>
              </button>
              ${isExpanded ? `
                <div class="border-t border-divider p-3 space-y-2">
                  ${dayInstances.map(i => {
                    const key = instanceKey(i);
                    const isFull = i.maxIntentions && i.booked >= i.maxIntentions;
                    const isSelected = state.draft.instanceKey === key;
                    return `
                      <button ${isFull ? 'disabled' : `onclick="selectMass('${key}', ${i.bookingFee})"`} class="option-card w-full rounded-card p-3.5 text-left transition-warm min-h-[44px] ${isFull ? 'full bg-section-bg' : isSelected ? 'selected' : 'bg-section-bg'}">
                        <div class="flex items-center justify-between">
                          <div>
                            <p class="text-sm font-semibold">${i.massName}</p>
                            <p class="text-xs text-ink-muted mt-0.5">${i.time} · ₹${i.bookingFee} booking fee</p>
                          </div>
                          ${isFull
                            ? `<span class="text-xs font-semibold text-error">Full</span>`
                            : isSelected
                              ? `<span class="text-primary">${icon(ICONS.check,'w-5 h-5')}</span>`
                              : `<span class="text-xs text-ink-muted flex items-center gap-1">${icon(ICONS.users,'w-3.5 h-3.5')}${i.booked}/${i.maxIntentions}</span>`
                          }
                        </div>
                      </button>
                    `;
                  }).join('')}
                </div>
              ` : ''}
            </div>
          `;
        }).join('')}
      </div>
    `;
  }

  function renderIntention() {
    const help = INTENTION_HELP[state.draft.intentionType] || INTENTION_HELP[''];
    return `
      <p class="font-heading font-bold text-xl mb-1">Intention ${state.intentions.length + 1} details</p>
      <p class="text-ink-muted text-sm mb-4">Fill this in below. When you're done, you'll choose to add another intention or move on to review.</p>
      <div class="bg-card-bg rounded-card shadow-card p-5 space-y-4">
        <div class="space-y-1.5">
          <label class="text-sm font-medium">Intention type</label>
          <select id="in-type" onchange="state.draft.intentionType=this.value; render()" class="w-full border border-divider rounded-input px-4 h-12 text-sm bg-bg-warm focus:ring-2 focus:ring-primary-light focus:outline-none">
            <option value="">Select…</option>
            ${INTENTION_TYPES.map(t => `<option value="${t}" ${state.draft.intentionType===t?'selected':''}>${t}</option>`).join('')}
          </select>
        </div>
        <div class="space-y-1.5">
          <label class="text-sm font-medium">Intention description</label>
          <textarea id="in-desc" rows="2" placeholder="${help.placeholder}"
            class="w-full border border-divider rounded-input px-4 py-3 text-sm bg-bg-warm focus:ring-2 focus:ring-primary-light focus:outline-none resize-none"
            oninput="state.draft.intentionDescription=this.value">${state.draft.intentionDescription}</textarea>
          <p class="text-xs text-ink-muted">${help.help}</p>
        </div>
        <div class="space-y-1.5">
          <label class="text-sm font-medium">Offered by</label>
          <input id="in-offeredby" type="text" value="${state.draft.offeredBy}"
            class="w-full border border-divider rounded-input px-4 h-12 text-sm bg-bg-warm focus:ring-2 focus:ring-primary-light focus:outline-none"
            oninput="state.draft.offeredBy=this.value">
        </div>
        <div class="flex items-center justify-between bg-section-bg rounded-card p-3">
          <span class="text-xs text-ink-muted">Stipend</span>
          <span class="text-sm font-semibold">₹${state.draft.stipend}</span>
        </div>
      </div>
    `;
  }

  function renderReview() {
    return `
      <p class="font-heading font-bold text-xl mb-1">Review your booking</p>
      <p class="text-ink-muted text-sm mb-4">${state.intentions.length} intention${state.intentions.length>1?'s':''} · ${state.parishName}</p>
      <div class="space-y-3 mb-4">
        ${state.intentions.map((it, idx) => {
          const inst = generateInstances(state.parishId).find(i => instanceKey(i) === it.instanceKey);
          return `
            <div class="bg-card-bg rounded-card shadow-card p-4">
              <div class="flex items-start justify-between gap-3">
                <div class="min-w-0">
                  <p class="text-sm font-semibold">${inst.massName}</p>
                  <p class="text-xs text-ink-muted mt-0.5">${formatDateLabel(inst.date)} · ${inst.time}</p>
                  <p class="text-xs mt-2"><span class="font-semibold">${it.intentionType}</span> — ${it.intentionDescription}</p>
                  <p class="text-xs text-ink-muted mt-0.5">Offered by ${it.offeredBy}</p>
                </div>
                <div class="text-right flex-shrink-0">
                  <p class="text-sm font-semibold">₹${it.stipend}</p>
                  <button onclick="removeIntention(${idx})" class="text-error mt-1">${icon(ICONS.trash,'w-4 h-4')}</button>
                </div>
              </div>
            </div>
          `;
        }).join('')}
      </div>
      <button onclick="addAnotherFromReview()" class="w-full bg-white border-2 border-primary text-primary text-sm font-semibold py-3 rounded-button min-h-[44px] transition-warm flex items-center justify-center gap-1.5 mb-4">${icon(ICONS.plus,'icon w-4 h-4')}Add Another Intention</button>
      <div class="bg-section-bg rounded-card p-4 flex items-center justify-between">
        <span class="text-sm font-semibold">Total (${state.intentions.length} intention${state.intentions.length>1?'s':''})</span>
        <span class="font-heading font-bold text-lg">₹${totalAmount()}</span>
      </div>
    `;
  }

  function totalAmount() {
    return state.intentions.reduce((sum, it) => sum + it.stipend, 0);
  }

  function renderPayment() {
    const methods = ['UPI', 'Card', 'Net Banking'];
    return `
      <p class="font-heading font-bold text-xl mb-1">Payment</p>
      <div class="bg-card-bg rounded-card shadow-card p-5 mb-4 flex items-center justify-between">
        <p class="text-sm text-ink-muted">Total payable</p>
        <p class="font-heading font-bold text-xl">₹${totalAmount()}</p>
      </div>
      <p class="text-ink-muted text-sm mb-3">Choose a payment method.</p>
      <div class="space-y-3">
        ${methods.map(m => `
          <button onclick="state.paymentMethod='${m}'; render()" class="option-card w-full rounded-card p-4 flex items-center justify-between text-left transition-warm min-h-[44px] ${state.paymentMethod === m ? 'selected' : 'bg-card-bg'}">
            <span class="text-sm font-semibold">${m}</span>
            ${state.paymentMethod === m ? `<span class="text-primary">${icon(ICONS.check, 'w-5 h-5')}</span>` : ''}
          </button>
        `).join('')}
      </div>
    `;
  }

  const RENDERERS = { parish: renderParish, dateMass: renderDateMass, intention: renderIntention, review: renderReview, payment: renderPayment };

  function render() {
    const step = WIZARD_STEPS[stepIndex];
    const cartStrip = ['dateMass','intention'].includes(step) ? renderCartStrip() : '';
    document.getElementById('step-content').innerHTML = cartStrip + RENDERERS[step]();
    document.getElementById('step-label').textContent = `Step ${stepIndex + 1} of ${WIZARD_STEPS.length} · ${STEP_LABELS[step]}`;
    document.getElementById('progress-fill').style.width = `${((stepIndex + 1) / WIZARD_STEPS.length) * 100}%`;
    updateCartBadge();

    const footer = document.getElementById('footer-actions');
    if (step === 'intention') {
      footer.innerHTML = `
        <button onclick="commitIntentionAndAddAnother()" class="flex-1 bg-white border-2 border-primary text-primary text-sm font-semibold py-3.5 rounded-button min-h-[48px] transition-warm">Save &amp; Add Another</button>
        <button onclick="commitIntentionAndReview()" class="flex-1 bg-primary hover:bg-primary-hover text-white text-sm font-semibold py-3.5 rounded-button min-h-[48px] transition-warm">Save &amp; Review</button>
      `;
    } else {
      footer.innerHTML = `<button id="continue-btn" onclick="handleContinue()" class="flex-1 bg-primary hover:bg-primary-hover text-white text-sm font-semibold py-3.5 rounded-button min-h-[48px] transition-warm">${step === 'payment' ? 'Pay ₹' + totalAmount() : 'Continue'}</button>`;
    }
  }

  function submitBooking() {
    const btn = document.getElementById('continue-btn');
    if (btn) { btn.disabled = true; btn.textContent = 'Processing payment…'; }
    // Payment starts Pending and only becomes Paid on confirmed gateway response — simulated here with a delay,
    // never inferred just from the user reaching this screen.
    setTimeout(() => {
      const bookingNumber = 'MASS-BOOK-2026-' + Math.floor(1000 + Math.random() * 8999);
      document.getElementById('footer-actions').classList.add('hidden');
      document.getElementById('step-content').innerHTML = `
        <div class="pt-6 text-center space-y-4">
          <span class="w-16 h-16 rounded-badge bg-green/20 text-[#2f6b45] flex items-center justify-center mx-auto">${icon(ICONS.check, 'w-8 h-8')}</span>
          <p class="font-heading font-bold text-xl">Booking confirmed</p>
          <p class="text-sm text-ink-muted max-w-xs mx-auto">Booking <span class="font-semibold text-ink">${bookingNumber}</span> · ${state.intentions.length} intention${state.intentions.length>1?'s':''} · ₹${totalAmount()} paid via ${state.paymentMethod}</p>
          <div class="bg-card-bg rounded-card shadow-card divide-y divide-divider overflow-hidden text-left mt-4">
            ${state.intentions.map(it => {
              const inst = generateInstances(state.parishId).find(i => instanceKey(i) === it.instanceKey);
              return `<div class="px-4 py-3"><p class="text-sm font-semibold">${inst.massName} — ${formatDateLabel(inst.date)}</p><p class="text-xs text-ink-muted mt-0.5">${it.intentionType}: ${it.intentionDescription}</p></div>`;
            }).join('')}
          </div>
          <div class="pt-4 space-y-3">
            <button onclick="window.location.href='screen-parishioner-massbooking-mybookings.html?${sessionParams.toString()}'" class="w-full bg-primary hover:bg-primary-hover text-white text-sm font-semibold py-3.5 rounded-button min-h-[48px] transition-warm">View My Bookings</button>
            <button onclick="window.location.href='screen-parishioner-dashboard-home.html?${sessionParams.toString()}'" class="w-full text-primary text-sm font-semibold py-2 min-h-[44px]">Back to Home</button>
          </div>
        </div>
      `;
      document.getElementById('step-label').textContent = 'Done';
      document.getElementById('progress-fill').style.width = '100%';
    }, 900);
  }

  render();
</script>

</body>
</html>
